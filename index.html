<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="SEREN — a minimalist three-column parkour game.">
<title>SEREN</title>
<style>
/* ============================================================
   SEREN — visual identity
   Palette: paper white / ink black, accents only on menu circles.
   ============================================================ */
:root{
  --paper:#ffffff;
  --ink:#000000;
  --soft:rgba(0,0,0,.55);
  --hair:rgba(0,0,0,.14);
  --f:"Helvetica Neue","Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  width:100%;height:100%;height:100dvh;overflow:hidden;position:fixed;inset:0;
  background:var(--paper);color:var(--ink);
  font-family:var(--f);
  -webkit-user-select:none;-moz-user-select:none;user-select:none;
  -webkit-touch-callout:none;
  overscroll-behavior:none;touch-action:none;
  -webkit-text-size-adjust:100%;
}
#stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;z-index:2}

/* ---------- safe-area probe (read by JS) ---------- */
#insetProbe{position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}

/* ---------- panels ---------- */
.panel{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;gap:26px;
  padding:calc(28px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom));
  background:var(--paper);color:var(--ink);
  opacity:0;visibility:hidden;pointer-events:none;
  overflow-y:auto;touch-action:pan-y;
  transition:opacity .32s var(--ease),visibility 0s linear .32s;
}
.panel.show{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .32s var(--ease)}
.panel>*:first-child{margin-top:auto}
.panel>*:last-child{margin-bottom:auto}
.panel.veil{background:rgba(255,255,255,.94)}
.panel.dark{background:#000;color:#fff}
.panel.dark .btn{border-color:#fff}
.panel.dark .btn:hover,.panel.dark .btn:focus-visible{background:#fff;color:#000}

h1,h2{font-weight:700;letter-spacing:.3em;font-size:15px;text-indent:.3em}
.lede{font-size:15px;line-height:1.5;max-width:34ch;text-align:center;color:var(--soft)}
.tiny{font-size:12px;letter-spacing:.04em;color:var(--soft);text-align:center;max-width:32ch}

/* ---------- buttons ---------- */
.btn{
  font:600 12px/1 var(--f);letter-spacing:.2em;text-indent:.2em;
  padding:15px 30px;border:1.5px solid var(--ink);border-radius:100px;
  background:transparent;color:inherit;cursor:pointer;
  transition:background .2s var(--ease),color .2s var(--ease),transform .12s var(--ease);
}
.btn:hover,.btn:focus-visible{background:var(--ink);color:var(--paper)}
.btn:active{transform:scale(.955)}
.btn.ghost{border-color:var(--hair);color:var(--soft)}
.btn.ghost:hover{border-color:var(--ink);background:transparent;color:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid currentColor;outline-offset:4px}
.stack{display:flex;flex-direction:column;gap:12px;align-items:stretch;width:min(300px,86vw)}

/* ---------- language select ---------- */
.langWrap{display:flex;gap:clamp(18px,7vw,54px);align-items:center;justify-content:center;flex-wrap:wrap}
.langCircle{
  width:clamp(112px,30vw,150px);aspect-ratio:1;border-radius:50%;
  border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;
  font:600 13px/1 var(--f);letter-spacing:.14em;
  display:flex;align-items:center;justify-content:center;
  transition:transform .3s var(--ease),background .25s var(--ease),color .25s var(--ease);
}
.langCircle:hover,.langCircle:focus-visible{background:var(--ink);color:var(--paper);transform:scale(1.05)}
.langCircle:active{transform:scale(.96)}
.mark{font-weight:700;font-size:13px;letter-spacing:.55em;text-indent:.55em}

/* ---------- marble selection ---------- */
.marbles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;width:min(400px,92vw)}
@media (min-width:700px){.marbles{grid-template-columns:repeat(6,1fr);width:min(680px,94vw)}}
.marbleOpt{display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:11px 4px;border:1.5px solid transparent;border-radius:16px;
  background:transparent;cursor:pointer;
  transition:border-color .2s var(--ease),transform .12s var(--ease)}
.marbleOpt svg{width:clamp(46px,13vw,68px);height:auto;display:block;
  transition:transform .28s var(--ease)}
.marbleOpt span{font:600 10px/1 var(--f);letter-spacing:.16em;text-indent:.16em;color:var(--soft)}
.marbleOpt:hover svg,.marbleOpt:focus-visible svg{transform:scale(1.07)}
.marbleOpt:active{transform:scale(.96)}
.marbleOpt[aria-pressed="true"]{border-color:var(--ink)}
.marbleOpt[aria-pressed="true"] span{color:var(--ink)}

/* ---------- cpu intelligence ---------- */
.levels{display:flex;flex-direction:column;gap:10px;width:min(320px,86vw)}
.levels .btn{width:100%}
.levels .btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
#cpuDesc{min-height:3.2em}

/* ---------- settings sheet ---------- */
.sheet{display:flex;flex-direction:column;gap:22px;width:min(420px,88vw)}
.row{display:flex;align-items:center;justify-content:space-between;gap:18px;
  padding-bottom:16px;border-bottom:1px solid var(--hair)}
.row:last-of-type{border-bottom:none}
.rowlabel{font-size:13px;letter-spacing:.02em}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:100px;overflow:hidden}
.seg button{
  font:600 11px/1 var(--f);letter-spacing:.12em;padding:10px 14px;border:0;cursor:pointer;
  background:transparent;color:var(--ink);transition:background .2s var(--ease),color .2s var(--ease)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.toggle{width:52px;height:30px;border-radius:100px;border:1.5px solid var(--ink);
  background:transparent;cursor:pointer;position:relative;transition:background .22s var(--ease)}
.toggle span{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:var(--ink);transition:transform .24s var(--ease),background .22s var(--ease)}
.toggle[aria-pressed="true"]{background:var(--ink)}
.toggle[aria-pressed="true"] span{transform:translateX(22px);background:var(--paper)}
input[type=range]{-webkit-appearance:none;appearance:none;width:150px;height:2px;background:var(--hair);
  border-radius:2px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:var(--ink);cursor:pointer;transition:transform .15s var(--ease)}
input[type=range]::-webkit-slider-thumb:active{transform:scale(1.18)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:var(--ink);cursor:pointer}

/* ---------- how to play ---------- */
.guide{display:flex;flex-direction:column;gap:20px;width:min(560px,90vw)}
.demos{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
@media (min-width:760px){.demos{grid-template-columns:repeat(4,1fr)}}
.demo{display:flex;flex-direction:column;gap:10px}
.demo svg{width:100%;height:auto;display:block;border:1px solid var(--hair);border-radius:3px;background:#fff}
.demo figcaption{font-size:11.5px;line-height:1.45;color:var(--soft)}
.ln{stroke:#000;stroke-width:1.2}
.ball{fill:#fff;stroke:#000;stroke-width:2;transform-box:fill-box;transform-origin:center}
.blk{fill:#000}
.chev{stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round}
.notes{display:flex;flex-direction:column;gap:9px}
.note{display:flex;gap:12px;align-items:baseline;font-size:13px;line-height:1.5}
.note b{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--ink);transform:translateY(-1px)}
@keyframes d-lane{0%,16%{transform:translateX(0)}30%,46%{transform:translateX(-33px)}60%,76%{transform:translateX(33px)}90%,100%{transform:translateX(0)}}
@keyframes d-squash{0%,38%{transform:scaleY(1)}50%,74%{transform:scaleY(.55) translateY(6px)}88%,100%{transform:scaleY(1)}}
@keyframes d-fall{0%{transform:translateY(-34px)}100%{transform:translateY(96px)}}
@keyframes d-drag{0%,14%{transform:translateY(-7px);opacity:.2}40%,78%{transform:translateY(0);opacity:.65}100%{transform:translateY(-7px);opacity:.2}}
@keyframes d-blink{0%,42%{opacity:1}50%,66%{opacity:0}74%{opacity:1}82%{opacity:.25}90%,100%{opacity:1}}
.a1{animation:d-lane 3.6s var(--ease) infinite}
.a2{animation:d-squash 2.6s var(--ease) infinite}
.a3{animation:d-fall 2.6s linear infinite}
.a4{animation:d-blink 3s steps(1,end) infinite}
.a5{animation:d-drag 2.6s var(--ease) infinite;transform-box:fill-box;transform-origin:center}
body.reduced .a1,body.reduced .a2,body.reduced .a3,body.reduced .a4,body.reduced .a5{animation:none}
@media (prefers-reduced-motion:reduce){.a1,.a2,.a3,.a4,.a5{animation:none}}

/* ---------- completion ---------- */
.stats{display:flex;flex-direction:column;gap:1px;width:min(320px,84vw);margin:4px 0 10px}
.stat{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  padding:13px 0;border-bottom:1px solid rgba(255,255,255,.18)}
.stat:last-child{border-bottom:none}
.stat dt{font-size:11px;letter-spacing:.18em;opacity:.6}
.stat dd{font-size:22px;font-weight:600;letter-spacing:.02em;font-variant-numeric:tabular-nums}

/* ---------- pause button ---------- */
#pauseBtn{
  position:absolute;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--hair);
  background:rgba(255,255,255,.7);color:var(--ink);cursor:pointer;pointer-events:auto;
  display:none;align-items:center;justify-content:center;
  transition:border-color .2s var(--ease),transform .12s var(--ease)}
#pauseBtn.show{display:flex}
#pauseBtn:hover{border-color:var(--ink)}
#pauseBtn:active{transform:scale(.92)}
#pauseBtn svg{width:13px;height:13px}

/* ---------- orientation gate ---------- */
#panel-orient{gap:20px}
.rotIcon{width:44px;height:64px;border:1.5px solid var(--ink);border-radius:7px;position:relative;
  animation:rot 3s var(--ease) infinite}
.rotIcon::after{content:"";position:absolute;left:50%;bottom:6px;width:14px;height:2px;
  background:var(--ink);transform:translateX(-50%);border-radius:2px}
@keyframes rot{0%,30%{transform:rotate(90deg)}55%,100%{transform:rotate(0)}}
body.reduced .rotIcon{animation:none}
</style>
</head>
<body>
<div id="insetProbe"></div>
<canvas id="stage"></canvas>

<div id="ui">
  <button id="pauseBtn" aria-label="Pause">
    <svg viewBox="0 0 12 12" aria-hidden="true"><rect x="1.5" y="1" width="3" height="10" fill="currentColor"/><rect x="7.5" y="1" width="3" height="10" fill="currentColor"/></svg>
  </button>

  <!-- LANGUAGE SELECT -->
  <section class="panel" id="panel-lang" role="dialog" aria-label="Language">
    <div class="mark">SEREN</div>
    <p class="lede" id="langTitle">Choose your language</p>
    <div class="langWrap">
      <button class="langCircle" data-lang="en">English</button>
      <button class="langCircle" data-lang="fr">Français</button>
    </div>
    <p class="tiny" id="langNote">You can change this later in Settings.</p>
  </section>

  <!-- HOW TO PLAY -->
  <section class="panel" id="panel-howto" role="dialog">
    <h2 data-i18n="howToTitle">HOW TO PLAY</h2>
    <div class="guide">
      <div class="demos">
        <figure class="demo">
          <svg viewBox="0 0 120 80" aria-hidden="true">
            <line class="ln" x1="40" y1="2" x2="40" y2="78"/><line class="ln" x1="80" y1="2" x2="80" y2="78"/>
            <circle class="ball a1" cx="60" cy="56" r="11"/>
          </svg>
          <figcaption data-i18n="htLanes"></figcaption>
        </figure>
        <figure class="demo">
          <svg viewBox="0 0 120 80" aria-hidden="true">
            <line class="ln" x1="40" y1="2" x2="40" y2="78"/><line class="ln" x1="80" y1="2" x2="80" y2="78"/>
            <g class="a3"><rect class="blk" x="0" y="0" width="120" height="16"/>
              <path class="chev" d="M14 5 l6 5 l6 -5 M54 5 l6 5 l6 -5 M94 5 l6 5 l6 -5"/></g>
            <circle class="ball a2" cx="60" cy="58" r="11"/>
            <g class="a5"><circle cx="99" cy="40" r="3.2" fill="#000"/>
              <path d="M99 47 l0 13 M94 55 l5 6 l5 -6" fill="none" stroke="#000"
                    stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>
          </svg>
          <figcaption data-i18n="htCrouch"></figcaption>
        </figure>
        <figure class="demo">
          <svg viewBox="0 0 120 80" aria-hidden="true">
            <line class="ln" x1="40" y1="2" x2="40" y2="78"/><line class="ln" x1="80" y1="2" x2="80" y2="78"/>
            <rect class="blk" x="46" y="8" width="28" height="28"/>
            <rect class="blk" x="0" y="50" width="80" height="15"/>
            <circle class="ball" cx="100" cy="72" r="7"/>
          </svg>
          <figcaption data-i18n="htObstacles"></figcaption>
        </figure>
        <figure class="demo">
          <svg viewBox="0 0 120 80" aria-hidden="true">
            <line class="ln" x1="40" y1="2" x2="40" y2="78"/><line class="ln" x1="80" y1="2" x2="80" y2="78"/>
            <circle class="ball a4" cx="60" cy="52" r="11"/>
            <path class="ln" d="M60 20 l0 14 M54 28 l6 6 l6 -6" fill="none"/>
          </svg>
          <figcaption data-i18n="htHit"></figcaption>
        </figure>
      </div>
      <div class="notes">
        <p class="note"><b></b><span data-i18n="htWalls"></span></p>
        <p class="note"><b></b><span data-i18n="htGoal"></span></p>
        <p class="note" id="noteKeys"><b></b><span data-i18n="htKeys"></span></p>
      </div>
    </div>
    <button class="btn" data-act="howto-back" data-i18n="back">BACK</button>
  </section>

  <!-- MARBLE SELECTION -->
  <section class="panel" id="panel-marble" role="dialog">
    <h2 data-i18n="marbleTitle">MARBLE</h2>
    <div class="marbles">
      <button class="marbleOpt" data-marble="blue" aria-pressed="true">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="28" fill="#2F63E0" stroke="#000" stroke-width="2"/>
          <rect x="19" y="19" width="26" height="26" fill="#fff"/>
        </svg>
        <span data-i18n="cBlue">BLUE</span>
      </button>
      <button class="marbleOpt" data-marble="red" aria-pressed="false">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="28" fill="#DE3B3B" stroke="#000" stroke-width="2"/>
          <path fill="#fff" d="M32 49 C11 33, 17 15, 32 26 C47 15, 53 33, 32 49 Z"/>
        </svg>
        <span data-i18n="cRed">RED</span>
      </button>
      <button class="marbleOpt" data-marble="green" aria-pressed="false">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="28" fill="#12A05B" stroke="#000" stroke-width="2"/>
          <path fill="#fff" d="M32 13 L48.5 41.5 L15.5 41.5 Z"/>
        </svg>
        <span data-i18n="cGreen">GREEN</span>
      </button>
      <button class="marbleOpt" data-marble="yellow" aria-pressed="false">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="28" fill="#EFA80B" stroke="#000" stroke-width="2"/>
          <path fill="#fff" d="M32 11 L36.9 25.2 L52 25.6 L40 34.6 L44.4 49 L32 40.4 L19.6 49 L24 34.6 L12 25.6 L27.1 25.2 Z"/>
        </svg>
        <span data-i18n="cYellow">YELLOW</span>
      </button>
      <button class="marbleOpt" data-marble="pink" aria-pressed="false">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="28" fill="#E8467C" stroke="#000" stroke-width="2"/>
          <path fill="#fff" fill-rule="evenodd" d="M9 32 Q32 8 55 32 Q32 56 9 32 Z M32 22 a3.2 10 0 1 0 0.1 0 Z"/>
        </svg>
        <span data-i18n="cPink">PINK</span>
      </button>
      <button class="marbleOpt" data-marble="purple" aria-pressed="false">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="28" fill="#8B4FD8" stroke="#000" stroke-width="2"/>
          <path fill="#fff" d="M32 10 L45 32 L32 54 L19 32 Z"/>
        </svg>
        <span data-i18n="cPurple">PURPLE</span>
      </button>
    </div>
    <button class="btn" data-act="marble-back" data-i18n="back">BACK</button>
  </section>

  <!-- CPU INTELLIGENCE -->
  <section class="panel" id="panel-cpu" role="dialog">
    <h2 data-i18n="cpuTitle">CPU INTELLIGENCE</h2>
    <div class="levels" id="cpuList">
      <button class="btn" data-cpu="easy" aria-pressed="false" data-i18n="cpuEasy">EASY</button>
      <button class="btn" data-cpu="normal" aria-pressed="true" data-i18n="cpuNormal">NORMAL</button>
      <button class="btn" data-cpu="hard" aria-pressed="false" data-i18n="cpuHard">HARD</button>
      <button class="btn" data-cpu="brutal" aria-pressed="false" data-i18n="cpuBrutal">BRUTAL</button>
    </div>
    <p class="tiny" id="cpuDesc"></p>
    <button class="btn" data-act="cpu-back" data-i18n="back">BACK</button>
  </section>

  <!-- SETTINGS -->
  <section class="panel" id="panel-settings" role="dialog">
    <h2 data-i18n="settings">SETTINGS</h2>
    <div class="sheet">
      <div class="row">
        <span class="rowlabel" data-i18n="language"></span>
        <div class="seg" id="segLang"><button data-v="en">English</button><button data-v="fr">Français</button></div>
      </div>
      <div class="row">
        <span class="rowlabel" data-i18n="volume"></span>
        <input type="range" id="volRange" min="0" max="100" step="1" aria-label="Volume">
      </div>
      <div class="row">
        <span class="rowlabel" data-i18n="mute"></span>
        <button class="toggle" id="muteBtn" aria-pressed="false" aria-label="Mute"><span></span></button>
      </div>
      <div class="row">
        <span class="rowlabel" data-i18n="effects"></span>
        <div class="seg" id="segFx"><button data-v="full" data-i18n="full"></button><button data-v="reduced" data-i18n="reduced"></button></div>
      </div>
    </div>
    <button class="btn" data-act="settings-back" data-i18n="back">BACK</button>
  </section>

  <!-- PAUSE -->
  <section class="panel veil" id="panel-pause" role="dialog">
    <h2 data-i18n="paused">PAUSED</h2>
    <div class="stack">
      <button class="btn" data-act="resume" data-i18n="resume"></button>
      <button class="btn" data-act="restart" data-i18n="restart"></button>
      <button class="btn ghost" data-act="pause-settings" data-i18n="settings"></button>
      <button class="btn ghost" data-act="home" data-i18n="home"></button>
    </div>
  </section>

  <!-- COMPLETE -->
  <section class="panel dark" id="panel-complete" role="dialog">
    <h2 data-i18n="complete">RUN COMPLETE</h2>
    <dl class="stats">
      <div class="stat"><dt data-i18n="finishPos"></dt><dd id="statPos">1 / 6</dd></div>
      <div class="stat"><dt data-i18n="distance"></dt><dd id="statDist">0 m</dd></div>
      <div class="stat"><dt data-i18n="collisions"></dt><dd id="statHits">0</dd></div>
      <div class="stat"><dt data-i18n="finalSpeed"></dt><dd id="statSpeed">2.00x</dd></div>
    </dl>
    <div class="stack">
      <button class="btn" data-act="again" data-i18n="playAgain"></button>
      <button class="btn" data-act="home" data-i18n="returnHome"></button>
    </div>
  </section>

  <!-- ORIENTATION -->
  <section class="panel" id="panel-orient" role="dialog">
    <div class="rotIcon" aria-hidden="true"></div>
    <p class="lede" id="orientTitle"></p>
    <p class="tiny" id="orientNote"></p>
  </section>
</div>

<script>
/* ============================================================================
   SEREN
   A minimalist three-column parkour game. Single file, no dependencies.

   Systems, in order:
     0. utilities        7. player
     1. storage          8. obstacles
     2. localization     9. procedural generator
     3. settings        10. run / game logic
     4. audio           11. rendering
     5. layout          12. input
     6. vfx             13. screens + boot
   ========================================================================== */
(function () {
'use strict';

/* ============================================================================
   0. UTILITIES
   ========================================================================== */
var PI = Math.PI, TAU = PI * 2;
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function rand(a, b) { return a + Math.random() * (b - a); }
function randInt(a, b) { return Math.floor(a + Math.random() * (b - a + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeInCubic(t) { return t * t * t; }
function easeInOutCubic(t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function easeOutBack(t) { var c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
function easeOutQuint(t) { return 1 - Math.pow(1 - t, 5); }
/* frame-rate independent approach-to-target */
function approach(cur, target, rate, dt) { return cur + (target - cur) * (1 - Math.exp(-rate * dt)); }

/* ============================================================================

  VIEW.dpr = clamp(window.devicePixelRatio || 1, 1, 2.5);

  canvas.style.width = vw + 'px';
  canvas.style.height = vh + 'px';
  canvas.width = Math.round(vw * VIEW.dpr);
  canvas.height = Math.round(vh * VIEW.dpr);
  ctx.setTransform(VIEW.dpr, 0, 0, VIEW.dpr, 0, 0);

  if (IS_MOBILE) {
    /* phone: the playfield is the whole screen; HUD respects the notch */
    PF.x = 0; PF.y = 0; PF.w = vw; PF.h = vh;
  } else {
    /* desktop: a centred portrait corridor, never stretched across ultrawide */
    var h = Math.min(vh - 40, 1000);
    var w = Math.min(h * 0.74, vw - 80, 780);
    h = Math.min(h, w / 0.5);
    PF.w = Math.max(240, w); PF.h = Math.max(320, h);
    PF.x = Math.round((vw - PF.w) / 2);
    PF.y = Math.round((vh - PF.h) / 2);
  }
  positionPauseButton();
  checkOrientation();
}

function colW() { return PF.w / 3; }
function laneCenterX(lane) { return PF.x + PF.w * (lane + 0.5) / 3; }
function playerRadius() { return colW() * CFG.PLAYER_R; }
function hudTop() { return PF.y + (IS_MOBILE ? INSET.t + 14 : 12); }

function positionPauseButton() {
  var b = document.getElementById('pauseBtn');
  b.style.left = Math.round(PF.x + PF.w - 42 - (IS_MOBILE ? INSET.r + 12 : 12)) + 'px';
  b.style.top = Math.round(hudTop() - 4) + 'px';
}

/* ============================================================================
   7. VFX — particles, ripples, speed lines, screen shake
   ========================================================================== */
var VFX = {
  parts: [], ripples: [], lines: [], shake: 0, shakeT: 0, moteAcc: 0,

  scale: function () { return Settings.reduced ? 0.35 : 1; },


  /* everything that belongs to the track scrolls with it */
  scrollWorld: function (dy) {
    var i;
    for (i = 0; i < this.parts.length; i++) if (this.parts[i].w) this.parts[i].y += dy;
    for (i = 0; i < this.ripples.length; i++) if (this.ripples[i].w) this.ripples[i].y += dy;
  },

  /* ---- ambient specks: texture in the empty track, never noise ---- */
  motes: function (dt, mult) {
    if (Settings.reduced) return;
    this.moteAcc += (5 + (mult - 1) * 9) * dt;
    while (this.moteAcc >= 1) {
      this.moteAcc -= 1;
      this.parts.push({
        x: PF.x + rand(4, PF.w - 4), y: PF.y - rand(4, 30),
        vx: rand(-8, 8), vy: rand(10, 40), life: 0, max: rand(1.6, 2.6),
        size: rand(1, 2.3), color: '#000', drag: 0.2, grav: 0, streak: false,
        a0: rand(.10, .22), w: true
      });
    }
  },
  /* ---- an obstacle sweeping past the player ---- */
  whoosh: function (r, near) {
    if (Settings.reduced) return;
    var y = r.y + r.h * 0.5;
    for (var side = 0; side < 2; side++) {
      var x = side ? r.x + r.w : r.x;
      this.parts.push({
        x: x, y: y, vx: (side ? 1 : -1) * rand(120, 260), vy: rand(-30, 30),
        life: 0, max: rand(.18, .3), size: rand(1.6, 3), color: '#000',
        drag: 3.4, grav: 0, streak: true, a0: .5
      });
    }
    if (near) {
      this.ripple(near.x, near.y, playerRadius() * 0.9, playerRadius() * 2.6, accent(1), .34, 1.6);
      this.burst(near.x, near.y, 6, { color: accent(1), spMin: 60, spMax: 220,
        sizeMax: 2.6, lifeMax: .32, streak: true });
    }
  },

  burst: function (x, y, n, opt) {
    opt = opt || {};
    n = Math.max(1, Math.round(n * this.scale()));
    for (var i = 0; i < n; i++) {
      var a = opt.dir !== undefined ? opt.dir + rand(-0.9, 0.9) : rand(0, TAU);
      var sp = rand(opt.spMin || 90, opt.spMax || 320);
      this.parts.push({
        x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0, max: rand(opt.lifeMin || .3, opt.lifeMax || .7),
        size: rand(opt.sizeMin || 2, opt.sizeMax || 5),
        color: opt.color || '#000', drag: opt.drag || 2.6,
        grav: opt.grav || 0, streak: !!opt.streak, a0: opt.a0, w: !!opt.world
      });
    }
  },
  ripple: function (x, y, r0, r1, color, dur, width) {
    this.ripples.push({ x: x, y: y, r0: r0, r1: r1, t: 0,
      dur: dur || .55, color: color || '#000', w: width || 2 });
  },
  /* ---- the dash a marble throws off as it crosses to another column ----
     A single horizontal streak, laid from the column it left to its own
     trailing edge. It exists only for the switch and the moment after it. */
  dashes: [], liveDash: null,
  startDash: function (x, y, dir, r, color) {
    this.liveDash = { x0: x, x1: x, y: y, dir: dir, r: r, t: 0, max: CFG.DASH_TIME,
      color: color || marble().color };
    this.dashes.push(this.liveDash);
    if (this.dashes.length > 3) this.dashes.shift();
  },
  trackDash: function (x, y) {
    if (this.liveDash) { this.liveDash.x1 = x; this.liveDash.y = y; }
  },
  releaseDash: function () { this.liveDash = null; },
  drawDashes: function () {
    if (!this.dashes.length) return;
    for (var i = 0; i < this.dashes.length; i++) {
      var d = this.dashes[i], f = 1 - d.t / d.max;
      ctx.fillStyle = d.color;
      var head = d.x1 - d.dir * d.r * 0.82;      /* the marble's trailing edge */
      if ((head - d.x0) * d.dir <= 1) continue;  /* nothing to draw yet */
      var hh = d.r * 0.42 * (0.32 + 0.68 * f);   /* thins as it goes */
      var th = hh * 0.16;
      ctx.globalAlpha = 0.58 * f * f;
      ctx.beginPath();
      ctx.moveTo(d.x0, d.y - th);
      ctx.lineTo(head, d.y - hh);
      ctx.lineTo(head, d.y + hh);
      ctx.lineTo(d.x0, d.y + th);
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  },
  addShake: function (m) { if (Settings.reduced) return; this.shake = Math.max(this.shake, m); },

  update: function (dt) {
    var i, p;
    for (i = this.parts.length - 1; i >= 0; i--) {
      p = this.parts[i]; p.life += dt;
      if (p.life >= p.max) { this.parts.splice(i, 1); continue; }
      var d = Math.exp(-p.drag * dt);
      p.vx *= d; p.vy = p.vy * d + p.grav * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    for (i = this.ripples.length - 1; i >= 0; i--) {
      var r = this.ripples[i]; r.t += dt;
      if (r.t >= r.dur) this.ripples.splice(i, 1);
    }
    for (i = this.dashes.length - 1; i >= 0; i--) {
      var d = this.dashes[i]; d.t += dt;
      if (d.t >= d.max) {
        if (this.liveDash === d) this.liveDash = null;
        this.dashes.splice(i, 1);
      }
    }
    for (i = this.lines.length - 1; i >= 0; i--) {
      var l = this.lines[i]; l.y += l.v * dt; l.life += dt;
      if (l.life > l.max || l.y > PF.y + PF.h + 100) this.lines.splice(i, 1);
    }
    this.shake = Math.max(0, this.shake - dt * 26);
  },
  clear: function () {
    this.parts.length = 0; this.ripples.length = 0; this.lines.length = 0;
    this.dashes.length = 0; this.liveDash = null; this.shake = 0; this.moteAcc = 0;
  },

  drawParticles: function () {
    var i, p, a;
    for (i = 0; i < this.parts.length; i++) {
      p = this.parts[i];
      a = 1 - p.life / p.max;
      ctx.globalAlpha = a * (p.a0 === undefined ? 1 : p.a0);
      ctx.fillStyle = p.color;
      if (p.streak) {
        var len = clamp(Math.hypot(p.vx, p.vy) * 0.035, 3, 40);
        var ang = Math.atan2(p.vy, p.vx);
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(ang);
        ctx.fillRect(-len, -p.size * 0.35, len, p.size * 0.7);
        ctx.restore();
      } else {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * a, 0, TAU); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  },
  drawRipples: function () {
    for (var i = 0; i < this.ripples.length; i++) {
      var r = this.ripples[i], k = r.t / r.dur;
      ctx.globalAlpha = (1 - k) * (r.fade ? .32 : .8);
      ctx.strokeStyle = r.color;
      ctx.lineWidth = r.w * (1 - k * .5);
      ctx.beginPath();
      ctx.arc(r.x, r.y, lerp(r.r0, r.r1, easeOutCubic(k)), 0, TAU);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  },
  drawSpeedLines: function () {
    for (var i = 0; i < this.lines.length; i++) {
      var l = this.lines[i];
      ctx.strokeStyle = l.c;
      ctx.globalAlpha = l.a * (1 - l.life / l.max);
      ctx.lineWidth = l.w;
      ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(l.x, l.y + l.len); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  },
  spawnSpeedLine: function (mult) {
    if (Settings.reduced) return;
    /* exactly the speed of the ground: nothing on screen may exaggerate the
       multiplier the HUD is reporting */
    var world = Run.speedN() * PF.h;               /* pixels per second of the world */
    var hot = ACCENT && Math.random() < 0.34;
    this.lines.push({
      x: PF.x + rand(6, PF.w - 6), y: PF.y - rand(20, 140),
      len: rand(20, 80) * (0.6 + mult * 0.5), v: world,
      a: hot ? rand(.20, .42) : rand(.05, .13),
      w: hot ? rand(1, 2.2) : rand(.7, 1.4),
      c: hot ? accent(1, 56) : '#000', life: 0, max: 2.2
    });
  }
};

/* ============================================================================
   8. THE WORLD — one canonical course, measured in metres

   Everything on the track lives at a world distance, not at a screen position.
   A racer at world distance d meets the hazard at 250 m when, and only when,
   that racer's own d reaches 250. The camera is a separate concern: it rides
   the human racer, and the mapping below is the only place the two meet.
   ========================================================================== */
function yNof(wd) { return CFG.PLAYER_Y - (wd - Race.camD) / CFG.METERS_VISIBLE; }
function screenY(wd) { return PF.y + yNof(wd) * PF.h; }
function metresToPx(m) { return m / CFG.METERS_VISIBLE * PF.h; }
function pxToMetres(px) { return px / PF.h * CFG.METERS_VISIBLE; }
function laneCenterF(l) { return (l + 0.5) / 3; }

/* wd  : world distance of the near edge — the first part a racer meets
   hM  : length along the track, in metres
   cxF : centre, fraction of playfield width      wF : width, same units      */
function Obstacle(kind, cxF, wF, hM, crouch, lanes, wd) {
  this.kind = kind; this.cxF = cxF; this.wF = wF; this.hM = hM;
  this.crouch = !!crouch; this.lanes = lanes; this.wd = wd;
  this.move = null;               /* set for moving squares */
  this.lastCxF = cxF;
  this.harmful = true;            /* false for the boost pad, which helps you */
  this.seen = {};                 /* which racers this one has already acted on */
}
/* Moving squares travel between two neighbouring columns, so the third column
   is always a guaranteed way through. Their position is a function of the
   shared race clock and their own phase — never of any one racer — so all six
   racers see the same hazard in the same column at the same instant. */
Obstacle.prototype.advance = function () {
  var m = this.move;
  if (!m) return;
  this.lastCxF = this.cxF;
  var k = 0.5 - 0.5 * Math.cos((Race.clock / m.period + m.phase) * TAU);
  this.cxF = lerp(laneCenterF(m.a), laneCenterF(m.b), k);
};
Obstacle.prototype.rect = function () {
  var w = this.wF * PF.w;
  return { x: PF.x + this.cxF * PF.w - w / 2, y: screenY(this.wd + this.hM),
    w: w, h: metresToPx(this.hM) };
};
Obstacle.prototype.blocks = function (lane) { return this.lanes.indexOf(lane) >= 0; };

var Obstacles = {
  list: [],
  clear: function () { this.list.length = 0; },

  /* factory: sizes derive from the column width, so they scale everywhere */
  spawn: function (entry, wd) {
    if (wd === undefined) wd = Race.camD + CFG.METERS_VISIBLE * CFG.PLAYER_Y + 2;
    var colM = pxToMetres(colW());     /* one column width, in metres */
    var out = [];
    if (entry.kind === 'square') {
      out.push(new Obstacle('square', laneCenterF(entry.lane), 0.78 / 3, colM * 0.78, false, [entry.lane], wd));
    } else if (entry.kind === 'twin') {
      for (var i = 0; i < entry.lanes.length; i++) {
        var l = entry.lanes[i];
        out.push(new Obstacle('square', laneCenterF(l), 0.78 / 3, colM * 0.78, false, [l], wd));
      }
    } else if (entry.kind === 'bar2') {
      out.push(new Obstacle('bar2', (entry.lane + 1) / 3, 1.88 / 3, colM * 0.54, entry.crouch,
        [entry.lane, entry.lane + 1], wd));
    } else if (entry.kind === 'bar3') {
      out.push(new Obstacle('bar3', 0.5, 1, colM * 0.50, true, [0, 1, 2], wd));
    } else if (entry.kind === 'boost') {
      var bs = new Obstacle('boost', laneCenterF(entry.lane), 0.58 / 3, colM * 0.58,
        false, [entry.lane], wd);
      bs.harmful = false;
      out.push(bs);
    } else if (entry.kind === 'mover' || entry.kind === 'shuttle' || entry.kind === 'moverC') {
      var duck = entry.kind === 'moverC';
      var mv = new Obstacle(duck ? 'moverC' : 'mover', laneCenterF(entry.lane),
        0.74 / 3, colM * (duck ? 0.58 : 0.74), duck, entry.lanes, wd);
      mv.move = { a: entry.lane, b: entry.to, phase: Math.random(),
        period: entry.kind === 'shuttle' ? CFG.SHUTTLE_PERIOD : CFG.MOVER_PERIOD };
      out.push(mv);
    }
    for (var j = 0; j < out.length; j++) this.list.push(out[j]);
    return out;
  },

  /* the world only advances its own moving parts; nothing here depends on any
     racer's position, and nothing is thrown away until every racer is past */
  update: function (dt) {
    var behind = Race.trailD() - 12;
    for (var i = this.list.length - 1; i >= 0; i--) {
      var o = this.list[i];
      o.advance();
      if (o.wd + o.hM < behind) this.list.splice(i, 1);
    }
  },

  /* the hazards a racer could be touching or about to touch */
  near: function (d, ahead, behind) {
    var out = [];
    for (var i = 0; i < this.list.length; i++) {
      var o = this.list[i];
      if (o.wd > d + ahead) continue;
      if (o.wd + o.hM < d - (behind || 3)) continue;
      out.push(o);
    }
    return out;
  },

  draw: function () {
    var top = Race.camD + CFG.METERS_VISIBLE * (CFG.PLAYER_Y + 0.1);
    var bot = Race.camD - CFG.METERS_VISIBLE * (1.1 - CFG.PLAYER_Y);
    for (var i = 0; i < this.list.length; i++) {
      var o = this.list[i];
      if (o.wd > top || o.wd + o.hM < bot) continue;      /* off camera */
      var r = o.rect();
      /* a moving square drags a short afterimage so its travel reads instantly */
      if (o.move && !Settings.reduced) {
        var d = o.cxF - o.lastCxF;
        if (Math.abs(d) > 1e-5) {
          ctx.fillStyle = '#000';
          for (var g = 1; g <= 3; g++) {
            ctx.globalAlpha = 0.13 - g * 0.03;
            ctx.fillRect(r.x - d * PF.w * g * 3.2, r.y, r.w, r.h);
          }
          ctx.globalAlpha = 1;
        }
      }
      if (!o.harmful) { this.drawBoost(r); continue; }
      ctx.fillStyle = '#000';
      ctx.fillRect(r.x, r.y, r.w, r.h);
      if (o.crouch) this.drawChevrons(o, r);
      /* the overhead squares carry a lit strip along the edge you pass under,
         so they read as hanging rather than sitting in the lane */
      if (o.kind === 'moverC') this.drawClearance(r);
    }
  },
  /* a shiny yellow pad with two arrows pointing the way you are going */
  drawBoost: function (r) {
    var g = ctx.createLinearGradient(r.x, r.y, r.x, r.y + r.h);
    g.addColorStop(0, '#FFE680');
    g.addColorStop(0.42, BOOST_INK);
    g.addColorStop(1, '#D89400');
    ctx.fillStyle = g;
    ctx.fillRect(r.x, r.y, r.w, r.h);

    /* a highlight travelling across the face, off the shared clock so every
       racer sees the same glint at the same moment */
    if (!Settings.reduced) {
      var k = (Race.clock * 0.7) % 1;
      var bx = r.x - r.w * 0.7 + k * r.w * 2.4;
      ctx.save();
      ctx.beginPath(); ctx.rect(r.x, r.y, r.w, r.h); ctx.clip();
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = '#FFFBE0';
      ctx.beginPath();
      ctx.moveTo(bx, r.y + r.h);
      ctx.lineTo(bx + r.w * 0.20, r.y + r.h);
      ctx.lineTo(bx + r.w * 0.50, r.y);
      ctx.lineTo(bx + r.w * 0.30, r.y);
      ctx.closePath(); ctx.fill();
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    var lw = Math.max(1.4, r.w * 0.05);
    ctx.strokeStyle = '#000'; ctx.lineWidth = lw;
    ctx.strokeRect(r.x + lw / 2, r.y + lw / 2, r.w - lw, r.h - lw);

    /* two arrows, stacked, pointing up the track */
    var cx = r.x + r.w / 2;
    var aw = r.w * 0.24, ah = r.h * 0.17, gap = r.h * 0.26;
    ctx.strokeStyle = '#000';
    ctx.lineWidth = Math.max(2, r.w * 0.09);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    for (var i = 0; i < 2; i++) {
      var cy = r.y + r.h * 0.5 + (i - 0.5) * gap + ah * 0.5;
      ctx.beginPath();
      ctx.moveTo(cx - aw, cy); ctx.lineTo(cx, cy - ah); ctx.lineTo(cx + aw, cy);
      ctx.stroke();
    }
  },
  drawClearance: function (r) {
    ctx.fillStyle = '#fff';
    ctx.globalAlpha = 0.85;
    ctx.fillRect(r.x + r.w * 0.10, r.y + r.h - Math.max(2, r.h * 0.12),
      r.w * 0.80, Math.max(2, r.h * 0.12));
    ctx.globalAlpha = 1;
  },
  /* redrawn over a ducking racer so it genuinely reads as passing underneath */
  drawOverhead: function () {
    for (var n = 0; n < Race.racers.length; n++) {
      var p = Race.racers[n];
      if (!p.alive || p.crouchAmt < 0.02 || !p.onCamera()) continue;
      var b = p.box(), top = b.y - b.ry * 2.2, bot = b.y + b.ry * 2.2;
      for (var i = 0; i < this.list.length; i++) {
        var o = this.list[i];
        if (!o.crouch) continue;
        var r = o.rect();
        if (r.y > bot || r.y + r.h < top) continue;
        ctx.fillStyle = '#000';
        ctx.fillRect(r.x, r.y, r.w, r.h);
        this.drawChevrons(o, r);
      }
    }
  },
  /* white chevrons = "you may pass under this by crouching" */
  drawChevrons: function (o, r) {
    var n = o.kind === 'bar3' ? 3 : 2;
    var cw = Math.min(r.w / (n + 1), colW()) * 0.30;
    var ch = cw * 0.62;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = Math.max(2, cw * 0.26);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    for (var i = 0; i < n; i++) {
      var cx = r.x + r.w * (i + 0.5) / n;
      var cy = r.y + r.h * 0.5 - ch * 0.5;
      ctx.beginPath();
      ctx.moveTo(cx - cw, cy); ctx.lineTo(cx, cy + ch); ctx.lineTo(cx + cw, cy);
      ctx.stroke();
    }
  }
};

/* ============================================================================
   9. PROCEDURAL GENERATOR
   Every hazard is rolled independently — kind, column and spacing are all
   random, so the track never repeats an authored phrase. It is written into
   the world *ahead of whichever racer leads*, and once written it is fixed:
   random when created, canonical afterwards.
   ========================================================================== */
function allBut(blocked) {
  var out = [];
  for (var l = 0; l < 3; l++) if (blocked.indexOf(l) < 0) out.push(l);
  return out.length ? out : [0, 1, 2];
}
/* worst case number of lanes a racer may have to cross between two entries */
function laneDistance(from, to) {
  var worst = 0;
  for (var i = 0; i < from.length; i++) {
    var best = 9;
    for (var j = 0; j < to.length; j++) best = Math.min(best, Math.abs(from[i] - to[j]));
    worst = Math.max(worst, best);
  }
  return worst;
}
function E_square(lane) {
  return { kind: 'square', lane: lane, crouch: false, safe: allBut([lane]) };
}
function E_twin(a, b) {
  return { kind: 'twin', lanes: [a, b], crouch: false, safe: allBut([a, b]) };
}
function E_bar2(start, crouchable) {
  return { kind: 'bar2', lane: start, crouch: crouchable,
    safe: crouchable ? [0, 1, 2] : allBut([start, start + 1]) };
}
function E_bar3() { return { kind: 'bar3', crouch: true, safe: [0, 1, 2] }; }
/* the boost pad blocks nothing at all — it is somewhere to aim for */
function E_boost(lane) {
  return { kind: 'boost', lane: lane, crouch: false, safe: [0, 1, 2] };
}
function E_mover(a, b, shuttle) {
  var lo = Math.min(a, b), hi = Math.max(a, b), span = [];
  for (var l = lo; l <= hi; l++) span.push(l);
  return { kind: shuttle ? 'shuttle' : 'mover', lane: a, to: b, lanes: span,
    crouch: false, safe: allBut(span) };
}
/* a moving square you go under rather than around */
function E_moverC(a, b) {
  var lo = Math.min(a, b), hi = Math.max(a, b), span = [];
  for (var l = lo; l <= hi; l++) span.push(l);
  return { kind: 'moverC', lane: a, to: b, lanes: span, crouch: true, safe: [0, 1, 2] };
}

/* the roll table: weights shift with speed, nothing else is scripted */
var KINDS = [
  { id: 'square',  min: 1.00, w: function (m) { return 30; },
    make: function (last) { return E_square(rollLane(last)); } },
  { id: 'twin',    min: 1.05, w: function (m) { return 11; },
    make: function () { var a = randInt(0, 2), b = pick(allBut([a])); return E_twin(a, b); } },

    make: function () { return E_bar2(randInt(0, 1), false); } },

    make: function () { return E_bar2(randInt(0, 1), true); } },
  { id: 'bar3',    min: 1.00, w: function (m) { return 11; }, wall: true,
    make: function () { return E_bar3(); } },

    make: function () {

      return E_mover(a, b, false);
    } },
  { id: 'shuttle', min: 1.35, w: function (m) { return 5 + (m - 1.35) * 10; },
    make: function () { var a = randInt(0, 1); return E_mover(a, a + 1, true); } },
  { id: 'moverC',  min: 1.30, w: function (m) { return 6 + (m - 1.30) * 8; },
    make: function () {

    } },
  /* uncommon, but often enough to be worth watching for */
  { id: 'boost',   min: 1.00, w: function (m) { return 4; },

function rollLane(last) {

var Gen = {
  queue: [], frontier: 0, sinceWall: 99, lastKind: '', lastLane: -1, enabled: false,

  reset: function (from) {
    this.queue.length = 0; this.sinceWall = 99;
    this.lastKind = ''; this.lastLane = -1; this.enabled = true;
    this.frontier = (from || 0) + CFG.METERS_VISIBLE * 0.9;   /* a clear start line */
  },
  stop: function () { this.enabled = false; },

  /* spacing, in seconds of travel. The fair-gap floor below still guarantees
     everything is passable; this only tightens the stretches that were roomier
     than they had to be. */
  gapScale: function (mult) { return lerp(1.08, 0.86, clamp((mult - 1) / 1, 0, 1)); },
  rollGap: function () {
    if (Math.random() < 0.09) return rand(1.6, 2.1);       /* the odd breather */
    return rand(0.58, 1.32);
  },

  roll: function (mult) {
    var pool = [], total = 0, i, k, w;
    for (i = 0; i < KINDS.length; i++) {
      k = KINDS[i];
      if (mult + 1e-6 < k.min) continue;
      if (k.wall && this.sinceWall < CFG.WALL_COOLDOWN) continue;
      w = Math.max(1, k.w(mult));
      if (k.id === this.lastKind) w *= 0.35;          /* no two-in-a-row habits */
      if (k.wall) w *= clamp(this.sinceWall / (CFG.WALL_COOLDOWN * 1.6), 0.2, 1.4);
      pool.push({ k: k, w: w }); total += w;
    }
    if (!pool.length) return KINDS[0];
    var r = Math.random() * total;
    for (i = 0; i < pool.length; i++) { r -= pool[i].w; if (r <= 0) return pool[i].k; }
    return pool[pool.length - 1].k;
  },

  refill: function (mult) {
    while (this.queue.length < 3) {
      var k = this.roll(mult);
      var e = k.make(this.lastLane);
      e.gap = k.id === 'boost' ? rand(1.9, 2.6) : this.rollGap();
      e.wall = !!k.wall;
      this.lastKind = k.id;
      this.lastLane = (e.lane === undefined) ? -1 : e.lane;
      if (k.wall) this.sinceWall = 0;
      this.queue.push(e);
    }
  },

  /* the fair gap, in seconds, between two consecutive entries */
  fairGap: function (a, b) {
    var g = CFG.REACTION_BASE + laneDistance(a.safe, b.safe) * CFG.REACTION_LANE;
    if (a.crouch) g += CFG.CROUCH_RELEASE;
    if (a.kind === 'mover' || a.kind === 'shuttle' || a.kind === 'moverC') g += CFG.CROUCH_RELEASE;
    if (a.kind === 'boost') g *= CFG.BOOST_SCALE;   /* they will arrive faster */
    return g;
  },

  /* author the course ahead of whoever is leading — not ahead of the camera */
  update: function (dt, mult, leadD) {
    if (!this.enabled) return;
    this.sinceWall += dt;
    this.refill(mult);
    var horizon = leadD + CFG.WORLD_AHEAD;
    var guard = 0;
    while (this.frontier < horizon && guard++ < 40) {
      var e = this.queue.shift();
      this.refill(mult);
      var next = this.queue[0];
      Obstacles.spawn(e, this.frontier);
      var gap = e.gap * this.gapScale(mult);
      gap = Math.max(gap, this.fairGap(e, next));
      this.frontier += gap * CFG.BASE_SPEED * mult;   /* seconds of travel -> metres */
    }
  }
};

/* ============================================================================
   10. RACERS — one simulation, six competitors

   The human is racer 0. Everything below applies to all six equally: the same
   movement, the same hazards, the same collisions, the same respawns. The only
   difference between the human and the other five is where their decisions
   come from.
   ========================================================================== */
var AI_LEVELS = {
  /* look is capped at the track a racer can actually see ahead of itself, so
     no level is ever reacting to something off screen */
  easy:   { react: [0.34, 0.52], look: 9,  err: 0.34, aggr: 0.10, defend: 0.10,
            waves: 1, duck: 0.60, lead: 0.55, greed: 0.15 },
  normal: { react: [0.19, 0.30], look: 14, err: 0.16, aggr: 0.34, defend: 0.38,
            waves: 2, duck: 0.88, lead: 0.75, greed: 0.45 },
  hard:   { react: [0.11, 0.18], look: 19, err: 0.055, aggr: 0.60, defend: 0.70,
            waves: 3, duck: 0.97, lead: 0.95, greed: 0.78 },
  brutal: { react: [0.07, 0.11], look: 22, err: 0.015, aggr: 0.86, defend: 0.93,
            waves: 4, duck: 1.00, lead: 1.15, greed: 1.00 }
};
var AI_ORDER = ['easy', 'normal', 'hard', 'brutal'];
function aiLevel() { return AI_LEVELS[Settings.cpu] || AI_LEVELS.normal; }

function Racer(id, human, marbleKey) {
  this.id = id;
  this.human = !!human;
  this.marble = marbleKey;
  this.d = 0;
  this.lane = 1; this.xF = 0.5; this.fromF = 0.5; this.toF = 0.5; this.moveT = 1; this.dir = 0;
  this.crouch = false; this.crouchAmt = 0;
  this.alive = true; this.spawnT = 1; this.immune = 0; this.immuneExt = 0;
  this.slow = 0;                 /* bump slowdown, seconds remaining */
  this.boost = 0;                /* speed-pad boost, seconds remaining */
  this.bubble = 0;               /* respawn bubble, seconds remaining */
  this.bubbleT = 0; this.coasting = false;
  this.entryD = 0;               /* how far back it still is on the starting roll */
  this.entryFrom = 0; this.entryDelay = 0;
  this.bumpCd = 0;               /* short guard against repeat contacts */
  this.hitFlash = 0;
  this.respawnT = 0; this.collisions = 0; this.finished = false;
  this.dustT = 0; this.yOff = 0; this.scaleMul = 1;
  this.ai = human ? null : { next: 0, want: 1, duckFor: null, duckOk: true, seen: 0 };
}

Racer.prototype.laneF = function (l) { return (l + 0.5) / 3; };
Racer.prototype.place = function (lane, d) {
  this.lane = clamp(lane, 0, 2);
  this.xF = this.fromF = this.toF = this.laneF(this.lane);
  this.moveT = 1; this.dir = 0;
  this.crouch = false; this.crouchAmt = 0;
  this.alive = true; this.spawnT = 1;
  this.immune = 0; this.immuneExt = 0; this.slow = 0; this.bumpCd = 0;
  this.boost = 0; this.entryD = 0; this.bubble = 0; this.bubbleT = 0;
  this.coasting = false;
  this.yOff = 0; this.scaleMul = 1;
  if (d !== undefined) this.d = d;
  if (this.ai) { this.ai.next = 0; this.ai.duckFor = null; }
};
/* kept for the call sites that reset the human racer by lane alone */
Racer.prototype.reset = function (lane) { this.place(lane === undefined ? 1 : lane); };

Racer.prototype.x = function () { return PF.x + this.xF * PF.w; };
/* the camera rides the human racer by definition, so that racer sits on its
   mark exactly — the rest are placed relative to it */
Racer.prototype.y = function () {
  if (this.human) {
    return PF.y + (CFG.PLAYER_Y - this.entryD / CFG.METERS_VISIBLE) * PF.h + this.yOff;
  }
  return screenY(this.d + this.entryD) + this.yOff;
};
Racer.prototype.onCamera = function () {
  var yn = yNof(this.d + this.entryD);
  return yn > -0.15 && yn < 1.15;
};
Racer.prototype.radiusPx = function () {
  return playerRadius() * this.scaleMul * (1 - CFG.CROUCH_SHRINK * this.crouchAmt);
};
Racer.prototype.radiusM = function () { return pxToMetres(this.radiusPx()); };
Racer.prototype.marbleDef = function () { return MARBLES[this.marble] || MARBLES.blue; };

/* how fast this racer is covering ground right now, as a fraction of the
   shared multiplier: a timed status effect, never a permanent change */
Racer.prototype.speedScale = function () {
  /* eliminated: the world stops dead for this racer and does not start again
     until it is back on the track. Everyone else carries on without it. */
  if (!this.alive) return this.coasting ? 1 : 0;
  var s = 1;
  if (this.boost > 0) s *= CFG.BOOST_SCALE;
  if (this.slow > 0) s *= CFG.BUMP_SLOW_SCALE;
  return s;
};

/* the drawn size of the body. Ducking shrinks the whole marble evenly —
   it never flattens — and the only stretch left is the lane-change lean. */
Racer.prototype.dims = function () {
  var r = playerRadius() * this.scaleMul * (1 - CFG.CROUCH_SHRINK * this.crouchAmt);
  var m = this.moveT < 1 ? Math.sin(this.moveT * PI) : 0;
  return { rx: r * (1 + 0.16 * m), ry: r * (1 - 0.10 * m) };
};
/* the hitbox follows the drawn body */
Racer.prototype.box = function () {
  var r = this.radiusPx() * CFG.HITBOX_FORGIVE;
  return { x: this.x(), y: this.y(), rx: r, ry: r };
};

/* a lane change, routed through the bump rules so two racers can never end up
   sharing a column */
Racer.prototype.setLane = function (n) {
  n = clamp(n, 0, 2);
  if (n === this.lane) return false;
  return Race.move(this, n > this.lane ? 1 : -1);
};
/* the animation half of a lane change, once the world has agreed to it */
Racer.prototype.slideTo = function (lane, dir, quiet) {
  this.dir = dir;
  this.lane = lane;
  this.fromF = this.xF; this.toF = this.laneF(lane); this.moveT = 0;
  if (!quiet && this.onCamera()) {
    if (this.human) Sound.play(dir > 0 ? 'laneR' : 'laneL');
    var r = playerRadius();
    VFX.startDash(this.x(), this.y(), dir, this.dims().rx, this.marbleDef().color);
    VFX.burst(this.x() - dir * r * 0.5, this.y() + r * 0.5, this.human ? 7 : 4, {
      color: '#000', dir: PI / 2 - dir * 0.9, spMin: 60, spMax: 210,
      sizeMax: 2.6, lifeMax: .34, streak: true, a0: .6, world: true
    });
    VFX.ripple(this.x(), this.y(), r * 0.7, r * 1.9, '#000', .3, 1.2);
  }
};

Racer.prototype.update = function (dt, active) {
  if (this.slow > 0) this.slow = Math.max(0, this.slow - dt);
  if (this.boost > 0) this.boost = Math.max(0, this.boost - dt);
  if (this.bumpCd > 0) this.bumpCd = Math.max(0, this.bumpCd - dt);
  if (this.hitFlash > 0) this.hitFlash = Math.max(0, this.hitFlash - dt);

  /* lane interpolation with a soft overshoot */
  if (this.moveT < 1) {
    this.moveT = Math.min(1, this.moveT + dt / CFG.LANE_TIME);
    var e = easeOutBack(this.moveT) * 0.12 + easeOutQuint(this.moveT) * 0.88;
    this.xF = lerp(this.fromF, this.toF, e);
    if (active && this.alive && this.onCamera()) VFX.trackDash(this.x(), this.y());
    if (this.moveT >= 1) VFX.releaseDash();
  } else { this.xF = this.toF; }

  /* dust kicked up along the ground while crouching */
  if (active && this.alive && this.crouchAmt > 0.55 && !Settings.reduced && this.onCamera()) {
    this.dustT -= dt;
    if (this.dustT <= 0) {
      this.dustT = this.human ? 0.045 : 0.09;
      var dd = this.dims();
      VFX.parts.push({
        x: this.x() + rand(-dd.rx, dd.rx), y: this.y() + dd.ry * 0.8,
        vx: rand(-40, 40), vy: rand(30, 110), life: 0, max: rand(.22, .4),
        size: rand(1.2, 2.6), color: '#000', drag: 2.2, grav: 0,
        streak: false, a0: .45, w: true
      });
    }
  }

  /* crouch easing */
  var target = (this.crouch && this.alive) ? 1 : 0;
  this.crouchAmt = approach(this.crouchAmt, target, CFG.CROUCH_RATE, dt);
  if (this.crouchAmt < 0.002) this.crouchAmt = 0;
  if (this.crouchAmt > 0.998) this.crouchAmt = 1;

  /* respawn pop-in */
  if (this.spawnT < 1) this.spawnT = Math.min(1, this.spawnT + dt / 0.42);

  /* immunity */
  if (this.immune > 0) {
    this.immune -= dt;
    if (this.immune <= 0) {
      if (Race.dangerNow(this) && this.immuneExt < CFG.IMMUNITY_MAX_EXT) {
        this.immune = CFG.IMMUNITY_EXTEND;
        this.immuneExt += CFG.IMMUNITY_EXTEND;
      } else {
        this.immune = 0; this.immuneExt = 0;
        if (this.human) {
          Sound.play('immuneEnd');
          VFX.ripple(this.x(), this.y(), playerRadius(), playerRadius() * 2.1, '#000', .45, 1.6);
        }
      }
    }
  }
};

Racer.prototype.draw = function () {
  if (!this.alive || !this.onCamera()) return;
  var x = this.x(), y = this.y();
  var c = this.crouchAmt;
  var pop = this.spawnT < 1 ? easeOutBack(this.spawnT) : 1;

  var m = this.moveT < 1 ? Math.sin(this.moveT * PI) : 0;
  var d = this.dims();
  var rx = d.rx * pop, ry = d.ry * pop;
  var rr = Math.min(rx, ry);
  var tilt = this.dir * m * 0.20;

  var alpha = 1;
  /* inside the bubble the marble is solid: the shell is the signal, and a
     blinking marble underneath it would only read as noise */
  if (this.immune > 0 && this.bubble <= 0) {
    alpha = 0.28 + 0.72 * (0.5 + 0.5 * Math.sin(App.time * 26));
  }

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.rotate(tilt);

  /* crouch action lines */
  if (c > 0.03) {
    ctx.globalAlpha = alpha * c * 0.55;
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    for (var i = 0; i < 3; i++) {
      var off = (i - 1) * ry * 0.62;
      var jt = Math.sin(App.time * 26 + i * 1.7) * rr * 0.14;
      var len = rr * (0.52 + 0.24 * Math.abs(Math.sin(App.time * 18 + i)));
      ctx.beginPath();
      ctx.moveTo(-rx - rr * 0.34 + jt, off); ctx.lineTo(-rx - rr * 0.34 - len + jt, off);
      ctx.moveTo(rx + rr * 0.34 - jt, off); ctx.lineTo(rx + rr * 0.34 + len - jt, off);
      ctx.stroke();
    }
    ctx.globalAlpha = alpha;
  }

  /* body */
  var mb = this.marbleDef();
  ctx.beginPath();
  ctx.ellipse(0, 0, Math.max(1, rx), Math.max(1, ry), 0, 0, TAU);
  ctx.fillStyle = mb.color; ctx.fill();

  /* the device inside it, turning with the ground this racer has covered */
  var r0 = Math.max(1, rr);
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(0, 0, Math.max(1, rx), Math.max(1, ry), 0, 0, TAU);
  ctx.clip();
  ctx.scale(Math.max(0.05, rx / r0), Math.max(0.05, ry / r0));
  ctx.rotate((this.d + this.entryD) * CFG.ROLL_RATE);
  drawMarblePattern(mb.pattern, r0);
  ctx.restore();

  /* the outline belongs to the marble, so the body is laid down again here:
     restore() gives back the transform and the clip but not the path, and
     the device's path would otherwise be the thing that got stroked */
  ctx.beginPath();
  ctx.ellipse(0, 0, Math.max(1, rx), Math.max(1, ry), 0, 0, TAU);
  ctx.lineWidth = Math.max(1.4, rr * 0.085);
  ctx.strokeStyle = '#000'; ctx.stroke();

  /* a racer knocked out of shape by a bump wears it for the two seconds it
     lasts: a broken ring that rocks with the marble */
  if (this.slow > 0) {
    ctx.globalAlpha = alpha * 0.55 * clamp(this.slow / CFG.BUMP_SLOW_TIME, 0, 1);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = Math.max(1.2, rr * 0.10);
    ctx.lineCap = 'round';
    var sp = App.time * 5;
    for (var k = 0; k < 3; k++) {
      var a0 = sp + k * TAU / 3;
      ctx.beginPath();
      ctx.ellipse(0, 0, rx * 1.34, ry * 1.34, 0, a0, a0 + 0.72);
      ctx.stroke();
    }
    ctx.globalAlpha = alpha;
  }

  ctx.restore();
  ctx.globalAlpha = 1;

  if (this.bubble > 0) this.drawBubble();
};

/* A soap bubble around the marble. What sells it is not colour but the way a
   film gathers at the edge and stays almost invisible through the middle: the
   marble is seen *through* it, the rim catches the light, and a couple of
   highlights sit on the curve of a sphere rather than on a flat ring. */
Racer.prototype.drawBubble = function () {
  var base = playerRadius() * 2.05;
  var k = 1 - clamp(this.bubble / CFG.BUBBLE_TIME, 0, 1);   /* 0 fresh, 1 about to go */
  var grow = 1 + 0.11 * easeInCubic(k);                     /* it swells before it goes */
  var pop = this.spawnT < 1 ? easeOutBack(this.spawnT) : 1;
  var t = App.time, id = this.id;
  /* two axes wobbling out of phase, the way a real one never holds still */
  var rx = base * grow * pop * (1 + Math.sin(t * 3.1 + id) * 0.045);
  var ry = base * grow * pop * (1 + Math.sin(t * 2.3 + id * 1.7 + 1.1) * 0.045);
  var x = this.x(), y = this.y();
  if (rx < 2 || ry < 2) return;
  var fade = 1 - k * 0.25;

  ctx.save();
  ctx.globalAlpha = fade;

  /* the film: all but invisible through the middle, gathering hard at the
     edge. This is the whole trick — it is what makes the marble read as being
     inside a sphere rather than behind a disc. */
  var g = ctx.createRadialGradient(x, y, rx * 0.05, x, y, rx);
  g.addColorStop(0,     'rgba(255,255,255,0.03)');
  g.addColorStop(0.58,  'rgba(255,255,255,0.06)');
  g.addColorStop(0.84,  'rgba(255,255,255,0.18)');
  g.addColorStop(0.965, 'rgba(255,255,255,0.62)');
  g.addColorStop(1,     'rgba(255,255,255,0.12)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); ctx.fill();

  /* iridescence: soft patches of colour drifting in the film, never a ring of
     stripes. Clipped to the bubble so it stays inside the skin. */
  if (!Settings.reduced) {
    ctx.save();
    ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); ctx.clip();
    var hue = (t * 34 + id * 63) % 360;
    for (var i = 0; i < 3; i++) {
      var ang = t * 0.55 + i * TAU / 3 + id;
      var px = x + Math.cos(ang) * rx * 0.52;
      var py = y + Math.sin(ang) * ry * 0.52;
      var h = (hue + i * 118) % 360;
      var ig = ctx.createRadialGradient(px, py, 0, px, py, rx * 0.8);
      ig.addColorStop(0, 'hsla(' + h.toFixed(0) + ',95%,70%,0.34)');
      ig.addColorStop(0.6, 'hsla(' + h.toFixed(0) + ',95%,70%,0.10)');
      ig.addColorStop(1, 'hsla(' + h.toFixed(0) + ',95%,70%,0)');
      ctx.fillStyle = ig;
      ctx.fillRect(x - rx, y - ry, rx * 2, ry * 2);
    }
    ctx.restore();
  }

  /* the skin itself, and a fainter line inside it: the far side of the sphere
     showing through, which is what stops it reading as a flat hoop */
  ctx.lineWidth = Math.max(1, base * 0.032);
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); ctx.stroke();
  ctx.lineWidth = Math.max(0.8, base * 0.018);
  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.beginPath(); ctx.ellipse(x, y, rx * 0.87, ry * 0.87, 0, 0, TAU); ctx.stroke();

  /* where the light sits on it: one broad sweep on the upper left, one small
     hard glint, and a dim bounce on the lower right */
  ctx.lineCap = 'round';
  ctx.lineWidth = Math.max(1.4, base * 0.07);
  ctx.strokeStyle = 'rgba(255,255,255,0.75)';
  ctx.beginPath();
  ctx.ellipse(x, y, rx * 0.80, ry * 0.80, 0, -2.62, -1.78);
  ctx.stroke();

  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.beginPath();
  ctx.ellipse(x - rx * 0.42, y - ry * 0.46, rx * 0.13, ry * 0.10, -0.7, 0, TAU);
  ctx.fill();

  ctx.strokeStyle = 'rgba(255,255,255,0.30)';
  ctx.lineWidth = Math.max(1, base * 0.045);
  ctx.beginPath();
  ctx.ellipse(x, y, rx * 0.78, ry * 0.78, 0, 0.55, 1.15);
  ctx.stroke();

  ctx.restore();
  ctx.globalAlpha = 1;
};

/* ---------------------------------------------------------------------------
   world-space collision: an ellipse (the racer) against a box (the hazard),
   both measured in metres and playfield fractions rather than pixels, so the
   answer is the same wherever the camera happens to be looking
   ------------------------------------------------------------------------- */
function racerHits(p, o) {
  var capX = colW() * 0.10 / PF.w, capM = pxToMetres(colW() * 0.10);
  var sx = Math.min(o.wF * CFG.OBSTACLE_FORGIVE, capX);
  var sm = Math.min(o.hM * CFG.OBSTACLE_FORGIVE, capM);
  var x0 = o.cxF - o.wF / 2 + sx, x1 = o.cxF + o.wF / 2 - sx;
  var d0 = o.wd + sm, d1 = o.wd + o.hM - sm;
  if (x1 <= x0 || d1 <= d0) return false;
  var rx = p.radiusPx() * CFG.HITBOX_FORGIVE / PF.w;
  var rm = p.radiusM() * CFG.HITBOX_FORGIVE;

      { lane: 0, back: 0 }, { lane: 2, back: 0 },

/* ============================================================================
   AI — the five rivals think with the same information a person has: the
   track they can see ahead of them, and where everybody near them is.
   ========================================================================== */
var AI = {
  think: function (p, dt) {
    var L = aiLevel();
    var a = p.ai;

    /* crouching is judged every frame — it is a timing decision, not a plan —
       but each racer only commits once, and the weaker ones sometimes don't */
    this.duck(p, L);

    a.next -= dt;
    if (a.next > 0) return;
    a.next = rand(L.react[0], L.react[1]);

    /* one temperament per decision, not one per lane: a racer that fancies a
       shove this instant must weigh every column with the same nerve */
    a.brave = Math.random() < L.aggr;

    var best = p.lane, bestCost = 1e9, here = 0;
    for (var l = 0; l < 3; l++) {
      var c = this.cost(p, l, L, a.brave);
      if (l === p.lane) here = c;
      if (c < bestCost) { bestCost = c; best = l; }
    }
    a.want = best;
    a.intent = false;
    if (best !== p.lane && here - bestCost > 0.5) {
      /* did it pick that column *because* somebody was standing in it? */
      a.intent = a.brave && !!Race.beside(p, best);
      p.setLane(p.lane + (best > p.lane ? 1 : -1));
    }
  },

  /* what a lane is worth to this racer: lower is better */
  cost: function (p, lane, L, brave) {
    var cost = 0;
    var speed = CFG.BASE_SPEED * Run.mult;
    var look = L.look;
    var list = Obstacles.list, waves = 0, lastWd = -1e9;

    for (var i = 0; i < list.length; i++) {
      var o = list[i];
      var gap = o.wd - p.d;
      if (gap < -o.hM || gap > look) continue;
      if (o.wd - lastWd > 1.5) { waves++; lastWd = o.wd; }
      if (waves > L.waves) break;
      if (!o.blocks(lane)) continue;
      var prox = 1 - clamp(gap / look, 0, 1);          /* nearer hurts more */
      var weight = 1 / waves;                          /* the wave in front matters most */
      if (!o.harmful) {
        /* worth steering into, and the sharper racers know it */
        cost -= 8 * prox * weight * L.greed;
        continue;
      }
      if (o.crouch) {
        cost += 4 * prox * weight * (1 - L.duck);      /* a reliable ducker barely cares */
      } else {
        cost += 46 * prox * weight;
      }
    }

    /* the edge is where a shove kills you */
    if (lane === 0 || lane === 2) {
      /* the only neighbour of either edge is the middle */
      cost += 1.2 * L.defend;
      if (Race.beside(p, 1)) cost += 2.0 * L.defend;
    }

    /* crossing costs a little: standing still is a decision too */
    cost += Math.abs(lane - p.lane) * 0.9;

    if (lane !== p.lane) {
      var occ = Race.beside(p, lane);
      if (occ) {
        if (occ.immune > 0) {
          cost += 6;                                   /* intangible: pointless */
        } else {
          /* would shoving them help? worth most when it ends their race */
          var to = occ.lane + (lane > p.lane ? 1 : -1);
          var value = (to < 0 || to > 2) ? 9 : 4.2;
          if (to >= 0 && to <= 2 && Race.clearance(occ, to) < 4) value = 6.5;
          if (occ.d > p.d) value *= 1.3;               /* shove whoever is beating you */
          if (brave) cost -= value * L.aggr;

        }
      }
    }

    /* mistakes, in proportion to how good this racer is meant to be */
    cost += rand(0, L.err * 26);
    return cost;
  },

  /* duck when the wave in front of this racer can only be passed underneath */
  duck: function (p, L) {
    var a = p.ai;
    var lead = CFG.BASE_SPEED * Run.mult * L.lead;     /* how early they commit */
    var need = null;
    var near = Obstacles.near(p.d, Math.max(lead, 3), 1);
    for (var i = 0; i < near.length; i++) {
      var o = near[i];
      if (!o.crouch || !o.blocks(p.lane)) continue;
      if (o.wd + o.hM < p.d - p.radiusM()) continue;
      if (!need || o.wd < need.wd) need = o;
    }

    if (a.duckFor !== need) {
      a.duckFor = need;
      a.duckOk = Math.random() < L.duck;               /* the weak ones miss some */
    }

  }
