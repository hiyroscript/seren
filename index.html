<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="SEREN — a minimalist three-column parkour game.">
<title>SEREN</title>
<link rel="stylesheet" href="./css/seren.css">
</head>
<body>
<div id="insetProbe"></div>
<canvas id="stage"></canvas>

<div id="ui">
  <button id="pauseBtn" aria-label="Pause">
    <svg viewBox="0 0 12 12" aria-hidden="true"><rect x="1.5" y="1" width="3" height="10" fill="currentColor"/><rect x="7.5" y="1" width="3" height="10" fill="currentColor"/></svg>
  </button>

  <!-- LANGUAGE SELECT -->
  <section class="panel" id="panel-lang" role="dialog" aria-label="Language">
    <div class="mark">SEREN</div>
    <p class="lede" id="langTitle">Choose your language</p>
    <div class="langWrap">
      <button class="langCircle" data-lang="en">English</button>
      <button class="langCircle" data-lang="fr">Français</button>
    </div>
    <p class="tiny" id="langNote">You can change this later in Settings.</p>
  </section>

  <!-- HOW TO PLAY -->
  <section class="panel" id="panel-howto" role="dialog">
    <h2 data-i18n="howToTitle">HOW TO PLAY</h2>
    <div class="guide">
      <div class="demos">
        <figure class="demo">
          <svg viewBox="0 0 120 80" aria-hidden="true">
            <line class="ln" x1="40" y1="2" x2="40" y2="78"/><line class="ln" x1="80" y1="2" x2="80" y2="78"/>
            <circle class="ball a1" cx="60" cy="56" r="11"/>
          </svg>
          <figcaption data-i18n="htLanes"></figcaption>
        </figure>
        <figure class="demo">
          <svg viewBox="0 0 120 80" aria-hidden="true">
            <line class="ln" x1="40" y1="2" x2="40" y2="78"/><line class="ln" x1="80" y1="2" x2="80" y2="78"/>
            <g class="a3"><rect class="blk" x="0" y="0" width="120" height="16"/>
              <path class="chev" d="M14 5 l6 5 l6 -5 M54 5 l6 5 l6 -5 M94 5 l6 5 l6 -5"/></g>
            <circle class="ball a2" cx="60" cy="58" r="11"/>
            <g class="a5"><circle cx="99" cy="40" r="3.2" fill="#000"/>
              <path d="M99 47 l0 13 M94 55 l5 6 l5 -6" fill="none" stroke="#000"
                    stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>
          </svg>
          <figcaption data-i18n="htCrouch"></figcaption>
        </figure>
        <figure class="demo">
          <svg viewBox="0 0 120 80" aria-hidden="true">
            <line class="ln" x1="40" y1="2" x2="40" y2="78"/><line class="ln" x1="80" y1="2" x2="80" y2="78"/>
            <rect class="blk" x="46" y="8" width="28" height="28"/>
            <rect class="blk" x="0" y="50" width="80" height="15"/>
            <circle class="ball" cx="100" cy="72" r="7"/>
          </svg>
          <figcaption data-i18n="htObstacles"></figcaption>
        </figure>
        <figure class="demo">
          <svg viewBox="0 0 120 80" aria-hidden="true">
            <line class="ln" x1="40" y1="2" x2="40" y2="78"/><line class="ln" x1="80" y1="2" x2="80" y2="78"/>
            <circle class="ball a4" cx="60" cy="52" r="11"/>
            <path class="ln" d="M60 20 l0 14 M54 28 l6 6 l6 -6" fill="none"/>
          </svg>
          <figcaption data-i18n="htHit"></figcaption>
        </figure>
      </div>
      <div class="notes">
        <p class="note"><b></b><span data-i18n="htWalls"></span></p>
        <p class="note"><b></b><span data-i18n="htGoal"></span></p>
        <p class="note" id="noteKeys"><b></b><span data-i18n="htKeys"></span></p>
      </div>
    </div>
    <button class="btn" data-act="howto-back" data-i18n="back">BACK</button>
  </section>

  <!-- MARBLE SELECTION -->
  <section class="panel" id="panel-marble" role="dialog">
    <h2 data-i18n="marbleTitle">MARBLE</h2>
    <div class="marbles">
      <button class="marbleOpt" data-marble="blue" aria-pressed="true">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="28" fill="#2F63E0" stroke="#000" stroke-width="2"/>
          <rect x="19" y="19" width="26" height="26" fill="#fff"/>
        </svg>
        <span data-i18n="cBlue">BLUE</span>
      </button>
      <button class="marbleOpt" data-marble="red" aria-pressed="false">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="28" fill="#DE3B3B" stroke="#000" stroke-width="2"/>
          <path fill="#fff" d="M32 49 C11 33, 17 15, 32 26 C47 15, 53 33, 32 49 Z"/>
        </svg>
        <span data-i18n="cRed">RED</span>
      </button>
      <button class="marbleOpt" data-marble="green" aria-pressed="false">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="28" fill="#12A05B" stroke="#000" stroke-width="2"/>
          <path fill="#fff" d="M32 13 L48.5 41.5 L15.5 41.5 Z"/>
        </svg>
        <span data-i18n="cGreen">GREEN</span>
      </button>
      <button class="marbleOpt" data-marble="yellow" aria-pressed="false">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="28" fill="#EFA80B" stroke="#000" stroke-width="2"/>
          <path fill="#fff" d="M32 11 L36.9 25.2 L52 25.6 L40 34.6 L44.4 49 L32 40.4 L19.6 49 L24 34.6 L12 25.6 L27.1 25.2 Z"/>
        </svg>
        <span data-i18n="cYellow">YELLOW</span>
      </button>
      <button class="marbleOpt" data-marble="pink" aria-pressed="false">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="28" fill="#E8467C" stroke="#000" stroke-width="2"/>
          <path fill="#fff" fill-rule="evenodd" d="M9 32 Q32 8 55 32 Q32 56 9 32 Z M32 22 a3.2 10 0 1 0 0.1 0 Z"/>
        </svg>
        <span data-i18n="cPink">PINK</span>
      </button>
      <button class="marbleOpt" data-marble="purple" aria-pressed="false">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="28" fill="#8B4FD8" stroke="#000" stroke-width="2"/>
          <path fill="#fff" d="M32 10 L45 32 L32 54 L19 32 Z"/>
        </svg>
        <span data-i18n="cPurple">PURPLE</span>
      </button>
    </div>
    <button class="btn" data-act="marble-back" data-i18n="back">BACK</button>
  </section>

  <!-- CPU INTELLIGENCE -->
  <section class="panel" id="panel-cpu" role="dialog">
    <h2 data-i18n="cpuTitle">CPU INTELLIGENCE</h2>
    <div class="levels" id="cpuList">
      <button class="btn" data-cpu="easy" aria-pressed="false" data-i18n="cpuEasy">EASY</button>
      <button class="btn" data-cpu="normal" aria-pressed="true" data-i18n="cpuNormal">NORMAL</button>
      <button class="btn" data-cpu="hard" aria-pressed="false" data-i18n="cpuHard">HARD</button>
      <button class="btn" data-cpu="brutal" aria-pressed="false" data-i18n="cpuBrutal">BRUTAL</button>
    </div>
    <p class="tiny" id="cpuDesc"></p>
    <button class="btn" data-act="cpu-back" data-i18n="back">BACK</button>
  </section>

  <!-- SETTINGS -->
  <section class="panel" id="panel-settings" role="dialog">
    <h2 data-i18n="settings">SETTINGS</h2>
    <div class="sheet">
      <div class="row">
        <span class="rowlabel" data-i18n="language"></span>
        <div class="seg" id="segLang"><button data-v="en">English</button><button data-v="fr">Français</button></div>
      </div>
      <div class="row">
        <span class="rowlabel" data-i18n="volume"></span>
        <input type="range" id="volRange" min="0" max="100" step="1" aria-label="Volume">
      </div>
      <div class="row">
        <span class="rowlabel" data-i18n="mute"></span>
        <button class="toggle" id="muteBtn" aria-pressed="false" aria-label="Mute"><span></span></button>
      </div>
      <div class="row">
        <span class="rowlabel" data-i18n="effects"></span>
        <div class="seg" id="segFx"><button data-v="full" data-i18n="full"></button><button data-v="reduced" data-i18n="reduced"></button></div>
      </div>
    </div>
    <button class="btn" data-act="settings-back" data-i18n="back">BACK</button>
  </section>

  <!-- PAUSE -->
  <section class="panel veil" id="panel-pause" role="dialog">
    <h2 data-i18n="paused">PAUSED</h2>
    <div class="stack">
      <button class="btn" data-act="resume" data-i18n="resume"></button>
      <button class="btn" data-act="restart" data-i18n="restart"></button>
      <button class="btn ghost" data-act="pause-settings" data-i18n="settings"></button>
      <button class="btn ghost" data-act="home" data-i18n="home"></button>
    </div>
  </section>

  <!-- COMPLETE -->
  <section class="panel dark" id="panel-complete" role="dialog">
    <h2 data-i18n="complete">RUN COMPLETE</h2>
    <dl class="stats">
      <div class="stat"><dt data-i18n="finishPos"></dt><dd id="statPos">1 / 6</dd></div>
      <div class="stat"><dt data-i18n="distance"></dt><dd id="statDist">0 m</dd></div>
      <div class="stat"><dt data-i18n="collisions"></dt><dd id="statHits">0</dd></div>
      <div class="stat"><dt data-i18n="finalSpeed"></dt><dd id="statSpeed">3.00x</dd></div>
    </dl>
    <div class="stack">
      <button class="btn" data-act="again" data-i18n="playAgain"></button>
      <button class="btn" data-act="home" data-i18n="returnHome"></button>
    </div>
  </section>

  <!-- ORIENTATION -->
  <section class="panel" id="panel-orient" role="dialog">
    <div class="rotIcon" aria-hidden="true"></div>
    <p class="lede" id="orientTitle"></p>
    <p class="tiny" id="orientNote"></p>
  </section>
</div>

<script defer src="./js/00-utils.js"></script>
<script defer src="./js/01-storage.js"></script>
<script defer src="./js/02-i18n.js"></script>
<script defer src="./js/03-marbles.js"></script>
<script defer src="./js/04-settings.js"></script>
<script defer src="./js/05-audio.js"></script>
<script defer src="./js/06-config-state.js"></script>
<script defer src="./js/07-layout.js"></script>
<script defer src="./js/08-vfx.js"></script>
<script defer src="./js/09-world.js"></script>
<script defer src="./js/10-generator.js"></script>
<script defer src="./js/11-racers.js"></script>
<script defer src="./js/12-ai.js"></script>
<script defer src="./js/13-run.js"></script>
<script defer src="./js/14-rendering.js"></script>
<script defer src="./js/15-input.js"></script>
<script defer src="./js/16-home.js"></script>
<script defer src="./js/17-screens.js"></script>
<script defer src="./js/18-settings-ui.js"></script>
<script defer src="./js/19-orientation.js"></script>
<script defer src="./js/20-main-loop.js"></script>
<script defer src="./js/21-boot.js"></script>
</body>
</html>
