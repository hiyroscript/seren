<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Mary</title>
<style>
/* Mary — interface styles
   Palette: cool paper + ink, one muted wine accent. No decorative gradients. */

:root {
  --paper:      #eceef0;
  --surface:    #fafbfb;
  --surface-2:  #f2f4f5;
  --ink:        #14181b;
  --ink-soft:   #4b545b;
  --muted:      #737d84;
  --line:       #d5dadd;
  --line-soft:  #e5e9eb;
  --accent:     #7a3b4e;
  --accent-ink: #ffffff;
  --gain:       #2f6b4f;
  --loss:       #8c3b2f;
  --caution:    #85661d;

  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  --r: 6px;
  --rail: 208px;
  --vitals: 268px;
  --pad: 20px;
  --tap: 44px;
}

[data-theme="dark"] {
  --paper:      #0f1214;
  --surface:    #171b1e;
  --surface-2:  #1e2327;
  --ink:        #e7eaeb;
  --ink-soft:   #b3bbc0;
  --muted:      #8a949a;
  --line:       #2a3136;
  --line-soft:  #232a2e;
  --accent:     #c78a9b;
  --accent-ink: #16181a;
  --gain:       #6fbb92;
  --loss:       #d98878;
  --caution:    #cfa94e;
}

/* An author `display` declaration overrides the user agent's [hidden] rule,
   so this has to be stated explicitly or hidden elements keep taking clicks. */
[hidden] { display: none !important; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
p { margin: 0 0 0.75em; }
p:last-child { margin-bottom: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

/* ---------- splash ---------- */
.splash {
  position: fixed; inset: 0; z-index: 100;
  background: #000; color: #f2f2f2;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity .5s ease;
}
.splash.is-out { opacity: 0; pointer-events: none; }
.splash-mark {
  font-family: var(--serif); font-size: 40px; letter-spacing: .1em;
  color: #dcdcdc; opacity: 0; animation: fadein 1s ease forwards;
}
.splash-credit {
  position: absolute; bottom: 12vh;
  font-size: 12px; letter-spacing: .16em; color: #7d7d7d;
  opacity: 0; animation: fadein 1.2s ease .5s forwards;
}
@keyframes fadein { to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .splash-mark, .splash-credit { animation-duration: .01s; }
  .splash { transition: none; }
}

/* ---------- generic surfaces ---------- */
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
}
.panel + .panel { margin-top: 14px; }
.panel-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  padding: 14px var(--pad) 0;
}
.panel-head h2 { font-size: 16px; }
.panel-body { padding: 12px var(--pad) 16px; }
.hint { color: var(--muted); font-size: 13px; }
.sep { height: 1px; background: var(--line-soft); margin: 12px 0; }
.num { font-variant-numeric: tabular-nums; }
.gain { color: var(--gain); }
.loss { color: var(--loss); }
.caution { color: var(--caution); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: var(--tap); padding: 10px 16px;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: var(--r);
  font-size: 14px; font-weight: 500; text-align: center;
  transition: background .12s ease, border-color .12s ease;
}
.btn:hover:not(:disabled) { background: var(--surface-2); border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); filter: brightness(1.08); }
.btn-quiet { background: transparent; border-color: transparent; color: var(--ink-soft); }
.btn-quiet:hover:not(:disabled) { background: var(--surface-2); border-color: var(--line-soft); }
.btn-danger { color: var(--loss); border-color: var(--line); }
.btn-sm { min-height: 34px; padding: 6px 12px; font-size: 13px; }
.btn-block { width: 100%; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- inputs ---------- */
.field { display: block; margin-bottom: 14px; }
.field > span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; }
.input, .select {
  width: 100%; min-height: var(--tap); padding: 9px 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
}
.input:focus, .select:focus { border-color: var(--accent); outline: none; }
.error { color: var(--loss); font-size: 13px; margin-top: 5px; }

.seg { display: flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button {
  flex: 1; min-height: 40px; padding: 8px 6px; border: 0; background: var(--surface);
  font-size: 13px; color: var(--ink-soft); border-right: 1px solid var(--line);
}
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

/* ---------- app shell ---------- */
.root { min-height: 100%; }
.app { display: grid; min-height: 100vh; min-height: 100dvh; }

.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 14px;
  padding: 10px 16px; background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.topbar .who { font-family: var(--serif); font-size: 17px; line-height: 1.2; }
.topbar .sub { font-size: 12px; color: var(--muted); }
.topbar .spacer { flex: 1; }
.topbar .stat { text-align: right; line-height: 1.25; }
.topbar .stat b { font-size: 15px; font-weight: 600; }
.topbar .stat span { display: block; font-size: 11px; color: var(--muted); }

.rail { border-right: 1px solid var(--line); background: var(--surface); padding: 14px 10px; }
.rail nav { display: flex; flex-direction: column; gap: 2px; }
.rail button {
  display: flex; justify-content: space-between; align-items: center;
  min-height: 38px; padding: 8px 12px; border: 0; border-radius: var(--r);
  background: transparent; text-align: left; font-size: 14px; color: var(--ink-soft);
}
.rail button:hover { background: var(--surface-2); }
.rail button[aria-current="page"] { background: var(--surface-2); color: var(--ink); font-weight: 600; box-shadow: inset 2px 0 0 var(--accent); }
.rail .badge {
  min-width: 20px; padding: 0 6px; border-radius: 10px;
  background: var(--accent); color: var(--accent-ink); font-size: 11px; text-align: center;
}

.main { padding: var(--pad); min-width: 0; }
.column { max-width: 68ch; margin: 0 auto; }
.aside { border-left: 1px solid var(--line); background: var(--surface); padding: 16px 16px 40px; }

.tabbar { display: none; }

/* desktop */
@media (min-width: 900px) {
  .app { grid-template-columns: var(--rail) minmax(0,1fr) var(--vitals); grid-template-rows: auto 1fr; }
  .topbar { grid-column: 1 / -1; }
  .rail { grid-row: 2; overflow-y: auto; }
  .main { grid-row: 2; overflow-y: auto; }
  .aside { grid-row: 2; overflow-y: auto; }
}

/* mobile */
@media (max-width: 899px) {
  .app { grid-template-rows: auto 1fr auto; padding-bottom: env(safe-area-inset-bottom); }
  .rail { display: none; }
  .aside { border-left: 0; border-top: 1px solid var(--line); }
  .main { padding: 14px; padding-bottom: 6px; }
  .tabbar {
    position: sticky; bottom: 0; z-index: 20;
    display: grid; grid-template-columns: repeat(5, 1fr);
    background: var(--surface); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tabbar button {
    min-height: 54px; border: 0; background: transparent;
    font-size: 12px; color: var(--muted); padding: 6px 2px;
  }
  .tabbar button[aria-current="page"] { color: var(--accent); font-weight: 600; box-shadow: inset 0 2px 0 var(--accent); }
  .tabbar .badge { display: inline-block; margin-left: 4px; min-width: 16px; padding: 0 4px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-size: 10px; }
}

/* ---------- vitals: thin chart rules, not chunky bars ---------- */
.vitals h3 { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
.vitals + .vitals { margin-top: 18px; }
.meter { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 5px 0; }
.meter .lbl { font-size: 13px; color: var(--ink-soft); }
.meter .val { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter .track {
  grid-column: 1 / -1; position: relative; height: 3px;
  background: var(--line-soft); border-radius: 2px;
}
.meter .fill { position: absolute; inset: 0 auto 0 0; border-radius: 2px; background: var(--ink-soft); }
.meter.is-low .fill { background: var(--loss); }
.meter.is-mid .fill { background: var(--caution); }
.meter.is-good .fill { background: var(--gain); }

.kv { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line-soft); font-size: 14px; }
.kv:last-child { border-bottom: 0; }
.kv .k { color: var(--muted); }
.kv .v { font-variant-numeric: tabular-nums; text-align: right; }

/* ---------- narrative / feed ---------- */
.prose { font-family: var(--serif); font-size: 17px; line-height: 1.62; }
.prose.small { font-size: 15.5px; }

.feed { border-left: 2px solid var(--line); padding-left: 16px; margin-left: 4px; }
.feed-item { position: relative; padding: 8px 0; }
.feed-item::before {
  content: ""; position: absolute; left: -21px; top: 15px;
  width: 7px; height: 7px; border-radius: 50%; background: var(--line);
  border: 1px solid var(--surface);
}
.feed-item.is-major::before { background: var(--accent); }
.feed-item .when { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.feed-item .what { font-size: 14.5px; }
.feed-item.tone-good .what { color: var(--ink); }
.feed-item.tone-bad .what { color: var(--loss); }

/* ---------- lists / cards ---------- */
.list { display: flex; flex-direction: column; gap: 8px; }
.row {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 11px 14px; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
}
button.row { transition: border-color .12s ease, background .12s ease; }
button.row:hover:not(:disabled) { background: var(--surface-2); border-color: var(--muted); }
button.row:disabled { opacity: .5; cursor: not-allowed; }
.row .grow { flex: 1; min-width: 0; }
.row .title { font-size: 14.5px; font-weight: 500; }
.row .meta { font-size: 12.5px; color: var(--muted); }
.row .end { font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

.tag {
  display: inline-block; padding: 1px 7px; margin-right: 5px;
  border: 1px solid var(--line); border-radius: 10px;
  font-size: 11.5px; color: var(--muted);
}
.tag.warn { color: var(--caution); border-color: var(--caution); }
.tag.bad { color: var(--loss); border-color: var(--loss); }
.tag.good { color: var(--gain); border-color: var(--gain); }

details.fold { border-top: 1px solid var(--line-soft); }
details.fold summary { padding: 11px 2px; cursor: pointer; font-size: 14px; font-weight: 500; list-style: none; }
details.fold summary::-webkit-details-marker { display: none; }
details.fold summary::after { content: "+"; float: right; color: var(--muted); }
details.fold[open] summary::after { content: "\2013"; }
details.fold .fold-body { padding: 0 2px 14px; }

.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 18px; }

/* ---------- overlay / modal ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(8, 11, 13, .55);
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.modal {
  width: min(560px, 100%); max-height: 90vh; overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 22px;
}
.modal h2 { font-family: var(--serif); font-size: 21px; margin-bottom: 10px; }
.modal .choices { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
.modal .choices .btn { justify-content: flex-start; text-align: left; }
@media (max-width: 899px) {
  .overlay { align-items: flex-end; padding: 0; }
  .modal { width: 100%; max-height: 92dvh; border-radius: 14px 14px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); }
}

/* ---------- toasts ---------- */
.toast-stack {
  position: fixed; z-index: 80; left: 50%; transform: translateX(-50%);
  bottom: 80px; display: flex; flex-direction: column; gap: 6px; align-items: center;
  pointer-events: none; width: min(420px, calc(100% - 24px));
}
.toast {
  width: 100%; padding: 9px 14px; border-radius: var(--r);
  background: var(--ink); color: var(--paper); font-size: 13.5px;
}
.toast.bad { background: var(--loss); color: #fff; }
.toast.good { background: var(--gain); color: #fff; }

/* ---------- setup screens ---------- */
.setup { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px 16px 48px; }
.setup-inner { width: min(600px, 100%); }
.setup h1 { font-family: var(--serif); font-size: 30px; margin-bottom: 6px; }
.setup .lede { color: var(--ink-soft); margin-bottom: 22px; }
.points { display: flex; align-items: center; gap: 8px; }
.points button { width: 36px; height: 36px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); }
.pips { display: flex; gap: 3px; min-width: 62px; }
.pip { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--line); }
.pip.on { background: var(--accent); border-color: var(--accent); }

/* ---------- minigames ---------- */
.mg-stage { padding: 6px 0 4px; }
.mg-prompt { font-family: var(--serif); font-size: 26px; text-align: center; padding: 14px 0; font-variant-numeric: tabular-nums; }
.mg-timer { height: 3px; background: var(--line-soft); border-radius: 2px; overflow: hidden; margin-bottom: 12px; }
.mg-timer i { display: block; height: 100%; background: var(--accent); width: 100%; }
.mg-grid { display: grid; gap: 8px; }
.mg-grid.c2 { grid-template-columns: repeat(2, 1fr); }
.mg-grid.c3 { grid-template-columns: repeat(3, 1fr); }
.mg-grid.c4 { grid-template-columns: repeat(4, 1fr); }
.mg-cell {
  min-height: 56px; display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--line); border-radius: var(--r); background: var(--surface);
  font-size: 18px; font-variant-numeric: tabular-nums;
}
.mg-cell.lit { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.mg-cell.hit { border-color: var(--gain); color: var(--gain); }
.mg-cell.miss { border-color: var(--loss); color: var(--loss); }
.mg-cell.blur { filter: blur(1.1px); opacity: .82; }
.mg-progress { font-size: 12.5px; color: var(--muted); text-align: center; margin-top: 10px; font-variant-numeric: tabular-nums; }
.mg-bar { position: relative; height: 46px; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface-2); }
.mg-bar .zone { position: absolute; top: 0; bottom: 0; background: var(--gain); opacity: .28; }
.mg-bar .cursor { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--accent); }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

</style>
</head>

  <div id="overlay" class="overlay" hidden></div>
  <div id="toast" class="toast-stack" aria-live="polite"></div>

  <noscript>Mary needs JavaScript enabled to run.</noscript>

// Deterministic-ish RNG. The seed and call count are saved so a reloaded life
// continues the same stream instead of re-rolling luck on every refresh.

let seed = 1;
let calls = 0;

function mulberry() {
  calls++;
  let t = (seed += 0x6d2b79f5);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

function initRng(s, c = 0) {
  seed = (s >>> 0) || 1;
  calls = c;
}
function rngState() { return { seed: seed >>> 0, calls }; }
function newSeed() { return (Math.random() * 4294967296) >>> 0; }

const rnd = () => mulberry();
const int = (a, b) => a + Math.floor(mulberry() * (b - a + 1));
const range = (a, b) => a + mulberry() * (b - a);
const chance = (p) => mulberry() < p;
const pick = (arr) => arr[Math.floor(mulberry() * arr.length)];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(mulberry() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function sample(arr, n) { return shuffle(arr).slice(0, n); }

function gauss(mean = 0, sd = 1) {
  const u = 1 - mulberry(), v = mulberry();
  return mean + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

// items: [{ weight, ...}] — returns one entry, or null if all weights are zero.
function weighted(items, getW = (i) => i.weight ?? 1) {
  let total = 0;
  for (const it of items) total += Math.max(0, getW(it));
  if (total <= 0) return null;
  let r = mulberry() * total;
  for (const it of items) {
    r -= Math.max(0, getW(it));
    if (r <= 0) return it;
  }
  return items[items.length - 1];
}

const clamp = (v, lo = 0, hi = 100) => Math.max(lo, Math.min(hi, v));

  __x.rngState = rngState;
  __x.newSeed = newSeed;

  __x.weighted = weighted;
  __x.rnd = rnd;
  __x.int = int;
  __x.range = range;

// NPCs are small independent simulations. They have goals, money, health and
// opinions, they act in months where the player is not looking, and they talk
// to each other about the player.

const { rnd, int, range, chance, pick, gauss, clamp, sample, weighted } = __req("core/rng.js");
const { BAL } = __req("config/balance.js");
const { NAMES, COMPLEXIONS, BUILDS } = __req("data/world.js");
const { CAREERS } = __req("data/careers.js");
const { L } = __req("i18n/i18n.js");
const { smell } = __req("core/derived.js");
const { logFeed } = __req("core/effects.js");

let nextId = 1;
function resetNpcIds(n = 1) { nextId = n; }
function peekNpcId() { return nextId; }

const PERSONALITY = () => ({
  warmth: clamp(gauss(50, 20), 5, 98),
  reliability: clamp(gauss(50, 22), 5, 98),
  volatility: clamp(gauss(45, 22), 2, 98),
  ambition: clamp(gauss(48, 22), 2, 98),
  risk: clamp(gauss(42, 24), 2, 98),
  honesty: clamp(gauss(55, 22), 2, 98),
  forgiving: clamp(gauss(50, 20), 2, 98)
});

function generateNpc(s, opts = {}) {
  const c = s.char.country;
  const pool = NAMES[c] || NAMES.us;
  const gender = opts.gender || pick(['male', 'female', 'female', 'male', 'nonbinary']);
  const firstPool = gender === 'nonbinary' ? pool.neutral : pool[gender];
  const npc = {
    id: 'n' + (nextId++),
    first: opts.first || pick(firstPool),
    last: opts.last || pick(pool.last),
    gender,
    age: opts.age ?? int(18, 46),
    role: opts.role || 'acquaintance',
    personality: PERSONALITY(),
    attrs: {
      charisma: clamp(gauss(50, 18), 3, 99),
      looks: clamp(gauss(50, 18), 3, 99),
      humour: clamp(gauss(50, 18), 3, 99),
      intelligence: clamp(gauss(50, 18), 3, 99),
      empathy: clamp(gauss(50, 18), 3, 99)
    },
    // Every NPC weighs attraction differently. No universal rules.
    prefs: {
      looks: range(0.1, 1), humour: range(0.1, 1), status: range(0, 0.9),
      kindness: range(0.2, 1), height: range(-0.4, 0.6), heightIdeal: int(155, 195),
      loyalty: range(0.3, 1),
      // Some people like visible ink, some do not. Neither is the rule.
      ink: range(-0.5, 0.5)
    },
    money: Math.round(Math.max(0, gauss(4200, 5200))),
    income: 0,
    job: null,
    emotion: { mood: clamp(gauss(58, 16)), stress: clamp(gauss(38, 18)) },
    health: clamp(gauss(78, 14)),
    alive: true,
    wanted: 0,
    jail: 0,
    goals: sample(['money', 'family', 'status', 'stability', 'freedom', 'craft'], 2),
    links: {},
    knows: [],
    lastTalk: -99,
    complexion: pick(COMPLEXIONS).k,
    build: pick(BUILDS).k,
    height: Math.round(gauss(gender === 'male' ? 177 : gender === 'female' ? 164 : 171, 8))

}

function assignJob(npc) {

  const lvl = int(0, Math.min(2, track.levels.length - 1));
  npc.job = { track: track.id, level: lvl };
  npc.income = Math.round(track.levels[lvl].pay * range(0.85, 1.15));

  const tr = CAREERS.find(t => t.id === npc.job.track);
  return tr ? L(tr.levels[npc.job.level]) : null;
}

// ---------- relationships ----------

function newRel(type = 'acquaintance', seed = {}) {
  return {
    type,
    affection: clamp(seed.affection ?? gauss(45, 15)),
    trust: clamp(seed.trust ?? gauss(45, 15)),
    respect: clamp(seed.respect ?? gauss(45, 15)),
    attraction: clamp(seed.attraction ?? 0),
    resentment: clamp(seed.resentment ?? gauss(8, 8)),
    loyalty: clamp(seed.loyalty ?? gauss(40, 18)),
    lastContact: 0,
    metMonth: 0

function addNpc(s, npc, relType = 'acquaintance', seed = {}) {

  s.rel[npc.id] = newRel(relType, seed);
  s.rel[npc.id].metMonth = s.month;
  s.rel[npc.id].lastContact = s.month;
  s.mem[npc.id] = [];
  return npc;
}

// Attraction is many factors, weighted by this individual's preferences.
function attractionOf(s, npc) {
  const p = npc.prefs;
  const ch = s.char;
  const looks = ch.attrs.looks;
  const hygiene = ch.needs.hygiene;
  const odour = smell(s);
  const grooming = (looks * 0.55 + hygiene * 0.45);
  const heightGap = Math.abs((ch.height || 172) - p.heightIdeal);
  let v = 0, w = 0;
  v += p.looks * grooming; w += p.looks;
  v += p.humour * ch.attrs.humour; w += p.humour;
  v += p.kindness * ch.attrs.empathy; w += p.kindness;
  v += p.status * (ch.job ? 45 + ch.job.performance * 0.4 : 25); w += p.status;
  v += Math.abs(p.height) * clamp(100 - heightGap * 2.2); w += Math.abs(p.height);

  base -= Math.max(0, odour - 55) * 0.55;      // how you smell, not just how clean you are

function remember(s, npcId, tag, opts = {}) {

  const weight = opts.weight ?? 1;

function decayMemories(s) {
  for (const id in s.mem) {
    const arr = s.mem[id];
    for (let i = arr.length - 1; i >= 0; i--) {

function gossip(s, from) {

  const deep = new Set(scored.slice(0, BAL.npc.deepSimCount).map(x => x.id));

  for (const id of ids) {
    const npc = s.npcs[id];

    if (deep.has(id)) deepTick(s, npc, out);

    const live = Object.values(s.npcs).filter(n => n.alive);
    if (live.length) gossip(s, pick(live));

function cheapTick(s, npc) {
  npc.emotion.mood = clamp(npc.emotion.mood + gauss(0, 4));
  npc.money += Math.round(npc.income * range(0.05, 0.2) - range(80, 400));

__def("core/derived.js", function (__x, __req) {
// Everything computed from state rather than stored in it. Attributes matter
// because every check in the game routes through effAttr().

const { clamp } = __req("core/rng.js");
const { BAL } = __req("config/balance.js");
const { COUNTRY_BY_ID } = __req("data/world.js");
const { CONDITION_BY_ID, VISION_BY_ID } = __req("data/health.js");
const { HOUSING_BY_ID } = __req("data/living.js");
const { CAREER_BY_ID } = __req("data/careers.js");

const country = (s) => COUNTRY_BY_ID[s.char.country] || COUNTRY_BY_ID.us;
const age = (s) => BAL.start.age + Math.floor(s.month / 12);

// How badly the body is letting the mind down right now: 0.55 .. 1.05
function condition(s) {
  const n = s.char.needs;
  const avg = (n.energy * 1.5 + n.hunger + n.hydration + n.health * 1.2) / 4.7;
  const stress = s.char.mood.stress;
  const intox = s.char.intox || 0;
  let m = BAL.minigame.conditionFloor + (avg / 100) * (1.05 - BAL.minigame.conditionFloor);
  m -= (stress / 100) * 0.12;
  m -= (intox / 100) * 0.3;
  return Math.max(0.3, Math.min(1.05, m));
}

// Attribute value after illness, ageing and current condition.
function effAttr(s, key) {
  let v = s.char.attrs[key] ?? 40;
  for (const c of s.char.conditions) {
    const def = CONDITION_BY_ID[c.id];
    if (def?.eff?.[key] && !c.managed) v += def.eff[key];
    else if (def?.eff?.[key] && c.managed) v += def.eff[key] * 0.35;
  }
  for (const tr of s.char.traumas || []) {
    if (tr.eff?.[key]) v += tr.eff[key];
  }
  return clamp(v * condition(s), 1, 100);
}

// Average of several attributes, weighted equally. The common shape of a check.
function skill(s, keys) {
  if (!keys || !keys.length) return 50;
  let sum = 0;
  for (const k of keys) sum += effAttr(s, k);
  return sum / keys.length;
}

function visionPenalty(s) {
  const v = VISION_BY_ID[s.char.vision] || VISION_BY_ID.normal;
  return s.char.hasGlasses ? v.pen * 0.15 : v.pen;
}

function homeQuality(s) {
  const h = HOUSING_BY_ID[s.char.home?.id] || HOUSING_BY_ID.street;
  return h.quality;
}

function smell(s) {
  const base = 100 - s.char.needs.hygiene;
  return clamp(base - (s.char.fragranceMonths > 0 ? 25 : 0), 0, 100);
}

function jobTitle(s) {
  const j = s.char.job;
  if (!j) return null;
  const track = CAREER_BY_ID[j.track];
  return track?.levels[j.level] || null;
}

// A state pension, scaled by how much of a working life was actually worked.
function pensionOf(s) {
  const c = country(s);
  if (age(s) < c.retireAge) return 0;
  const accrual = Math.min(1, (s.stats?.monthsWorked || 0) / 420);
  return Math.round(c.pension * (0.35 + 0.65 * accrual));
}

function monthlyIncome(s) {
  let inc = 0;
  inc += pensionOf(s);
  if (s.char.job) inc += s.char.job.salary;
  if (s.char.business) inc += Math.max(0, s.char.business.lastProfit || 0);
  if (s.char.creator) inc += s.char.creator.lastIncome || 0;
  if (!s.char.job && !s.char.business && s.char.claimingBenefits) inc += country(s).welfare;
  for (const p of s.char.properties || []) if (p.rentedOut) inc += p.rentIncome;
  return inc;
}

function monthlyCosts(s) {
  const c = country(s);
  let out = 0;
  const home = s.char.home;
  if (home?.kind === 'rent' || home?.kind === 'guest') out += home.rent;
  if (home?.kind === 'own') out += home.rent + Math.round(home.rent * 0.15); // mortgage plus upkeep
  for (const p of s.char.properties || []) {
    if (p.isHome) continue;
    out += (p.mortgage || 0) + Math.round((p.value || 0) * 0.0004);
  }
  out += Math.round(BAL.money.baseFood * c.col * (s.char.foodStocked ? 0 : 1));
  out += Math.round(250 * c.col); // transport, phone, utilities, the unavoidable rest
  for (const cond of s.char.conditions) if (cond.treating) out += Math.round(cond.monthlyCost || 0);
  for (const p of s.char.pets || []) out += p.upkeep;
  for (const k of s.char.children || []) if (k.dependent) out += Math.round(420 * c.col);
  if (s.char.money < 0) out += Math.round(Math.abs(s.char.money) * BAL.money.debtInterest);
  return out;
}

function taxOn(gross, s) {
  const c = country(s);
  const taxable = Math.max(0, gross - BAL.money.taxFreeBand);
  return Math.round(taxable * c.tax);
}

function netWorth(s) {
  let v = s.char.money;
  for (const p of s.char.properties || []) v += Math.max(0, (p.value || 0) - (p.debt || 0));
  if (s.char.business) v += s.char.business.value || 0;
  for (const i of s.char.investments || []) v += i.value;
  return Math.round(v);
}

// Self-esteem is not an average of attributes. It is how far this particular
// person's life is from what this particular person cares about.
function selfEsteem(s) {
  const ch = s.char;
  const v = ch.values;
  const parts = [];

  const relScores = Object.values(s.rel || {});
  const closeness = relScores.length
    ? relScores.reduce((a, r) => a + (r.affection + r.trust) / 2, 0) / relScores.length
    : 20;
  const partner = relScores.find(r => r.type === 'partner');

  parts.push([v.work, ch.job ? 40 + ch.job.performance * 0.6 : (ch.business ? 70 : 22)]);
  parts.push([v.money, clamp(35 + Math.log10(Math.max(1, netWorth(s))) * 11, 0, 100)]);
  parts.push([v.looks, clamp(ch.attrs.looks * 0.6 + ch.needs.hygiene * 0.4, 0, 100)]);
  parts.push([v.people, clamp(closeness * 0.8 + (partner ? 22 : 0), 0, 100)]);
  parts.push([v.freedom, clamp(ch.legal.incarceration ? 5 : 55 + (ch.home?.kind === 'own' ? 20 : 0) - (ch.debtStress || 0), 0, 100)]);
  parts.push([v.mastery, clamp(30 + ch.edu.tier * 9 + (ch.achievements?.length || 0) * 4, 0, 100)]);
  parts.push([v.family, clamp((ch.children?.length ? 60 : 25) + (partner ? 20 : 0) + (ch.familyContact || 0), 0, 100)]);

  let num = 0, den = 0;
  for (const [w, val] of parts) { num += w * val; den += w; }
  let base = den ? num / den : 45;

  base += (effAttr(s, 'confidence') - 50) * 0.22;
  base += (ch.mood.happiness - 50) * 0.18;
  base -= (ch.mood.stress - 40) * 0.12;
  base -= (ch.rejections || 0) * 1.1;
  base -= (ch.traumas?.length || 0) * 3.2;
  base += (ch.mood.confidence - 50) * 0.1;
  return Math.round(clamp(base, 1, 100));
}

// Busy lives generate more events than empty ones.
function lifeActivity(s) {
  let a = 0;

__def("core/effects.js", function (__x, __req) {
// The consequence engine. Every system — activities, events, minigames, NPC
// actions — describes what it does as a plain object and hands it here.

const { clamp } = __req("core/rng.js");
const { L } = __req("i18n/i18n.js");

function applyEffects(s, eff, ctx = {}) {
  if (!eff) return [];
  const notes = [];

  if (typeof eff === 'function') eff = eff(s, ctx);
  if (!eff) return notes;

  if (eff.money) {
    s.char.money = Math.round(s.char.money + eff.money);
    notes.push({ kind: 'money', amount: eff.money });
  }
  if (eff.days) spendDays(s, eff.days);

  if (eff.needs) {
    for (const k in eff.needs) {
      s.char.needs[k] = clamp((s.char.needs[k] ?? 50) + eff.needs[k]);
    }
  }
  if (eff.mood) {
    for (const k in eff.mood) {
      s.char.mood[k] = clamp((s.char.mood[k] ?? 50) + eff.mood[k]);
    }
  }
  if (eff.attrs) {
    for (const k in eff.attrs) {
      s.char.attrs[k] = clamp((s.char.attrs[k] ?? 40) + eff.attrs[k], 1, 100);
    }
  }
  if (eff.health) s.char.needs.health = clamp(s.char.needs.health + eff.health);
  if (eff.intox) s.char.intox = clamp((s.char.intox || 0) + eff.intox);

  if (eff.rep) {
    for (const k in eff.rep) s.char.rep[k] = clamp((s.char.rep[k] ?? 50) + eff.rep[k]);
  }
  if (eff.workPerf && s.char.job) {
    s.char.job.performance = clamp(s.char.job.performance + eff.workPerf);
  }
  if (eff.gpa && s.char.edu.enrolled) {
    s.char.edu.enrolled.gpa = Math.max(0, Math.min(4, s.char.edu.enrolled.gpa + eff.gpa));
  }
  if (eff.wanted) {
    s.char.legal.wanted = Math.max(0, Math.min(6, s.char.legal.wanted + eff.wanted));
  }
  if (eff.heat) s.char.legal.heat = Math.max(0, (s.char.legal.heat || 0) + eff.heat);

  if (eff.rel && ctx.npcId) applyRel(s, ctx.npcId, eff.rel);
  if (eff.relBy) {
    for (const id in eff.relBy) applyRel(s, id, eff.relBy[id]);
  }
  if (eff.flags) Object.assign(s.char.flags, eff.flags);
  if (eff.trauma) addTrauma(s, eff.trauma);
  if (eff.achievement) {
    s.char.achievements = s.char.achievements || [];
    s.char.achievements.push({ id: eff.achievement, month: s.month });
  }
  if (eff.feed) logFeed(s, eff.feed, eff.tone || 'neutral', eff.major);
  if (eff.then) applyEffects(s, eff.then, ctx);

  return notes;
}

function applyRel(s, npcId, delta) {
  const r = s.rel[npcId];
  if (!r) return;
  for (const k in delta) {
    if (k === 'type') { r.type = delta.type; continue; }
    r[k] = clamp((r[k] ?? 50) + delta[k]);
  }
  r.lastContact = s.month;
}

function addTrauma(s, id) {
  s.char.traumas = s.char.traumas || [];
  if (s.char.traumas.some(t => t.id === id)) return;
  s.char.traumas.push({ id, month: s.month, healed: 0 });
}

function spendDays(s, n) {
  s.daysLeft = Math.max(0, s.daysLeft - n);
}

function logFeed(s, text, tone = 'neutral', major = false) {
  s.feed.push({ month: s.month, text: L(text), tone, major: !!major });
  if (s.feed.length > 400) s.feed.splice(0, s.feed.length - 400);
}

// Checks used by activities, events and jobs alike.
function meetsReq(s, req) {
  if (!req) return true;
  if (req.job && !s.char.job) return false;
  if (req.noJob && s.char.job) return false;
  if (req.home && (!s.char.home || s.char.home.kind === 'none')) return false;
  if (req.minMoney != null && s.char.money < req.minMoney) return false;
  if (req.minEnergy != null && s.char.needs.energy < req.minEnergy) return false;
  if (req.minEdu != null && s.char.edu.tier < req.minEdu) return false;
  if (req.free && s.char.legal.incarceration) return false;
  if (req.attrs) {
    for (const k in req.attrs) if ((s.char.attrs[k] ?? 0) < req.attrs[k]) return false;
  }
  if (req.flags) {
    for (const k in req.flags) if (!!s.char.flags[k] !== !!req.flags[k]) return false;
  }
  if (typeof req.fn === 'function' && !req.fn(s)) return false;
  return true;
}

  __x.applyEffects = applyEffects;
  __x.applyRel = applyRel;
  __x.addTrauma = addTrauma;
  __x.spendDays = spendDays;
  __x.logFeed = logFeed;
  __x.meetsReq = meetsReq;
});

__def("core/state.js", function (__x, __req) {
// The store, plus everything involved in bringing one life into existence.

const { BAL } = __req("config/balance.js");
const { rnd, int, range, chance, pick, gauss, clamp, initRng, newSeed, rngState } = __req("core/rng.js");
const { ATTR_KEYS, VALUE_KEYS, POINTABLE } = __req("data/attributes.js");
const { COUNTRIES, COUNTRY_BY_ID, NAMES, COMPLEXIONS, BUILDS } = __req("data/world.js");
const { CONDITIONS, VISION } = __req("data/health.js");
const { generateStartingCircle, resetNpcIds } = __req("core/npc.js");
const { logFeed } = __req("core/effects.js");
const { L } = __req("i18n/i18n.js");

let state = null;

function getState() { return state; }
function setState(s) { state = s; }

function validName(v) {
  return /^[\p{L}][\p{L}'\-\s]{0,23}$/u.test(v.trim()) && v.trim().length >= 2 && !/\s\s/.test(v.trim());
}

function randomName(country, gender, part) {
  const pool = NAMES[country] || NAMES.us;
  if (part === 'last') return pick(pool.last);
  const g = gender === 'nonbinary' ? 'neutral' : gender;
  return pick(pool[g] || pool.neutral);
}

function rollAttribute(points) {
  const mean = BAL.attr.baseMean + points * BAL.attr.pointMean;
  const sd = Math.max(5, BAL.attr.baseSd - points * BAL.attr.pointSdCut);
  return Math.round(clamp(gauss(mean, sd), BAL.attr.min, BAL.attr.max));
}

function createLife({ first, last, gender, country, points }) {
  const seed = newSeed();
  initRng(seed);
  resetNpcIds(1);

  const c = COUNTRY_BY_ID[country] || COUNTRIES[0];
  const attrs = {};
  for (const k of ATTR_KEYS) {
    const p = POINTABLE.includes(k) ? (points[k] || 0) : 0;
    attrs[k] = rollAttribute(p);
  }
  // A few attributes correlate — nobody is a random vector of traits.
  attrs.willpower = Math.round(clamp((attrs.willpower + attrs.discipline) / 2 + gauss(0, 8)));
  attrs.stressTol = Math.round(clamp((attrs.stressTol + attrs.resilience) / 2 + gauss(0, 9)));
  attrs.speed = Math.round(clamp((attrs.speed + attrs.stamina) / 2 + gauss(0, 10)));

  const values = {};
  for (const v of VALUE_KEYS) values[v] = Math.round(range(15, 100));

  const height = Math.round(gauss(gender === 'male' ? 177 : gender === 'female' ? 164 : 171, 8));

  const s = {
    saveVersion: BAL.save.version,
    seed, rng: rngState(),
    month: 0,
    daysLeft: BAL.start.daysPerMonth,
    started: Date.now(),
    over: null,
    char: {
      first, last, gender, country: c.id,
      height,
      complexion: pick(COMPLEXIONS).k,
      build: pick(BUILDS).k,
      attrs, values,
      needs: { hunger: 62, hydration: 70, energy: 66, hygiene: 72, social: 55, health: 84 },
      mood: { happiness: 46, stress: 44, confidence: clamp(attrs.confidence), anger: 14 },
      intox: 0,
      money: BAL.start.money,
      home: { id: 'street', kind: 'none', rent: 0, missed: 0 },
      properties: [],
      investments: [],
      job: null, jobHistory: [],
      business: null, creator: null,
      edu: { tier: 0, enrolled: null, credentials: [] },
      conditions: [],
      traumas: [],
      vision: 'normal', hasGlasses: false,
      pets: [], children: [],
      rep: { general: 50, professional: 40, criminal: 5, online: 3, social: 45 },
      legal: { wanted: 0, heat: 0, record: [], incarceration: null },
      gang: null,
      flags: {}, achievements: [],
      familyContact: 0, rejections: 0, debtStress: 0,
      owedTo: null, deferredBill: null,
      foodStocked: false, fragranceMonths: 0, claimingBenefits: false,
      lastMedical: -99, lastCheckup: -99
    },
    npcs: {}, rel: {}, mem: {},
    feed: [], ledger: [],
    queue: [], cooldowns: {}, chains: {},
    stats: { monthsWorked: 0, jobsHeld: 0, crimesDone: 0, crimesCaught: 0, examsPassed: 0, examsFailed: 0, gigsDone: 0, arrests: 0, monthsInPrison: 0, peopleMet: 0 }
  };

  // Starting health and eyesight are not a level playing field.
  const vRoll = rnd();
  s.char.vision = vRoll < 0.62 ? 'normal' : vRoll < 0.78 ? 'mild' : vRoll < 0.9 ? 'near' : vRoll < 0.95 ? 'far' : vRoll < 0.985 ? 'low' : 'severe';
  if (chance(BAL.health.chronicAtStart)) {
    const pool = CONDITIONS.filter(x => x.chronic && x.minAge <= 18);
    const cond = pick(pool);
    s.char.conditions.push({ id: cond.id, since: 0, treating: false, managed: false, known: chance(0.6), monthlyCost: 0 });
  }

  generateStartingCircle(s);

  logFeed(s, {
    en: `You are eighteen, out of college, and out of your parents' house.`,
    fr: `Vous avez dix-huit ans, plus de fac, et plus de chambre chez vos parents.`
  }, 'neutral', true);

__def("ui/app.js", function (__x, __req) {
// The shell. Owns the layout, the current screen, the event queue and the
// minigame overlay. Game logic lives in core/; this decides what is on screen.

const { t, L, setLang, getLang } = __req("i18n/i18n.js");
const { el, btn, panel, openModal, closeModal, infoModal, toast } = __req("ui/components.js");
const { BAL } = __req("config/balance.js");
const { money, MONTHS } = __req("data/world.js");
const { country, age, jobTitle, condition } = __req("core/derived.js");
const { getState } = __req("core/state.js");
const { saveGame } = __req("core/save.js");
const { advance, passiveTick, resetIdle } = __req("core/time.js");
const { nextEvent, popEvent, resolveChoice, availableChoices, pendingCount } = __req("core/events.js");
const { PROGRAM_BY_ID } = __req("data/education.js");
const { runMinigame } = __req("minigames/index.js");
const { skill, visionPenalty } = __req("core/derived.js");
const { endScreen } = __req("ui/setup.js");
const S = __req("ui/screens.js");

const NAV = [
  { id: 'life', tk: 'nav.life', primary: true },
  { id: 'activities', tk: 'nav.activities', primary: true },
  { id: 'people', tk: 'nav.people', primary: true },
  { id: 'work', tk: 'nav.work', primary: true },
  { id: 'school', tk: 'nav.school' },
  { id: 'money', tk: 'nav.money' },
  { id: 'health', tk: 'nav.health' },
  { id: 'assets', tk: 'nav.assets' },
  { id: 'crime', tk: 'nav.crime' },
  { id: 'profile', tk: 'nav.profile' },
  { id: 'settings', tk: 'nav.settings' }
];

const SCREENS = {
  life: S.screenLife, activities: S.screenActivities, people: S.screenPeople,
  work: S.screenWork, school: S.screenSchool, money: S.screenMoney,
  health: S.screenHealth, assets: S.screenAssets, crime: S.screenCrime,
  profile: S.screenProfile, settings: S.screenSettings
};

function createApp({ root, settings, saveSettings, onNewLife }) {
  const app = {
    root, settings, saveSettings,
    tab: 'life',
    get s() { return getState(); },
    refresh, after, go, advance: doAdvance, minigame, deleteLife, save
  };

  function save() { saveGame(app.s); }

  function after() {
    save();
    refresh();
    drainEvents();
  }

  function go(tab) { app.tab = tab; refresh(); }

  function deleteLife() { onNewLife(); }

  // ---------------------------------------------------------------- render

  function refresh() {
    const s = app.s;
    if (!s) return;
    if (s.over) { endScreen(root, s, onNewLife); return; }

    const scroll = root.querySelector('.main')?.scrollTop ?? 0;
    root.innerHTML = '';
    const app_ = el('div', 'app');
    app_.append(topbar(s));
    app_.append(rail());
    const main = el('main', 'main');
    const col = el('div', 'column');
    const screen = (SCREENS[app.tab] || SCREENS.life)(app);
    col.append(screen);
    main.append(col);
    app_.append(main);

    const aside = el('aside', 'aside');
    aside.append(S.vitalsPanel(app));
    app_.append(aside);
    app_.append(tabbar());
    root.append(app_);
    const m = root.querySelector('.main');
    if (m) m.scrollTop = scroll;
  }

  function topbar(s) {
    const bar = el('header', 'topbar');
    const who = el('div');
    who.append(el('div', 'who', s.char.first + ' ' + s.char.last));
    const monthName = (MONTHS[getLang()] || MONTHS.en)[s.month % 12];
    who.append(el('div', 'sub', `${t('common.age')} ${age(s)} \u00b7 ${monthName} \u00b7 ${s.char.job ? L(jobTitle(s)) : t('hdr.unemployed')}`));
    bar.append(who);
    bar.append(el('div', 'spacer'));
    const stat = el('div', 'stat');
    const b = el('b', 'num', money(s.char.money, country(s)));
    stat.append(b);
    stat.append(el('span', null, t('hdr.daysLeft', { n: s.daysLeft })));
    bar.append(stat);
    return bar;
  }

  function rail() {
    const r = el('nav', 'rail');
    const nav = el('div');
    for (const item of NAV) {
      const b = el('button', null, t(item.tk));
      b.type = 'button';
      if (item.id === app.tab) b.setAttribute('aria-current', 'page');
      b.onclick = () => go(item.id);
      if (item.id === 'life' && pendingCount(app.s)) {
        b.append(el('span', 'badge', String(pendingCount(app.s))));
      }
      nav.append(b);
    }
    r.append(nav);
    return r;
  }

  function tabbar() {
    const bar = el('nav', 'tabbar');
    const primary = NAV.filter(n => n.primary);
    for (const item of primary) {
      const b = el('button', null, t(item.tk));
      b.type = 'button';
      if (item.id === app.tab) b.setAttribute('aria-current', 'page');
      b.onclick = () => go(item.id);
      bar.append(b);
    }
    const more = el('button', null, t('nav.more'));
    more.type = 'button';
    if (!primary.some(p => p.id === app.tab)) more.setAttribute('aria-current', 'page');
    more.onclick = () => openMore();
    bar.append(more);
    return bar;
  }

  function openMore() {
    openModal((m, api) => {
      m.append(el('h2', null, t('nav.more')));
      const list = el('div', 'choices');
      for (const item of NAV.filter(n => !n.primary)) {
        list.append(btn(t(item.tk), 'btn', () => { api.close(); go(item.id); }));
      }
      m.append(list);
    });
  }

  // ---------------------------------------------------------------- time

  // Months are simulated one at a time and any event they produce is answered
  // before the next month runs, so a choice made in March shapes April.
  let advancing = false;
  async function doAdvance(months) {
    const s = app.s;
    if (!s || s.over || advancing) return;
    advancing = true;
    resetIdle();
    try {
      for (let i = 0; i < months; i++) {
        if (s.over) break;
        advance(s, 1);
        save();
        refresh();
        await drainEvents();
        if (s.over) break;
      }
    } finally {
      advancing = false;
      save();
      refresh();
    }
  }

  // ---------------------------------------------------------------- events

  function drainEvents() {
    return new Promise((resolve) => {
      const step = () => {
        const s = app.s;
        if (!s || s.over) { refresh(); resolve(); return; }
        const next = nextEvent(s);
        if (!next) { resolve(); return; }
        showEvent(next.ev, next.ctx, next.index, step);
      };
      step();
    });
  }

  function showEvent(ev, ctx, index, done) {
    const s = app.s;
    openModal((m, api) => {
      const title = typeof ev.title === 'function' ? ev.title(s, ctx) : ev.title;
      const body = typeof ev.body === 'function' ? ev.body(s, ctx) : ev.body;
      m.append(el('h2', null, L(title)));
      m.append(el('p', 'prose small', L(body)));
      const choices = el('div', 'choices');
      for (const choice of availableChoices(s, ev, ctx)) {
        choices.append(btn(L(choice.label), 'btn', async () => {
          api.close();
          let score = null;
          if (choice.mg) {
            const setup = {
              type: choice.mg === 'auto' ? autoType(s) : choice.mg,
              charSkill: skill(s, choice.mgKey || []),
              difficulty: 0.45,
              vision: visionPenalty(s),
              condition: condition(s)
            };
            const r = await minigame(setup);
            score = r == null ? 0.25 : r;
          }
          popEvent(s, index);
          const result = resolveChoice(s, ev, choice, ctx, score);
          save();
          refresh();
          if (result) infoModal(L(title), L(result), done);
          else done();
        }));
      }
      m.append(choices);
    }, { dismissable: false });
  }

  // 'auto' lets an event defer to whatever the character is actually studying.
  function autoType(s) {
    const e = s.char.edu.enrolled;
    const prog = e && PROGRAM_BY_ID[e.programId];
    if (!prog || !prog.subjects.length) return 'logic';
    return prog.subjects[Math.floor(Math.random() * prog.subjects.length)];
  }

  // ---------------------------------------------------------------- minigames

  function minigame(setup) {
    return new Promise((resolve) => {
      let bailed = false;
      openModal((m, api) => {
        const host = el('div');
        m.append(host);
        const bail = btn(t('mg.skip'), 'btn btn-quiet btn-block', () => {
          bailed = true;      // its timers keep running; they must not close a later modal
          api.close();
          resolve(null);
        });
        runMinigame(host, setup.type, setup).then((res) => {
          if (bailed) return;
          api.close();
          resolve(res.score);
        });
        m.append(el('div', 'sep'));
        m.append(bail);
      }, { dismissable: false });
    });
  }

  // ---------------------------------------------------------------- passive

  let idleTimer = null;
  function startPassive() {
    if (idleTimer) clearInterval(idleTimer);
    idleTimer = setInterval(() => {
      const s = app.s;
      if (!s || s.over) return;
      if (!document.getElementById('overlay').hidden) return;
      if (document.hidden) return;
      if (passiveTick(s)) { saveGame(s); refresh(); }
    }, BAL.decay.idleTickMs);
  }

  app.start = () => { refresh(); drainEvents(); startPassive(); };
  app.pending = () => pendingCount(app.s);
  app.stop = () => { if (idleTimer) clearInterval(idleTimer); };
  return app;
}

  __x.createApp = createApp;
});

__def("ui/screens.js", function (__x, __req) {
// Screens. Each returns a DOM node; none of them mutate state directly — they
// call into core/actions.js and then ask the app to re-render.

const { t, L, getLang, setLang } = __req("i18n/i18n.js");
const { el, btn, panel, meter, kv, row, fold, field, segmented, openModal, closeModal, confirmModal, infoModal, toast, toastKey } = __req("ui/components.js");
const { BAL } = __req("config/balance.js");
const { money, COUNTRIES, MONTHS, COMPLEXIONS, BUILDS } = __req("data/world.js");
const { ATTRIBUTES, ATTR_GROUPS, VALUE_LABEL } = __req("data/attributes.js");
const { CAREER_BY_ID, GIGS, EMPLOYMENT_FIELDS } = __req("data/careers.js");
const { PROGRAM_BY_ID, EDU_TIERS, SUBJECT_LABEL } = __req("data/education.js");
const { HOUSING_BY_ID, FOOD, CARE, PETS, TRIPS } = __req("data/living.js");
const { CONDITION_BY_ID, VISION_BY_ID, MEDICAL_ACTIONS, TRAUMA_BY_ID } = __req("data/health.js");
const { CRIMES, WANTED_LABEL, PRISON_ACTIVITIES, GANGS } = __req("data/crime.js");
const { ACTIVITIES, ACTIVITY_CATS } = __req("data/activities.js");
const { country, age, monthlyIncome, monthlyCosts, netWorth, selfEsteem, jobTitle, condition, skill, visionPenalty, pensionOf, smell } = __req("core/derived.js");
const { npcName, jobLabelOf, attractionOf } = __req("core/npc.js");
const A = __req("core/actions.js");

const M = (s, v) => money(v, country(s));

function fail(code) { if (code) toastKey(code, 'bad'); return !!code; }

function smellLabel(s) {
  const v = smell(s);
  const scale = getLang() === 'fr'
    ? ['frais', 'discret', 'perceptible', 'gênant', 'difficile à ignorer']
    : ['fresh', 'unnoticeable', 'noticeable', 'off-putting', 'hard to be near'];
  return scale[Math.min(scale.length - 1, Math.floor(v / 22))];
}

// ---------------------------------------------------------------- life

function screenLife(app) {
  const s = app.s;
  const wrap = el('div');

  const summary = panel(t('life.summaryTitle'));
  const b = summary.querySelector('.panel-body');
  const home = HOUSING_BY_ID[s.char.home?.id];
  b.append(kv(t('hdr.job'), s.char.job ? L(jobTitle(s)) : t('hdr.unemployed')));
  b.append(kv(t('home.current'), s.char.home?.kind === 'none' ? t('home.homeless') : L(home)));
  b.append(kv(t('money.balance'), M(s, s.char.money), s.char.money < 0 ? 'loss' : ''));
  b.append(kv(t('money.net'), M(s, monthlyIncome(s) - monthlyCosts(s)), (monthlyIncome(s) - monthlyCosts(s)) < 0 ? 'loss' : 'gain'));
  if (s.char.edu.enrolled) {
    const p = PROGRAM_BY_ID[s.char.edu.enrolled.programId];
    b.append(kv(t('nav.school'), L(p) + ' — ' + t('edu.term', { n: s.char.edu.enrolled.term, total: p.terms })));
  }
  if (s.char.legal.incarceration) {
    const inc = s.char.legal.incarceration;
    b.append(kv(t('crime.prison'), t('crime.release', { n: inc.months - inc.served }), 'loss'));
  }
  wrap.append(summary);

  wrap.append(timePanel(app));

  const feedPanel = panel(t('life.feed'));
  const fb = feedPanel.querySelector('.panel-body');
  if (!s.feed.length) fb.append(el('p', 'hint', t('life.feedEmpty')));
  else {
    const list = el('div', 'feed');
    const items = s.feed.slice(-40).reverse();
    for (const f of items) {
      const item = el('div', 'feed-item' + (f.major ? ' is-major' : '') + ' tone-' + (f.tone || 'neutral'));

      item.append(el('div', 'what', f.text));
      list.append(item);

    fb.append(list);

  wrap.append(feedPanel);

  const p = panel(t('time.advance'));

  b.append(el('p', 'hint', t('hdr.daysLeft', { n: s.daysLeft })));

    { label: t('time.1m'), value: 1 }, { label: t('time.3m'), value: 3 },
    { label: t('time.6m'), value: 6 }, { label: t('time.12m'), value: 12 }
  ], app.settings.step, (v) => { app.settings.step = v; app.saveSettings(); app.refresh(); }));
  b.append(el('div', 'sep'));
  const go = btn(t('time.advance'), 'btn btn-primary btn-block', () => app.advance(app.settings.step));
  b.append(go);
  const urgent = urgentWarning(s);
  if (urgent) b.append(el('p', 'hint caution', urgent));

}

function urgentWarning(s) {
  const n = s.char.needs;
  const parts = [];
  if (n.hunger < 20) parts.push(getLang() === 'fr' ? 'la faim' : 'hunger');
  if (n.hydration < 20) parts.push(getLang() === 'fr' ? 'la soif' : 'thirst');
  if (n.energy < 18) parts.push(getLang() === 'fr' ? 'l\'épuisement' : 'exhaustion');
  if (n.health < 25) parts.push(getLang() === 'fr' ? 'votre santé' : 'your health');
  if (!parts.length) return null;
  return t('time.warnNeeds') + ' (' + parts.join(', ') + ')';
}

// ---------------------------------------------------------------- activities

function screenActivities(app) {
  const s = app.s;
  const wrap = el('div');
  wrap.append(el('p', 'hint', t('hdr.daysLeft', { n: s.daysLeft })));

  if (s.char.legal.incarceration) return prisonScreen(app);

  for (const cat of ACTIVITY_CATS) {
    const list = ACTIVITIES.filter(a => a.cat === cat.k);
    if (!list.length) continue;
    const p = panel(t(cat.tk));
    const b = p.querySelector('.panel-body');
    const holder = el('div', 'list');
    for (const act of list) {
      const reason = A.canDo(s, act);
      const cost = typeof act.cost === 'function' ? act.cost(s) : (act.cost || 0);
      const bits = [];
      if (act.days) bits.push(t('act.costDays', { n: act.days }));
      if (cost) bits.push(M(s, cost));
      holder.append(row({
        title: L(act),
        meta: L(act.desc),
        end: bits.join(' \u00b7 ') || t('common.free'),
        disabled: !!reason,
        onClick: () => runActivity(app, act)
      }));
    }
    b.append(holder);
    wrap.append(p);
  }
  return wrap;
}

async function runActivity(app, act) {
  const s = app.s;
  const reason = A.canDo(s, act);
  if (fail(reason)) return;

  if (act.opensFood) return openFood(app);
  if (act.opensCare) return openCare(app);
  if (act.opensMedical) return app.go('health');
  if (act.opensHousing) return app.go('assets');
  if (act.opensJobs) { A.performActivity(s, act); app.go('work'); return; }
  if (act.opensGigs) return openGigs(app);
  if (act.opensCrime) return app.go('crime');
  if (act.opensInvest) return openInvest(app);
  if (act.opensTrips) return openTrips(app);

  let score = null;
  const setup = A.activityMinigame(s, act);
  if (setup) {
    const res = await app.minigame(setup);
    if (res == null) return;
    score = res;
  }
  A.performActivity(s, act, score);
  if (act.drinkOffer && Math.random() < 0.5) A.performActivity(s, { eff: { intox: 25, mood: { stress: -6 } } });
  app.after();

      }));

    const list = el('div', 'list');
    for (const c of CARE) {
      const cost = Math.round(c.cost * country(s).col);
      list.append(row({
        title: L(c),
        end: cost ? M(s, cost) : t('common.free'),
        onClick: () => { if (!fail(A.personalCare(s, c.id))) { api.close(); app.after(); } }
      }));
    }
    m.append(list);
  });
}

function openGigs(app) {
  const s = app.s;
  openModal((m, api) => {
    m.append(el('h2', null, t('nav.money')));
    const list = el('div', 'list');
    for (const g of GIGS) {
      const disabled = g.days > s.daysLeft;

// ---------------------------------------------------------------- people

function screenPeople(app) {
  const s = app.s;
  const wrap = el('div');
  const entries = Object.entries(s.rel)
    .filter(([id]) => s.npcs[id]?.alive)
    .sort((a, b) => rank(b[1]) - rank(a[1]));
  if (!entries.length) { wrap.append(el('p', 'hint', t('people.empty'))); return wrap; }

  const groups = { partner: [], family: [], friend: [], acquaintance: [], ex: [] };
  for (const [id, rel] of entries) (groups[rel.type] || groups.acquaintance).push([id, rel]);

  const labels = {
    partner: getLang() === 'fr' ? 'Couple' : 'Partner',
    family: getLang() === 'fr' ? 'Famille' : 'Family',
    friend: getLang() === 'fr' ? 'Amis' : 'Friends',
    acquaintance: getLang() === 'fr' ? 'Connaissances' : 'Acquaintances',
    ex: getLang() === 'fr' ? 'Anciennes relations' : 'Former'
  };

  for (const key of ['partner', 'family', 'friend', 'acquaintance', 'ex']) {
    if (!groups[key].length) continue;
    const p = panel(labels[key]);
    const b = p.querySelector('.panel-body');
    const list = el('div', 'list');
    for (const [id, rel] of groups[key]) {
      const npc = s.npcs[id];
      const job = jobLabelOf(npc);
      list.append(row({
        title: npcName(npc),
        meta: [job, npc.jail ? (getLang() === 'fr' ? 'en détention' : 'inside') : null].filter(Boolean).join(' \u00b7 '),
        end: Math.round(rel.affection) + '%',
        onClick: () => openPerson(app, id)
      }));
    }
    b.append(list);
    wrap.append(p);
  }
  return wrap;
}

function rank(rel) {
  return rel.affection + (rel.type === 'partner' ? 200 : rel.type === 'family' ? 120 : rel.type === 'friend' ? 60 : 0);
}

function openPerson(app, id) {
  const s = app.s;
  const npc = s.npcs[id];
  const rel = s.rel[id];
  openModal((m, api) => {
    m.append(el('h2', null, npcName(npc)));
    const meta = [jobLabelOf(npc), `${npc.age}`, t('people.lastSeen', { n: s.month - rel.lastContact })].filter(Boolean);
    m.append(el('p', 'hint', meta.join(' \u00b7 ')));

    m.append(meter(t('people.aff'), rel.affection));
    m.append(meter(t('people.trust'), rel.trust));
    m.append(meter(t('people.resp'), rel.respect));
    if (rel.attraction > 5) m.append(meter(t('people.attr'), rel.attraction));
    if (rel.resentment > 15) m.append(meter(t('people.res'), rel.resentment, { color: 'var(--loss)' }));

    const mems = (s.mem[id] || []).filter(x => x.strength > 0.15);
    if (mems.length) {
      const body = el('div');
      for (const mem of mems) body.append(el('div', 'meta', memoryText(mem)));
      m.append(fold(t('people.knows'), body));
    }

    const acts = el('div', 'choices');
    const doAct = (kind, amount) => {
      const r = A.socialAction(s, id, kind, amount);
      if (r === 'rejected') toast(t('work.rejected'), 'bad');
      else if (r) toastKey(r, 'bad');
      api.close();
      app.after();
    };
    acts.append(btn(t('people.talk'), 'btn', () => doAct('talk')));
    acts.append(btn(t('people.help'), 'btn', () => doAct('help')));
    if (s.daysLeft >= 1) acts.append(btn(t('people.meet'), 'btn', () => doAct('meet')));
    acts.append(btn(t('people.gift'), 'btn', () => doAct('gift', Math.min(s.char.money, 200))));
    acts.append(btn(t('people.ask'), 'btn', () => doAct('ask')));
    if (rel.type !== 'partner' && rel.type !== 'family' && npc.age >= 18) {
      acts.append(btn(t('people.flirt'), 'btn', () => doAct('flirt')));
      if (rel.attraction >= 45) acts.append(btn(t('people.date'), 'btn btn-primary', () => doAct('date')));
    }
    if (rel.type === 'partner') acts.append(btn(t('people.family'), 'btn btn-primary', () => doAct('family')));
    if (rel.type !== 'family') acts.append(btn(t('people.cut'), 'btn btn-danger', () => doAct('cut')));
    acts.append(btn(t('common.close'), 'btn btn-quiet', () => api.close()));
    m.append(acts);
  });
}

  } else {

    p.querySelector('.panel-body').append(el('p', 'hint', t('work.none')));

  const holder = el('div', 'list');
  for (const o of list) {
    holder.append(row({
      title: L(o.def),
      meta: L(o.trackDef) + ' \u00b7 ' + o.def.hours + 'h',
      end: M(s, o.pay),
      tags: [{ text: (getLang() === 'fr' ? 'Adéquation ' : 'Fit ') + o.fit + '%', kind: o.fit > 60 ? 'good' : o.fit < 40 ? 'bad' : '' }],
      onClick: async () => {
        if (s.daysLeft < 1) return fail(A.FAIL.days);

function businessPanel(app) {
  const s = app.s;
  if (s.char.business) {
    const b = s.char.business;
    const def = A.BUSINESS_TYPES.find(x => x.id === b.type);
    const p = panel(t('work.business'));
    const pb = p.querySelector('.panel-body');
    pb.append(kv(L(def), M(s, b.value)));
    pb.append(kv(getLang() === 'fr' ? 'Résultat mensuel' : 'Monthly profit', M(s, b.lastProfit), b.lastProfit < 0 ? 'loss' : 'gain'));
    pb.append(kv(getLang() === 'fr' ? 'Demande / capacité' : 'Demand / capacity', `${Math.round(b.demand)} / ${Math.round(b.capacity)}`));
    pb.append(kv(getLang() === 'fr' ? 'Salariés' : 'Staff', String(b.staff)));
    pb.append(el('div', 'sep'));
    if (!b.marketing) pb.append(btn(getLang() === 'fr' ? 'Lancer une campagne' : 'Run marketing', 'btn btn-block', () => {
      const cost = Math.round(1800 * country(s).col);
      if (cost > s.char.money) return fail(A.FAIL.money);
      s.char.money -= cost; b.marketing = true; b.demand += 15; app.after();
    }));
    pb.append(btn(getLang() === 'fr' ? 'Vendre l\'entreprise' : 'Sell the business', 'btn btn-danger btn-block',
      () => confirmModal({ title: getLang() === 'fr' ? 'Vendre ?' : 'Sell?', onConfirm: () => { A.sellBusiness(s); app.after(); } })));
    return p;
  }
  const p = panel(t('work.startBiz'));
  const pb = p.querySelector('.panel-body');
  const list = el('div', 'list');
  for (const bt of A.BUSINESS_TYPES) {
    const capital = Math.round(bt.capital * country(s).col);
    list.append(row({
      title: L(bt), end: M(s, capital),
      meta: (getLang() === 'fr' ? 'Marge ' : 'Margin ') + Math.round(bt.margin * 100) + '%',
      disabled: capital > s.char.money || s.daysLeft < 5,
      onClick: () => { if (!fail(A.startBusiness(s, bt.id))) app.after(); }
    }));
  }
  pb.append(list);
  return p;
}

    rlist.append(row({

      const line = el('div');

        title: L(def),

        end: M(s, o.priceReal),

function screenCrime(app) {
