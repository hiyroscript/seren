__def("core/actions.js", function (__x, __req) {
// Player actions. The UI decides what to show; this file decides what happens.

const { BAL } = __req("config/balance.js");
const { int, range, chance, pick, clamp } = __req("core/rng.js");
const { t, L } = __req("i18n/i18n.js");
const { applyEffects, meetsReq, logFeed, spendDays } = __req("core/effects.js");
const { ledger } = __req("core/state.js");
const { country, effAttr, skill, age, condition, visionPenalty, smell, monthlyIncome } = __req("core/derived.js");
const { CAREERS, CAREER_BY_ID, GIGS } = __req("data/careers.js");
const { PROGRAMS, PROGRAM_BY_ID } = __req("data/education.js");
const { HOUSING, HOUSING_BY_ID, FOOD, CARE, PETS, TRIPS } = __req("data/living.js");
const { CONDITIONS, CONDITION_BY_ID, VISION_BY_ID, MEDICAL_ACTIONS } = __req("data/health.js");
const { CRIMES, CRIME_BY_ID, PRISON_ACTIVITIES, GANGS } = __req("data/crime.js");
const { meetsJobReq } = __req("core/time.js");
const { arrest } = __req("content/events.js");
const { remember, npcName, attractionOf, generateNpc, addNpc } = __req("core/npc.js");

const FAIL = {
  days: 'toast.noDays', money: 'toast.needMoney', energy: 'toast.tooTired'
};

function canDo(s, def) {
  const days = def.days ?? 0;
  if (days > s.daysLeft) return FAIL.days;
  const cost = typeof def.cost === 'function' ? def.cost(s) : (def.cost || 0);
  if (cost > s.char.money) return FAIL.money;
  if (def.req && !meetsReq(s, def.req)) return def.req.minEnergy ? FAIL.energy : 'work.reqFail';
  return null;
}

// ---------------------------------------------------------------- activities

function activityMinigame(s, act) {
  if (!act.mg) return null;
  return {
    type: act.mg,
    charSkill: skill(s, act.mgKey || []),
    difficulty: 0.45,
    vision: act.mg === 'observe' ? visionPenalty(s) : 0,
    condition: condition(s)
  };
}

function performActivity(s, act, score = null) {
  const cost = typeof act.cost === 'function' ? act.cost(s) : (act.cost || 0);
  if (cost) { s.char.money -= cost; ledger(s, act, -cost); }
  spendDays(s, act.days || 0);

  if (act.homeQuality) {
    const q = HOUSING_BY_ID[s.char.home?.id]?.quality ?? 10;
    applyEffects(s, { needs: { energy: Math.round((act.eff.needs.energy) * (0.45 + q / 140)) } });
    const rest = { ...act.eff, needs: { ...act.eff.needs, energy: 0 } };
    applyEffects(s, rest);
  } else if (act.eff) {
    applyEffects(s, act.eff);
  }

  if (act.overtimePay && s.char.job) {
    const extra = Math.round(s.char.job.salary * 0.18);
    s.char.money += extra;
    ledger(s, { en: 'Overtime', fr: 'Heures supplémentaires' }, extra);
    strainRelationships(s);
  }
  if (score != null && act.onScore) applyEffects(s, act.onScore(score));
  if (act.meetChance && chance(act.meetChance)) meetSomeoneNew(s);
  if (act.creator) {
    if (!s.char.creator) s.char.creator = { audience: int(3, 40), rpm: range(4, 12), lastIncome: 0, postedThisMonth: true };
    else {
      s.char.creator.postedThisMonth = true;
      const boost = 1 + (score ?? 0.4) * 0.5 + (effAttr(s, 'creativity') - 50) / 300;
      s.char.creator.audience = Math.max(1, Math.round(s.char.creator.audience * boost + int(0, 25)));
    }
  }
  return null;
}

function strainRelationships(s) {
  for (const id in s.rel) {
    const r = s.rel[id];
    if (r.type === 'partner') { r.resentment = clamp(r.resentment + 4); r.affection = clamp(r.affection - 2); }
  }
  if (s.char.edu.enrolled) s.char.edu.enrolled.gpa = Math.max(0, s.char.edu.enrolled.gpa - 0.08);
}

function meetSomeoneNew(s, type = 'acquaintance') {
  const npc = generateNpc(s, { age: int(Math.max(18, age(s) - 12), age(s) + 14) });
  addNpc(s, npc, type, { affection: int(25, 55), trust: int(20, 45) });
  s.stats.peopleMet++;
  logFeed(s, { en: `Met ${npcName(npc)}.`, fr: `Rencontre : ${npcName(npc)}.` });
  return npc;
}

// ---------------------------------------------------------------- food, care

function eat(s, foodId) {
  const f = FOOD.find(x => x.id === foodId);
  if (!f) return;
  const c = country(s);
  const cost = Math.round(f.cost * c.col);
  if (cost > s.char.money) return FAIL.money;
  if ((f.days || 0) > s.daysLeft) return FAIL.days;
  s.char.money -= cost;
  spendDays(s, f.days || 0);
  if (f.stocks) { s.char.foodStocked = true; ledger(s, f, -cost); }
  applyEffects(s, { needs: { hunger: f.hunger, hydration: 6 }, health: f.health, mood: { happiness: f.happy || 0 } });
  return null;
}

function personalCare(s, careId) {
  const item = CARE.find(x => x.id === careId);
  if (!item) return;
  const c = country(s);
  const cost = Math.round(item.cost * c.col);
  if (cost > s.char.money) return FAIL.money;
  if ((item.days || 0) > s.daysLeft) return FAIL.days;
  if (item.needsHome && (!s.char.home || s.char.home.kind === 'none')) return 'work.reqFail';
  s.char.money -= cost;
  spendDays(s, item.days || 0);
  applyEffects(s, {
    needs: { hygiene: item.hygiene || 0 },
    attrs: { looks: item.looks || 0 },
    mood: { confidence: item.conf || 0 }
  });
  if (item.smell) s.char.fragranceMonths = 2;
  if (item.mark) { s.char.flags.tattooed = true; }
  return null;
}

// ---------------------------------------------------------------- work

function openings(s) {
  const out = [];
  const c = country(s);
  for (const track of CAREERS) {
    for (let lvl = 0; lvl < track.levels.length; lvl++) {
      const level = track.levels[lvl];
      const exp = experienceIn(s, track.id);
      if (!meetsJobReq(s, level, exp)) continue;
      // Employers do not advertise every role to every applicant.
      const visible = lvl === 0 || exp > 0 || s.char.edu.tier >= (level.edu || 0) + 1;
      if (!visible) continue;
      out.push({
        track: track.id, level: lvl, def: level, trackDef: track,
        pay: Math.round(level.pay * c.wage),
        fit: Math.round(skill(s, track.key))
      });
    }
  }
  return out.sort((a, b) => b.fit - a.fit).slice(0, 10);
}

function experienceIn(s, trackId) {
  let m = 0;
  for (const j of s.char.jobHistory) if (j.track === trackId) m += j.tenure;
  if (s.char.job?.track === trackId) m += s.char.job.tenure;
  return m;
}

function interviewSetup(s, opening) {
  return {
    type: pick(['words', 'alloc', 'logic']),
    charSkill: skill(s, opening.trackDef.key.concat(['charisma'])),
    difficulty: 0.3 + opening.level * 0.15,
    condition: condition(s)
  };
}

const INK_AT_WORK = {
  creative: 0.05, service: 0.02, manual: 0.01, tech: 0,
  sales: -0.02, public: -0.03, health: -0.04, office: -0.05
};

function applyForJob(s, opening, score) {
  let presentation = (s.char.needs.hygiene * 0.3 + effAttr(s, 'looks') * 0.15 + effAttr(s, 'charisma') * 0.55) / 100;
  presentation -= Math.max(0, smell(s) - 50) * 0.006;
  // Workplace cultures differ. Visible tattoos help in some rooms and cost in others.
  if (s.char.flags.tattooed) presentation += INK_AT_WORK[opening.trackDef.field] ?? 0;
  const fit = skill(s, opening.trackDef.key) / 100;
  const record = s.char.rep.professional / 100 - (s.char.legal.record.length ? 0.22 : 0);
  // Someone who has dropped their standards gets entry-level work more easily,
  // and stops being desperate the moment they are hired.
  const desperate = s.char.flags.desperateForWork && opening.level === 0 ? 0.12 : 0;
  const chanceToGet = clamp(
    score * 0.36 + presentation * 0.30 + fit * 0.20 + record * 0.14 - opening.level * 0.09 + desperate,
    0.03, 0.95
  );
  spendDays(s, 1);
  if (chance(chanceToGet)) {
    if (s.char.job) s.char.jobHistory.push({ ...s.char.job, endedMonth: s.month, reason: 'left' });
    s.char.job = {
      track: opening.track, level: opening.level,
      salary: Math.round(opening.pay * range(0.94, 1.08)),
      performance: 50, tenure: 0, startedMonth: s.month
    };
    s.stats.jobsHeld++;
    s.char.flags.desperateForWork = false;
    s.char.flags.jobSearching = false;
    logFeed(s, { en: `Started work as ${L(opening.def)}.`, fr: `Embauché comme ${L(opening.def)}.` }, 'good', true);
    applyEffects(s, { mood: { confidence: 8, stress: -6, happiness: 8 }, rep: { professional: 4 } });
    return true;
  }
  s.char.rejections = (s.char.rejections || 0) + 1;
  applyEffects(s, { mood: { confidence: -3, stress: 4 } });
  return false;
}

function quitJob(s) {
  if (!s.char.job) return;
  const title = CAREER_BY_ID[s.char.job.track].levels[s.char.job.level];
  s.char.jobHistory.push({ ...s.char.job, endedMonth: s.month, reason: 'quit' });
  s.char.job = null;
  logFeed(s, { en: `Left the job as ${L(title)}.`, fr: `Départ du poste de ${L(title)}.` }, 'neutral', true);
}

function doGig(s, gig, score) {
  const c = country(s);
  const fit = gig.key.length ? skill(s, gig.key) / 100 : 0.5;
  const quality = score != null ? (score * 0.6 + fit * 0.4) : fit;
  const pay = Math.round((gig.pay[0] + (gig.pay[1] - gig.pay[0]) * quality) * c.wage);
  spendDays(s, gig.days);
  s.char.money += pay;
  ledger(s, gig, pay);
  applyEffects(s, { needs: { energy: gig.energy }, mood: { stress: 3 } });
  s.stats.gigsDone++;
  if (chance(0.12)) meetSomeoneNew(s);
  return pay;
}

// ---------------------------------------------------------------- education

function availablePrograms(s) {
  return PROGRAMS.filter(p => s.char.edu.tier >= p.minTier && !s.char.edu.credentials.some(c => c.id === p.id));
}

function enroll(s, programId) {
  const p = PROGRAM_BY_ID[programId];
  if (!p) return 'work.reqFail';
  const due = Math.round(p.tuition * country(s).tuition);
  if (due > s.char.money) return FAIL.money;
  s.char.money -= due;
  ledger(s, p, -due);
  s.char.edu.enrolled = { programId, term: 1, monthsInTerm: 0, gpa: 2.4, strikes: 0, studiedThisMonth: false };
  logFeed(s, { en: `Enrolled: ${L(p)}.`, fr: `Inscription : ${L(p)}.` }, 'good', true);
  return null;
}

function studySetup(s) {
  const e = s.char.edu.enrolled;
  const p = PROGRAM_BY_ID[e.programId];
  return {
    type: pick(p.subjects),
    charSkill: skill(s, p.key),
    difficulty: 0.25 + p.demand / 160,
    vision: visionPenalty(s),
    condition: condition(s)
  };
}

function study(s, score) {
  const e = s.char.edu.enrolled;
  if (!e) return;
  spendDays(s, 2);
  e.studiedThisMonth = true;
  applyEffects(s, {
    gpa: (score - 0.4) * BAL.edu.studyGpaGain * 2.4,
    needs: { energy: -12 }, mood: { stress: 5 },
    attrs: { intelligence: score * 0.2, focus: score * 0.2, discipline: 0.15 }
  });
}

function withdraw(s) {
  const p = PROGRAM_BY_ID[s.char.edu.enrolled?.programId];
  s.char.edu.enrolled = null;
  if (p) logFeed(s, { en: `Withdrew from ${L(p)}.`, fr: `Abandon : ${L(p)}.` }, 'bad');
  applyEffects(s, { mood: { confidence: -6 } });
}

// ---------------------------------------------------------------- housing

function housingOptions(s) {
  const c = country(s);
  return HOUSING.filter(h => h.kind !== 'none' && h.id !== 'couch').map(h => ({
    ...h,
    rentReal: Math.round(h.rent * c.rentMul * c.col),
    priceReal: Math.round(h.price * c.rentMul * c.col),
    deposit: Math.round(h.rent * c.rentMul * c.col * 2)
  }));
}

function rentHome(s, id) {
  const opt = housingOptions(s).find(h => h.id === id);
  if (!opt) return 'work.reqFail';
  if (opt.deposit + opt.rentReal > s.char.money) return FAIL.money;
  if (s.daysLeft < 2) return FAIL.days;
  s.char.money -= opt.deposit;
  ledger(s, { en: 'Deposit', fr: 'Caution' }, -opt.deposit);
  spendDays(s, 2);
  s.char.home = { id: opt.id, kind: 'rent', rent: opt.rentReal, missed: 0 };
  logFeed(s, { en: `Moved into a ${L(opt).toLowerCase()}.`, fr: `Emménagement : ${L(opt).toLowerCase()}.` }, 'good', true);
  applyEffects(s, { mood: { stress: -10, happiness: 8 } });
  return null;
}

function newProperty(opt, deposit, isHome) {
  return {
    id: opt.id, value: opt.priceReal, debt: opt.priceReal - deposit,
    mortgage: Math.round((opt.priceReal - deposit) / 300),
    rentedOut: false, rentIncome: Math.round(opt.rentReal * 0.92), isHome
  };
}

function buyHome(s, id) {
  const opt = housingOptions(s).find(h => h.id === id);
  if (!opt || !opt.priceReal) return 'work.reqFail';
  const deposit = Math.round(opt.priceReal * 0.2);
  if (deposit > s.char.money) return FAIL.money;
  if (s.daysLeft < 3) return FAIL.days;
  s.char.money -= deposit;
  spendDays(s, 3);
  ledger(s, { en: 'Property deposit', fr: 'Apport immobilier' }, -deposit);
  // whatever you owned before becomes something you could let out
  for (const p of s.char.properties) p.isHome = false;
  const mortgage = Math.round((opt.priceReal - deposit) / 300);
  s.char.home = { id: opt.id, kind: 'own', rent: mortgage, missed: 0 };
  s.char.properties.push(newProperty(opt, deposit, true));
  logFeed(s, { en: `Bought a ${L(opt).toLowerCase()}.`, fr: `Achat : ${L(opt).toLowerCase()}.` }, 'good', true);
  applyEffects(s, { mood: { confidence: 10, happiness: 10 }, rep: { general: 4 }, achievement: 'homeowner' });
  return null;
}

function buyInvestmentProperty(s, id) {
  const opt = housingOptions(s).find(h => h.id === id);
  if (!opt || !opt.priceReal) return 'work.reqFail';
  const deposit = Math.round(opt.priceReal * 0.3); // lenders want more for a second property
  if (deposit > s.char.money) return FAIL.money;
  if (s.daysLeft < 3) return FAIL.days;
  s.char.money -= deposit;
  spendDays(s, 3);
  ledger(s, { en: 'Investment property', fr: 'Investissement immobilier' }, -deposit);
  s.char.properties.push(newProperty(opt, deposit, false));
  logFeed(s, { en: `Bought a second property.`, fr: `Achat d'un second bien.` }, 'good', true);
  return null;
}

function toggleRentOut(s, index) {
  const p = s.char.properties[index];
  if (!p || p.isHome) return 'work.reqFail';
  if (!p.rentedOut && s.daysLeft < 1) return FAIL.days;
  if (!p.rentedOut) spendDays(s, 1);
  p.rentedOut = !p.rentedOut;
  return null;
}

function sellProperty(s, index) {
  const p = s.char.properties[index];
  if (!p) return 'work.reqFail';
  if (p.isHome && s.char.properties.length === 1) {
    s.char.home = { id: 'street', kind: 'none', rent: 0, missed: 0 };
  }
  const equity = Math.max(0, Math.round((p.value - (p.debt || 0)) * range(0.92, 1.06)));
  s.char.money += equity;
  ledger(s, { en: 'Sold a property', fr: 'Vente d\'un bien' }, equity);
  s.char.properties.splice(index, 1);
  logFeed(s, { en: 'Sold a property.', fr: 'Bien immobilier vendu.' }, 'neutral', true);
  return null;
}

// ---------------------------------------------------------------- medical

function medicalCost(s, action) {
  const c = country(s);
  return Math.round(action.cost * (1 - c.health.cover) * c.col);
}

function doMedical(s, actionId) {
  const act = MEDICAL_ACTIONS.find(a => a.id === actionId);
  if (!act) return 'work.reqFail';
  const cost = medicalCost(s, act);
  if (cost > s.char.money) return FAIL.money;
  if (act.days > s.daysLeft) return FAIL.days;
  s.char.money -= cost;
  ledger(s, act, -cost);
  spendDays(s, act.days);
  s.char.lastMedical = s.month;

  if (actionId === 'checkup') {
    s.char.lastCheckup = s.month;
    for (const c of s.char.conditions) if (chance(0.8)) c.known = true;
    applyEffects(s, { mood: { stress: -3 } });
  }
  if (actionId === 'gp' || actionId === 'specialist') {
    for (const c of s.char.conditions) c.known = true;
    applyEffects(s, { health: actionId === 'specialist' ? 5 : 2 });
  }
  if (actionId === 'therapy') {
    s.char.flags.inTherapy = true;
    applyEffects(s, { mood: { stress: -14, happiness: 5 }, attrs: { stressTol: 0.5, resilience: 0.3 } });
    for (const tr of s.char.traumas || []) tr.healed = Math.min(1, tr.healed + 0.08);
  }
  if (actionId === 'optician') {
    s.char.flags.visionTested = true;
  }
  return null;
}

function treatCondition(s, condId, on) {
  const inst = s.char.conditions.find(c => c.id === condId);
  const def = CONDITION_BY_ID[condId];
  if (!inst || !def) return;
  inst.treating = on;
  inst.monthlyCost = on ? Math.round(def.treat / 12 * (1 - country(s).health.cover)) : 0;
}

function buyGlasses(s) {
  const v = VISION_BY_ID[s.char.vision];
  if (!v?.cost) return 'work.reqFail';
  const cost = Math.round(v.cost * (1 - country(s).health.cover * 0.5) * country(s).col);
  if (cost > s.char.money) return FAIL.money;
  s.char.money -= cost;
  ledger(s, { en: 'Eyewear', fr: 'Lunettes' }, -cost);
  s.char.hasGlasses = true;
  logFeed(s, { en: 'Got glasses. The world sharpens up.', fr: 'Lunettes obtenues. Le monde redevient net.' }, 'good');
  return null;
}

const VISION_LADDER = { severe: 'low', low: 'near', near: 'mild', far: 'mild', mild: 'normal' };

function canCorrectVision(s) {
  const v = VISION_BY_ID[s.char.vision];
  return !!(v && v.fix === 'specialist' && VISION_LADDER[s.char.vision]);
}

function correctVision(s) {
  if (!canCorrectVision(s)) return 'work.reqFail';
  const v = VISION_BY_ID[s.char.vision];
  const cost = Math.round(v.cost * (1 - country(s).health.cover) * country(s).col);
  if (cost > s.char.money) return FAIL.money;
  if (s.daysLeft < 4) return FAIL.days;
  s.char.money -= cost;
  ledger(s, { en: 'Eye procedure', fr: 'Intervention ophtalmologique' }, -cost);
  spendDays(s, 4);
  if (chance(0.78)) {
    s.char.vision = VISION_LADDER[s.char.vision];
    logFeed(s, { en: `Your eyesight improved to ${L(VISION_BY_ID[s.char.vision]).toLowerCase()}.`, fr: `Votre vue s'est améliorée : ${L(VISION_BY_ID[s.char.vision]).toLowerCase()}.` }, 'good', true);
  } else {
    applyEffects(s, { mood: { stress: 10 }, health: -3 });
    logFeed(s, { en: 'The procedure did not take.', fr: 'L\'intervention n\'a rien changé.' }, 'bad');
  }
  return null;
}

function repayDebtToFriend(s) {
  const owed = s.char.owedTo;
  if (!owed) return 'work.reqFail';
  if (owed.amount > s.char.money) return FAIL.money;
  s.char.money -= owed.amount;
  ledger(s, { en: 'Repaid a loan', fr: 'Prêt remboursé' }, -owed.amount);
  applyEffects(s, { relBy: { [owed.npcId]: { trust: 12, respect: 8, loyalty: 6 } } });
  remember(s, owed.npcId, 'paid_me_back', { weight: 2, decay: 'major', good: 1 });
  s.char.owedTo = null;
  s.char.flags.owesFriend = false;
  return null;
}

// ---------------------------------------------------------------- crime

function crimeSetup(s, crime) {
  return {
    type: crime.mg,
    charSkill: skill(s, crime.key),
    difficulty: 0.3 + crime.sev * 0.07,
    vision: crime.mg === 'observe' ? visionPenalty(s) : 0,
    condition: condition(s)
  };
}

function commitCrime(s, crimeId, score) {
  const cr = CRIME_BY_ID[crimeId];
  if (!cr) return null;
  spendDays(s, cr.days);
  s.stats.crimesDone++;
  s.char.legal.lastCrimeGap = 0;

  const c = country(s);
  const exposure = clamp(
    (cr.heat * (1.6 - score) * c.law.severity) + s.char.legal.wanted * BAL.crime.witnessPerStar - effAttr(s, 'luck') * 0.0015,
    0.02, 0.95
  );
  const caught = chance(exposure);
  const payout = Math.round((cr.pay[0] + (cr.pay[1] - cr.pay[0]) * score) * c.col);

  if (caught) {
    s.stats.crimesCaught++;
    if (cr.gangOnly && s.char.gang) s.char.gang.standing = clamp(s.char.gang.standing - cr.sev * 2);
    const stars = Math.min(6, s.char.legal.wanted + Math.ceil(cr.sev / 2));
    if (chance(0.45 + cr.sev * 0.05)) {
      applyEffects(s, arrest(s, stars));
      return { caught: true, arrested: true, payout: 0 };
    }
    applyEffects(s, { wanted: Math.ceil(cr.sev / 2), heat: 0.4, mood: { stress: 20 }, rep: { criminal: cr.sev * 2 } });
    return { caught: true, arrested: false, payout: 0 };
  }

  s.char.money += payout;
  ledger(s, cr, payout);
  if (cr.gangOnly && s.char.gang) {
    s.char.gang.standing = clamp(s.char.gang.standing + cr.sev * 2.4);
  }
  applyEffects(s, {
    mood: { stress: 8 + cr.sev, confidence: 2 },
    rep: { criminal: cr.sev * 1.6, general: -cr.sev * 0.4 },
    heat: cr.heat * 0.4,
    wanted: chance(cr.heat * 0.5) ? 1 : 0
  });
  return { caught: false, arrested: false, payout };
}

function gangDef(s) { return s.char.gang ? GANGS.find(g => g.id === s.char.gang.id) : null; }

function joinGang(s, gangId) {
  const g = GANGS.find(x => x.id === gangId);
  if (!g || s.char.gang) return 'work.reqFail';
  if (s.char.rep.criminal < 20) return 'work.reqFail';
  if (s.daysLeft < 2) return FAIL.days;
  spendDays(s, 2);
  s.char.gang = { id: g.id, standing: 10, joined: s.month };
  applyEffects(s, { rep: { criminal: 6, general: -4 }, mood: { confidence: 4 } });
  logFeed(s, { en: `Started running with ${L(g)}.`, fr: `Vous roulez désormais avec ${L(g)}.` }, 'neutral', true);
  return null;
}

function leaveGang(s) {
  const g = gangDef(s);
  if (!g) return 'work.reqFail';
  const standing = s.char.gang.standing;
  const clean = chance(clamp(0.35 + standing * 0.006 - g.loyalty * 0.4, 0.05, 0.9));
  s.char.gang = null;
  if (clean) {
    applyEffects(s, { mood: { stress: 10 }, rep: { criminal: -8 } });
    logFeed(s, { en: 'You walked away and nobody followed.', fr: 'Vous êtes parti et personne ne vous a suivi.' }, 'good', true);
    return null;
  }
  applyEffects(s, {
    health: -Math.round(range(6, 18)), mood: { stress: 24 },
    rep: { criminal: -4 }, trauma: chance(0.4) ? 'violence' : null
  });
  logFeed(s, { en: 'Leaving cost you.', fr: 'Partir vous a coûté cher.' }, 'bad', true);
  return null;
}

function crimeLocked(s, cr) {
  if (cr.gangOnly && !s.char.gang) return 'gang';
  if (cr.minRep && (s.char.gang?.standing ?? 0) < 45) return 'standing';
  return null;
}

function turnSelfIn(s) {
  const stars = s.char.legal.wanted;
  const reduced = Math.max(1, stars - 1);
  applyEffects(s, arrest(s, reduced));
  applyEffects(s, { mood: { stress: -8 } });
}

function prisonAction(s, id) {
  const act = PRISON_ACTIVITIES.find(a => a.id === id);
  const inc = s.char.legal.incarceration;
  if (!act || !inc) return 'work.reqFail';
  if (act.days > s.daysLeft) return FAIL.days;
  if (act.cost && act.cost > s.char.money) return FAIL.money;
  spendDays(s, act.days);
  if (act.cost) s.char.money -= act.cost;
  inc.safety = clamp((inc.safety || 50) + (act.safety || 0));
  inc.paroleCredit = (inc.paroleCredit || 0) + (act.parole || 0);
  if (act.pay) { s.char.money += act.pay; ledger(s, act, act.pay); }
  if (act.strength) applyEffects(s, { attrs: { strength: act.strength, stamina: act.strength * 0.6 } });
  if (act.crimeRep) applyEffects(s, { rep: { criminal: act.crimeRep } });
  if (act.edu) applyEffects(s, { attrs: { intelligence: 0.3, focus: 0.3 } });
  if (act.appeal) {
    const ok = chance(0.12 + (inc.paroleCredit || 0) * 0.01 + effAttr(s, 'intelligence') * 0.001);
    if (ok) {
      inc.months = Math.max(inc.served + 1, Math.round(inc.months * 0.65));
      logFeed(s, { en: 'The appeal reduced the sentence.', fr: 'L\'appel a réduit la peine.' }, 'good');
    }
  }
  return null;
}

function paroleCheck(s) {
  const inc = s.char.legal.incarceration;
  if (!inc) return false;
  if (inc.served < inc.paroleEligible) return false;
  const p = clamp(0.18 + (inc.paroleCredit || 0) * 0.02 + (inc.safety || 50) * 0.002 - s.char.rep.criminal * 0.002, 0.02, 0.8);
  if (chance(p)) {
    s.char.legal.incarceration = null;
    logFeed(s, { en: 'Released on parole.', fr: 'Libéré sous conditions.' }, 'good', true);
    s.char.flags.onParole = true;
    return true;
  }
  return false;
}

function escapeSetup(s) {
  return { type: 'memory', charSkill: skill(s, ['awareness', 'coordination', 'stressTol']), difficulty: 0.75, condition: condition(s) };
}

function attemptEscape(s, score) {
  const inc = s.char.legal.incarceration;
  if (!inc) return null;
  spendDays(s, 6);
  const ok = score > 0.72 - (inc.security || 1) * 0.04 && chance(score * 0.7);
  if (ok) {
    s.char.legal.incarceration = null;
    applyEffects(s, { wanted: 5, rep: { criminal: 25 }, mood: { stress: 30 } });
    logFeed(s, { en: 'You got out. Everyone is looking for you.', fr: 'Vous êtes sorti. Tout le monde vous cherche.' }, 'bad', true);
    return true;
  }
  inc.months += int(12, 48);
  inc.security = Math.min(4, (inc.security || 1) + 1);
  applyEffects(s, { mood: { stress: 24, happiness: -12 } });
  logFeed(s, { en: 'The attempt failed and the sentence grew.', fr: 'La tentative a échoué et la peine s\'est allongée.' }, 'bad', true);
  return false;
}

// ---------------------------------------------------------------- business

const BUSINESS_TYPES = [
  { id: 'cafe', capital: 12000, en: 'A small café', fr: 'Un petit café', demand: 90, price: 14, margin: 0.32, overhead: 2400, key: ['stamina', 'charisma'] },
  { id: 'shop', capital: 18000, en: 'A retail shop', fr: 'Une boutique', demand: 70, price: 32, margin: 0.28, overhead: 3200, key: ['charisma', 'discipline'] },
  { id: 'agency', capital: 6000, en: 'A one-person agency', fr: 'Une agence solo', demand: 20, price: 320, margin: 0.55, overhead: 900, key: ['creativity', 'charisma'] },
  { id: 'trade', capital: 9000, en: 'A trade business', fr: 'Une entreprise artisanale', demand: 30, price: 180, margin: 0.42, overhead: 1600, key: ['coordination', 'discipline'] }
];

function startBusiness(s, typeId) {
  const b = BUSINESS_TYPES.find(x => x.id === typeId);
  if (!b) return 'work.reqFail';
  const capital = Math.round(b.capital * country(s).col);
  if (capital > s.char.money) return FAIL.money;
  if (s.daysLeft < 5) return FAIL.days;
  s.char.money -= capital;
  ledger(s, b, -capital);
  spendDays(s, 5);
  s.char.business = {
    type: b.id, demand: b.demand, capacity: Math.round(b.demand * 0.5), pricePoint: b.price,
    margin: b.margin, overhead: Math.round(b.overhead * country(s).col), staff: 0, value: Math.round(capital * 0.7),
    cash: 0, lastProfit: 0, marketing: false
  };
  logFeed(s, { en: `Started a business: ${L(b)}.`, fr: `Création d'entreprise : ${L(b)}.` }, 'good', true);
  return null;
}

function sellBusiness(s) {
  if (!s.char.business) return;
  const v = Math.max(0, Math.round(s.char.business.value * range(0.7, 1.15)));
  s.char.money += v;
  ledger(s, { en: 'Sold the business', fr: 'Vente de l\'entreprise' }, v);
  s.char.business = null;
  logFeed(s, { en: 'Sold the business.', fr: 'Entreprise vendue.' }, 'neutral', true);
}

const INVESTMENTS = [
  { id: 'savings', drift: 0.002, vol: 0.001, en: 'Savings account', fr: 'Livret d\'épargne', min: 100 },
  { id: 'index', drift: 0.006, vol: 0.035, en: 'Index fund', fr: 'Fonds indiciel', min: 500 },
  { id: 'speculative', drift: 0.012, vol: 0.14, en: 'Speculative position', fr: 'Placement spéculatif', min: 250 }
];

function invest(s, id, amount) {
  const def = INVESTMENTS.find(i => i.id === id);
  if (!def || amount < def.min) return 'work.reqFail';
  if (amount > s.char.money) return FAIL.money;
  s.char.money -= amount;
  ledger(s, def, -amount);
  const existing = s.char.investments.find(i => i.id === id);
  if (existing) existing.value += amount;
  else s.char.investments.push({ id, value: amount, drift: def.drift, vol: def.vol });
  return null;
}

function withdrawInvestment(s, id) {
  const idx = s.char.investments.findIndex(i => i.id === id);
  if (idx < 0) return;
  const inv = s.char.investments[idx];
  s.char.money += Math.round(inv.value);
  ledger(s, { en: 'Investment withdrawal', fr: 'Retrait de placement' }, Math.round(inv.value));
  s.char.investments.splice(idx, 1);
}

// ---------------------------------------------------------------- people

function socialAction(s, npcId, kind, amount = 0) {
  const npc = s.npcs[npcId];
  const rel = s.rel[npcId];
  if (!npc || !rel) return 'work.reqFail';
  const days = kind === 'meet' ? 1 : 0;
  if (days > s.daysLeft) return FAIL.days;
  spendDays(s, days);
  rel.lastContact = s.month;
  const charm = (effAttr(s, 'charisma') + effAttr(s, 'humour') + effAttr(s, 'empathy')) / 3;
  const receptive = (npc.personality.warmth + rel.affection) / 2;

  switch (kind) {
    case 'talk':
      applyEffects(s, { needs: { social: 12 }, rel: { affection: charm > 55 ? 3 : 1, trust: 1 } }, { npcId });
      break;
    case 'meet':
      applyEffects(s, { needs: { social: 34, energy: -8 }, mood: { happiness: 5 }, money: -25,
        rel: { affection: 5 + (charm - 50) * 0.06, trust: 2, respect: 1 } }, { npcId });
      break;
    case 'help':
      applyEffects(s, { needs: { energy: -10 }, rel: { affection: 8, trust: 6, loyalty: 5 } }, { npcId });
      remember(s, npcId, 'helped_me', { weight: 1.4, decay: 'major', good: 1 });
      break;
    case 'gift': {
      if (amount > s.char.money) return FAIL.money;
      s.char.money -= amount;
      ledger(s, { en: `Gift to ${npcName(npc)}`, fr: `Cadeau à ${npcName(npc)}` }, -amount);
      const impact = clamp(amount / 40, 1, 20);
      applyEffects(s, { rel: { affection: impact, loyalty: impact * 0.6, trust: impact * 0.3 } }, { npcId });
      remember(s, npcId, 'gave_me_money', { weight: 1.6, decay: 'major', good: 1 });
      break;
    }
    case 'flirt': {
      const att = attractionOf(s, npc);
      const ok = chance(clamp(att / 130 + (rel.affection - 40) / 240, 0.05, 0.9));
      if (ok) applyEffects(s, { rel: { attraction: 12, affection: 4 }, mood: { confidence: 3 } }, { npcId });
      else { applyEffects(s, { rel: { attraction: -4, respect: -2 }, mood: { confidence: -4 } }, { npcId }); s.char.rejections++; }
      return ok ? null : 'rejected';
    }
    case 'date': {
      if (rel.attraction < 45) { s.char.rejections++; return 'rejected'; }
      rel.type = 'partner';
      applyEffects(s, { rel: { affection: 14, attraction: 8 }, mood: { happiness: 14, confidence: 6 } }, { npcId });
      logFeed(s, { en: `Started seeing ${npcName(npc)}.`, fr: `Début de relation avec ${npcName(npc)}.` }, 'good', true);
      break;
    }
    case 'family': {
      if (rel.type !== 'partner') return 'work.reqFail';
      const setup = Math.round(2200 * country(s).col);
      if (setup > s.char.money) return FAIL.money;
      if (s.daysLeft < 4) return FAIL.days;
      s.char.money -= setup;
      spendDays(s, 4);
      const child = generateNpc(s, { age: 0, role: 'child', last: s.char.last });
      child.job = null; child.income = 0; child.money = 0;
      addNpc(s, child, 'family', { affection: 85, trust: 80, respect: 60, loyalty: 80 });
      s.char.children.push({ npcId: child.id, born: s.month, dependent: true, coParent: npcId });
      applyEffects(s, { mood: { happiness: 18, stress: 12 }, needs: { energy: -20, social: 10 },
        rel: { affection: 10, loyalty: 8 },
        feed: { en: `A child, ${npcName(child)}.`, fr: `Naissance : ${npcName(child)}.` }, tone: 'good', major: true }, { npcId });
      break;
    }
    case 'cut':
      rel.type = 'ex';
      applyEffects(s, { rel: { affection: -40, trust: -20, resentment: 20 }, mood: { happiness: -6 } }, { npcId });
      remember(s, npcId, 'cut_me_off', { weight: 2, decay: 'major', good: -2 });
      break;
    case 'ask': {
      const willing = rel.trust > 55 && npc.money > 1500 && chance(clamp(rel.affection / 130, 0.05, 0.85));
      if (willing) {
        const amt = Math.min(npc.money * 0.2, 900);
        s.char.money += Math.round(amt);
        npc.money -= amt;
        ledger(s, { en: `Help from ${npcName(npc)}`, fr: `Aide de ${npcName(npc)}` }, Math.round(amt));
        applyEffects(s, { rel: { trust: -3, loyalty: 3 } }, { npcId });
        remember(s, npcId, 'lent_money', { weight: 1.5, decay: 'major', good: 0 });
        return null;
      }
      applyEffects(s, { rel: { respect: -4, affection: -2 } }, { npcId });
      return 'rejected';
    }
  }
  return null;
}

function petBuy(s, petId) {
  const p = PETS.find(x => x.id === petId);
  if (!p) return 'work.reqFail';
  const rooms = HOUSING_BY_ID[s.char.home?.id]?.rooms ?? 0;
  if (rooms < p.needsRooms) return 'work.reqFail';
  const cost = Math.round(p.cost * country(s).col);
  if (cost > s.char.money) return FAIL.money;
  s.char.money -= cost;
  s.char.pets.push({ id: p.id, upkeep: Math.round(p.upkeep * country(s).col), since: s.month });
  applyEffects(s, { mood: { happiness: p.happy, stress: p.stress } });
  logFeed(s, { en: `Got a ${L(p).toLowerCase()}.`, fr: `Nouvel animal : ${L(p).toLowerCase()}.` }, 'good');
  return null;
}

function takeTrip(s, tripId) {
  const tr = TRIPS.find(x => x.id === tripId);
  if (!tr) return 'work.reqFail';
  if (s.char.legal.incarceration || s.char.legal.wanted >= 3) return 'work.reqFail';
  const cost = Math.round(tr.cost * country(s).col);
  if (cost > s.char.money) return FAIL.money;
  if (tr.days > s.daysLeft) return FAIL.days;
  s.char.money -= cost;
  ledger(s, tr, -cost);
  spendDays(s, tr.days);
  applyEffects(s, { mood: { happiness: tr.happy, stress: tr.stress }, needs: { energy: 20, social: 15 } });
  if (chance(0.4)) meetSomeoneNew(s);
  logFeed(s, { en: `Travelled: ${L(tr).toLowerCase()}.`, fr: `Voyage : ${L(tr).toLowerCase()}.` });
  return null;
}

__def("core/time.js", function (__x, __req) {
// The simulation clock. One month at a time, in a fixed order, so that a
// consequence set up in one system lands in another.

const { BAL } = __req("config/balance.js");
const { rnd, int, range, chance, pick, clamp, gauss } = __req("core/rng.js");
const { ATTRIBUTES } = __req("data/attributes.js");
const { CONDITIONS, CONDITION_BY_ID } = __req("data/health.js");
const { CAREER_BY_ID } = __req("data/careers.js");
const { PROGRAM_BY_ID } = __req("data/education.js");
const { HOUSING_BY_ID } = __req("data/living.js");
const { country, age, monthlyIncome, monthlyCosts, taxOn, condition, effAttr, homeQuality } = __req("core/derived.js");
const { applyEffects, logFeed } = __req("core/effects.js");
const { ledger } = __req("core/state.js");
const { tickNpcs, npcName, remember } = __req("core/npc.js");
const { rollMonthEvents, queueById } = __req("core/events.js");
const { loseJob, moveOut, arrest } = __req("content/events.js");
const { L } = __req("i18n/i18n.js");

function advance(s, months) {
  const notes = [];
  for (let i = 0; i < months; i++) {
    if (s.over) break;
    stepMonth(s, notes);
  }
  s.daysLeft = BAL.start.daysPerMonth;
  return notes;
}

function stepMonth(s, notes) {
  s.month++;
  const inPrison = !!s.char.legal.incarceration;

  decayNeeds(s, inPrison);
  s.char.intox = Math.max(0, (s.char.intox || 0) - 60);
  if (s.char.fragranceMonths > 0) s.char.fragranceMonths--;

  if (inPrison) { prisonMonth(s, notes); }
  else {
    finances(s, notes);
    workMonth(s, notes);
    educationMonth(s, notes);
  }

  childrenMonth(s);
  healthMonth(s, notes);
  ageAttributes(s);
  legalMonth(s);
  tickNpcs(s, notes);
  handleNpcActions(s, notes);
  if (!inPrison || chance(0.4)) rollMonthEvents(s);
  checkEnding(s);
}

// ---------------------------------------------------------------- needs

function decayNeeds(s, inPrison) {
  const d = BAL.decay;
  const n = s.char.needs;
  const hq = homeQuality(s);
  const jobHours = s.char.job ? (CAREER_BY_ID[s.char.job.track]?.levels[s.char.job.level].hours || 40) : 0;
  const load = 1 + (jobHours - 38) / 120 + (s.char.edu.enrolled ? 0.12 : 0);

  n.hunger = clamp(n.hunger - d.hunger * (s.char.foodStocked ? 0.45 : 1));
  n.hydration = clamp(n.hydration - d.hydration * 0.55);
  n.energy = clamp(n.energy - d.energy * load * (0.6 + (100 - hq) / 220));
  n.hygiene = clamp(n.hygiene - d.hygiene * (hq < 30 ? 1.35 : 0.85));
  n.social = clamp(n.social - d.social * (inPrison ? 1.3 : 1));

  // What running on empty actually costs.
  if (n.hunger <= 2) { n.health = clamp(n.health - BAL.starvation.hungerHealth); }
  if (n.hydration <= 2) { n.health = clamp(n.health - BAL.starvation.thirstHealth); }
  if (n.energy <= 2) { n.health = clamp(n.health - BAL.starvation.energyHealth); s.char.mood.stress = clamp(s.char.mood.stress + 8); }
  if (n.hygiene < 18) s.char.rep.social = clamp(s.char.rep.social - 1.5);

  // Mood follows circumstance rather than drifting at random.
  const m = s.char.mood;
  const pressure = (100 - n.energy) * 0.12 + (100 - n.health) * 0.1 + (s.char.money < 0 ? 12 : 0)
    + (s.char.home?.kind === 'none' ? 14 : 0) + (n.social < 25 ? 8 : 0);
  const relief = (n.social > 60 ? 6 : 0) + (s.char.job ? 3 : 0) + effAttr(s, 'stressTol') * 0.06;
  m.stress = clamp(m.stress + (pressure - relief - 6) * 0.35);
  m.happiness = clamp(m.happiness + ((n.social - 45) * 0.06 + (60 - m.stress) * 0.07 + (s.char.money > 2000 ? 1 : -1)));
  m.anger = clamp(m.anger - 3 + (m.stress > 70 ? 3 : 0));
  s.char.debtStress = s.char.money < 0 ? Math.min(40, s.char.debtStress + 2) : Math.max(0, s.char.debtStress - 3);
}

// ---------------------------------------------------------------- money

function finances(s, notes) {
  const c = country(s);
  const gross = monthlyIncome(s);
  const tax = taxOn(gross, s);
  const net = gross - tax;
  if (net) { s.char.money += net; ledger(s, { en: 'Income', fr: 'Revenus' }, net); }

  const costs = monthlyCosts(s);
  s.char.money -= costs;
  if (costs) ledger(s, { en: 'Living costs', fr: 'Charges' }, -costs);

  if (s.char.foodStocked && chance(0.5)) s.char.foodStocked = false;

  // Rent that cannot be paid does not simply vanish.
  const home = s.char.home;
  if (home?.kind === 'rent' && s.char.money < 0) {
    home.missed = (home.missed || 0) + 1;
    if (home.missed >= BAL.money.evictionMonths) {
      applyEffects(s, moveOut(s));
      applyEffects(s, { mood: { stress: 22 }, trauma: chance(0.4) ? 'ruin' : null });
    } else {
      logFeed(s, { en: 'Missed the rent.', fr: 'Loyer impayé.' }, 'bad');
    }
  } else if (home?.kind === 'rent') {
    home.missed = 0;
  }

  if (s.char.money < BAL.money.creditFloor) {
    applyEffects(s, { mood: { stress: 20 }, trauma: 'ruin' });
    s.char.money = Math.round(BAL.money.creditFloor * 0.6);
    logFeed(s, { en: 'Debts were written off in the worst possible way.', fr: 'Les dettes ont été effacées de la pire manière.' }, 'bad', true);
  }

  propertiesMonth(s);
  if (s.char.business) businessMonth(s);
  if (s.char.creator) creatorMonth(s);
  for (const inv of s.char.investments || []) {
    inv.value = Math.round(inv.value * (1 + gauss(inv.drift, inv.vol)));
  }
}

function propertiesMonth(s) {
  for (const p of s.char.properties || []) {
    if (p.debt > 0) p.debt = Math.max(0, p.debt - (p.mortgage || 0) * 0.6);
    p.value = Math.max(0, Math.round(p.value * (1 + gauss(0.0022, 0.008))));
    if (p.rentedOut && chance(0.03)) {
      p.rentedOut = false;
      logFeed(s, { en: 'A tenant moved out.', fr: 'Un locataire est parti.' }, 'bad');
    }
  }
}

function businessMonth(s) {
  const b = s.char.business;
  const skillFactor = (effAttr(s, 'ambition') + effAttr(s, 'discipline') + effAttr(s, 'charisma')) / 300;
  const served = Math.min(b.demand, b.capacity);
  const revenue = Math.round(served * b.pricePoint * (0.8 + skillFactor * 0.6));
  const wages = b.staff * Math.round(2200 * country(s).wage);
  const overhead = b.overhead;
  b.lastProfit = Math.round(revenue * b.margin - wages - overhead);
  b.value = Math.max(0, Math.round(b.value * 0.98 + b.lastProfit * 2.2));
  b.demand = clamp(b.demand + gauss(0, 6) + (b.marketing ? 3 : -1) + (s.char.rep.general - 50) * 0.05, 0, 400);
  if (b.lastProfit < 0) b.cash = (b.cash || 0) + b.lastProfit;
  if (b.value <= 0 || (b.cash || 0) < -12000) {
    s.char.business = null;
    logFeed(s, { en: 'The business failed.', fr: 'L\'entreprise a fait faillite.' }, 'bad', true);
    applyEffects(s, { mood: { stress: 20, confidence: -10 }, trauma: chance(0.4) ? 'ruin' : null, rep: { professional: -8 } });
  }
}

function creatorMonth(s) {
  const cr = s.char.creator;
  const drift = cr.postedThisMonth ? range(0.98, 1.22) : range(0.86, 0.99);
  cr.audience = Math.max(0, Math.round(cr.audience * drift));
  cr.lastIncome = Math.round(cr.audience * cr.rpm / 1000);
  cr.postedThisMonth = false;
  s.char.rep.online = clamp(20 + Math.log10(Math.max(1, cr.audience)) * 14);
  if (cr.audience < 20 && chance(0.2)) { s.char.creator = null; logFeed(s, { en: 'You stopped posting.', fr: 'Vous avez arrêté de publier.' }, 'neutral'); }
}

// ---------------------------------------------------------------- work

function workMonth(s, notes) {
  const j = s.char.job;
  if (!j) return;
  const track = CAREER_BY_ID[j.track];
  const lvl = track.levels[j.level];
  j.tenure++;
  s.stats.monthsWorked++;

  const fit = (track.key.reduce((a, k) => a + effAttr(s, k), 0) / track.key.length);
  const strain = clamp((lvl.stress - effAttr(s, 'stressTol')) * 0.4 + (100 - s.char.needs.energy) * 0.2, -20, 40);
  const delta = (fit - 50) * 0.09 - strain * 0.09 + (s.char.mood.stress > BAL.work.burnoutStress ? -3 : 0);
  j.performance = clamp(j.performance + (delta > 0 ? delta * 0.6 : delta));
  s.char.mood.stress = clamp(s.char.mood.stress + lvl.stress * 0.045);

  j.salary = Math.round(j.salary * (1 + BAL.work.raisePerYear / 12));

  const promoChance = BAL.work.promoteChance * (s.char.flags.reliableAtWork ? 1.35 : 1);
  if (j.performance >= BAL.work.promoteAt && j.level < track.levels.length - 1 && chance(promoChance)) {
    const next = track.levels[j.level + 1];
    if (meetsJobReq(s, next, j.tenure)) {
      j.level++;
      j.salary = Math.round(next.pay * country(s).wage * range(0.95, 1.1));
      j.performance = 62;
      logFeed(s, { en: `Promoted to ${L(next)}.`, fr: `Promotion : ${L(next)}.` }, 'good', true);
      applyEffects(s, { rep: { professional: 6 }, mood: { confidence: 6, happiness: 6 } });
    }
  }
  if (j.performance <= BAL.work.fireAt && chance(BAL.work.fireChance)) {
    applyEffects(s, loseJob(s, 'performance'));
    applyEffects(s, { mood: { confidence: -10, stress: 14 } });
  }
}

function meetsJobReq(s, level, exp = 0) {
  if (s.char.edu.tier < (level.edu || 0)) return false;
  if (level.exp && exp < level.exp) return false;
  if (level.attrs) for (const k in level.attrs) if (effAttr(s, k) < level.attrs[k]) return false;
  return true;
}

// ---------------------------------------------------------------- education

function educationMonth(s, notes) {
  const e = s.char.edu.enrolled;
  if (!e) return;
  const prog = PROGRAM_BY_ID[e.programId];
  e.monthsInTerm++;
  if (!e.studiedThisMonth) e.gpa = Math.max(0, e.gpa - BAL.edu.absentGpaLoss * 0.5);
  e.studiedThisMonth = false;
  s.char.mood.stress = clamp(s.char.mood.stress + 2.5);

  if (e.monthsInTerm >= BAL.edu.termMonths) {
    e.monthsInTerm = 0;
    e.term++;
    const due = Math.round(prog.tuition * country(s).tuition);
    if (s.char.money >= due) { s.char.money -= due; ledger(s, { en: 'Tuition', fr: 'Frais de scolarité' }, -due); }
    else {
      logFeed(s, { en: 'Could not pay tuition. Enrolment cancelled.', fr: 'Frais de scolarité impayés. Inscription annulée.' }, 'bad', true);
      s.char.edu.enrolled = null;
      return;
    }

      s.stats.examsFailed++;

      s.char.edu.credentials.push({ id: prog.id, month: s.month, gpa: Math.round(e.gpa * 100) / 100 });
      s.char.edu.enrolled = null;
      logFeed(s, { en: `Graduated: ${L(prog)}.`, fr: `Diplôme obtenu : ${L(prog)}.` }, 'good', true);

function childrenMonth(s) {
  if (!s.char.children.length) return;
  for (const kid of s.char.children) {
    const npc = s.npcs[kid.npcId];
    if (!npc) continue;
    if (s.month % 12 === 0) npc.age++;
    if (kid.dependent && npc.age >= 18) {
      kid.dependent = false;
      logFeed(s, { en: `${npcName(npc)} moved out.`, fr: `${npcName(npc)} a quitté la maison.` }, 'neutral', true);

    s.char.needs.energy = clamp(s.char.needs.energy - deps * 5);
    s.char.mood.happiness = clamp(s.char.mood.happiness + deps * 0.8);
  }
}

// ---------------------------------------------------------------- health

function healthMonth(s, notes) {
  const a = age(s);
  const c = country(s);

  // New conditions arise from age, habits and the state of the body.
  let risk = BAL.health.illnessBase;
  risk += Math.max(0, (a - 30) ** 2) * BAL.health.ageCurve;
  risk += (100 - s.char.needs.health) * 0.0012;
  risk += (s.char.mood.stress - 50) * 0.0009;
  risk -= (effAttr(s, 'stamina') - 50) * 0.0004;

      if (s.char.conditions[s.char.conditions.length - 1].known) {
        logFeed(s, { en: `Diagnosed: ${L(cond)}.`, fr: `Diagnostic : ${L(cond)}.` }, 'bad', cond.sev >= 4);
      }
    }
  }

  for (let i = s.char.conditions.length - 1; i >= 0; i--) {
    const inst = s.char.conditions[i];
    const def = CONDITION_BY_ID[inst.id];
    if (!def) { s.char.conditions.splice(i, 1); continue; }
    if (inst.treating) {
      inst.monthlyCost = Math.round(def.treat / 12 * (1 - c.health.cover));
      inst.managed = true;
      if (def.cure && chance(def.cure * 0.22)) {
        s.char.conditions.splice(i, 1);
        logFeed(s, { en: `Recovered from ${L(def)}.`, fr: `Guérison : ${L(def)}.` }, 'good');
        continue;
      }
    } else {
      inst.managed = false;
      // Severe untreated illness is an emergency, not background attrition.
      if (def.sev >= 6 && chance(BAL.health.untreatedWorsen)) {
        s.char.needs.health = clamp(s.char.needs.health - def.sev);
      }

    if (inst.monthsLeft != null) {
      inst.monthsLeft--;
      if (inst.monthsLeft <= 0) { s.char.conditions.splice(i, 1); continue; }
    }

  // untreated illness makes you fragile long before it makes you dead.
  s.char.needs.health = clamp(s.char.needs.health + (healthTarget(s) - s.char.needs.health) * 0.09);

  for (const tr of s.char.traumas || []) {

      + (s.char.flags.inTherapy ? 0.05 : 0.012)
      + (s.char.needs.social > 60 ? 0.008 : 0)
      + (s.char.flags.hasSupport ? 0.01 : 0));

function conditionBurden(s) {

    const def = CONDITION_BY_ID[inst.id];

  return b;

  const a = age(s);

  target -= Math.max(0, 45 - s.char.needs.hygiene) * 0.12;

  target -= Math.max(0, 55 - basics) * 0.5;

  if (s.month % 6 !== 0) return;
  const a = age(s);
  const past = a - BAL.attr.peakAge;
  for (const def of ATTRIBUTES) {
    if (!def.age) continue;
    let drift = 0;
    if (past < 0) drift = 0.12 * def.age;
    else drift = -Math.pow(past / 26, 1.7) * 0.5 * def.age;
    s.char.attrs[def.k] = clamp(s.char.attrs[def.k] + drift, 1, 100);
  }

// ---------------------------------------------------------------- law

function legalMonth(s) {
  const lg = s.char.legal;
  lg.heat = Math.max(0, (lg.heat || 0) - BAL.crime.heatDecayPerMonth);
  if (lg.wanted > 0 && !lg.incarceration) {
    // Attention fades only when nothing new is happening.
    lg.lastCrimeGap = (lg.lastCrimeGap || 0) + 1;
    if (lg.lastCrimeGap >= BAL.crime.starDecayMonths && lg.heat < 0.2) {
      lg.wanted--;
      lg.lastCrimeGap = 0;
    }
    // Being wanted is not a stable state.
    if (chance(0.03 * lg.wanted)) applyEffects(s, arrest(s, lg.wanted));
  }
}

function prisonMonth(s, notes) {
  const inc = s.char.legal.incarceration;
  inc.served++;
  s.stats.monthsInPrison++;
  const n = s.char.needs;
  n.hunger = Math.max(n.hunger, 48);
  n.hydration = Math.max(n.hydration, 55);
  n.hygiene = Math.max(n.hygiene, 38);
  n.energy = Math.max(n.energy, 45);
  s.char.needs.social = clamp(s.char.needs.social - 4);
  s.char.mood.stress = clamp(s.char.mood.stress + 3 - (inc.safety || 0) * 0.1);
  if (inc.served >= inc.months) {
    s.char.legal.incarceration = null;
    logFeed(s, { en: 'Released.', fr: 'Libéré.' }, 'neutral', true);
    applyEffects(s, { mood: { happiness: 10, stress: -10 }, rep: { criminal: 4 } });
  }
}

// ---------------------------------------------------------------- npc results

function handleNpcActions(s, notes) {
  for (const act of notes.splice(0, notes.length)) {
    const npc = s.npcs[act.npcId];
    if (!npc) continue;
    const name = npcName(npc);
    switch (act.type) {
      case 'npc_contact':
        s.rel[npc.id].lastContact = s.month;
        s.char.needs.social = clamp(s.char.needs.social + 8);
        logFeed(s, { en: `${name} got in touch.`, fr: `${name} a pris de vos nouvelles.` });
        break;
      case 'npc_favour':
        logFeed(s, { en: `${name} has been asking around for help.`, fr: `${name} cherche de l'aide autour de lui.` });
        break;
      case 'npc_offer':
        if (chance(0.5)) {
          const amt = int(200, 800);
          s.char.money += amt;
          ledger(s, { en: `Help from ${name}`, fr: `Aide de ${name}` }, amt);
          remember(s, npc.id, 'helped_you', { weight: 1.5, decay: 'major', good: 1 });
          logFeed(s, { en: `${name} sent money without being asked.`, fr: `${name} a envoyé de l'argent sans qu'on lui demande.` }, 'good');
        }
        break;
      case 'npc_news':
        if (act.news === 'promotion') logFeed(s, { en: `${name} was promoted.`, fr: `${name} a été promu.` });
        if (act.news === 'arrested') logFeed(s, { en: `${name} was arrested.`, fr: `${name} a été arrêté.` }, 'bad');
        if (act.news === 'released') logFeed(s, { en: `${name} is out.`, fr: `${name} est sorti.` });
        if (act.news === 'partnered') logFeed(s, { en: `${name} is seeing someone.`, fr: `${name} est en couple.` });
        break;
      case 'npc_conflict':
        s.rel[npc.id].affection = clamp(s.rel[npc.id].affection - 12);
        s.char.rep.social = clamp(s.char.rep.social - 3);
        logFeed(s, { en: `${name} has been telling people their version of things.`, fr: `${name} raconte sa version des faits.` }, 'bad');
        break;
    }
  }
}

// ---------------------------------------------------------------- endings

function checkEnding(s) {
  const a = age(s);
  if (s.char.needs.health <= BAL.starvation.deathAt) {
    const neglect = s.char.needs.hunger < 5 || s.char.needs.hydration < 5;
    return end(s, neglect ? 'neglect' : 'health');
  }
  // Mortality rises with age, health and the life that was led.
  if (a >= 50) {
    let p = Math.pow((a - 45) / 40, 3.4) * BAL.health.mortality;
    p *= (125 - s.char.needs.health) / 70;
    p *= 1 + s.char.conditions.reduce((x, c) => x + (CONDITION_BY_ID[c.id]?.sev || 0) * (c.managed ? 0.02 : 0.06), 0);
    if (chance(p)) return end(s, 'age');
  }
  if (a >= BAL.win.age) return end(s, 'win');
}

function end(s, cause) {
  s.over = { cause, month: s.month, age: age(s) };
  logFeed(s, cause === 'win'
    ? { en: 'You reached eighty.', fr: 'Vous avez atteint quatre-vingts ans.' }
    : { en: 'The life ended here.', fr: 'La vie s\'est arrêtée là.' }, cause === 'win' ? 'good' : 'bad', true);
}

// ---------------------------------------------------------------- real time

let idleTotal = 0;
function passiveTick(s) {
  if (!s || s.over) return false;
  if (idleTotal >= BAL.decay.idleSessionCap) return false;
  const d = BAL.decay.idlePerTick;
  idleTotal += d;
  s.char.needs.hunger = clamp(s.char.needs.hunger - d);
  s.char.needs.hydration = clamp(s.char.needs.hydration - d * 1.2);
  s.char.needs.energy = clamp(s.char.needs.energy - d * 0.4);
  return true;
}
function resetIdle() { idleTotal = 0; }

  __x.conditionBurden = conditionBurden;
  __x.healthTarget = healthTarget;
  __x.end = end;
  __x.passiveTick = passiveTick;
  __x.resetIdle = resetIdle;

// The event engine. Events are data; this file decides which of them the
// current life is capable of producing, and in what order.

const { BAL } = __req("config/balance.js");
const { rnd, chance, pick, weighted, clamp } = __req("core/rng.js");
const { lifeActivity } = __req("core/derived.js");
const { EVENTS, EVENT_BY_ID } = __req("content/events.js");
const { meetsReq, applyEffects } = __req("core/effects.js");

function onCooldown(s, ev) {
  const last = s.cooldowns[ev.id];
  if (last == null) return false;
  const cd = ev.cooldown ?? BAL.events.defaultCooldown;
  return (s.month - last) < cd;
}

// Pull an NPC matching the event's requirement into the event context.
function resolveNpc(s, want) {
  const entries = Object.entries(s.rel).filter(([id]) => s.npcs[id]?.alive && !s.npcs[id].jail);
  if (!entries.length) return null;
  let pool = entries;
  if (want === 'partner') pool = entries.filter(([, r]) => r.type === 'partner');
  else if (want === 'friend') pool = entries.filter(([, r]) => r.type === 'friend' || r.affection > 55);
  else if (want === 'family') pool = entries.filter(([, r]) => r.type === 'family');
  else if (want === 'close') pool = entries.filter(([, r]) => r.affection > 60);
  else if (want === 'hostile') pool = entries.filter(([, r]) => r.resentment > 55);
  if (!pool.length) return null;
  return pick(pool)[0];
}

function candidateEvents(s) {
  const out = [];
  for (const ev of EVENTS) {
    if (ev.once && s.chains['done:' + ev.id]) continue;
    if (onCooldown(s, ev)) continue;
    if (ev.req && !meetsReq(s, ev.req)) continue;
    if (ev.cond && !ev.cond(s)) continue;
    let npcId = null;
    if (ev.npc) {
      npcId = resolveNpc(s, ev.npc);
      if (!npcId) continue;
    }
    const w = typeof ev.weight === 'function' ? ev.weight(s) : (ev.weight ?? 1);
    if (w <= 0) continue;
    out.push({ ev, weight: w, npcId });
  }
  return out;
}

// How many events a single month should produce, given how busy the life is.
function eventCountForMonth(s) {
  const load = BAL.events.perMonthBase + lifeActivity(s) * 0.28;
  const lambda = Math.min(BAL.events.perMonthMax, load);
  let n = 0;
  if (rnd() < lambda) n++;
  if (rnd() < lambda - 1) n++;
  if (rnd() < lambda - 2) n++;
  return n;
}

function rollMonthEvents(s) {
  const n = eventCountForMonth(s);
  const queued = [];
  for (let i = 0; i < n; i++) {
    if (s.queue.length >= BAL.events.maxQueued) break;
    const cands = candidateEvents(s).filter(c => !s.queue.some(q => q.id === c.ev.id));
    const chosen = weighted(cands);
    if (!chosen) break;
    queue(s, chosen.ev, { npcId: chosen.npcId });
    queued.push(chosen.ev.id);
  }
  return queued;
}

function queue(s, ev, ctx = {}) {
  if (typeof ev === 'string') ev = EVENT_BY_ID[ev];
  if (!ev) return;
  s.cooldowns[ev.id] = s.month;
  if (ev.once) s.chains['done:' + ev.id] = s.month;
  s.queue.push({ id: ev.id, month: s.month, ctx });
  s.queue.sort((a, b) => a.month - b.month);
}

function queueById(s, id, ctx = {}) { queue(s, EVENT_BY_ID[id], ctx); }

function nextEvent(s) {
  for (let i = 0; i < s.queue.length; i++) {
    const item = s.queue[i];
    if (item.month > s.month) continue; // chained events wait their turn
    const ev = EVENT_BY_ID[item.id];
    if (!ev) { s.queue.splice(i, 1); i--; continue; }
    // Circumstances may have moved on since the event was queued.
    if (ev.stillValid && !ev.stillValid(s, item.ctx)) { s.queue.splice(i, 1); i--; continue; }
    return { ev, ctx: item.ctx, index: i };
  }
  return null;
}

function popEvent(s, index = 0) { return s.queue.splice(index, 1)[0]; }

function pendingCount(s) { return s.queue.filter(q => q.month <= s.month).length; }

// Applies a choice and returns the text to show as the outcome.
function resolveChoice(s, ev, choice, ctx, score = null) {
  const c2 = { ...ctx, score };
  let eff = choice.eff;
  if (typeof eff === 'function') eff = eff(s, c2);
  applyEffects(s, eff, c2);
  if (choice.chain) {
    const delay = choice.chainDelay ?? 0;
    const target = EVENT_BY_ID[choice.chain];
    if (target) {
      s.queue.push({ id: choice.chain, month: s.month + delay, ctx: c2 });
      s.queue.sort((a, b) => a.month - b.month);
      s.cooldowns[choice.chain] = s.month;
    }
  }
  const res = typeof choice.result === 'function' ? choice.result(s, c2) : choice.result;
  return res;
}

function availableChoices(s, ev, ctx) {
  return (ev.choices || []).filter(c => {
    if (c.req && !meetsReq(s, c.req)) return false;
    if (c.cond && !c.cond(s, ctx)) return false;
    return true;
  });
}

      },
      { label: { en: 'Keep walking', fr: 'Continuer' }, eff: { mood: { happiness: -3 }, attrs: { empathy: -0.3 } }, result: { en: 'You think about it on the bus.', fr: 'Vous y repensez dans le bus.' } }
    ]
  }
];

// ---------------------------------------------------------------- helpers

function billAmount(s) {
  const scaled = Math.min(1500, Math.abs(s.char.money) * 0.04);
  return Math.round((300 + scaled) * country(s).col * range(0.7, 1.6));
}

function raise(s, pct) {
  if (!s.char.job) return null;
  s.char.job.salary = Math.round(s.char.job.salary * (1 + pct));
  return { feed: { en: 'Got a raise.', fr: 'Augmentation obtenue.' }, tone: 'good' };
}

function loseJob(s, reason) {
  if (!s.char.job) return null;
  s.char.jobHistory.push({ ...s.char.job, endedMonth: s.month, reason });
  s.char.job = null;
  return { feed: { en: 'Lost your job.', fr: 'Emploi perdu.' }, tone: 'bad', major: true, rep: { professional: -5 } };
}

function arrest(s, wanted) {
  const c = country(s);
  const months = Math.max(1, Math.round(wanted * 4 * c.law.severity * range(0.7, 1.4)));
  s.char.legal.incarceration = { months, served: 0, security: Math.min(3, Math.ceil(wanted / 2)), paroleEligible: Math.round(months * c.law.paroleAt) };
  s.char.legal.wanted = 0;
  s.char.legal.record.push({ month: s.month, months });
  s.stats.arrests++;
  if (s.char.job) loseJob(s, 'arrested');
  return { feed: { en: 'Arrested and sentenced.', fr: 'Arrêté et condamné.' }, tone: 'bad', major: true, trauma: 'prison', rep: { criminal: 10, general: -12, professional: -10 } };
}

function moveOut(s) {
  s.char.home = { id: 'street', kind: 'none', rent: 0, missed: 0 };
  return { feed: { en: 'Lost your housing.', fr: 'Perte du logement.' }, tone: 'bad', major: true };
}

function rememberGood(s, id, tag, w = 1) { remember(s, id, tag, { weight: w, decay: 'normal', good: 1 }); return null; }
function rememberBad(s, id, tag, w = 1) { remember(s, id, tag, { weight: w, decay: 'normal', good: -1 }); return null; }

function catchSti(s) {
  const has = s.char.conditions.some(c => c.id === 'sti');
  if (!has) s.char.conditions.push({ id: 'sti', since: s.month, treating: false, managed: false, known: false, monthlyCost: 0 });
  return null;
}

// Placed here so events can introduce people; the real generator lives in npc.js
let _meet = null;
function bindMeet(fn) { _meet = fn; }
function meetSomeone(s) { return _meet ? _meet(s) : null; }

const EVENT_BY_ID = Object.fromEntries(EVENTS.map(e => [e.id, e]));

  __x.loseJob = loseJob;
  __x.arrest = arrest;
  __x.moveOut = moveOut;
  __x.bindMeet = bindMeet;
  __x.EVENTS = EVENTS;
  __x.EVENT_BY_ID = EVENT_BY_ID;
});

__def("ui/components.js", function (__x, __req) {
// Small DOM helpers. No framework, no build step — the game has to run from a
// static folder on GitHub Pages.

const { t, L } = __req("i18n/i18n.js");

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function btn(label, cls = 'btn', onClick) {
  const b = el('button', cls, label);
  b.type = 'button';
  if (onClick) b.onclick = onClick;
  return b;
}

function panel(title, ...body) {
  const p = el('section', 'panel');
  if (title) {
    const h = el('div', 'panel-head');
    h.append(el('h2', null, title));
    p.append(h);
  }
  const b = el('div', 'panel-body');
  for (const n of body) if (n) b.append(n);
  p.append(b);
  return p;
}

function meter(label, value, opts = {}) {
  const cls = value < 25 ? 'is-low' : value < 55 ? 'is-mid' : 'is-good';
  const m = el('div', 'meter ' + (opts.plain ? '' : cls));
  m.append(el('div', 'lbl', label));
  m.append(el('div', 'val', opts.text ?? Math.round(value) + '%'));
  const track = el('div', 'track');
  const fill = el('div', 'fill');
  fill.style.width = Math.max(0, Math.min(100, value)) + '%';
  if (opts.color) fill.style.background = opts.color;
  track.append(fill);
  m.append(track);
  return m;
}

function kv(k, v, cls) {
  const row = el('div', 'kv');
  row.append(el('div', 'k', k));
  const val = el('div', 'v' + (cls ? ' ' + cls : ''), v);
  row.append(val);
  return row;
}

function row({ title, meta, end, onClick, disabled, tags }) {
  const node = el(onClick ? 'button' : 'div', 'row');
  if (onClick) { node.type = 'button'; node.onclick = onClick; }
  if (disabled) node.disabled = true;
  const grow = el('div', 'grow');
  grow.append(el('div', 'title', title));
  if (tags && tags.length) {
    const tw = el('div');
    for (const tg of tags) tw.append(el('span', 'tag' + (tg.kind ? ' ' + tg.kind : ''), tg.text));
    grow.append(tw);
  }
  if (meta) grow.append(el('div', 'meta', meta));
  node.append(grow);
  if (end != null) node.append(el('div', 'end', end));
  return node;
}

function fold(summary, ...body) {
  const d = el('details', 'fold');
  d.append(el('summary', null, summary));
  const b = el('div', 'fold-body');
  for (const n of body) if (n) b.append(n);
  d.append(b);
  return d;
}

function field(labelText, control) {
  const l = el('label', 'field');
  l.append(el('span', null, labelText));
  l.append(control);
  return l;
}

function segmented(options, current, onPick) {
  const wrap = el('div', 'seg');
  for (const o of options) {
    const b = el('button', null, o.label);
    b.type = 'button';
    b.setAttribute('aria-pressed', String(o.value === current));
    b.onclick = () => onPick(o.value);
    wrap.append(b);
  }
  return wrap;
}

// ---------------------------------------------------------------- overlay

const overlay = () => document.getElementById('overlay');

function openModal(build, opts = {}) {
  const ov = overlay();
  ov.innerHTML = '';
  ov.hidden = false;
  const m = el('div', 'modal');
  m.setAttribute('role', 'dialog');
  m.setAttribute('aria-modal', 'true');
  ov.append(m);
  const api = {
    node: m,
    close() { ov.hidden = true; ov.innerHTML = ''; if (opts.onClose) opts.onClose(); }
  };
  if (opts.dismissable !== false) {
    ov.onclick = (e) => { if (e.target === ov) api.close(); };
  } else {
    ov.onclick = null;
  }
  build(m, api);
  const focusable = m.querySelector('button, input, select');
  if (focusable) focusable.focus();
  return api;
}

function closeModal() {
  const ov = overlay();
  ov.hidden = true;
  ov.innerHTML = '';
}

function confirmModal({ title, body, confirmLabel, danger, onConfirm }) {
  return openModal((m, api) => {
    m.append(el('h2', null, title));
    if (body) m.append(el('p', 'prose small', body));
    const choices = el('div', 'choices');
    choices.append(btn(confirmLabel || t('common.confirm'), 'btn ' + (danger ? 'btn-danger' : 'btn-primary'), () => {
      api.close();
      onConfirm();
    }));
    choices.append(btn(t('common.cancel'), 'btn btn-quiet', () => api.close()));
    m.append(choices);
  });
}

function infoModal(title, body, onClose) {
  return openModal((m, api) => {
    m.append(el('h2', null, title));
    if (body) m.append(el('p', 'prose small', body));
    const choices = el('div', 'choices');
    choices.append(btn(t('common.continue'), 'btn btn-primary', () => { api.close(); if (onClose) onClose(); }));
    m.append(choices);
  }, { dismissable: false });
}

// ---------------------------------------------------------------- toast

function toast(message, kind = '') {
  const stack = document.getElementById('toast');
  const node = el('div', 'toast ' + kind, message);
  stack.append(node);
  setTimeout(() => node.remove(), 2600);
}

function toastKey(key, kind = '') { toast(t(key), kind); }

  __x.el = el;
  __x.btn = btn;
  __x.panel = panel;
  __x.meter = meter;
  __x.kv = kv;
  __x.row = row;
  __x.fold = fold;
  __x.field = field;
  __x.segmented = segmented;
  __x.openModal = openModal;
  __x.closeModal = closeModal;
  __x.confirmModal = confirmModal;
  __x.infoModal = infoModal;
  __x.toast = toast;
  __x.toastKey = toastKey;
});

__def("minigames/index.js", function (__x, __req) {
// Minigames. Each returns a promise resolving to a blended score in 0..1:
// how the player did, weighted with what the character is capable of, adjusted
// for the state their body is in. A skilled player still gains an edge; a
// wrecked character still drags the result down.

const { t, L } = __req("i18n/i18n.js");
const { BAL } = __req("config/balance.js");
const { int, range, chance, pick, shuffle, clamp } = __req("core/rng.js");

const TYPES = ['math', 'memory', 'pattern', 'observe', 'timing', 'words', 'logic', 'alloc'];
const MINIGAME_TYPES = TYPES;

// host: an element to render into. Resolves { score, raw, gaveUp }.
function runMinigame(host, type, opts = {}) {
  const cfg = {
    difficulty: clamp(opts.difficulty ?? 0.5, 0, 1),
    charSkill: clamp(opts.charSkill ?? 50, 1, 100) / 100,
    vision: opts.vision ?? 0,
    condition: opts.condition ?? 1,
    ...opts
  };
  const game = GAMES[TYPES.includes(type) ? type : pick(TYPES)];
  return new Promise((resolve) => {
    let settled = false;
    const finish = (raw, meta = {}) => {
      if (settled) return;      // a fast double tap must not resolve twice
      settled = true;
      const p = clamp(raw, 0, 1);
      const score = clamp(
        BAL.minigame.playerWeight * p + BAL.minigame.charWeight * cfg.charSkill * cfg.condition,
        0, 1
      );
      resolve({ score, raw: p, ...meta });
    };
    host.innerHTML = '';
    game(host, cfg, finish);
  });
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function header(host, titleKey, helpKey) {
  const h = el('h2', null, t(titleKey));
  const p = el('p', 'hint', t(helpKey));
  host.append(h, p);
}

function timerBar(host, ms, onEnd) {
  const wrap = el('div', 'mg-timer');
  const bar = el('i');
  wrap.append(bar);
  host.append(wrap);
  const start = performance.now();
  let raf;
  const step = (now) => {
    const left = Math.max(0, 1 - (now - start) / ms);
    bar.style.width = (left * 100) + '%';
    if (left <= 0) { onEnd(); return; }
    raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
  return () => cancelAnimationFrame(raf);
}

// ---------------------------------------------------------------- math
function mathGame(host, cfg, done) {
  header(host, 'mg.math.title', 'mg.math.help');
  const stage = el('div', 'mg-stage');
  const prompt = el('div', 'mg-prompt');
  const grid = el('div', 'mg-grid c2');
  const progress = el('div', 'mg-progress');
  const total = 8;
  let i = 0, correct = 0, stop = null, locked = false, over = false;

  const ms = (16000 + cfg.charSkill * 9000) * cfg.condition;
  stop = timerBar(host, ms, () => finish());
  stage.append(prompt, grid);
  host.append(stage, progress);

  function makeQ() {
    if (over || i >= total) return;
    locked = false;
    const hard = cfg.difficulty;
    const a = int(2, Math.round(9 + hard * 40));
    const b = int(2, Math.round(6 + hard * 22));
    const ops = hard > 0.55 ? ['+', '-', '\u00d7'] : ['+', '-'];
    const op = pick(ops);
    const ans = op === '+' ? a + b : op === '-' ? a - b : a * b;
    prompt.textContent = `${a} ${op} ${b}`;
    const opts = shuffle([ans, ans + int(1, 4), ans - int(1, 5), ans + int(6, 14)]);
    grid.innerHTML = '';
    for (const o of opts) {
      const c = el('button', 'mg-cell', String(o));
      c.type = 'button';
      c.onclick = () => {
        if (locked || over) return;
        locked = true;
        if (o === ans) { correct++; c.classList.add('hit'); } else c.classList.add('miss');
        i++;
        if (i >= total) finish(); else setTimeout(makeQ, 120);
        progress.textContent = t('mg.score', { n: correct, total });
      };
      grid.append(c);
    }
  }
  function finish() {
    if (over) return;
    over = true;
    if (stop) stop();
    done(correct / total, { detail: `${correct}/${total}` });
  }
  progress.textContent = t('mg.score', { n: 0, total });
  makeQ();
}

// ---------------------------------------------------------------- memory
function memoryGame(host, cfg, done) {
  header(host, 'mg.memory.title', 'mg.memory.help');
  const len = Math.round(4 + cfg.difficulty * 4);
  const cells = [];
  const grid = el('div', 'mg-grid c3');
  for (let i = 0; i < 9; i++) {
    const c = el('button', 'mg-cell', '');
    c.type = 'button';
    c.disabled = true;
    cells.push(c);
    grid.append(c);
  }
  const progress = el('div', 'mg-progress');
  host.append(grid, progress);

  const seq = Array.from({ length: len }, () => int(0, 8));
  let shown = 0, entered = 0, correct = 0, over = false;
  const showMs = Math.max(320, 720 - cfg.difficulty * 300);

  function showNext() {
    if (shown >= seq.length) { startInput(); return; }
    const c = cells[seq[shown]];
    c.classList.add('lit');
    setTimeout(() => { c.classList.remove('lit'); shown++; setTimeout(showNext, 160); }, showMs);
  }
  function startInput() {
    progress.textContent = t('mg.memory.help');
    cells.forEach((c, idx) => {
      c.disabled = false;
      c.onclick = () => {
        if (over || entered >= seq.length) return;
        const ok = idx === seq[entered];
        if (ok) correct++;
        c.classList.add(ok ? 'hit' : 'miss');
        setTimeout(() => c.classList.remove('hit', 'miss'), 200);
        entered++;
        progress.textContent = t('mg.score', { n: correct, total: seq.length });
        if (entered >= seq.length) { over = true; done(correct / seq.length, { detail: `${correct}/${seq.length}` }); }
      };
    });
  }
  progress.textContent = '\u2026';
  setTimeout(showNext, 500);
}

// ---------------------------------------------------------------- pattern
function patternGame(host, cfg, done) {
  header(host, 'mg.pattern.title', 'mg.pattern.help');
  const rounds = 5;
  const prompt = el('div', 'mg-prompt');
  const grid = el('div', 'mg-grid c4');
  const progress = el('div', 'mg-progress');
  host.append(prompt, grid, progress);
  let i = 0, correct = 0, locked = false, over = false;

  function build() {
    if (over || i >= rounds) return;
    locked = false;
    const kind = cfg.difficulty > 0.6 ? pick(['add', 'mul', 'alt', 'fib']) : pick(['add', 'mul', 'alt']);
    let seq = [], next;
    const a = int(1, 9), d = int(2, 7);
    if (kind === 'add') { seq = [a, a + d, a + 2 * d, a + 3 * d]; next = a + 4 * d; }
    else if (kind === 'mul') { const r = int(2, 3); seq = [a, a * r, a * r * r, a * r * r * r]; next = a * r ** 4; }
    else if (kind === 'alt') { seq = [a, a + d, a + 1, a + d + 1]; next = a + 2; }
    else { seq = [a, a + d, a + a + d, a + d + a + a + d]; next = seq[2] + seq[3]; }
    prompt.textContent = seq.join('   ') + '   ?';
    const opts = shuffle([next, next + int(1, 5), next - int(1, 6), Math.round(next * range(1.2, 1.8))]);
    grid.innerHTML = '';
    for (const o of opts) {
      const c = el('button', 'mg-cell', String(o));
      c.type = 'button';
      c.onclick = () => {
        if (locked || over) return;
        locked = true;
        if (o === next) { correct++; c.classList.add('hit'); } else c.classList.add('miss');
        i++;
        progress.textContent = t('mg.score', { n: correct, total: rounds });
        if (i >= rounds) { over = true; done(correct / rounds, { detail: `${correct}/${rounds}` }); }
        else setTimeout(build, 160);
      };
      grid.append(c);
    }
  }
  progress.textContent = t('mg.score', { n: 0, total: rounds });
  build();
}

// ---------------------------------------------------------------- observe
function observeGame(host, cfg, done) {

// ---------------------------------------------------------------- timing
function timingGame(host, cfg, done) {
  header(host, 'mg.timing.title', 'mg.timing.help');
  const rounds = 4;
  const bar = el('div', 'mg-bar');
  const zone = el('div', 'zone');
  const cursor = el('div', 'cursor');
  bar.append(zone, cursor);
  const btn = el('button', 'btn btn-primary btn-block', t('mg.stop'));
  btn.type = 'button';
  const progress = el('div', 'mg-progress');
  host.append(bar, el('div', 'sep'), btn, progress);

  let i = 0, total = 0, raf = null, dir = 1, pos = 0, over = false;
  const zoneW = Math.max(8, 26 - cfg.difficulty * 16);
  const speed = 0.9 + cfg.difficulty * 1.5;

  function build() {
    if (over || i >= rounds) return;
    const zStart = range(6, 94 - zoneW);
    zone.style.left = zStart + '%';
    zone.style.width = zoneW + '%';
    pos = 0; dir = 1;
    const loop = () => {
      pos += dir * speed;
      if (pos >= 100) { pos = 100; dir = -1; }
      if (pos <= 0) { pos = 0; dir = 1; }
      cursor.style.left = pos + '%';
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    btn.onclick = () => {
      if (over) return;
      cancelAnimationFrame(raf);
      const centre = zStart + zoneW / 2;
      const dist = Math.abs(pos - centre);
      const hit = dist <= zoneW / 2;
      total += hit ? clamp(1 - dist / (zoneW / 2) * 0.4, 0.6, 1) : 0;
      i++;
      progress.textContent = `${Math.round(total * 10) / 10} / ${rounds}`;
      if (i >= rounds) { over = true; done(total / rounds, { detail: `${Math.round(total * 100) / 100}` }); }
      else setTimeout(build, 180);
    };
  }
  build();
}

// ---------------------------------------------------------------- words
const WORD_ITEMS = {

// ---------------------------------------------------------------- logic
function logicGame(host, cfg, done) {
  header(host, 'mg.pattern.title', 'mg.pattern.help');
  const rounds = 4;
  const prompt = el('div', 'prose small');
  const list = el('div', 'list');
  const progress = el('div', 'mg-progress');
  host.append(el('div', 'sep'), prompt, list, progress);
  let i = 0, correct = 0, locked = false, over = false;
  const fr = document.documentElement.lang === 'fr';

  function build() {
    if (over || i >= rounds) return;
    locked = false;
    const a = int(2, 9), b = int(2, 9), c = int(2, 9);
    const kinds = [
      () => {
        const ok = a * b > c * 2;
        return {
          q: fr ? `Chaque caisse contient ${a} pièces. Il y a ${b} caisses. Le seuil est ${c * 2}.`
                : `Each crate holds ${a} parts. There are ${b} crates. The threshold is ${c * 2}.`,
          opts: [
            { txt: fr ? 'Le seuil est dépassé' : 'The threshold is exceeded', ok },
            { txt: fr ? 'Le seuil n\'est pas atteint' : 'The threshold is not met', ok: !ok },
            { txt: fr ? 'On ne peut pas conclure' : 'It cannot be determined', ok: false }
          ]
        };
      },
      () => {
        const ok = (a + b) % 2 === 0;
        return {
          q: fr ? `Un lot de ${a + b} unités doit être partagé en deux parts égales et entières.`
                : `A batch of ${a + b} units must split into two equal whole shares.`,
          opts: [
            { txt: fr ? 'C\'est possible' : 'It is possible', ok },
            { txt: fr ? 'C\'est impossible' : 'It is impossible', ok: !ok },
            { txt: fr ? 'Cela dépend du lot' : 'It depends on the batch', ok: false }
          ]
        };
      },
      () => {
        const ok = c > a;
        return {
          q: fr ? `Toute livraison de plus de ${a} jours est en retard. Celle-ci a pris ${c} jours.`
                : `Any delivery over ${a} days is late. This one took ${c} days.`,
          opts: [
            { txt: fr ? 'Elle est en retard' : 'It is late', ok },
            { txt: fr ? 'Elle est à l\'heure' : 'It is on time', ok: !ok },
            { txt: fr ? 'La règle ne s\'applique pas' : 'The rule does not apply', ok: false }
          ]
        };
      }
    ];
    const q = pick(kinds)();
    prompt.textContent = q.q;
    list.innerHTML = '';
    for (const o of shuffle(q.opts)) {
      const btn = el('button', 'row', null);
      btn.type = 'button';
      const g = el('div', 'grow');
      g.append(el('div', 'title', o.txt));
      btn.append(g);
      btn.onclick = () => {
        if (locked || over) return;
        locked = true;
        if (o.ok) correct++;
        i++;
        progress.textContent = t('mg.score', { n: correct, total: rounds });
        if (i >= rounds) { over = true; done(correct / rounds, { detail: `${correct}/${rounds}` }); }
        else setTimeout(build, 150);
      };
      list.append(btn);
    }
  }
  progress.textContent = t('mg.score', { n: 0, total: rounds });
  build();
}

// ---------------------------------------------------------------- alloc
function allocGame(host, cfg, done) {
  header(host, 'mg.alloc.title', 'mg.alloc.help');
  const fr = document.documentElement.lang === 'fr';
  const budget = 100;
  const needs = [
    { name: fr ? 'Urgent' : 'Urgent', want: int(20, 55), w: 1.4 },
    { name: fr ? 'Important' : 'Important', want: int(15, 45), w: 1.0 },
    { name: fr ? 'Peut attendre' : 'Can wait', want: int(10, 35), w: 0.5 }
  ];
  const alloc = [34, 33, 33];
  const wrap = el('div', 'panel-body');
  const progress = el('div', 'mg-progress');

  function render() {
    wrap.innerHTML = '';
    needs.forEach((n, idx) => {
      const row = el('div', 'meter');
      row.append(el('div', 'lbl', n.name), el('div', 'val', alloc[idx] + '%'));
      const track = el('div', 'track');
      const fill = el('div', 'fill');
      fill.style.width = alloc[idx] + '%';
      track.append(fill);
      row.append(track);
      const ctrl = el('div', 'btn-row');
      for (const step of [-10, -5, 5, 10]) {
        const b = el('button', 'btn btn-sm', (step > 0 ? '+' : '') + step);
        b.type = 'button';
        b.onclick = () => {
          const next = clamp(alloc[idx] + step, 0, 100);
          const diff = next - alloc[idx];
          const other = idx === 0 ? 1 : 0;
          if (alloc[other] - diff < 0) return;
          alloc[idx] = next; alloc[other] -= diff;
          render();
        };
        ctrl.append(b);
      }
      wrap.append(row, ctrl, el('div', 'sep'));
    });
    const used = alloc.reduce((a, b) => a + b, 0);
    progress.textContent = `${used} / ${budget}`;
  }
  const submit = el('button', 'btn btn-primary btn-block', t('common.confirm'));
  submit.type = 'button';
  let allocDone = false;
  submit.onclick = () => {
    if (allocDone) return;
    allocDone = true;
    let score = 0, maxScore = 0;
    needs.forEach((n, idx) => {
      const fit = 1 - Math.min(1, Math.abs(alloc[idx] - n.want) / 50);
      score += fit * n.w;
      maxScore += n.w;
    });
    done(score / maxScore, { detail: alloc.join('/') });
  };
  host.append(wrap, submit, progress);
  render();
}

const GAMES = {
  math: mathGame, memory: memoryGame, pattern: patternGame, observe: observeGame,
  timing: timingGame, words: wordsGame, logic: logicGame, alloc: allocGame
};
