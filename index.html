Race.build();

/* ============================================================================
   11. RUN — the game itself: speed, distance, collision, respawn, finale
   ========================================================================== */
var Run = {
  distance: 0, mult: 1, speedTimer: 0, collisions: 0, playT: 0,
  hudPulse: 0, milestone: 0,
  finalActive: false, finalStart: 0,
  wall: null, seq: null, lineAcc: 0,
  countT: 0, countIdx: 0,

  /* ---------- lifecycle ---------- */
  begin: function () {
    this.distance = 0; this.mult = 1; this.speedTimer = 0; this.collisions = 0;
    this.hudPulse = 0; this.milestone = 0;
    this.playT = 0; this.finalActive = false; this.finalStart = 0;
    this.wall = null; this.seq = null; this.lineAcc = 0;
    Obstacles.clear(); VFX.clear();
    Race.reset();
    Gen.reset(0);
    Input.releaseAll();
    this.startCountdown(true);
  },
  startCountdown: function (full) {
    this.countIdx = full ? 0 : 3;
    this.countT = 0;
    App.set(ST.COUNTDOWN);
    Sound.play(this.countIdx === 3 ? 'go' : 'count');
  },
  countLabel: function () {
    return ['3', '2', '1', t('go')][clamp(this.countIdx, 0, 3)];
  },

  speedN: function () { return CFG.BASE_SPEED * this.mult / CFG.METERS_VISIBLE; },
  /* what the camera is actually doing, which is what the HUD reports */
  shownMult: function () { return this.mult * (Player ? Player.speedScale() : 1); },

  /* ---------- per frame ---------- */
  update: function (dt) {
    if (App.state === ST.COUNTDOWN) {
      /* nobody races until GO — but they do roll up onto the grid */
      Race.updateEntry(dt);
      for (var i = 0; i < Race.racers.length; i++) Race.racers[i].update(dt, false);
      this.countT += dt;
      while (this.countT >= CFG.COUNT_STEP) {
        this.countT -= CFG.COUNT_STEP;
        this.countIdx++;
        if (this.countIdx >= 4) {
          this.countT = 0;
          /* six racers start shoulder to shoulder: give the grid a moment to
             spread before anyone can be shoved out of it */
          for (var g = 0; g < Race.racers.length; g++) {
            Race.racers[g].immune = CFG.GRID_IMMUNITY;
          }
          App.set(ST.PLAYING);
          return;
        }
        Sound.play(this.countIdx === 3 ? 'go' : 'count');
      }
      return;
    }

    if (App.state === ST.FINISH || App.state === ST.COMPLETED) { this.updateFinish(dt); return; }
    if (App.state !== ST.PLAYING && App.state !== ST.RESPAWNING) return;

    this.playT += dt;
    if (this.hudPulse > 0) this.hudPulse = Math.max(0, this.hudPulse - dt * 2.4);

    /* --- speed progression -------------------------------------------------
       Every step is derived from the running total of active play rather than
       from an accumulator that is topped up and drained, so step n lands at
       exactly n x 20s and no rounding can pull one early or push it late. --- */
    this.speedTimer += dt;
    if (this.mult < CFG.SPEED_MAX - 1e-9) {
      var steps = Math.floor(this.speedTimer / CFG.SPEED_STEP_TIME);
      var want = Math.round(Math.min(CFG.SPEED_MAX, 1 + steps * CFG.SPEED_STEP) * 100) / 100;
      if (want > this.mult) { this.mult = want; this.onSpeedUp(); }
    }

    /* --- the world, then the racers in it --- */
    var before = Player.d;
    Race.tickClock(dt);
    Obstacles.update(dt);
    Gen.update(dt, this.mult, Race.leadD());
    Race.update(dt, this.mult);

    /* the camera rides the human racer: everything drawn scrolls by exactly
       as much ground as that racer covered */
    var moved = Player.d - before;
    this.distance = Player.d;
    VFX.scrollWorld(metresToPx(moved));
    VFX.motes(dt, this.mult);
    this.passFX();

    var ms = Math.floor(this.distance / 100);
    if (ms > this.milestone) { this.milestone = ms; this.hudPulse = 1; }

    /* --- ambient speed lines --- */
    this.lineAcc += (0.34 + (this.mult - 1) * 1.6) * 40 * dt;
    while (this.lineAcc >= 1) { this.lineAcc -= 1; VFX.spawnSpeedLine(this.mult); }

    /* --- final stage --- */
    if (!this.finalActive && this.mult >= CFG.SPEED_MAX - 1e-9) this.enterFinal();
    if (this.finalActive && !this.wall && this.finalProgress() >= CFG.FINAL_DISTANCE) {
      Gen.stop();
      /* placed ahead of whoever leads, so no racer is ever behind the wall */
      this.wall = { d: Race.leadD() + CFG.SUCTION_DISTANCE + 22 };
    }
    if (this.wall) {
      this.retireFinishers();
      if (this.wallGap() <= CFG.SUCTION_DISTANCE) this.beginFinish();
    }
  },

  /* a rival that reaches the wall has finished its race */
  retireFinishers: function () {
    for (var i = 0; i < Race.racers.length; i++) {
      var p = Race.racers[i];
      if (p.human || p.finished) continue;
      if (p.d >= this.wall.d) { p.finished = true; p.alive = false; Race.finish(p); }
    }
  },

  finalProgress: function () { return Math.max(0, this.distance - this.finalStart); },

  /* an obstacle sweeping past the player: air displacement, and a spark
     when it goes by close enough to be felt */
  passFX: function () {
    if (Settings.reduced) return;
    var px = Player.x(), py = Player.y(), pr = playerRadius();
    var list = Obstacles.list;
    for (var i = 0; i < list.length; i++) {
      var o = list[i];
      if (o.passed || o.wd + o.hM > Player.d) continue;
      o.passed = true;
      var r = o.rect(), near = null;
      if (Player.alive) {
        var gap = Math.max(r.x - px, px - (r.x + r.w));
        if (gap < pr * 1.5) near = { x: px, y: py };     /* squeezed by, or ducked under */
      }
      VFX.whoosh(r, near);
    }
  },

  onSpeedUp: function () {
    Sound.play('speedUp');
    var x = PF.x + PF.w / 2, y = PF.y + PF.h * CFG.PLAYER_Y;
    VFX.ripple(x, y, PF.w * 0.1, PF.w * 0.9, accent(1), .6, 2.4);
    VFX.ripple(x, y, PF.w * 0.05, PF.w * 0.55, '#000', .45, 1.2);
    VFX.burst(x, y, 14, { color: accent(1), spMin: 120, spMax: 460,
      sizeMax: 3.4, lifeMax: .6, streak: true, world: true });
  },

  enterFinal: function () {
    this.finalActive = true;
    this.finalStart = this.distance;
    Sound.play('finalStage');
    VFX.ripple(PF.x + PF.w / 2, PF.y + PF.h * 0.5, PF.w * 0.05, PF.w * 1.25, accent(1), 1.0, 3);
    VFX.ripple(PF.x + PF.w / 2, PF.y + PF.h * 0.5, PF.w * 0.05, PF.w * 0.9, '#000', .8, 1.6);
    VFX.addShake(4);
  },

  /* ---------- finish sequence ---------- */
  /* metres of open track still between the player and the face of the wall */
  wallGap: function () {
    if (!this.wall) return Infinity;
    return this.wall.d - Player.d;
  },
  /* has the slab run past the last pixel of the world? */
  wallCovered: function () {
    return !!this.wall && screenY(this.wall.d) >= VIEW.h + 24;
  },

  beginFinish: function () {
    if (App.state === ST.FINISH || App.state === ST.COMPLETED) return;
    App.set(ST.FINISH);
    Gen.stop();
    Sound.play('suction');
    if (!Player.alive) {                 /* never end the run with no player on screen */
      var d = Player.d;
      Player.place(1); Player.d = d; Player.spawnT = 1;
    }
    Player.crouch = false;
    Player.coasting = false;
    Player.immune = 999;                 /* the finish is not a place to die */
    this.seq = { t: 0, fromX: Player.x(), soundDone: false, particleT: 0 };
  },

  updateFinish: function (dt) {
    var s = this.seq;
    if (!s || !this.wall) return;
    s.t += dt;

    /* the track keeps running: the wall closes the gap at exactly the speed of
       the world, so the hundred metres are real metres */
    Race.tickClock(dt);
    Obstacles.update(dt);
    Race.update(dt, this.mult);
    this.retireFinishers();
    var moved = Player.d - this.distance;
    this.distance = Player.d;
    VFX.scrollWorld(metresToPx(moved));

    var home = PF.y + CFG.PLAYER_Y * PF.h;
    var edge = screenY(this.wall.d);                 /* the face, in screen pixels */
    var r = playerRadius();

    /* two stages of the same pull. Over the hundred metres the marble is drawn
       forward off its mark; once the face is actually on screen it takes over
       and the marble is pulled into it. */
    var gapK = clamp(1 - this.wallGap() / CFG.SUCTION_DISTANCE, 0, 1);
    var closeK = clamp(1 - (home - edge) / (PF.h * 0.92), 0, 1);
    var e = easeInCubic(closeK);
    var driftY = home - PF.h * 0.17 * easeInCubic(gapK);

    Player.xF = (lerp(s.fromX, PF.x + PF.w / 2, e) - PF.x) / PF.w;
    Player.yOff = lerp(driftY, edge - r, e) - home;
    Player.scaleMul = 1 - 0.97 * e;
    Player.moveT = 1; Player.toF = Player.xF; Player.fromF = Player.xF;

    /* everything loose on the track is dragged the same way */
    var tx = PF.x + PF.w / 2, ty = Math.max(edge, PF.y - PF.h * 0.12);
    s.particleT -= dt;
    if (s.particleT <= 0 && Player.alive) {
      s.particleT = 0.02;
      var n = Settings.reduced ? 1 : 2 + Math.round(gapK * 2);
      for (var i = 0; i < n; i++) {
        var ang = rand(0, TAU), dist = rand(PF.w * 0.35, PF.w * 0.95);
        var px = tx + Math.cos(ang) * dist, py = home + Math.sin(ang) * dist * 0.8;
        var toA = Math.atan2(ty - py, tx - px);
        var sp = rand(400, 780) * (0.6 + gapK * 0.8);
        VFX.parts.push({
          x: px, y: py, vx: Math.cos(toA) * sp, vy: Math.sin(toA) * sp,
          life: 0, max: rand(.35, .6), size: rand(1.5, 3.4), color: '#000',
          drag: -0.9, grav: 0, streak: true
        });
      }
    }
    if (!Settings.reduced && Player.alive) VFX.addShake(0.6 + 2.4 * closeK);

    /* absorbed: the marble is gone and the slab is all there is */
    if (e >= 0.97 && Player.alive) {
      if (!s.soundDone) { s.soundDone = true; Sound.play('complete'); }
      /* absorbed, but the camera still has to ride the wall over the last of
         the world, so this racer keeps covering ground and never respawns */
      Player.alive = false;
      Player.coasting = true;         /* the finish is the one time a downed racer moves */
      Player.respawnT = 1e9;
      Race.finish(Player);
    }
    if (App.state === ST.FINISH && !Player.alive && (this.wallCovered() || s.t >= 14)) {
      App.set(ST.COMPLETED);
      Screens.showComplete();
    }
  }
};

/* ============================================================================
   12. RENDERING
   ========================================================================== */
function setFont(size, weight) { ctx.font = (weight || 600) + ' ' + size.toFixed(1) + 'px ' + FONT; }

/* letter-spaced text, drawn glyph by glyph (ctx.letterSpacing is not universal) */
function tracked(text, x, y, size, weight, spacing, align, color, alpha) {
  setFont(size, weight);
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  var sp = size * spacing, total = 0, i, ch;
  for (i = 0; i < text.length; i++) total += ctx.measureText(text[i]).width + (i < text.length - 1 ? sp : 0);
  var sx = align === 'center' ? x - total / 2 : (align === 'right' ? x - total : x);
  ctx.fillStyle = color || '#000';
  if (alpha !== undefined) ctx.globalAlpha = alpha;
  for (i = 0; i < text.length; i++) {
    ch = text[i];
    ctx.fillText(ch, sx, y);
    sx += ctx.measureText(ch).width + sp;
  }
  ctx.globalAlpha = 1;
  return total;
}

/* ---------- iris / screen transitions ---------- */
var Iris = { mode: null, t: 0, dur: 0, x: 0, y: 0, r0: 0, cover: 0, after: null };
function coverRadius(x, y) {
  return Math.max(Math.hypot(x, y), Math.hypot(VIEW.w - x, y),
                  Math.hypot(x, VIEW.h - y), Math.hypot(VIEW.w - x, VIEW.h - y)) + 4;
}
function irisIn(x, y, r0, after) {
  Iris.mode = 'in'; Iris.t = 0; Iris.dur = CFG.IRIS_IN;
  Iris.x = x; Iris.y = y; Iris.r0 = r0; Iris.cover = coverRadius(x, y); Iris.after = after || null;
}
function irisOut(x, y) {
  Iris.mode = 'out'; Iris.t = 0; Iris.dur = CFG.IRIS_OUT;
  Iris.x = x; Iris.y = y; Iris.r0 = 0; Iris.cover = coverRadius(x, y); Iris.after = null;
}
function updateIris(dt) {
  if (!Iris.mode) return;
  Iris.t += dt;
  if (Iris.t >= Iris.dur) {
    var fn = Iris.after; Iris.mode = null; Iris.after = null;
    if (fn) fn();
  }
}
function drawIris() {
  if (!Iris.mode) return;
  var k = clamp(Iris.t / Iris.dur, 0, 1);
  ctx.fillStyle = '#000';
  if (Iris.mode === 'in') {
    var r = lerp(Iris.r0, Iris.cover, easeInCubic(k));
    ctx.beginPath(); ctx.arc(Iris.x, Iris.y, r, 0, TAU); ctx.fill();
  } else {
    var ro = lerp(0, Iris.cover, easeOutCubic(k));
    ctx.beginPath();
    ctx.rect(0, 0, VIEW.w, VIEW.h);
    ctx.arc(Iris.x, Iris.y, ro, 0, TAU);
    ctx.fill('evenodd');
  }
}

/* ---------- splash ---------- */
var Splash = { t: 0 };
function drawSplash() {
  var T = CFG.SPLASH_TIME, t0 = Splash.t;
  var veil = t0 > T - 0.55 ? clamp(1 - (t0 - (T - 0.55)) / 0.55, 0, 1) : 1;
  ctx.globalAlpha = veil;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, VIEW.w, VIEW.h);
  ctx.globalAlpha = 1;
  var textA = clamp(t0 / 0.6, 0, 1) * (t0 > T - 0.9 ? clamp(1 - (t0 - (T - 0.9)) / 0.5, 0, 1) : 1) * veil;
  var size = clamp(Math.min(VIEW.w, VIEW.h) * 0.028, 10.5, 15);
  var y = VIEW.h - INSET.b - Math.max(64, VIEW.h * 0.11);
  tracked('a game by hiyroscript', VIEW.w / 2, y, size, 400, 0.24, 'center', '#fff', textA);
}

/* ---------- home screen ---------- */
var HOME_FX = {};
function fx(id) {
  if (!HOME_FX[id]) HOME_FX[id] = { hover: 0, press: 0 };
  return HOME_FX[id];
}
var HOME_DEF = [
  { id: 'howto', ang: -0.98, rf: 0.52, color: '#F2B705', text: '#000', key: 'circleHowTo' },
  { id: 'settings', ang: 2.24, rf: 0.52, color: '#3B5BDB', text: '#fff', key: 'circleSettings' },
  { id: 'marble', ang: -1.95, rf: 0.52, color: '#F2600C', text: '#fff', key: 'circleMarble' },
  { id: 'cpu', ang: 1.35, rf: 0.52, color: '#7A3FF2', text: '#fff', key: 'circleCpu', tf: 0.74 },
  { id: 'deco1', ang: -2.55, rf: 0.20, color: '#0FA3A3', text: null },
  { id: 'deco2', ang: 0.62, rf: 0.135, color: '#E5487B', text: null }
];
function homeCircles() {
  var base = Math.min(VIEW.w, VIEW.h);
  var cx = VIEW.w / 2, cy = VIEW.h / 2;
  var R = clamp(base * 0.215, 70, 175);
  var out = [{ id: 'start', x: cx, y: cy, r: R, color: '#000', text: '#fff', big: true }];
  var ring = Math.min(R * 2.05,
    Math.max(R * 1.45, Math.min(VIEW.w / 2 - R * 0.6 - 10, VIEW.h / 2 - R * 0.6 - 10)));
  for (var i = 0; i < HOME_DEF.length; i++) {
    var d = HOME_DEF[i], r = R * d.rf;
    var f = 1 + (d.rf > 0.4 ? 0 : 0.12);
    out.push({
      id: d.id, r: r, color: d.color, text: d.text, key: d.key, tf: d.tf,
      x: clamp(cx + Math.cos(d.ang) * ring * f, r + 8, VIEW.w - r - 8),
      y: clamp(cy + Math.sin(d.ang) * ring * f, r + 8 + INSET.t, VIEW.h - r - 8 - INSET.b)
    });
  }
  return out;
}
/* independent floating motion per circle */
function homeFloat(c, i) {
  var tt = App.time;
  if (c.big) return { x: 0, y: Math.sin(tt * 0.9) * 5, s: 1 + Math.sin(tt * 1.15) * 0.012 };
  return {
    x: Math.cos(tt * (0.5 + i * 0.13) + i * 2.1) * (5 + i * 1.6),
    y: Math.sin(tt * (0.62 + i * 0.11) + i * 1.3) * (7 + i * 1.8),
    s: 1 + Math.sin(tt * (1.1 + i * 0.2) + i) * 0.02
  };
}
function drawHome() {
  var list = homeCircles();
  for (var i = 0; i < list.length; i++) {
    var c = list[i], f = fx(c.id), fl = homeFloat(c, i);
    var scale = fl.s * (1 + f.hover * 0.055 - f.press * 0.075);
    var x = c.x + fl.x, y = c.y + fl.y, r = c.r * scale;

    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU);
    ctx.fillStyle = c.color; ctx.fill();

    if (c.big) {
      tracked('SEREN', x, y - r * 0.13, clamp(r * 0.29, 16, 46), 700, 0.34, 'center', '#fff', 1);
      tracked(t('start'), x, y + r * 0.42, clamp(r * 0.125, 9, 15), 600, 0.22, 'center', 'rgba(255,255,255,.72)', 1);
    } else if (c.text && c.key) {
      var lines = t(c.key), fs = clamp(r * 0.25, 8.5, 14) * (c.tf || 1);
      for (var k = 0; k < lines.length; k++) {
        tracked(lines[k], x, y + (k - (lines.length - 1) / 2) * fs * 1.45, fs, 600, 0.12, 'center', c.text, 1);
      }
    }
  }
}

/* ---------- gameplay scene ---------- */
/* the ground itself: a lit column under the player, rungs and dashed dividers
   that scroll with the world, so speed is legible even on an empty stretch */
var RUNG_M = 3.4, DASH_M = 2.2;

/* walk the rungs of a given world spacing from the bottom of the field upward */
function eachRung(stepM, fn) {
  var d0 = Run.distance;
  var k = Math.floor((d0 + (CFG.PLAYER_Y - 1.06) * CFG.METERS_VISIBLE) / stepM);
  for (var n = 0; n < 48; n++, k++) {
    var yN = CFG.PLAYER_Y - (k * stepM - d0) / CFG.METERS_VISIBLE;
    if (yN < -0.04) break;
    if (yN > 1.04) continue;
    fn(PF.y + yN * PF.h, k);
  }
}

function drawTrack() {
  var lw = Math.max(1, Math.min(2, PF.w * 0.0035));
  var cw = colW();

  /* the column the player is running in, so the eye always knows where it is */
  if (Player.alive) {
    ctx.fillStyle = accent(ACCENT ? 0.06 : 0.03);
    ctx.fillRect(PF.x + Player.xF * PF.w - cw / 2, PF.y, cw, PF.h);
  }

  /* rungs: short bars inside each column, brighter every fourth */
  var inset = cw * 0.16;
  eachRung(RUNG_M, function (y, k) {
    var strong = (k % 4 === 0);
    ctx.fillStyle = strong ? 'rgba(0,0,0,.13)' : 'rgba(0,0,0,.055)';
    var h = strong ? Math.max(1.5, lw * 1.4) : Math.max(1, lw);
    for (var c = 0; c < 3; c++) {
      ctx.fillRect(PF.x + c * cw + inset, y, cw - inset * 2, h);
    }
  });

  /* dividers: a whisper of a line, with a scrolling dashed rhythm on top */
  ctx.strokeStyle = '#000';
  ctx.lineWidth = lw;
  ctx.globalAlpha = 0.10;
  for (var i = 1; i < 3; i++) {
    var x = Math.round(PF.x + PF.w * i / 3) + 0.5;
    ctx.beginPath(); ctx.moveTo(x, PF.y); ctx.lineTo(x, PF.y + PF.h); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  var dashH = DASH_M / CFG.METERS_VISIBLE * PF.h * 0.55;
  eachRung(DASH_M, function (y) {
    ctx.fillStyle = 'rgba(0,0,0,.62)';
    for (var i = 1; i < 3; i++) {
      ctx.fillRect(Math.round(PF.x + PF.w * i / 3) - lw / 2, y, Math.max(1, lw), dashH);
    }
  });
}

/* obstacles emerge from the distance instead of popping in at the edge */
function drawHorizon() {
  var h = PF.h * 0.17;
  var g = ctx.createLinearGradient(0, PF.y, 0, PF.y + h);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.5, 'rgba(255,255,255,.78)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(PF.x, PF.y, PF.w, h);
}

/* the corridor tightens as the run accelerates */
function drawEdges() {
  var k = clamp((Run.mult - 1) / 1, 0, 1);
  var a = 0.05 + 0.10 * k;
  var w = PF.w * (0.06 + 0.05 * k);
  var g = ctx.createLinearGradient(PF.x, 0, PF.x + w, 0);
  g.addColorStop(0, 'rgba(0,0,0,' + a.toFixed(3) + ')');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(PF.x, PF.y, w, PF.h);
  var g2 = ctx.createLinearGradient(PF.x + PF.w, 0, PF.x + PF.w - w, 0);
  g2.addColorStop(0, 'rgba(0,0,0,' + a.toFixed(3) + ')');
  g2.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g2; ctx.fillRect(PF.x + PF.w - w, PF.y, w, PF.h);
}
/* the speed pad: the one warm thing on the track */
var BOOST_INK = '#F5C518';
/* the respawn bubble */
var BUBBLE_INK = '#8FE3F0';

/* the finish wall's palette: solid, saturated, and never two at once */
var WALL_COLORS = ['#E5484D', '#F5A524', '#30A46C', '#00A2C7', '#3E63DD', '#8E4EC6'];
var WALL_HOLD = 0.40, WALL_FADE = 0.52;   /* seconds held, seconds crossfading */

function drawFinishWall() {
  var w = Run.wall; if (!w) return;
  var bottom = screenY(w.d);            /* the face, wherever the camera is */
  if (!(bottom > -1)) return;

  /* One blank slab, one colour at a time: it holds, then crossfades into the
     next. Painted well past every edge of the screen so that a shake, a notch
     or a desktop margin can never uncover a strip of the world beside it. */
  var over = 96, x = -over, y = -over, w = VIEW.w + over * 2, h = bottom + over;
  var cyc = (WALL_HOLD + WALL_FADE) * (Settings.reduced ? 1.7 : 1);
  var p = App.time / cyc;
  var i = Math.floor(p) % WALL_COLORS.length;
  var into = (p - Math.floor(p)) * cyc - WALL_HOLD * (Settings.reduced ? 1.7 : 1);
  var mix = easeInOutCubic(clamp(into / (WALL_FADE * (Settings.reduced ? 1.7 : 1)), 0, 1));

  ctx.fillStyle = WALL_COLORS[i];
  ctx.fillRect(x, y, w, h);
  if (mix > 0) {
    ctx.globalAlpha = mix;
    ctx.fillStyle = WALL_COLORS[(i + 1) % WALL_COLORS.length];
    ctx.fillRect(x, y, w, h);
    ctx.globalAlpha = 1;
  }
}

function drawHUD() {
  var pad = IS_MOBILE ? INSET.l + 16 : 14;
  var top = hudTop() + 8;
  var pulse = easeOutCubic(Run.hudPulse);
  var s1 = clamp(PF.w * 0.042, 13, 21) * (1 + 0.15 * pulse);
  var s2 = clamp(PF.w * 0.028, 10, 13);
  tracked(numFmt(Run.distance) + ' ' + t('meters'), PF.x + pad, top + s1 * 0.4, s1, 600, 0.05, 'left',
    pulse > 0.03 ? accent(1, 46) : '#000', 0.82 + 0.18 * pulse);
  tracked(Run.shownMult().toFixed(2) + 'x', PF.x + pad, top + s1 * 1.5, s2, 500, 0.12, 'left', '#000', 0.42);
  /* where this racer stands in a field of six */
  var pos = (Player && Player.pos) ? Player.pos : 1;
  tracked(t('position') + ' ' + pos + '/' + Race.racers.length,
    PF.x + pad, top + s1 * 2.45, s2, 600, 0.12, 'left',
    pos === 1 ? accent(1, 46) : '#000', pos === 1 ? 0.9 : 0.5);

  if (Run.finalActive) {
    var prog = Math.min(CFG.FINAL_DISTANCE, Math.floor(Run.finalProgress()));
    var label = t('final') + ' \u2014 ' + prog + ' / ' + CFG.FINAL_DISTANCE + ' ' + t('meters');
    var fs = clamp(PF.w * 0.032, 11, 15);
    var by = PF.y + PF.h - (IS_MOBILE ? INSET.b + 26 : 24);
    tracked(label, PF.x + PF.w / 2, by, fs, 700, 0.14, 'center', '#000', 0.9);
    /* thin progress rule under the label */
    var bw = Math.min(PF.w * 0.5, 220), k = prog / CFG.FINAL_DISTANCE;
    ctx.globalAlpha = 0.16; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(PF.x + PF.w / 2 - bw / 2, by + fs); ctx.lineTo(PF.x + PF.w / 2 + bw / 2, by + fs); ctx.stroke();
    ctx.globalAlpha = 0.85;
    ctx.beginPath(); ctx.moveTo(PF.x + PF.w / 2 - bw / 2, by + fs); ctx.lineTo(PF.x + PF.w / 2 - bw / 2 + bw * k, by + fs); ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function drawCountdown() {
  if (App.state !== ST.COUNTDOWN) return;
  var phase = Run.countT / CFG.COUNT_STEP;
  var label = Run.countLabel();
  var pop = easeOutBack(clamp(phase / 0.34, 0, 1));
  var a = phase > 0.7 ? clamp(1 - (phase - 0.7) / 0.3, 0, 1) : 1;
  var size = Math.min(PF.w * 0.30, PF.h * 0.20);
  var isGo = Run.countIdx >= 3;
  ctx.save();
  ctx.translate(PF.x + PF.w / 2, PF.y + PF.h * 0.42);
  ctx.scale(pop * (isGo ? 1 + (1 - a) * 0.25 : 1), pop * (isGo ? 1 + (1 - a) * 0.25 : 1));
  tracked(label, 0, 0, isGo ? size * 0.62 : size, 700, isGo ? 0.2 : 0.06, 'center', '#000', a * 0.92);
  ctx.restore();
}

function drawScene() {
  var sh = VFX.shake;
  var ox = sh ? rand(-sh, sh) : 0, oy = sh ? rand(-sh, sh) : 0;

  ctx.save();
  ctx.translate(ox, oy);
  ctx.save();
  ctx.beginPath(); ctx.rect(PF.x, PF.y, PF.w, PF.h); ctx.clip();

  drawTrack();
  VFX.drawSpeedLines();
  Obstacles.draw();
  drawHorizon();
  drawEdges();
  if (!Run.wall) {
    VFX.drawDashes();
    VFX.drawRipples();
    Race.drawRacers();
    Obstacles.drawOverhead();     /* a barrier you duck under passes over you */
    VFX.drawParticles();
  }

  ctx.restore();

  /* the wall cuts off the whole screen, corridor framing included, so it is
     drawn unclipped, and the player rides on its face until it absorbs him */
  if (Run.wall) {
    drawFinishWall();
    VFX.drawRipples();
    Race.drawRacers();
    VFX.drawParticles();
  }

  /* desktop framing: two hairlines that hold the corridor on a wide screen */
  if (!IS_MOBILE && !Run.wall) {
    ctx.globalAlpha = 0.13; ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(PF.x + .5, PF.y); ctx.lineTo(PF.x + .5, PF.y + PF.h);
    ctx.moveTo(PF.x + PF.w - .5, PF.y); ctx.lineTo(PF.x + PF.w - .5, PF.y + PF.h);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  drawHUD();
  drawCountdown();
  ctx.restore();
}

function render() {
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, VIEW.w, VIEW.h);
  var s = App.state;
  if (s === ST.LANG) { /* white page under the panel */ }
  else if (s === ST.SPLASH) { if (Settings.lang) drawHome(); drawSplash(); }
  else if (s === ST.HOME || s === ST.HOWTO || s === ST.MARBLE || s === ST.CPU) {
    drawHome(); VFX.drawRipples(); VFX.drawParticles();
  }
  else if (s === ST.SETTINGS) {
    if (App.prev === ST.HOME || App.prev === ST.HOWTO) drawHome(); else drawScene();
  } else drawScene();
  drawIris();
}

/* ============================================================================
   13. INPUT — keyboard, mouse and a gesture system built around one rule:
   a lane change needs a decisive, deliberate swipe. Crouching is a dedicated
   button, so a hold and a swipe can never be confused for one another.
   ========================================================================== */
/* pointer ids are normalised to strings: object keys are strings, so a promoted
   pointer would otherwise never match its own pointerup */
function pid(e) { return String(e.pointerId === undefined ? 'mouse' : e.pointerId); }

var Input = {
  crouchHeld: false,
  crouchKeys: {},
  pointers: {},          /* id -> {x,y,x0,y0,t0,lx,ly,lt,swiped,crouching} */
  crouchHold: 0,         /* keeps a quick flick down readable */
  laneLock: 0,           /* two fingers can never spend one swipe twice */

  /* a swipe must travel this far before it counts as intent */
  swipeDist: function () { return Math.max(46, Math.min(VIEW.w, VIEW.h) * 0.090); },
  SWIPE_WINDOW: 0.45,    /* seconds: a slow drag is not a swipe */
  SWIPE_RATIO: 1.4,      /* one axis must clearly beat the other */
  REANCHOR: 0.12,        /* a finger that pauses starts a fresh swipe from there */
  MIN_CROUCH: 0.30,      /* a flick down still ducks long enough to matter */
  LANE_COOLDOWN: 0.09,

  releaseAll: function () {
    this.crouchHeld = false; this.crouchKeys = {};
    this.pointers = {}; this.crouchHold = 0; this.laneLock = 0;
  },

  /* gameplay input is dead until the countdown has fully finished */
  canPlay: function () {
    if (App.blocked) return false;
    if (Player && Player.bubble > 0) return false;    /* the bubble is steering */
    return App.state === ST.PLAYING || App.state === ST.RESPAWNING;
  },
  canPause: function () {
    return !App.blocked && (App.state === ST.PLAYING || App.state === ST.RESPAWNING ||
                            App.state === ST.COUNTDOWN);
  },
  move: function (dir) {
    if (!this.canPlay() || !Player.alive) return;
    Player.setLane(Player.lane + dir);
  },

  /* crouch is held for as long as a finger that swiped down stays on the glass */
  anyFingerDown: function () {
    for (var k in this.pointers) if (this.pointers[k].crouching) return true;
    return false;
  },
  anyKeyCrouch: function () {
    for (var k in this.crouchKeys) if (this.crouchKeys[k]) return true;
    return false;
  },
  updateHold: function () {
    this.crouchHeld = this.anyFingerDown() || this.anyKeyCrouch() || this.crouchHold > 0;
  },
  tick: function (dt) {
    /* the floor is measured from the swipe, so lifting after a long hold
       stands the player up at once */
    if (this.crouchHold > 0) this.crouchHold = Math.max(0, this.crouchHold - dt);
    if (this.laneLock > 0) this.laneLock = Math.max(0, this.laneLock - dt);
    this.updateHold();
  },

  /* start a fresh swipe measurement from the current point */
  anchor: function (p, x, y) {
    p.x0 = x; p.y0 = y; p.t0 = App.time; p.swiped = false; p.dirX = 0; p.peak = x;
  },

  onDown: function (e) {
    Sound.unlock();
    var id = pid(e);

    if (App.state === ST.SPLASH) { Splash.t = Math.max(Splash.t, CFG.SPLASH_TIME - 0.5); return; }
    if (App.state === ST.HOME && Iris.mode !== 'in') { Home.press(e.clientX, e.clientY); return; }
    if (!this.canPlay()) return;

    this.pointers[id] = { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY,
      lx: e.clientX, ly: e.clientY, lt: App.time, t0: App.time,
      swiped: false, crouching: false, dirX: 0, peak: e.clientX };
  },
  onMove: function (e) {
    var id = pid(e);
    if (App.state === ST.HOME && e.pointerType === 'mouse') Home.hover(e.clientX, e.clientY);
    var p = this.pointers[id];
    if (!p) return;
    var now = App.time, need = this.swipeDist();
    var rest = now - p.lt;              /* how long this finger has been still */

    if (p.swiped) {
      /* the flick is spent. It renews only when the finger clearly reverses or
         comes to rest — so one long drag is still one column, but a second
         deliberate flick works even with the finger never leaving the glass. */
      p.peak = p.dirX > 0 ? Math.max(p.peak, e.clientX) : Math.min(p.peak, e.clientX);
      var back = p.dirX > 0 ? p.peak - e.clientX : e.clientX - p.peak;
      if (back > need * 0.32 || rest > 0.10) this.anchor(p, e.clientX, e.clientY);
    } else if (rest > this.REANCHOR && Math.hypot(e.clientX - p.lx, e.clientY - p.ly) < 4) {
      /* a finger that paused starts its next gesture from where it stopped */
      this.anchor(p, e.clientX, e.clientY);
    }
    p.x = e.clientX; p.y = e.clientY;
    p.lx = e.clientX; p.ly = e.clientY; p.lt = now;

    var dx = e.clientX - p.x0, dy = e.clientY - p.y0;
    var adx = Math.abs(dx), ady = Math.abs(dy);
    var quick = (now - p.t0) <= this.SWIPE_WINDOW;
    if (!quick) return;

    /* swipe DOWN, then keep the finger on the glass: that is the crouch */
    if (!p.crouching && dy > 0 && ady >= need && ady > adx * this.SWIPE_RATIO) {
      p.crouching = true;
      this.crouchHold = this.MIN_CROUCH;
      this.updateHold();
      /* measure again from here, so a flick sideways still steers while ducked */
      this.anchor(p, e.clientX, e.clientY);
      return;
    }
    /* a decisive sideways swipe changes column, exactly one column per flick */
    if (!p.swiped && adx >= need && adx > ady * this.SWIPE_RATIO && this.laneLock <= 0) {
      p.swiped = true;
      p.dirX = dx > 0 ? 1 : -1;
      p.peak = e.clientX;
      this.laneLock = this.LANE_COOLDOWN;
      this.move(p.dirX);
    }
  },
  onUp: function (e) {
    var id = pid(e);
    var p = this.pointers[id];
    if (App.state === ST.HOME) { Home.release(e.clientX, e.clientY); }
    if (!p) return;
    delete this.pointers[id];
    this.updateHold();
  },

  onKeyDown: function (e) {
    Sound.unlock();
    var k = e.key;
    if (k === 'Escape') {
      if (App.state === ST.PAUSED) resumeGame();
      else if (Input.canPause()) pauseGame();
      e.preventDefault();
      return;
    }
    if (k === ' ' || k === 'Spacebar') e.preventDefault();
    if (App.state === ST.HOME && (k === 'Enter' || k === ' ')) { Home.activate('start'); return; }
    if (!Input.canPlay()) return;
    if (e.repeat) { if (k === ' ' || k === 's' || k === 'S' || k === 'ArrowDown') Input.crouchKeys[k] = true; return; }

    if (k === 'ArrowLeft' || k === 'a' || k === 'A' || k === 'q' || k === 'Q') { Input.move(-1); e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { Input.move(1); e.preventDefault(); }
    else if (k === 'ArrowDown' || k === 's' || k === 'S' || k === ' ' || k === 'Spacebar') {
      Input.crouchKeys[k] = true; e.preventDefault();
    }
  },
  onKeyUp: function (e) {
    delete Input.crouchKeys[e.key];
    Input.updateHold();
  }
};

/* ============================================================================
   HOME interaction
   ========================================================================== */
var Home = {
  hitAt: function (x, y) {
    var list = homeCircles();
    for (var i = list.length - 1; i >= 0; i--) {
      var c = list[i], fl = homeFloat(c, i);
      if (Math.hypot(x - (c.x + fl.x), y - (c.y + fl.y)) <= c.r * 1.06) return c;
    }
    return null;
  },
  hover: function (x, y) {
    var hit = this.hitAt(x, y);
    var list = homeCircles();
    for (var i = 0; i < list.length; i++) fx(list[i].id).hoverTarget = (hit && hit.id === list[i].id) ? 1 : 0;
    canvas.style.cursor = hit ? 'pointer' : 'default';
  },
  press: function (x, y) {
    var hit = this.hitAt(x, y);
    if (!hit) return;
    this.pressed = hit.id;
    fx(hit.id).pressTarget = 1;
    fx(hit.id).press = 0.7;
  },
  release: function (x, y) {
    var id = this.pressed;
    this.pressed = null;
    var list = homeCircles();
    for (var i = 0; i < list.length; i++) fx(list[i].id).pressTarget = 0;
    if (!id) return;
    var hit = this.hitAt(x, y);
    if (hit && hit.id === id) this.activate(id, hit);
  },
  activate: function (id, c) {
    if (Iris.mode === 'in') return;      /* a transition is already committed */
    if (!c) { var l = homeCircles(); for (var i = 0; i < l.length; i++) if (l[i].id === id) c = l[i]; }
    if (!c) return;
    Sound.unlock();
    var i2 = 0, list = homeCircles();
    for (var j = 0; j < list.length; j++) if (list[j].id === id) i2 = j;
    var fl = homeFloat(c, i2);
    VFX.ripple(c.x + fl.x, c.y + fl.y, c.r, c.r * 1.9, c.color, .6, 2);

    if (id === 'start') {
      Sound.play('start');
      irisIn(c.x + fl.x, c.y + fl.y, c.r * 0.96, function () {
        Run.begin();
        irisOut(VIEW.w / 2, VIEW.h / 2);
      });
    } else if (id === 'settings') {
      Sound.play('ui'); App.prev = ST.HOME; App.set(ST.SETTINGS); Screens.show('settings');
    } else if (id === 'howto') {
      Sound.play('ui'); App.set(ST.HOWTO); Screens.show('howto');
    } else if (id === 'marble') {
      Sound.play('ui'); App.set(ST.MARBLE); Screens.show('marble');
    } else if (id === 'cpu') {
      Sound.play('ui'); App.set(ST.CPU); Screens.show('cpu');
    } else {
      Sound.play('ui');
      VFX.burst(c.x + fl.x, c.y + fl.y, 10, { color: c.color, spMax: 180, sizeMax: 4 });
    }
  }
};

/* ============================================================================
   SCREENS + CHROME
   ========================================================================== */
var Screens = {
  ids: ['lang', 'howto', 'marble', 'cpu', 'settings', 'pause', 'complete'],
  show: function (id) {
    for (var i = 0; i < this.ids.length; i++) {
      var el = document.getElementById('panel-' + this.ids[i]);
      if (el) el.classList.toggle('show', this.ids[i] === id);
    }
  },
  showComplete: function () {
    var p = Player.result || Race.finishOrder.length + 1;
    document.getElementById('statPos').textContent = p + ' / ' + Race.racers.length;
    document.getElementById('statDist').textContent = numFmt(Run.distance) + ' ' + t('meters');
    document.getElementById('statHits').textContent = numFmt(Run.collisions);
    document.getElementById('statSpeed').textContent = Run.mult.toFixed(2) + 'x';
    this.show('complete');
  }
};

function syncChrome() {
  var b = document.getElementById('pauseBtn');
  var visible = (App.state === ST.PLAYING || App.state === ST.RESPAWNING || App.state === ST.COUNTDOWN);
  b.classList.toggle('show', visible && !App.blocked);
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', (App.state === ST.COMPLETED || App.state === ST.SPLASH) ? '#000000' : '#ffffff');
}

/* ---------- pause / resume / navigation ---------- */
var pausedFrom = null;
function pauseGame() {
  if (!(App.state === ST.PLAYING || App.state === ST.RESPAWNING || App.state === ST.COUNTDOWN)) return;
  pausedFrom = App.state;
  App.set(ST.PAUSED);
  Input.releaseAll();
  Player.crouch = false;
  Screens.show('pause');
  Sound.play('ui');
}
function resumeGame() {
  if (App.state !== ST.PAUSED) return;
  Screens.show(null);
  Input.releaseAll();
  Sound.play('ui');
  if (pausedFrom === ST.COUNTDOWN) App.set(ST.COUNTDOWN);
  else Run.startCountdown(false);
}
function restartRun() {
  Screens.show(null);
  Sound.play('ui');
  Run.begin();
}
function goHome(fromBlack) {
  Screens.show(null);
  Sound.play('uiBack');
  var cx = VIEW.w / 2, cy = VIEW.h / 2;
  var finish = function () {
    Obstacles.clear(); VFX.clear(); Gen.stop();
    Run.seq = null; Run.wall = null; Run.finalActive = false;
    Player.reset(1);
    App.set(ST.HOME);
    irisOut(cx, cy);
  };
  if (fromBlack) finish();
  else irisIn(cx, cy, 0, finish);
}

/* ============================================================================
   LOCALISATION + SETTINGS UI
   ========================================================================== */
function applyI18n() {
  var nodes = document.querySelectorAll('[data-i18n]');
  for (var i = 0; i < nodes.length; i++) {
    var key = nodes[i].getAttribute('data-i18n');
    var v = t(key);
    if (typeof v === 'string') nodes[i].textContent = v;
  }
  document.getElementById('noteKeys').style.display = IS_MOBILE ? 'none' : '';
  if (!IS_MOBILE) {   /* the tutorial speaks the language of the device it is on */
    var a = document.querySelector('[data-i18n="htLanes"]');
    var b = document.querySelector('[data-i18n="htCrouch"]');
    if (a) a.textContent = t('htLanesKb');
    if (b) b.textContent = t('htCrouchKb');
  }
  var op = document.getElementById('panel-orient');
  if (op.classList.contains('show')) checkOrientation();
}
function setLanguage(l) {
  Settings.lang = (l === 'fr') ? 'fr' : 'en';
  Settings.save();
  try { document.documentElement.lang = Settings.lang; } catch (e) {}
  applyI18n();
  syncSettingsUI();
  syncCpuUI();
}
function syncMarbleUI() {
  var opts = document.querySelectorAll('[data-marble]');
  for (var i = 0; i < opts.length; i++) {
    opts[i].setAttribute('aria-pressed',
      opts[i].getAttribute('data-marble') === Settings.marble ? 'true' : 'false');
  }
}
function syncCpuUI() {
  var opts = document.querySelectorAll('[data-cpu]');
  for (var i = 0; i < opts.length; i++) {
    opts[i].setAttribute('aria-pressed',
      opts[i].getAttribute('data-cpu') === Settings.cpu ? 'true' : 'false');
  }
  var key = 'd' + Settings.cpu.charAt(0).toUpperCase() + Settings.cpu.slice(1);
  var d = document.getElementById('cpuDesc');
  if (d) d.textContent = t(key);
}
function syncSettingsUI() {
  var segL = document.getElementById('segLang').children;
  for (var i = 0; i < segL.length; i++)
    segL[i].setAttribute('aria-pressed', segL[i].getAttribute('data-v') === Settings.lang ? 'true' : 'false');
  var segF = document.getElementById('segFx').children;
  for (var j = 0; j < segF.length; j++)
    segF[j].setAttribute('aria-pressed', segF[j].getAttribute('data-v') === Settings.effects ? 'true' : 'false');
  document.getElementById('volRange').value = Math.round(Settings.volume * 100);
  document.getElementById('muteBtn').setAttribute('aria-pressed', Settings.muted ? 'true' : 'false');
  document.body.classList.toggle('reduced', Settings.reduced);
}

/* ============================================================================
   ORIENTATION GATE
   ========================================================================== */
function checkOrientation() {
  var bad = null;
  if (IS_MOBILE) { if (VIEW.w > VIEW.h * 1.02) bad = 'rotate'; }
  else if (VIEW.h > VIEW.w || VIEW.w < 620) bad = 'landscape';

  App.blocked = !!bad;
  var p = document.getElementById('panel-orient');
  if (bad) {
    document.getElementById('orientTitle').textContent = t(bad === 'rotate' ? 'rotate' : 'landscape');
    document.getElementById('orientNote').textContent = t(bad === 'rotate' ? 'rotateNote' : 'landscapeNote');
    p.classList.add('show');
    Input.releaseAll();
    if (Player) Player.crouch = false;
  } else {
    p.classList.remove('show');
  }
  syncChrome();
}

/* ============================================================================
   MAIN LOOP
   ========================================================================== */
var lastTS = 0;
function update(dt) {
  App.time += dt;
  updateIris(dt);
  VFX.update(dt);

  for (var id in HOME_FX) {
    var f = HOME_FX[id];
    f.hover = approach(f.hover, f.hoverTarget || 0, 14, dt);
    f.press = approach(f.press, f.pressTarget || 0, 16, dt);
  }

  if (App.state === ST.SPLASH) {
    Splash.t += dt;
    if (Splash.t >= CFG.SPLASH_TIME) {
      /* the language question comes after the title card, never before it */
      if (!Settings.lang) { App.set(ST.LANG); Screens.show('lang'); }
      else App.set(ST.HOME);
    }
    return;
  }
  if (App.blocked) return;

  Input.tick(dt);

  if (App.state === ST.PLAYING || App.state === ST.RESPAWNING) {
    var want = Input.crouchHeld && Player.alive && Player.bubble <= 0;
    if (want !== Player.crouch) {
      Player.crouch = want;
      Sound.play(want ? 'crouchIn' : 'crouchOut');
      if (want && !Settings.reduced) {
        var pr = playerRadius();
        VFX.burst(Player.x(), Player.y() + pr * 0.6, 9,
          { color: '#000', dir: PI / 2, spMax: 160, sizeMax: 2.6, lifeMax: .38, world: true });
        VFX.ripple(Player.x(), Player.y() + pr * 0.5, pr * 0.5, pr * 2.6, accent(1), .34, 1.8);
      }
    }
  }
  if (inRun() || App.state === ST.COMPLETED) Run.update(dt);
}

function frame(ts) {
  requestAnimationFrame(frame);
  var now = ts / 1000;
  var dt = lastTS ? now - lastTS : 1 / 60;
  lastTS = now;
  if (!(dt > 0)) dt = 1 / 60;        /* a clock that jumps back must not rewind the world */
  if (dt > 0.05) dt = 0.05;          /* never let a stalled tab teleport it forward */
  update(dt);
  render();
}

/* ============================================================================
   WIRING + BOOT
   ========================================================================== */
function wireEvents() {
  /* pointer */
  canvas.addEventListener('pointerdown', function (e) { Input.onDown(e); }, { passive: true });
  window.addEventListener('pointermove', function (e) { Input.onMove(e); }, { passive: true });
  window.addEventListener('pointerup', function (e) { Input.onUp(e); }, { passive: true });
  window.addEventListener('pointercancel', function (e) { Input.onUp(e); }, { passive: true });

  /* keyboard */
  window.addEventListener('keydown', Input.onKeyDown);
  window.addEventListener('keyup', Input.onKeyUp);
  window.addEventListener('blur', function () { Input.releaseAll(); });

  /* stop the browser from scrolling, zooming or pulling to refresh */
  document.addEventListener('touchmove', function (e) {
    if (e.target === canvas || !e.target.closest || !e.target.closest('.panel')) {
      if (e.cancelable) e.preventDefault();
    }
  }, { passive: false });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); });
  window.addEventListener('contextmenu', function (e) { if (e.target === canvas) e.preventDefault(); });

  /* layout */
  var rt = null;
  function onResize() {
    clearTimeout(rt);
    layout();
    rt = setTimeout(layout, 220);      /* mobile browser chrome settles late */
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 60); });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { Input.releaseAll(); pauseGame(); }
    else { lastTS = 0; Sound.unlock(); }
  });

  /* pause button */
  document.getElementById('pauseBtn').addEventListener('click', function (e) {
    e.stopPropagation(); pauseGame();
  });

  /* language select */
  var langBtns = document.querySelectorAll('[data-lang]');
  for (var i = 0; i < langBtns.length; i++) {
    langBtns[i].addEventListener('click', function () {
      Sound.unlock(); Sound.play('start');
      setLanguage(this.getAttribute('data-lang'));
      Screens.show(null);
      App.set(ST.HOME);
      irisOut(VIEW.w / 2, VIEW.h / 2);
    });
  }

  /* panel actions */
  document.getElementById('ui').addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    var act = el.getAttribute('data-act');
    Sound.unlock();
    if (act === 'howto-back') { Sound.play('uiBack'); Screens.show(null); App.set(ST.HOME); }
    else if (act === 'marble-back') { Sound.play('uiBack'); Screens.show(null); App.set(ST.HOME); }
    else if (act === 'cpu-back') { Sound.play('uiBack'); Screens.show(null); App.set(ST.HOME); }
    else if (act === 'settings-back') {
      Sound.play('uiBack');
      if (App.prev === ST.PAUSED) { App.set(ST.PAUSED); Screens.show('pause'); }
      else { App.set(ST.HOME); Screens.show(null); }
    }
    else if (act === 'resume') resumeGame();
    else if (act === 'restart') restartRun();
    else if (act === 'pause-settings') { Sound.play('ui'); App.prev = ST.PAUSED; App.set(ST.SETTINGS); Screens.show('settings'); }
    else if (act === 'home') goHome(App.state === ST.COMPLETED);
    else if (act === 'again') { Screens.show(null); Sound.play('start'); Run.begin(); irisOut(VIEW.w / 2, VIEW.h / 2); }
  });

  /* marble selection */
  document.querySelector('.marbles').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-marble]') : null;
    if (!b) return;
    var id = b.getAttribute('data-marble');
    if (!MARBLES[id]) return;
    Settings.marble = id;
    Settings.save();
    syncMarbleUI();
    Sound.unlock(); Sound.play('ui');
  });

  /* cpu intelligence */
  document.getElementById('cpuList').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-cpu]') : null;
    if (!b) return;
    var id = b.getAttribute('data-cpu');
    if (!AI_LEVELS[id]) return;
    Settings.cpu = id;
    Settings.save();
    syncCpuUI();
    Sound.unlock(); Sound.play('ui');
  });

  /* settings controls */
  document.getElementById('segLang').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    setLanguage(b.getAttribute('data-v')); Sound.play('ui');
  });
  document.getElementById('segFx').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    Settings.effects = b.getAttribute('data-v'); Settings.save(); syncSettingsUI(); Sound.play('ui');
  });
  document.getElementById('volRange').addEventListener('input', function () {
    Settings.volume = clamp(this.value / 100, 0, 1);
    if (Settings.muted && Settings.volume > 0) { Settings.muted = false; syncSettingsUI(); }
    Sound.unlock(); Sound.apply(); Settings.save();
  });
  document.getElementById('volRange').addEventListener('change', function () { Sound.play('ui'); });
  document.getElementById('muteBtn').addEventListener('click', function () {
    Settings.muted = !Settings.muted; Settings.save(); syncSettingsUI(); Sound.unlock(); Sound.apply();
    if (!Settings.muted) Sound.play('ui');
  });
}

function startSplash() {
  Splash.t = 0;
  App.set(ST.SPLASH);
}

function boot() {
  document.getElementById('langTitle').innerHTML =
    'Choose your language<br><span style="opacity:.5">Choisissez votre langue</span>';
  document.getElementById('langNote').textContent =
    'You can change this later in Settings. \u00B7 Vous pourrez la changer dans les Paramètres.';

  layout();
  if (!MARBLES[Settings.marble]) Settings.marble = 'blue';
  if (!AI_LEVELS[Settings.cpu]) Settings.cpu = 'normal';
  syncSettingsUI();
  syncMarbleUI();
  syncCpuUI();
  applyI18n();
  wireEvents();

  if (Settings.lang) setLanguage(Settings.lang);
  startSplash();
  requestAnimationFrame(frame);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
</body>
</html>
