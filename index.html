  inner.append(el('p', 'lede', t('menu.tagline')));

  const list = el('div', 'list');
  if (save) {
    const c = COUNTRY_BY_ID[save.char.country];
    list.append(row({
      title: t('menu.continue'),
      meta: `${save.char.first} ${save.char.last} \u00b7 ${t('common.age')} ${BAL.start.age + Math.floor(save.month / 12)} \u00b7 ${money(save.char.money, c)}`,
      onClick: onContinue
    }));
  }
  list.append(row({
    title: t('menu.newLife'),
    onClick: () => {
      if (!save) return onNew();
      confirmModal({
        title: t('menu.warnTitle'),
        body: t('menu.warnBody', { name: save.char.first + ' ' + save.char.last, age: BAL.start.age + Math.floor(save.month / 12) }),
        confirmLabel: t('menu.warnGo'), danger: true, onConfirm: onNew
      });
    }
  }));
  inner.append(list);
  inner.append(el('p', 'hint', t('set.about')));
  wrap.append(inner);
  root.append(wrap);
}

function createScreen(root, onBegin) {
  const draft = {
    gender: pick(['male', 'female', 'nonbinary']),
    country: 'us',
    first: '', last: '',
    points: Object.fromEntries(POINTABLE.map(k => [k, 0]))
  };
  draft.first = randomName(draft.country, draft.gender, 'first');
  draft.last = randomName(draft.country, draft.gender, 'last');

  function spent() { return Object.values(draft.points).reduce((a, b) => a + b, 0); }

  function render() {
    root.innerHTML = '';
    const wrap = el('div', 'setup');
    const inner = el('div', 'setup-inner');
    inner.append(el('h1', null, t('create.title')));
    inner.append(el('p', 'lede prose small', t('create.backstory', { money: money(BAL.start.money, COUNTRY_BY_ID[draft.country]) })));

    const idPanel = panel(t('profile.identity'));
    const ib = idPanel.querySelector('.panel-body');

    const firstInput = el('input', 'input');
    firstInput.value = draft.first;
    firstInput.maxLength = 24;
    firstInput.oninput = () => { draft.first = firstInput.value; };
    const firstErr = el('div', 'error');
    firstErr.hidden = true;

    const lastInput = el('input', 'input');
    lastInput.value = draft.last;
    lastInput.maxLength = 24;
    lastInput.oninput = () => { draft.last = lastInput.value; };
    const lastErr = el('div', 'error');
    lastErr.hidden = true;

    ib.append(field(t('create.first'), firstInput), firstErr);
    ib.append(field(t('create.last'), lastInput), lastErr);
    ib.append(field(t('create.gender'), segmented([
      { label: t('gender.male'), value: 'male' },
      { label: t('gender.female'), value: 'female' },
      { label: t('gender.nonbinary'), value: 'nonbinary' }
    ], draft.gender, (v) => { draft.gender = v; render(); })));

    const sel = el('select', 'select');
    for (const c of COUNTRIES) {
      const o = el('option', null, L(c));
      o.value = c.id;
      if (c.id === draft.country) o.selected = true;
      sel.append(o);
    }
    sel.onchange = () => { draft.country = sel.value; render(); };
    ib.append(field(t('create.country'), sel));

    const c = COUNTRY_BY_ID[draft.country];
    ib.append(el('p', 'hint', countryBlurb(c)));
    ib.append(btn(t('common.random'), 'btn btn-sm', () => {
      draft.gender = pick(['male', 'female', 'nonbinary']);
      draft.first = randomName(draft.country, draft.gender, 'first');
      draft.last = randomName(draft.country, draft.gender, 'last');
      render();
    }));
    inner.append(idPanel);

    const pPanel = panel(t('create.points') + ' \u00b7 ' + t('create.pointsLeft', { n: BAL.start.lifePoints - spent() }));
    const pb = pPanel.querySelector('.panel-body');
    pb.append(el('p', 'hint', t('create.pointsNote')));
    for (const k of POINTABLE) {
      const def = ATTR_BY_KEY[k];
      const line = el('div', 'meter');
      line.append(el('div', 'lbl', L(def)));
      const controls = el('div', 'points');
      const minus = el('button', null, '\u2212');
      minus.type = 'button';
      minus.onclick = () => { if (draft.points[k] > 0) { draft.points[k]--; render(); } };
      const pips = el('div', 'pips');
      for (let i = 0; i < BAL.start.lifePoints; i++) {
        pips.append(el('div', 'pip' + (i < draft.points[k] ? ' on' : '')));
      }
      const plus = el('button', null, '+');
      plus.type = 'button';
      plus.disabled = spent() >= BAL.start.lifePoints;
      plus.onclick = () => { if (spent() < BAL.start.lifePoints) { draft.points[k]++; render(); } };
      controls.append(minus, pips, plus);
      line.append(controls);
      pb.append(line);
    }
    inner.append(pPanel);

    const go = btn(t('create.begin'), 'btn btn-primary btn-block', () => {
      let ok = true;
      firstErr.hidden = true; lastErr.hidden = true;
      if (!validName(draft.first)) { firstErr.textContent = t('create.nameError'); firstErr.hidden = false; ok = false; }
      if (!validName(draft.last)) { lastErr.textContent = t('create.nameError'); lastErr.hidden = false; ok = false; }
      if (!ok) return;
      onBegin({
        first: draft.first.trim(), last: draft.last.trim(),
        gender: draft.gender, country: draft.country, points: draft.points
      });
    });
    inner.append(el('div', 'sep'));
    inner.append(go);
    wrap.append(inner);
    root.append(wrap);
  }
  render();
}

function countryBlurb(c) {
  const pct = Math.round(c.health.cover * 100);
  return L({
    en: `Healthcare covers about ${pct}% here. Income tax runs near ${Math.round(c.tax * 100)}%, and tuition is ${c.tuition < 0.3 ? 'low' : c.tuition < 0.7 ? 'moderate' : 'high'}.`,
    fr: `La santé est couverte à environ ${pct}% ici. L'impôt tourne autour de ${Math.round(c.tax * 100)}%, et les frais de scolarité sont ${c.tuition < 0.3 ? 'faibles' : c.tuition < 0.7 ? 'modérés' : 'élevés'}.`
  });
}

// ---------------------------------------------------------------- ending

function endScreen(root, s, onNew) {
  root.innerHTML = '';
  const win = s.over.cause === 'win';
  const wrap = el('div', 'setup');
  const inner = el('div', 'setup-inner');
  const name = s.char.first + ' ' + s.char.last;
  inner.append(el('h1', null, win ? t('end.winTitle', { name }) : t('end.deadTitle', { name })));
  inner.append(el('p', 'lede prose', win ? t('end.win') : t('end.cause.' + s.over.cause)));

  const c = country(s);
  const score = lifeScore(s);

  const sum = panel(t('end.score') + ' \u00b7 ' + score.total);
  const sb = sum.querySelector('.panel-body');
  for (const [k, v] of Object.entries(score.parts)) sb.append(meter(t('end.cat.' + k), v, { plain: true }));
  inner.append(sum);

  const facts = panel(t('life.summaryTitle'));
  const fb = facts.querySelector('.panel-body');
  fb.append(kv(t('common.age'), String(s.over.age)));
  fb.append(kv(t('money.balance'), money(netWorth(s), c)));
  fb.append(kv(t('nav.work'), s.char.job ? L(CAREER_BY_ID[s.char.job.track].levels[s.char.job.level]) : t('hdr.unemployed')));
  fb.append(kv(t('nav.school'), L(EDU_TIERS[s.char.edu.tier])));
  fb.append(kv(t('mood.selfEsteem'), selfEsteem(s) + '%'));
  const partner = Object.entries(s.rel).find(([, r]) => r.type === 'partner');
  if (partner) fb.append(kv(t('people.title'), npcName(s.npcs[partner[0]])));
  if (s.char.children?.length) fb.append(kv(t('end.cat.family'), String(s.char.children.length)));
  if (s.char.legal.record.length) fb.append(kv(t('crime.record'), String(s.char.legal.record.length)));
  if (s.stats.monthsInPrison) fb.append(kv(t('crime.prison'), s.stats.monthsInPrison + ' ' + t('common.months')));
  inner.append(facts);

  const moments = panel(t('end.moments'));
  const mb = moments.querySelector('.panel-body');
  const majors = s.feed.filter(f => f.major).slice(-18);
  if (!majors.length) mb.append(el('p', 'hint', t('life.feedEmpty')));
  const list = el('div', 'feed');
  for (const f of majors) {
    const item = el('div', 'feed-item is-major tone-' + (f.tone || 'neutral'));
    item.append(el('div', 'when', t('common.age') + ' ' + (BAL.start.age + Math.floor(f.month / 12))));
    item.append(el('div', 'what', f.text));
    list.append(item);
  }
  mb.append(list);
  inner.append(moments);

  inner.append(el('div', 'sep'));
  inner.append(btn(t('end.newLife'), 'btn btn-primary btn-block', onNew));
  wrap.append(inner);
  root.append(wrap);
}

// Wealth is one column of seven. It does not decide the result on its own.
function lifeScore(s) {
  const clamp = (v) => Math.max(0, Math.min(100, Math.round(v)));
  const rels = Object.values(s.rel);
  const close = rels.filter(r => r.affection > 60).length;
  const parts = {
    money: clamp(Math.log10(Math.max(1, netWorth(s))) * 17),
    career: clamp(s.stats.monthsWorked * 0.12 + (s.char.job ? 20 : 0) + s.char.rep.professional * 0.4),
    edu: clamp(s.char.edu.tier * 18 + s.char.edu.credentials.length * 6),
    family: clamp((s.char.children?.length || 0) * 18 + (rels.some(r => r.type === 'partner') ? 34 : 0) + s.char.familyContact * 0.3),
    health: clamp(s.char.needs.health * 0.6 + (s.over.age - 18) * 0.7),
    legal: clamp(100 - s.char.legal.record.length * 18 - s.stats.monthsInPrison * 0.6),
    social: clamp(close * 9 + s.char.rep.general * 0.35 + s.stats.peopleMet * 0.6)
  };
  const total = Math.round(Object.values(parts).reduce((a, b) => a + b, 0) / Object.keys(parts).length);
  return { parts, total };
}

  __x.languageScreen = languageScreen;
  __x.menuScreen = menuScreen;
  __x.createScreen = createScreen;
  __x.endScreen = endScreen;
  __x.lifeScore = lifeScore;
});

  __req("main.js");
})();
