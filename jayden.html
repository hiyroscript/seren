let hexPat=null, FLFONT='600 13px "Avenir Next",system-ui,sans-serif';
function buildHexPattern(){
  const a=46,tw=3*a,th=Math.sqrt(3)*a;
  const c=document.createElement("canvas");
  c.width=Math.round(tw);c.height=Math.round(th);
  const g=c.getContext("2d");
  g.strokeStyle="rgba(150,180,220,0.10)";g.lineWidth=1;
  const centers=[[0,0],[1.5*a,th/2]];
  const offs=[[0,0],[tw,0],[-tw,0],[0,th],[0,-th],[tw,th],[-tw,-th],[tw,-th],[-tw,th]];
  g.beginPath();
  for(const[cx,cy]of centers)for(const[ox,oy]of offs){
    for(let i=0;i<6;i++){
      const x1=cx+ox+a*Math.cos(i*TAU/6),y1=cy+oy+a*Math.sin(i*TAU/6);
      const x2=cx+ox+a*Math.cos((i+1)*TAU/6),y2=cy+oy+a*Math.sin((i+1)*TAU/6);
      g.moveTo(x1,y1);g.lineTo(x2,y2);
    }
  }
  g.stroke();
  hexPat=CX.createPattern(c,"repeat");
}
function shapePath(g,shape,x,y,s,rot){
  g.save(); g.translate(x,y); if(rot)g.rotate(rot); g.beginPath();
  switch(shape){
    case "square": g.rect(-s,-s,s*2,s*2); break;
    case "tri": g.moveTo(s,0); g.lineTo(-s*.75,s*.85); g.lineTo(-s*.75,-s*.85); g.closePath(); break;
    case "arrow": g.moveTo(s*1.25,0); g.lineTo(-s*.6,s*.9); g.lineTo(-s*.15,0); g.lineTo(-s*.6,-s*.9); g.closePath(); break;
    case "circle": g.arc(0,0,s,0,TAU); break;
    case "diamond": g.moveTo(0,-s*1.15); g.lineTo(s,0); g.lineTo(0,s*1.15); g.lineTo(-s,0); g.closePath(); break;
    case "hex": for(let i=0;i<6;i++){const a=i*TAU/6;const px=Math.cos(a)*s,py=Math.sin(a)*s;i?g.lineTo(px,py):g.moveTo(px,py);} g.closePath(); break;
    case "pent": for(let i=0;i<5;i++){const a=-PI/2+i*TAU/5;const px=Math.cos(a)*s,py=Math.sin(a)*s;i?g.lineTo(px,py):g.moveTo(px,py);} g.closePath(); break;
    case "shard": g.moveTo(0,-s*1.3); g.lineTo(s*.72,0); g.lineTo(0,s*1.3); g.lineTo(-s*.72,0); g.closePath(); break;
    case "ring": g.arc(0,0,s,0,TAU); g.moveTo(s*.55,0); g.arc(0,0,s*.55,0,TAU,true); break;
    case "mono": g.rect(-s*.7,-s,s*1.4,s*2); break;
    case "star": for(let i=0;i<10;i++){const a=-PI/2+i*PI/5;const r=i%2?s*.48:s;const px=Math.cos(a)*r,py=Math.sin(a)*r;i?g.lineTo(px,py):g.moveTo(px,py);} g.closePath(); break;
    default: g.rect(-s,-s,s*2,s*2);
  }
  g.restore();
}
function fillShape(g,shape,x,y,s,col,rot,alpha){
  g.globalAlpha=alpha==null?1:alpha; g.fillStyle=col;
  shapePath(g,shape,x,y,s,rot); g.fill(); g.globalAlpha=1;
}
function strokeShape(g,shape,x,y,s,col,rot,w,alpha){
  g.globalAlpha=alpha==null?1:alpha; g.strokeStyle=col; g.lineWidth=w||1.4;
  shapePath(g,shape,x,y,s,rot); g.stroke(); g.globalAlpha=1;
}
function drawTower(g,t){
  const tier=towerTier(), hp=RUN.tower.hp/Math.max(1,RUN.tower.maxHp);
  const crit=hp<.3;
  const pulse=.5+.5*Math.sin(t*(crit?7:2));
  const base=crit?"#ff5c9c":(hp<.6?"#ffc24d":"#3fd8ff");
  if(RUN.tower.shield>0){
    g.globalAlpha=.16+.1*pulse; g.fillStyle="#3fd8ff";
    g.beginPath(); g.arc(0,0,52+tier*4,0,TAU); g.fill(); g.globalAlpha=1;
    strokeShape(g,"circle",0,0,52+tier*4,"#3fd8ff",0,1.6,.6);
  }
  if(tier>=6){ strokeShape(g,"hex",0,0,58,base,t*.16,1.6,.45); }
  if(tier>=3){ strokeShape(g,"circle",0,0,44,base,0,1.4,.4+.2*pulse); }
  if(tier>=5){ strokeShape(g,"circle",0,0,50,base,0,1,.3); }
  if(tier>=1){ strokeShape(g,"square",0,0,30,base,PI/4,1.6,.6); }
  if(tier>=2){ for(let i=0;i<4;i++){const a=i*TAU/4+PI/4;
      fillShape(g,"square",Math.cos(a)*30,Math.sin(a)*30,6,base,0,.55);} }
  if(tier>=4){ for(let i=0;i<6;i++){const a=i*TAU/6+t*.5;
      fillShape(g,"diamond",Math.cos(a)*46,Math.sin(a)*46,5,base,a,.6);} }
  fillShape(g,"square",0,0,22,"#0c1526");
  strokeShape(g,"square",0,0,22,base,0,2.2,1);
  fillShape(g,"square",0,0,11,base,PI/4,.55+.35*pulse);
  if(tier>=2)strokeShape(g,"square",0,0,16,base,PI/4,1,.5);
  if(RUN.ups.tu_core)strokeShape(g,"circle",0,0,26,"#3fd8ff",0,1,.5);
}
function draw(){
  const t=now();
  CX.setTransform(DPR,0,0,DPR,0,0);
  CX.fillStyle="#04060e"; CX.fillRect(0,0,VW,VH);
  if(!RUN)return;
  let sx=0,sy=0;
  if(CAM.shake>0){sx=rnd(-CAM.shake,CAM.shake);sy=rnd(-CAM.shake,CAM.shake);}
  CX.save();
  CX.translate(VW/2+sx,VH/2+sy); CX.scale(CAM.z,CAM.z); CX.translate(-CAM.x,-CAM.y);
  /* grid */
  if(hexPat){
    CX.save(); CX.fillStyle=hexPat;
    const x0=CAM.x-VW/2/CAM.z-80,y0=CAM.y-VH/2/CAM.z-80;
    CX.fillRect(x0,y0,VW/CAM.z+160,VH/CAM.z+160);
    CX.restore();
  }
  /* boundary */
  CX.strokeStyle="rgba(63,216,255,.18)"; CX.lineWidth=2;
  CX.beginPath(); CX.arc(0,0,WORLD.r,0,TAU); CX.stroke();
  CX.strokeStyle="rgba(63,216,255,.06)"; CX.lineWidth=1;
  CX.beginPath(); CX.arc(0,0,WORLD.r-60,0,TAU); CX.stroke();
  /* hazards */
  for(const h of HZs){
    CX.globalAlpha=.16*(h.l/h.m)+.06; CX.fillStyle=h.col;
    CX.beginPath(); CX.arc(h.x,h.y,h.r,0,TAU); CX.fill(); CX.globalAlpha=1;
  }
  /* barriers */
  for(const m of MNs){ if(m.kind!=="barrier")continue;
    strokeShape(CX,"circle",m.x,m.y,m.r,"#8fa6c4",0,2,.8);
    CX.globalAlpha=.12;CX.fillStyle="#8fa6c4";CX.beginPath();CX.arc(m.x,m.y,m.r,0,TAU);CX.fill();CX.globalAlpha=1;
  }
  /* structure fields */
  for(const s of RUN.structs){
    if(s.dead)continue; const D=DBY[s.t],st=structStats(s);
    if(st.auraR&&(SET.extra||Game.sel===s)){
      CX.globalAlpha=Game.sel===s?.22:.08; CX.strokeStyle=D.col; CX.lineWidth=1;
      CX.beginPath(); CX.arc(s.x,s.y,st.auraR,0,TAU); CX.stroke();
      if(D.slow||D.amp||D.repair||D.structShield||D.pull){
        CX.globalAlpha=Game.sel===s?.09:.035; CX.fillStyle=D.col;
        CX.beginPath(); CX.arc(s.x,s.y,st.auraR,0,TAU); CX.fill();
      }
      CX.globalAlpha=1;
    }
    if(st.range&&(Game.sel===s||(SET.extra&&Game.place))){
      CX.globalAlpha=.16; CX.strokeStyle=D.col; CX.lineWidth=1;
      CX.beginPath(); CX.arc(s.x,s.y,st.range*(1+(s.bRange||0)),0,TAU); CX.stroke(); CX.globalAlpha=1;
    }
    for(const m of s.mines){
      fillShape(CX,"diamond",m.x,m.y,4,m.arm>0?"#5b6b82":"#ff8f5c",0,.9);
    }
  }
  /* structures */
  for(const s of RUN.structs){
    if(s.dead)continue;
    const D=DBY[s.t],col=s.flash>0?"#ffffff":D.col;
    if(s.shield>0)strokeShape(CX,"circle",s.x,s.y,D.size+6,"#3fd8ff",0,1.4,.5);
    fillShape(CX,D.shape,s.x,s.y,D.size,"#0a1120");
    strokeShape(CX,D.shape,s.x,s.y,D.size,col,s.ang||0,2);
    if(D.dmg){ const a=s.ang||0;
      CX.strokeStyle=col;CX.lineWidth=2.4;CX.globalAlpha=.9;
      CX.beginPath();CX.moveTo(s.x,s.y);CX.lineTo(s.x+Math.cos(a)*(D.size+7),s.y+Math.sin(a)*(D.size+7));CX.stroke();CX.globalAlpha=1; }
    for(let i=0;i<s.lvl-1;i++){
      const a=-PI/2+i*TAU/5;
      fillShape(CX,"diamond",s.x+Math.cos(a)*(D.size+7),s.y+Math.sin(a)*(D.size+7),2.6,"#ffc24d");
    }
    if(s.jam>0){ strokeShape(CX,"circle",s.x,s.y,D.size+9,"#ff6b52",0,1.6,.7+.3*Math.sin(t*14)); }
    if(s.scr>0){ strokeShape(CX,"circle",s.x,s.y,D.size+9,"#ff5c9c",0,1.2,.6); }
    if(SET.extra&&s.hp<s.maxHp){
      const w=D.size*2,h=3;
      CX.fillStyle="rgba(0,0,0,.6)";CX.fillRect(s.x-w/2,s.y-D.size-9,w,h);
      CX.fillStyle=s.hp/s.maxHp<.35?"#ff5c9c":"#5cffb4";
      CX.fillRect(s.x-w/2,s.y-D.size-9,w*(s.hp/s.maxHp),h);
    }
    if(Game.sel===s)strokeShape(CX,"circle",s.x,s.y,D.size+12,"#ffffff",0,1.4,.7);
    if(s.beamT>0&&s.beamList){
      CX.strokeStyle=D.col;CX.lineWidth=D.beam?3:2;CX.globalAlpha=.85;
      for(const e of s.beamList){ if(!e||e.dead)continue;
        CX.beginPath();CX.moveTo(s.x,s.y);CX.lineTo(e.x,e.y);CX.stroke(); }
      CX.globalAlpha=1;
    }
  }
  /* tower */
  drawTower(CX,t);
  /* guards */
  for(const g of RUN.guards){
    if(g.dead)continue; const G=GBY[g.t];
    const col=g.flash>0?"#ffffff":G.col;
    fillShape(CX,G.shape,g.x,g.y,11,"#0a1120",g.ang||0);
    strokeShape(CX,G.shape,g.x,g.y,11,col,g.ang||0,1.8);
    strokeShape(CX,"circle",g.x,g.y,15,col,0,1,.35);
    if(g.post&&SET.extra){ CX.globalAlpha=.2;CX.strokeStyle=col;CX.setLineDash([4,5]);
      CX.beginPath();CX.moveTo(g.x,g.y);CX.lineTo(g.post.x,g.post.y);CX.stroke();
      CX.setLineDash([]);CX.globalAlpha=1; }
    const gs=guardStats(g);
    if(g.hp<gs.hp){ CX.fillStyle="rgba(0,0,0,.6)";CX.fillRect(g.x-11,g.y-19,22,3);
      CX.fillStyle="#5cffb4";CX.fillRect(g.x-11,g.y-19,22*(g.hp/gs.hp),3); }
    if(Game.sel===g)strokeShape(CX,"circle",g.x,g.y,19,"#ffffff",0,1.4,.7);
  }
  /* enemies */
  for(const e of ENs){
    if(e.dead)continue;
    const E=EBY[e.t],col=FAM[e.fam].c;
    const vis=!e.cloak||e.revealed;
    if(!vis){
      strokeShape(CX,E.shape,e.x,e.y,e.size,col,e.ang,1,SET.contrast?.28:.12);
      continue;
    }
    if(e.shield>0)strokeShape(CX,"circle",e.x,e.y,e.size+5,"#3fd8ff",0,1.4,.55);
    fillShape(CX,E.shape,e.x,e.y,e.size,e.flash>0?"#ffffff":"#0a1120",e.ang);
    strokeShape(CX,E.shape,e.x,e.y,e.size,e.flash>0?"#ffffff":col,e.ang,E.rar>=4?2.6:1.8);
    if(E.rar>=3)strokeShape(CX,E.shape,e.x,e.y,e.size+4,col,e.ang,1,.35);
    if(E.rar>=5){ strokeShape(CX,"circle",e.x,e.y,e.size+9,"#ffffff",0,1,.25+.2*Math.sin(t*5)); }
    if(e.flying){ CX.globalAlpha=.25;CX.fillStyle="#000";
      CX.beginPath();CX.ellipse(e.x,e.y+e.size*.9,e.size*.8,e.size*.3,0,0,TAU);CX.fill();CX.globalAlpha=1; }
    if(e.hp<e.maxHp){
      const w=Math.max(16,e.size*2);
      CX.fillStyle="rgba(0,0,0,.55)";CX.fillRect(e.x-w/2,e.y-e.size-8,w,3);
      CX.fillStyle=col;CX.fillRect(e.x-w/2,e.y-e.size-8,w*clamp(e.hp/e.maxHp,0,1),3);
    }
    let sx2=e.x-e.size;
    const dot=(c)=>{CX.fillStyle=c;CX.fillRect(sx2,e.y+e.size+3,4,4);sx2+=6;};
    if(e.eff.frz>0)dot("#7fe4ff"); if(e.eff.slow>0&&e.eff.slowT>0)dot("#5ec8ff");
    if(e.eff.burnT>0)dot("#ff8f5c"); if(e.eff.shock>0)dot("#7fd4ff");
    if(e.eff.mark>0)dot("#ff5c9c"); if(e.eff.emp>0)dot("#ffc24d");
    if(e.eff.weak>0)dot("#b98cff");
    if(Game.sel===e)strokeShape(CX,"circle",e.x,e.y,e.size+12,"#ffffff",0,1.4,.7);
  }
  /* projectiles */
  for(const p of PRs){
    CX.strokeStyle=p.col;CX.lineWidth=p.size*.9;CX.globalAlpha=.95;
    CX.beginPath();CX.moveTo(p.x,p.y);CX.lineTo(p.x-p.vx*.014,p.y-p.vy*.014);CX.stroke();CX.globalAlpha=1;
  }
  for(const p of EPRs){
    fillShape(CX,"diamond",p.x,p.y,4,p.col,Math.atan2(p.vy,p.vx));
  }
  /* particles */
  for(const p of PTs){
    CX.globalAlpha=clamp(p.l/p.m,0,1)*.9; CX.fillStyle=p.col;
    CX.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s);
  }
  CX.globalAlpha=1;
  /* fx */
  for(const f of FXs){
    const k=1-f.l/f.m;
    CX.globalAlpha=clamp(f.l/f.m,0,1)*.85;
    CX.strokeStyle=f.col; CX.lineWidth=f.w||2;
    if(f.line){ CX.beginPath();CX.moveTo(f.x,f.y);CX.lineTo(f.x2,f.y2);CX.stroke(); }
    else if(f.warn){ CX.setLineDash([6,6]); CX.beginPath();CX.arc(f.x,f.y,f.r,0,TAU);CX.stroke();
      CX.setLineDash([]); CX.beginPath();CX.arc(f.x,f.y,f.r*(1-k),0,TAU);CX.stroke(); }
    else { CX.beginPath();CX.arc(f.x,f.y,lerp(f.r0,f.r,k),0,TAU);CX.stroke(); }
  }
  CX.globalAlpha=1;
  /* floaters */
  CX.font=FLFONT;
  CX.textAlign="center";
  for(const f of FLs){ CX.globalAlpha=clamp(f.l/f.m,0,1); CX.fillStyle=f.col;
    CX.fillText(f.txt,f.x,f.y); }
  CX.globalAlpha=1;
  /* placement ghost */
  if(Game.place){
    const p=Game.place;
    const col=p.ok?"#5cffb4":"#ff5c9c";
    if(p.kind==="def"){
      const D=DBY[p.id];
      strokeShape(CX,D.shape,p.x,p.y,D.size,col,0,2,.9);
      const tmp={t:p.id,lvl:1,branch:null};
      const st=structStats(tmp);
      if(st.range){CX.globalAlpha=.28;CX.strokeStyle=col;CX.lineWidth=1;
        CX.beginPath();CX.arc(p.x,p.y,st.range,0,TAU);CX.stroke();CX.globalAlpha=1;}
      if(st.auraR){CX.globalAlpha=.22;CX.strokeStyle=col;CX.setLineDash([5,5]);
        CX.beginPath();CX.arc(p.x,p.y,st.auraR,0,TAU);CX.stroke();CX.setLineDash([]);CX.globalAlpha=1;}
    } else {
      const G=GBY[p.id];
      strokeShape(CX,G.shape,p.x,p.y,11,col,0,2,.9);
      CX.globalAlpha=.25;CX.strokeStyle=col;CX.beginPath();CX.arc(p.x,p.y,G.range,0,TAU);CX.stroke();CX.globalAlpha=1;
    }
  }
  if(Game.itemMode){
    const I=IBY[Game.itemMode.id];
    const x=IN.hasHover?s2wx(IN.hoverX):CAM.x, y=IN.hasHover?s2wy(IN.hoverY):CAM.y;
    CX.strokeStyle=I.col;CX.lineWidth=1.6;CX.globalAlpha=.8;CX.setLineDash([7,6]);
    CX.beginPath();CX.arc(x,y,I.r||44,0,TAU);CX.stroke();CX.setLineDash([]);CX.globalAlpha=1;
  }
  if(Game.moveGuard){
    const x=IN.hasHover?s2wx(IN.hoverX):CAM.x,y=IN.hasHover?s2wy(IN.hoverY):CAM.y;
    strokeShape(CX,"circle",x,y,18,"#3fd8ff",0,1.6,.8);
  }
  CX.restore();
  /* vision handicap */
  if(RUN.handicaps&&RUN.handicaps.vision){
    const gx=w2sx(0),gy=w2sy(0);
    const grd=CX.createRadialGradient(gx,gy,120*CAM.z,gx,gy,Math.max(VW,VH)*.72);
    grd.addColorStop(0,"rgba(4,6,14,0)"); grd.addColorStop(1,"rgba(4,6,14,.93)");
    CX.fillStyle=grd; CX.fillRect(0,0,VW,VH);
  }
  /* offscreen markers */
  if(RUN.phase==="combat"){
    CX.save();
    for(const e of ENs){
      if(e.dead)continue; if(e.cloak&&!e.revealed)continue;
      const px=w2sx(e.x),py=w2sy(e.y);
      if(px>-20&&px<VW+20&&py>-20&&py<VH+20)continue;
      const cx=VW/2,cy=VH/2,a=Math.atan2(py-cy,px-cx);
      const rx=Math.min(VW/2-16,Math.abs(Math.cos(a))*1e4),ry=Math.min(VH/2-16,Math.abs(Math.sin(a))*1e4);
      const k=Math.min(rx/Math.max(.001,Math.abs(Math.cos(a))),ry/Math.max(.001,Math.abs(Math.sin(a))));
      const mx=cx+Math.cos(a)*k,my=cy+Math.sin(a)*k;
      CX.globalAlpha=EBY[e.t].rar>=3?.85:.4;
      CX.fillStyle=FAM[e.fam].c;
      CX.save();CX.translate(mx,my);CX.rotate(a);
      CX.beginPath();CX.moveTo(6,0);CX.lineTo(-5,4);CX.lineTo(-5,-4);CX.closePath();CX.fill();
      CX.restore();
    }
    CX.globalAlpha=1; CX.restore();
  }
}

/* ============================================================
   14. USER INTERFACE
   ============================================================ */
const HUD=document.getElementById("hud"), SCR=document.getElementById("screens"), TOASTS=document.getElementById("toasts");
const SVG={
  pause:'<svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg>',
  target:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>',
  cart:'<svg viewBox="0 0 24 24"><path d="M4 5h3l2.5 10h9L21 8H8"/><circle cx="10" cy="19" r="1.4"/><circle cx="18" cy="19" r="1.4"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};
const UI={
  cur:null,shopOpen:false,shopCat:"all",shopQ:"",
  init(){
    const st=document.createElement("style");
    st.textContent=`
      body.portrait .cell.opt{display:none}
      body.portrait .topbar{flex-wrap:wrap}
      body.portrait .cell{padding:0 calc(7px*var(--ui))}
      body.portrait .wavebar{top:calc(52px*var(--ui))}
      body.mobileui .btn{padding:calc(11px*var(--ui)) calc(15px*var(--ui))}
      body.mobileui .iconbtn{width:calc(40px*var(--ui));height:calc(40px*var(--ui))}
    `;
    document.head.appendChild(st);
    HUD.innerHTML=`
      <div class="topbar">
        <div class="cell"><span class="k">${T("wave")}</span><span class="v" id="hWave">I</span></div>
        <div class="cell opt"><span class="k">${T("diff")}</span><span class="v d-easy" id="hDiff">-</span></div>
        <div class="cell grow"><span class="k" id="hHpLbl">${T("tower")}</span>
          <div class="bar hp"><i id="hHp"></i></div>
          <div class="bar sh" id="hShWrap" style="margin-top:2px"><i id="hSh"></i></div></div>
        <div class="cell"><span class="k">${T("credits")}</span><span class="v" id="hCred" style="color:var(--am)">0</span></div>
        <div class="cell"><span class="k">${T("score")}</span><span class="v" id="hScore">0</span></div>
        <div class="topbtns">
          <button class="iconbtn" id="bRecenter" title="${T("recenter")}">${SVG.target}</button>
          <button class="iconbtn" id="bPause" title="${T("pause")}">${SVG.pause}</button>
        </div>
      </div>
      <div class="wavebar">
        <div class="big" id="hWaveBig"></div>
        <div class="prep hide" id="hPrep"><span>${T("prep")}</span><span class="t" id="hPrepT">0</span>
          <button class="btn sm pri" id="bStart">${T("startNow")}</button></div>
        <div class="diff hide" id="hHandi"></div>
      </div>
      <div class="dock">
        <div class="items" id="hItems"></div>
        <button class="btn pri" id="bShop">${T("shop")}</button>
      </div>
      <div class="panel hide" id="shop">
        <div class="ptitle"><h4>${T("shop")}</h4><button class="iconbtn" id="shopClose">${SVG.x}</button></div>
        <div class="searchrow"><input id="shopSearch" placeholder="${T("searchPH")}"/></div>
        <div class="cats" id="shopCats"></div>
        <div class="pbody" id="shopBody"></div>
      </div>
      <div class="panel hide" id="ctx">
        <div class="ptitle"><h4 id="ctxTitle">-</h4><button class="iconbtn" id="ctxClose">${SVG.x}</button></div>
        <div class="pbody" id="ctxBody"></div>
      </div>
      <div class="placebar hide" id="placebar"></div>
      <div id="banner" class="hide"></div>
      <div id="tut" class="hide"></div>`;
    const $=id=>document.getElementById(id);
    $("bRecenter").onclick=()=>{recenter();Audio2.sfx("ui");};
    $("bPause").onclick=()=>{Audio2.sfx("ui");this.togglePause();};
    $("bStart").onclick=()=>{Audio2.sfx("ui");if(RUN&&RUN.phase==="prep")Game.startWave();};
    $("bShop").onclick=()=>{Audio2.sfx("ui");this.toggleShop();};
    $("shopClose").onclick=()=>{Audio2.sfx("uiback");this.closeShop();};
    $("ctxClose").onclick=()=>{Audio2.sfx("uiback");Game.sel=null;this.hideContext();};
    $("shopSearch").oninput=e=>{this.shopQ=e.target.value.toLowerCase();this.buildShop();};
    this.applySettings();
  },
  applySettings(){
    document.documentElement.style.setProperty("--ui",SET.uiScale);
    Audio2.applyVolumes();
  },
  /* ---------- screens ---------- */
  clear(){SCR.innerHTML="";this.cur=null;},
  screen(html,cls){
    const d=document.createElement("div");
    d.className="screen "+(cls||"");
    d.innerHTML=html; SCR.appendChild(d); return d;
  },
  rotateGate(bad,needPortrait){
    let g=document.getElementById("rotate");
    if(!bad){ if(g)g.remove(); return; }
    if(g)return;
    g=document.createElement("div"); g.className="screen"; g.id="rotate";
    g.innerHTML=`<div class="ph"></div><div style="letter-spacing:.16em;font-size:var(--f2)">
      ${needPortrait?T("rotP"):T("rotL")}</div>
      <p style="color:var(--dim);margin-top:10px">${needPortrait?T("rotNoteP"):T("rotNoteL")}</p>`;
    document.body.appendChild(g);
  },
  splash(){
    this.clear();
    const d=this.screen(`<div class="mark"></div><div class="sig">a game by hiyroscript</div>`);
    d.id="splash";
    setTimeout(()=>{ d.remove(); if(!PROF.lang)this.lang(); else{LANG=PROF.lang;this.home();} },3000);
  },
  lang(){
    this.clear();
    const d=this.screen(`<div class="sbody">
      <div style="letter-spacing:.2em;font-size:var(--f3);margin-bottom:6px">${STR.en.pickLang} / ${STR.fr.pickLang}</div>
      <p style="text-align:center">${STR.en.langNote}<br>${STR.fr.langNote}</p>
      <button class="btn pri" data-l="en" style="width:220px;margin-top:10px">English</button>
      <button class="btn pri" data-l="fr" style="width:220px">Français</button></div>`);
    d.id="lang";
    d.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{
      Audio2.init();Audio2.resume();Audio2.sfx("ui");
      LANG=b.dataset.l; PROF.lang=LANG; SET.lang=LANG; saveProf(); saveSet();
      this.init(); this.home();
    });
  },
  home(){
    this.clear(); HUD.classList.add("hide");
    Game.running=false; Game.paused=false; RUN=null; resetField();
    const has=hasRun(false);
    const d=this.screen(`
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center">
        <h1 class="title">JAYDEN</h1>
        <div class="sub">${T("tagline")}</div>
        <div class="menu">
          <button class="btn pri" id="mCont" ${has?"":"disabled"}>${T("cont")}</button>
          <button class="btn" id="mNew">${T("newgame")}</button>
          <button class="btn" id="mTut">${T("tutorial")}</button>
          <button class="btn" id="mDisc">${T("discover")}</button>
          <button class="btn" id="mHow">${T("howto")}</button>
          <button class="btn" id="mSet">${T("settings")}</button>
        </div>
        <div class="hs">${T("best")} <b>${fmt(PROF.best)}</b>${PROF.bestWave?" &nbsp;·&nbsp; "+T("wave")+" "+roman(PROF.bestWave):""}</div>
      </div>`);
    d.id="home";
    const $=id=>document.getElementById(id);
    $("mCont").onclick=()=>{Audio2.init();Audio2.resume();Audio2.sfx("ui");
      const r=loadRun(false); if(!r){this.toast(T("noRun"),"warn");return;} Game.start(r);};
    $("mNew").onclick=()=>{Audio2.init();Audio2.resume();Audio2.sfx("ui");
      if(hasRun(false))this.confirm(T("eraseQ"),T("eraseB"),()=>{Store.del(K_RUN);Game.start(newRun(false));});
      else Game.start(newRun(false));};
    $("mTut").onclick=()=>{Audio2.init();Audio2.resume();Audio2.sfx("ui");
      Store.del(K_TUT); Game.start(newRun(true));};
    $("mDisc").onclick=()=>{Audio2.sfx("ui");this.discover();};
    $("mHow").onclick=()=>{Audio2.sfx("ui");this.howto();};
    $("mSet").onclick=()=>{Audio2.sfx("ui");this.settings(()=>this.home());};
  },
  enterGame(){ this.clear(); HUD.classList.remove("hide"); this.buildShop(); this.syncItems(); this.syncHud(); },
  exitGame(){ HUD.classList.add("hide"); this.closeShop(); this.hideContext(); this.hidePlaceBar(); },
  /* ---------- hud ---------- */
  syncHud(){
    if(!RUN)return;
    const $=id=>document.getElementById(id); if(!$("hWave"))return;
    $("hWave").textContent=roman(RUN.wave);
    const df=difficultyOf(RUN.wave);
    const dd=$("hDiff"); dd.textContent=T(df); dd.className="v d-"+df;
    const t=RUN.tower;
    $("hHp").style.transform="scaleX("+clamp(t.hp/Math.max(1,t.maxHp),0,1)+")";
    const sw=$("hShWrap");
    if(t.maxShield>0||t.shield>0){sw.style.display="";
      $("hSh").style.transform="scaleX("+clamp(t.shield/Math.max(1,t.maxShield||t.shield),0,1)+")";}
    else sw.style.display="none";
    $("hHpLbl").textContent=T("tower")+" "+Math.ceil(t.hp)+"/"+Math.ceil(t.maxHp);
    $("hCred").textContent=fmt(RUN.credits);
    $("hScore").textContent=fmt(RUN.score);
    const big=$("hWaveBig"), prep=$("hPrep");
    if(RUN.phase==="prep"){ prep.classList.remove("hide"); $("hPrepT").textContent=Math.ceil(Math.max(0,RUN.prepLeft));
      big.textContent=""; }
    else { prep.classList.add("hide");
      const left=RUN.spawnQueue.length+ENs.length;
      big.textContent=T("wave")+" "+roman(RUN.wave)+"  ·  "+left; }
    const h=$("hHandi"), keys=Object.keys(RUN.handicaps||{});
    if(keys.length){h.classList.remove("hide");h.className="diff d-inhuman";
      h.textContent=keys.map(k=>T("hp_"+k)).join(" · ");}
    else h.classList.add("hide");
    this.syncItemsCd();
  },
  syncItems(){
    const c=document.getElementById("hItems"); if(!c||!RUN)return;
    const ids=Object.keys(RUN.inv).filter(k=>RUN.inv[k]>0);
    c.innerHTML=ids.map(id=>{
      const I=IBY[id];
      return `<button class="itembtn" data-i="${id}"><span class="n">${esc(TX(I.n))}</span>
        <span class="c">${RUN.inv[id]}</span><span class="cd hide"></span></button>`;
    }).join("");
    c.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{Audio2.sfx("ui");Game.useItem(b.dataset.i);});
    this.syncItemsCd();
  },
  syncItemsCd(){
    const c=document.getElementById("hItems"); if(!c||!RUN)return;
    c.querySelectorAll("[data-i]").forEach(b=>{
      const id=b.dataset.i, cd=RUN.cd[id]||0, el=b.querySelector(".cd");
      b.classList.toggle("on",!!(Game.itemMode&&Game.itemMode.id===id));
      if(cd>0){el.classList.remove("hide");el.textContent=Math.ceil(cd);}else el.classList.add("hide");
    });
  },
  toast(msg,kind){
    const d=document.createElement("div");
    d.className="toast "+(kind||""); d.textContent=msg;
    TOASTS.appendChild(d);
    setTimeout(()=>{d.style.opacity="0";d.style.transition="opacity .3s";},1700);
    setTimeout(()=>d.remove(),2100);
    while(TOASTS.children.length>4)TOASTS.firstChild.remove();
  },
  banner(a,b,cls){
    const el=document.getElementById("banner"); if(!el)return;
    el.innerHTML=`<div class="b1 ${cls||""}">${esc(a)}</div><div class="b2">${esc(b||"")}</div>`;
    el.classList.remove("hide"); el.style.opacity="1";
    clearTimeout(this._bt);
    this._bt=setTimeout(()=>{el.style.transition="opacity .6s";el.style.opacity="0";
      setTimeout(()=>{el.classList.add("hide");el.style.transition="";},600);},1500);
  },
  showPlaceBar(){
    const b=document.getElementById("placebar"); if(!b)return;
    b.classList.remove("hide");
    let label="",ok=true;
    if(Game.place){ const p=Game.place;
      label=(p.kind==="def"?TX(DBY[p.id].n):TX(GBY[p.id].n)); ok=p.ok; }
    else if(Game.itemMode)label=TX(IBY[Game.itemMode.id].n)+" — "+T("useItem");
    else if(Game.moveGuard)label=T("guardPost");
    const hint=document.body.classList.contains("mobileui")?T("tapPlace"):T("clickPlace");
    b.innerHTML=`<span class="lbl ${ok?"":"bad"}">${esc(label)}</span>
      <span style="color:var(--dim2);font-size:var(--f0)">${Game.place?esc(hint):""}</span>
      ${Game.place?`<button class="btn sm pri" id="pbOk">${T("place")}</button>`:""}
      <button class="btn sm" id="pbNo">${T("cancel")}</button>`;
    const ok2=document.getElementById("pbOk");
    if(ok2)ok2.onclick=()=>{Audio2.sfx("ui");Game.confirmPlace();};
    document.getElementById("pbNo").onclick=()=>{Audio2.sfx("uiback");Game.cancelAction();this.toast(T("cancelled"));};
  },
  hidePlaceBar(){const b=document.getElementById("placebar");if(b)b.classList.add("hide");},
  /* ---------- shop ---------- */
  toggleShop(){ this.shopOpen?this.closeShop():this.openShop(); },
  openShop(){
    if(RUN&&RUN.handicaps&&RUN.handicaps.shop){this.toast(T("hp_shop"),"warn");Audio2.sfx("err");return;}
    this.shopOpen=true; document.getElementById("shop").classList.remove("hide"); this.buildShop();
    if(RUN&&RUN.tut)Tutorial.event("shop");
  },
  closeShop(){ this.shopOpen=false; const s=document.getElementById("shop"); if(s)s.classList.add("hide"); },
  shopCats(){
    return [["all",T("c_all")],["tower",T("c_tower")],["weapons",T("c_weapons")],
      ["defenses",T("c_defenses")],["barriers",T("c_barriers")],["traps",T("c_traps")],
      ["support",T("c_support")],["utility",T("c_utility")],["guards",T("c_guards")],["items",T("c_items")]];
  },
  buildShop(){
    if(!RUN)return;
    const cats=document.getElementById("shopCats"),body=document.getElementById("shopBody");
    if(!cats)return;
    cats.innerHTML=this.shopCats().map(([id,nm])=>
      `<button class="chip ${this.shopCat===id?"on":""}" data-c="${id}">${esc(nm)}</button>`).join("");
    cats.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{
      Audio2.sfx("ui");this.shopCat=b.dataset.c;this.buildShop();});
    const q=this.shopQ;
    const match=o=>!q||TX(o.n).toLowerCase().includes(q)||TX(o.d).toLowerCase().includes(q);
    let html="";
    const cat=this.shopCat;
    if(cat==="all"||cat==="tower"){
      for(const U of TOWERUPS){
        if(!match(U))continue;
        const lvl=RUN.ups[U.id]||0, maxed=lvl>=U.max;
        const cost=Math.round(U.base*Math.pow(U.mul,lvl));
        const afford=RUN.credits>=cost;
        html+=`<div class="card" data-k="tu" data-id="${U.id}">
          <div class="hd"><span class="sw" style="background:#3fd8ff"></span>
            <span class="nm"><b>${esc(TX(U.n))}</b><s>${U.max>1?T("lvl",lvl+" / "+U.max):(lvl?T("owned"):"")}</s></span>
            <span class="pr ${afford?"":"no"}">${maxed?T("maxed"):cost}</span></div>
          <div class="ex"><div class="dsc">${esc(TX(U.d))}</div>
            ${maxed?"":`<button class="btn sm wide pri" data-buy="${U.id}">${T("buy")} — ${cost}</button>`}</div></div>`;
      }
    }
    const defCats=["weapons","defenses","barriers","traps","support","utility"];
    for(const D of DEFENSES){
      if(cat!=="all"&&cat!==D.cat)continue;
      if(!match(D))continue;
      const locked=RUN.wave<(D.minWave||1);
      const afford=RUN.credits>=D.cost;
      const tmp={t:D.id,lvl:1,branch:null},st=structStats(tmp);
      const stats=[];
      if(st.dmg)stats.push([T("s_damage"),Math.round(st.dmg*10)/10]);
      if(st.rof)stats.push([T("s_rate"),st.rof.toFixed(1)+"/s"]);
      if(st.dmg&&st.rof)stats.push([T("s_dps"),Math.round(st.dmg*st.rof)]);
      if(st.range)stats.push([T("s_range"),Math.round(st.range)]);
      if(st.auraR)stats.push([T("s_radius"),Math.round(st.auraR)]);
      if(st.hp)stats.push([T("s_health"),Math.round(st.hp)]);
      const tags=[];
      if(D.air==="air")tags.push(`<span class="tag mt">${T("t_air")}</span>`);
      if(D.air==="ground")tags.push(`<span class="tag">${T("c_defenses")}</span>`);
      if(D.dtype)tags.push(`<span class="tag ${D.dtype==="enr"?"vi":D.dtype==="exp"?"am":D.dtype==="frz"?"cy":""}">${
        D.dtype==="phy"?"kinetic":D.dtype==="exp"?"explosive":D.dtype==="enr"?"energy":"cold"}</span>`);
      html+=`<div class="card ${locked?"locked":""}" data-k="def" data-id="${D.id}">
        <div class="hd"><span class="sw" style="background:${D.col}"></span>
          <span class="nm"><b>${esc(TX(D.n))}</b><s>${esc(TX(D.d))}</s></span>
          <span class="pr ${afford&&!locked?"":"no"}">${locked?T("locked"):D.cost}</span></div>
        <div class="ex"><div class="dsc">${esc(TX(D.d))}</div>${tags.join("")}
          ${stats.map(s=>`<div class="stat"><span>${s[0]}</span><b>${s[1]}</b></div>`).join("")}
          ${locked?`<div class="dsc">${T("waveReq",D.minWave)}</div>`:
            `<button class="btn sm wide pri" data-place="${D.id}">${T("buy")} — ${D.cost}</button>`}</div></div>`;
    }
    if(cat==="all"||cat==="guards"){
      for(const G of GUARDS){
        if(!match(G))continue;
        const locked=RUN.wave<(G.minWave||1);
        const afford=RUN.credits>=G.cost;
        const stats=[[T("s_health"),G.hp],[T("s_speed"),G.spd],[T("s_range"),G.range]];
        if(G.dmg)stats.splice(1,0,[T("s_damage"),G.dmg]);
        if(G.heal)stats.splice(1,0,["+"+T("s_health"),G.heal+"/s"]);
        html+=`<div class="card ${locked?"locked":""}" data-k="guard" data-id="${G.id}">
          <div class="hd"><span class="sw" style="background:${G.col}"></span>
            <span class="nm"><b>${esc(TX(G.n))}</b><s>${esc(TX(G.d))}</s></span>
            <span class="pr ${afford&&!locked?"":"no"}">${locked?T("locked"):G.cost}</span></div>
          <div class="ex"><div class="dsc">${esc(TX(G.d))}</div>
            ${stats.map(s=>`<div class="stat"><span>${s[0]}</span><b>${s[1]}</b></div>`).join("")}
            ${locked?`<div class="dsc">${T("waveReq",G.minWave)}</div>`:
              `<button class="btn sm wide pri" data-guard="${G.id}">${T("buy")} — ${G.cost}</button>`}</div></div>`;
      }
    }
    if(cat==="all"||cat==="items"){
      for(const I of ITEMS){
        if(!match(I))continue;
        const afford=RUN.credits>=I.cost, own=RUN.inv[I.id]||0;
        html+=`<div class="card" data-k="item" data-id="${I.id}">
          <div class="hd"><span class="sw" style="background:${I.col}"></span>
            <span class="nm"><b>${esc(TX(I.n))}</b><s>${esc(TX(I.d))}</s></span>
            <span class="pr ${afford?"":"no"}">${I.cost}</span></div>
          <div class="ex"><div class="dsc">${esc(TX(I.d))}</div>
            <div class="stat"><span>${T("owned")}</span><b>${own}</b></div>
            <div class="stat"><span>${T("cooldown")}</span><b>${I.cd}s</b></div>
            <button class="btn sm wide pri" data-item="${I.id}">${T("buy")} — ${I.cost}</button></div></div>`;
      }
    }
    body.innerHTML=html||`<p style="color:var(--dim2)">${T("empty")}</p>`;
    body.querySelectorAll(".card .hd").forEach(h=>h.onclick=()=>{
      const c=h.parentElement; const was=c.classList.contains("open");
      body.querySelectorAll(".card").forEach(x=>x.classList.remove("open"));
      if(!was)c.classList.add("open"); Audio2.sfx("ui");});
    body.querySelectorAll("[data-place]").forEach(b=>b.onclick=e=>{e.stopPropagation();Game.beginPlace("def",b.dataset.place);});
    body.querySelectorAll("[data-guard]").forEach(b=>b.onclick=e=>{e.stopPropagation();Game.beginPlace("guard",b.dataset.guard);});
    body.querySelectorAll("[data-item]").forEach(b=>b.onclick=e=>{e.stopPropagation();Game.buyItem(b.dataset.item);this.buildShop();});
    body.querySelectorAll("[data-buy]").forEach(b=>b.onclick=e=>{e.stopPropagation();Game.buyTowerUp(b.dataset.buy);});
  },
  /* ---------- context ---------- */
  hideContext(){const c=document.getElementById("ctx");if(c)c.classList.add("hide");},
  showContext(){
    const c=document.getElementById("ctx"); if(!c||!Game.sel)return;
    const tt=document.getElementById("ctxTitle"),bd=document.getElementById("ctxBody");
    c.classList.remove("hide");
    if(Game.selType==="struct"){
      const s=Game.sel,D=DBY[s.t],st=structStats(s);
      tt.textContent=TX(D.n)+" — "+T("lvl",s.lvl);
      const rows=[];
      if(st.dmg)rows.push([T("s_damage"),Math.round(st.dmg*(1+(s.bDmg||0))*10)/10]);
      if(st.rof)rows.push([T("s_rate"),st.rof.toFixed(1)+"/s"]);
      if(st.range)rows.push([T("s_range"),Math.round(st.range*(1+(s.bRange||0)))]);
      if(st.auraR)rows.push([T("s_radius"),Math.round(st.auraR)]);
      rows.push([T("s_health"),Math.round(s.hp)+" / "+Math.round(s.maxHp)]);
      if(s.maxShield)rows.push([T("shield"),Math.round(s.shield)+" / "+Math.round(s.maxShield)]);
      rows.push([T("s_sell"),sellValue(s)]);
      let h=rows.map(r=>`<div class="stat"><span>${r[0]}</span><b>${r[1]}</b></div>`).join("");
      if(D.dmg){
        h+=`<div style="margin:10px 0 4px;color:var(--dim2);font-size:var(--f0)">${T("targetMode")}</div>
          <div class="seg" style="justify-content:flex-start">`+
          TARGET_MODES.map(m=>`<button class="chip ${s.tm===m?"on":""}" data-tm="${m}">${T("t_"+m)}</button>`).join("")+`</div>`;
      }
      if(D.branches&&!s.branch&&s.lvl>=3){
        h+=`<div style="margin:12px 0 5px;color:var(--cy);font-size:var(--f0)">${T("branch")}</div>`;
        h+=D.branches.map(b=>`<button class="btn sm wide" data-br="${b.id}" style="margin-bottom:5px;text-align:left;justify-content:flex-start">
          <span><b style="font-weight:500">${esc(TX(b.n))}</b><br><s style="color:var(--dim2);font-size:var(--f0)">${esc(TX(b.d))}</s></span></button>`).join("");
      } else if(s.branch){
        const b=D.branches.find(x=>x.id===s.branch);
        if(b)h+=`<div style="margin-top:10px"><span class="tag cy">${esc(TX(b.n))}</span><div class="dsc">${esc(TX(b.d))}</div></div>`;
      }
      h+=`<div style="display:flex;gap:6px;margin-top:12px">
        ${s.lvl<5?`<button class="btn sm pri" id="cUp" style="flex:1">${T("upgrade")} — ${upCost(s)}</button>`:
          `<button class="btn sm" disabled style="flex:1">${T("maxed")}</button>`}
        <button class="btn sm dgr" id="cSell">${T("sell")}</button></div>`;
      bd.innerHTML=h;
      bd.querySelectorAll("[data-tm]").forEach(b=>b.onclick=()=>{s.tm=b.dataset.tm;Audio2.sfx("ui");this.showContext();saveRun();
        if(RUN.tut)Tutorial.event("target");});
      bd.querySelectorAll("[data-br]").forEach(b=>b.onclick=()=>Game.chooseBranch(b.dataset.br));
      const up=document.getElementById("cUp"); if(up)up.onclick=()=>Game.upgradeSel();
      document.getElementById("cSell").onclick=()=>Game.sellSel();
    } else if(Game.selType==="guard"){
      const g=Game.sel,G=GBY[g.t],gs=guardStats(g);
      tt.textContent=TX(G.n)+" — "+T("lvl",g.lvl);
      const rows=[[T("s_health"),Math.round(g.hp)+" / "+Math.round(gs.hp)],[T("s_speed"),Math.round(gs.spd)],
        [T("s_range"),Math.round(gs.range)],[T("s_sell"),guardSell(g)]];
      if(gs.dmg)rows.splice(1,0,[T("s_damage"),Math.round(gs.dmg)]);
      if(gs.heal)rows.splice(1,0,["+"+T("s_health"),Math.round(gs.heal)]);
      bd.innerHTML=`<div class="dsc">${esc(TX(G.d))}</div>`+
        rows.map(r=>`<div class="stat"><span>${r[0]}</span><b>${r[1]}</b></div>`).join("")+
        `<div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap">
          ${g.lvl<4?`<button class="btn sm pri" id="cUp" style="flex:1">${T("upgrade")} — ${guardUpCost(g)}</button>`:
            `<button class="btn sm" disabled style="flex:1">${T("maxed")}</button>`}
          <button class="btn sm" id="cMove">${T("moveGuard")}</button>
          <button class="btn sm dgr" id="cSell">${T("sell")}</button></div>`;
      const up=document.getElementById("cUp"); if(up)up.onclick=()=>Game.upgradeSel();
      document.getElementById("cMove").onclick=()=>{Audio2.sfx("ui");Game.startMoveGuard();};
      document.getElementById("cSell").onclick=()=>Game.sellSel();
    } else {
      const e=Game.sel,E=EBY[e.t];
      tt.textContent=TX(E.n);
      const res=Object.keys(E.res||{}).map(k=>`<span class="tag rs">${
        (k==="phy"?"kinetic":k==="exp"?"explosive":k==="enr"?"energy":"cold")} ${Math.round(E.res[k]*100)}%</span>`).join("");
      const wk=Object.keys(E.weak||{}).map(k=>`<span class="tag mt">${
        (k==="phy"?"kinetic":k==="exp"?"explosive":k==="enr"?"energy":"cold")} +${Math.round(E.weak[k]*100)}%</span>`).join("");
      const tags=[];
      if(E.flying)tags.push(`<span class="tag cy">${T("t_air")}</span>`);
      if(E.cloak)tags.push(`<span class="tag vi">${T("stat_revealed")}</span>`);
      if(E.armor)tags.push(`<span class="tag am">${T("s_armour")} ${Math.round(E.armor*100)}%</span>`);
      bd.innerHTML=`
        <div class="stat"><span>${T("s_family")}</span><b>${esc(TX(FAM[E.fam].n))}</b></div>
        <div class="stat"><span>${T("s_rarity")}</span><b class="rar${E.rar}">${T(RARN[E.rar])}</b></div>
        <div class="stat"><span>${T("s_health")}</span><b>${Math.round(e.hp)} / ${Math.round(e.maxHp)}</b></div>
        <div class="stat"><span>${T("s_speed")}</span><b>${Math.round(e.spd)}</b></div>
        <div class="stat"><span>${T("s_damage")}</span><b>${Math.round(e.dmg)}</b></div>
        <div style="margin-top:8px">${tags.join("")}${res}${wk}</div>
        <div class="dsc">${esc(TX(E.bh))}</div>
        <div style="color:var(--cy);font-size:var(--f0);margin-top:8px">${T("s_counter")}</div>
        <div class="dsc">${esc(TX(E.cn))}</div>`;
      if(RUN.tut)Tutorial.event("inspect");
    }
  },
  /* ---------- pause ---------- */
  togglePause(){
    if(!RUN||!Game.running)return;
    if(Game.paused){Game.paused=false;this.clear();return;}
    Game.paused=true; saveRun();
    const d=this.screen(`<div class="shead"><h2>${T("paused")}</h2></div>
      <div class="sbody" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px">
        <button class="btn pri" id="pR" style="width:min(300px,74vw)">${T("resume")}</button>
        <button class="btn" id="pS" style="width:min(300px,74vw)">${T("settings")}</button>
        <button class="btn" id="pH" style="width:min(300px,74vw)">${T("howto")}</button>
        <button class="btn" id="pD" style="width:min(300px,74vw)">${T("discover")}</button>
        <button class="btn dgr" id="pQ" style="width:min(300px,74vw)">${T("home")}</button>
      </div>`,"sheet");
    document.getElementById("pR").onclick=()=>{Audio2.sfx("uiback");Game.paused=false;this.clear();};
    document.getElementById("pS").onclick=()=>{Audio2.sfx("ui");this.settings(()=>{this.clear();this.togglePauseMenu();});};
    document.getElementById("pH").onclick=()=>{Audio2.sfx("ui");this.howto(()=>{this.clear();this.togglePauseMenu();});};
    document.getElementById("pD").onclick=()=>{Audio2.sfx("ui");this.discover(()=>{this.clear();this.togglePauseMenu();});};
    document.getElementById("pQ").onclick=()=>{Audio2.sfx("uiback");saveRun();Game.stop();Game.paused=false;this.home();};
  },
  togglePauseMenu(){ Game.paused=false; this.togglePause(); },
  /* ---------- modal ---------- */
  confirm(title,body,cb){
    const old=document.getElementById("modal"); if(old)old.remove();
    const d=document.createElement("div"); d.id="modal";
    d.innerHTML=`<div class="box"><h4>${esc(title)}</h4><p>${esc(body)}</p>
      <div class="mf"><button class="btn" id="mNo">${T("cancel")}</button>
      <button class="btn dgr" id="mYes">${T("confirm")}</button></div></div>`;
    document.body.appendChild(d);
    document.getElementById("mNo").onclick=()=>{Audio2.sfx("uiback");d.remove();};
    document.getElementById("mYes").onclick=()=>{Audio2.sfx("ui");d.remove();cb();};
  },
  /* ---------- game over ---------- */
  gameOver(win){
    this.exitGame(); this.clear();
    const s=RUN?RUN.score:0,w=RUN?RUN.wave:1,k=RUN?RUN.kills:0;
    const best=PROF.best, isNew=!RUN.tut&&s>=best&&s>0;
    const d=this.screen(`
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px">
        <div class="t1" style="${win?"color:var(--mt)":""}">${win?T("complete"):T("runOver")}</div>
        <div class="st">
          <div><div class="k">${T("wavesSurvived")}</div><div class="v">${roman(w)}</div></div>
          <div><div class="k">${T("kills")}</div><div class="v">${fmt(k)}</div></div>
          <div><div class="k">${T("finalScore")}</div><div class="v" style="color:var(--am)">${fmt(s)}</div></div>
        </div>
        ${isNew?`<div style="color:var(--mt);letter-spacing:.18em;margin-bottom:18px">${T("newBest")}</div>`:
          `<div style="color:var(--dim);margin-bottom:18px">${T("best")}: ${fmt(best)}</div>`}
        <div style="display:flex;gap:9px;flex-wrap:wrap;justify-content:center">
          <button class="btn pri" id="oAgain">${T("again")}</button>
          <button class="btn" id="oHome">${T("home")}</button>
        </div>
      </div>`);
    d.id="over";
    document.getElementById("oAgain").onclick=()=>{Audio2.sfx("ui");Store.del(K_RUN);Game.start(newRun(false));};
    document.getElementById("oHome").onclick=()=>{Audio2.sfx("uiback");this.home();};
  }
};

/* ---------- settings / discover / how to play ---------- */
Object.assign(UI,{
  settings(back){
    this.clear();

        ${row(T("set_mute"),"",tog("sMute",SET.mute))}

          <button class="btn sm dgr" id="sWipe">${T("set_resetall")}</button>
        </div>
      </div>`,"sheet");
    const $=id=>document.getElementById(id);
    $("sBack").onclick=()=>{Audio2.sfx("uiback");saveSet();back?back():this.home();};
    const link=(id,key,f)=>{const el=$(id);if(!el)return;el.oninput=()=>{SET[key]=f?f(el.value):parseFloat(el.value);
      saveSet();this.applySettings();};};
    link("sCam","camSens");link("sZoom","zoomSens");link("sShake","shake");
    link("sMaster","master");link("sMusic","music");link("sSfx","sfx");link("sScale","uiScale");
    d.querySelectorAll("[data-seg]").forEach(b=>b.onclick=()=>{
      Audio2.sfx("ui");
      const id=b.dataset.seg,v=b.dataset.v;
      if(id==="sDmg")SET.dmgNum=v==="1";
      if(id==="sVfx")SET.vfx=parseInt(v,10);
      if(id==="sMute")SET.mute=v==="1";
      if(id==="sExtra")SET.extra=v==="1";
      if(id==="sMotion")SET.motion=v==="1";
      if(id==="sFlash")SET.flash=v==="1";
      if(id==="sContrast")SET.contrast=v==="1";
      if(id==="sLang"){LANG=v;PROF.lang=v;SET.lang=v;saveProf();this.init();}
      saveSet();this.applySettings();this.settings(back);
    });
    $("sClear").onclick=()=>this.confirm(T("clearRunQ"),T("eraseB"),()=>{
      Store.del(K_RUN);Store.del(K_TUT);if(Game.running){Game.running=false;Game.paused=false;}
      this.toast(T("confirm"),"good");this.home();});
    $("sReset").onclick=()=>this.confirm(T("resetSetQ"),"",()=>{
      SET=Object.assign({},DEFAULT_SET,{lang:LANG});saveSet();this.applySettings();this.settings(back);});

      Store.del(K_RUN);Store.del(K_TUT);Store.del(K_PROFILE);Store.del(K_SET);
      location.reload();});

  discover(back){
    this.clear();
    const cats=[["enemy",T("d_enemies")],["families",T("d_families")],["def",T("d_def")],
      ["guard",T("d_guards")],["item",T("d_items")],["towerup",T("d_towerup")],

    document.getElementById("hBack").onclick=()=>{Audio2.sfx("uiback");back?back():this.home();};

function glyphClip(shape){
  switch(shape){
    case "tri": return "polygon(50% 0,100% 100%,0 100%)";
    case "circle": return "circle(50%)";
    case "diamond": return "polygon(50% 0,100% 50%,50% 100%,0 50%)";
    case "hex": return "polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)";
    case "shard": return "polygon(50% 0,90% 50%,50% 100%,10% 50%)";
    case "arrow": return "polygon(100% 50%,20% 100%,40% 50%,20% 0)";
    case "star": return "polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)";
    case "ring": return "circle(50%)";
    case "mono": return "polygon(30% 0,70% 0,70% 100%,30% 100%)";
    case "pent": return "polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%)";
    default: return "none";
  }
}
function enemyEntryHtml(e){
  const dmgName=k=>({phy:LANG==="fr"?"cinétique":"kinetic",exp:LANG==="fr"?"explosif":"explosive",
    enr:LANG==="fr"?"énergie":"energy",frz:LANG==="fr"?"froid":"cold"}[k]||k);
  const res=Object.keys(e.res||{}).map(k=>`<span class="tag rs">${dmgName(k)} ${Math.round(e.res[k]*100)}%</span>`).join("");
  const wk=Object.keys(e.weak||{}).map(k=>`<span class="tag mt">${dmgName(k)} +${Math.round(e.weak[k]*100)}%</span>`).join("");
  const tags=[];
  if(e.flying)tags.push(`<span class="tag cy">${T("t_air")}</span>`);
  if(e.cloak)tags.push(`<span class="tag vi">${T("stat_revealed")}</span>`);
  if(e.armor)tags.push(`<span class="tag am">${T("s_armour")} ${Math.round(e.armor*100)}%</span>`);
  return `<p>${esc(TX(e.bh))}</p>
    <div class="stat"><span>${T("s_family")}</span><b>${esc(TX(FAM[e.fam].n))}</b></div>
    <div class="stat"><span>${T("s_rarity")}</span><b class="rar${e.rar}">${T(RARN[e.rar])}</b></div>
    <div class="stat"><span>${T("s_first")}</span><b>${T("wave")} ${roman(e.minWave)}</b></div>
    <div class="stat"><span>${T("s_health")}</span><b>${e.hp}</b></div>
    <div class="stat"><span>${T("s_speed")}</span><b>${e.spd}</b></div>
    <div class="stat"><span>${T("s_damage")}</span><b>${e.dmg}</b></div>
    <div style="margin:9px 0">${tags.join("")}${res}${wk}</div>
    <h3>${T("s_counter")}</h3><p>${esc(TX(e.cn))}</p>`;
}

const Tutorial={
  idx:0,waiting:null,
  begin(){ this.idx=RUN.tutStep||0; this.waiting=null; setTimeout(()=>this.show(),700); },
  show(){
    const s=TUT_STEPS[this.idx];
    const el=document.getElementById("tut"); if(!el)return;
    if(!s||!RUN||!RUN.tut){el.classList.add("hide");return;}
    if(RUN.wave<s.wave){el.classList.add("hide");return;}
    el.classList.remove("hide");
    el.innerHTML=`<div class="tt">${T("tutorial")} — ${this.idx+1} / ${TUT_STEPS.length}</div>
      <div class="tb">${esc(TX(s.b))}</div>
      <div class="tf"><button class="btn sm" id="tSkip">${T("tutSkip")}</button>
      ${s.need?"":`<button class="btn sm pri" id="tNext">${T("next")}</button>`}</div>`;
    const nx=document.getElementById("tNext");
    if(nx)nx.onclick=()=>{Audio2.sfx("ui");this.advance();};
    document.getElementById("tSkip").onclick=()=>{Audio2.sfx("uiback");this.skip();};
    this.waiting=s.need||null;
  },
  advance(){
    this.idx++; RUN.tutStep=this.idx; this.waiting=null;
    const el=document.getElementById("tut"); if(el)el.classList.add("hide");
    saveRun();
    setTimeout(()=>this.show(),400);
  },
  event(name){
    if(!RUN||!RUN.tut)return;
    if(this.waiting===name)this.advance();
  },
  tick(){
    if(!RUN||!RUN.tut)return;
    const s=TUT_STEPS[this.idx];
    const el=document.getElementById("tut");
    if(!s||!el)return;
    if(el.classList.contains("hide")&&RUN.wave>=s.wave&&RUN.phase==="prep")this.show();
  },
  skip(){
    const el=document.getElementById("tut"); if(el)el.classList.add("hide");
    this.idx=TUT_STEPS.length; RUN.tutStep=this.idx; this.waiting=null;
  },
  finish(){
    PROF.tutDone=true; saveProf(); Store.del(K_TUT);
    Game.running=false;
    UI.exitGame(); UI.clear();
    const d=UI.screen(`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center">
      <div style="font-size:clamp(26px,6vw,46px);letter-spacing:.2em;color:var(--mt)">${T("tutDone")}</div>
      <p style="margin-top:18px;max-width:56ch">${T("tutDoneB")}</p>
      <div style="display:flex;gap:9px;margin-top:20px;flex-wrap:wrap;justify-content:center">
        <button class="btn pri" id="tgNew">${T("newgame")}</button>
        <button class="btn" id="tgHome">${T("home")}</button></div></div>`);
    document.getElementById("tgNew").onclick=()=>{Audio2.sfx("ui");Store.del(K_RUN);Game.start(newRun(false));};
    document.getElementById("tgHome").onclick=()=>{Audio2.sfx("uiback");UI.home();};
  }
};

/* ============================================================
   16. BOOT
   ============================================================ */
let lastT=0;
function loop(ts){
  requestAnimationFrame(loop);
  const t=ts/1000;
  let dt=lastT?Math.min(.05,t-lastT):0;
  lastT=t;
  if(Game.running&&!Game.paused&&RUN)Game.tick(dt);
  else if(RUN)Game.updateFx(dt*0.6);
  draw();
}
function boot(){
  LANG=PROF.lang||SET.lang||"en";
  resize(); buildHexPattern(); bindInput();
  if(PROF.lang)UI.init();
  UI.splash();
  document.addEventListener("visibilitychange",()=>{
    if(document.hidden&&Game.running&&!Game.paused){ saveRun(); UI.togglePause(); }
  });
  window.addEventListener("beforeunload",()=>{ if(Game.running)saveRun(); });
  requestAnimationFrame(loop);
}
boot();
