<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#04060e"/>
<meta name="description" content="Jayden - a geometric survival tower defense."/>
<title>JAYDEN</title>
<style>
/* ============================================================
   JAYDEN - design tokens
   Base   : deep navy-black field, hairline hex lattice
   Accents: signal cyan (player), amber (economy), rose (threat),
            mint (restore), violet (rare)
   Type   : one geometric sans family, three sizes, two weights
   ============================================================ */
:root{
  --bg:#04060e; --bg2:#080d19; --bg3:#0c1526;
  --line:rgba(140,175,225,.16);
  --line2:rgba(140,175,225,.30);
  --fg:#e2ebf8; --dim:#8ea3c2; --dim2:#5c6f8d;
  --cy:#3fd8ff; --am:#ffc24d; --rs:#ff5c9c; --mt:#5cffb4; --vi:#a98bff; --rd:#ff6b52;
  --ui:1;
  --pad:calc(10px * var(--ui));
  --f0:calc(10.5px * var(--ui));
  --f1:calc(12.5px * var(--ui));
  --f2:calc(15px * var(--ui));
  --f3:calc(20px * var(--ui));
  --sans:"Avenir Next","Futura","Century Gothic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:var(--sans);font-size:var(--f1);overscroll-behavior:none;touch-action:none;}
body{user-select:none;-webkit-user-select:none;}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%;}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;font-size:inherit;}
input,select{font-family:inherit;font-size:inherit;color:var(--fg);}
.hide{display:none !important;}

/* ---------- shared chrome ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:calc(9px*var(--ui)) calc(16px*var(--ui));
  border:1px solid var(--line2);background:rgba(63,216,255,.05);
  color:var(--fg);letter-spacing:.06em;font-size:var(--f1);
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);
  transition:background .12s,border-color .12s,color .12s;
}
.btn:hover:not(:disabled){background:rgba(63,216,255,.14);border-color:var(--cy);}
.btn:focus-visible{outline:2px solid var(--cy);outline-offset:2px;}
.btn:disabled{opacity:.32;cursor:not-allowed;}
.btn.pri{background:rgba(63,216,255,.16);border-color:var(--cy);color:#eafaff;}
.btn.dgr{border-color:rgba(255,92,156,.5);background:rgba(255,92,156,.08);color:#ffd7e7;}
.btn.dgr:hover:not(:disabled){background:rgba(255,92,156,.2);border-color:var(--rs);}
.btn.sm{padding:calc(6px*var(--ui)) calc(10px*var(--ui));font-size:var(--f0);}
.btn.wide{width:100%;}
.chip{border:1px solid var(--line);padding:4px 9px;font-size:var(--f0);color:var(--dim);
  background:rgba(255,255,255,.02);}
.chip.on{border-color:var(--cy);color:var(--cy);background:rgba(63,216,255,.1);}

/* ---------- full screens ---------- */
.screen{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;
  background:radial-gradient(120% 90% at 50% 0%,#0b1830 0%,var(--bg) 62%);}
.screen.sheet{background:rgba(4,6,14,.94);backdrop-filter:blur(6px);}
.shead{display:flex;align-items:center;gap:12px;padding:calc(14px*var(--ui)) calc(16px*var(--ui));
  border-bottom:1px solid var(--line);flex:0 0 auto;}
.shead h2{margin:0;font-size:var(--f3);font-weight:500;letter-spacing:.16em;}
.sbody{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(14px*var(--ui));}
.sfoot{flex:0 0 auto;padding:calc(12px*var(--ui));border-top:1px solid var(--line);
  display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}
.sbody h3{font-size:var(--f2);font-weight:500;letter-spacing:.1em;margin:22px 0 8px;color:var(--cy);}
.sbody h3:first-child{margin-top:0;}
.sbody p{margin:0 0 10px;color:var(--dim);line-height:1.65;max-width:74ch;}
.sbody li{color:var(--dim);line-height:1.6;margin-bottom:5px;}
.sbody ul{padding-left:18px;margin:0 0 12px;max-width:74ch;}

/* ---------- splash / language / home ---------- */
#splash{justify-content:flex-end;align-items:center;background:#000;z-index:60;}
#splash .sig{margin-bottom:11vh;color:#6d8099;letter-spacing:.34em;font-size:var(--f1);
  opacity:0;animation:sig 3.1s ease forwards;}
@keyframes sig{12%{opacity:0}40%{opacity:1}78%{opacity:1}100%{opacity:0}}
#splash .mark{position:absolute;top:50%;left:50%;width:74px;height:74px;margin:-37px 0 0 -37px;
  border:1px solid #2b3a52;transform:rotate(45deg) scale(.3);opacity:0;animation:mk 3.1s cubic-bezier(.2,.8,.2,1) forwards;}
@keyframes mk{15%{opacity:0;transform:rotate(45deg) scale(.3)}
  50%{opacity:1;transform:rotate(0deg) scale(1)}80%{opacity:1}100%{opacity:0;transform:rotate(0deg) scale(1.5)}}

#home{align-items:center;justify-content:center;text-align:center;}
#home .title{font-size:clamp(46px,13vw,124px);letter-spacing:.3em;font-weight:300;margin:0 0 0 .3em;
  line-height:1;text-shadow:0 0 40px rgba(63,216,255,.28);}
#home .sub{color:var(--dim2);letter-spacing:.24em;font-size:var(--f0);margin-top:14px;}
#home .menu{display:flex;flex-direction:column;gap:9px;margin-top:min(7vh,46px);width:min(320px,76vw);}
#home .hs{margin-top:26px;color:var(--dim);font-size:var(--f1);letter-spacing:.1em;}
#home .hs b{color:var(--am);font-weight:500;}
#lang .sbody{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;z-index:20;pointer-events:none;}
#hud > *{pointer-events:auto;}
.topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:stretch;gap:1px;
  background:linear-gradient(180deg,rgba(4,6,14,.92),rgba(4,6,14,.55) 78%,transparent);
  padding:calc(7px*var(--ui)) calc(9px*var(--ui));padding-top:max(calc(7px*var(--ui)),env(safe-area-inset-top));}
.cell{display:flex;flex-direction:column;gap:2px;padding:0 calc(11px*var(--ui));
  border-left:1px solid var(--line);justify-content:center;min-width:0;}
.cell:first-child{border-left:none;padding-left:2px;}
.cell .k{font-size:var(--f0);color:var(--dim2);letter-spacing:.14em;}
.cell .v{font-size:var(--f2);letter-spacing:.06em;white-space:nowrap;}
.cell.grow{flex:1 1 auto;}
.bar{height:7px;border:1px solid var(--line2);position:relative;overflow:hidden;background:rgba(0,0,0,.4);}
.bar i{position:absolute;inset:0;transform-origin:left;display:block;}
.bar.hp i{background:linear-gradient(90deg,#ff5c9c,#ffc24d);}
.bar.sh i{background:linear-gradient(90deg,#3fd8ff,#a98bff);}
.spacer{flex:1 1 auto;}
.topbtns{display:flex;gap:6px;align-items:center;}
.iconbtn{width:calc(34px*var(--ui));height:calc(34px*var(--ui));border:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;background:rgba(8,13,25,.8);}
.iconbtn:hover{border-color:var(--cy);}
.iconbtn svg{width:16px;height:16px;stroke:var(--fg);fill:none;stroke-width:1.5;}

.wavebar{position:absolute;left:50%;transform:translateX(-50%);top:calc(58px*var(--ui));
  display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;}
.wavebar .big{font-size:var(--f3);letter-spacing:.2em;}
.wavebar .diff{font-size:var(--f0);letter-spacing:.2em;}
.d-easy{color:var(--mt)} .d-medium{color:var(--cy)} .d-hard{color:var(--am)}
.d-brutal{color:var(--rs)} .d-inhuman{color:#fff;text-shadow:0 0 14px var(--rs);}
.prep{display:flex;align-items:center;gap:9px;background:rgba(8,13,25,.86);
  border:1px solid var(--line2);padding:5px 10px;}
.prep .t{color:var(--am);font-size:var(--f2);min-width:36px;text-align:center;}

/* ---------- bottom dock ---------- */
.dock{position:absolute;left:0;right:0;bottom:0;display:flex;gap:6px;align-items:flex-end;
  padding:calc(9px*var(--ui));padding-bottom:max(calc(9px*var(--ui)),env(safe-area-inset-bottom));}
.items{display:flex;gap:5px;flex-wrap:wrap;flex:1 1 auto;}
.itembtn{position:relative;width:calc(46px*var(--ui));height:calc(46px*var(--ui));
  border:1px solid var(--line2);background:rgba(8,13,25,.86);display:flex;
  align-items:center;justify-content:center;flex-direction:column;gap:1px;}
.itembtn .n{font-size:var(--f0);color:var(--dim);text-align:center;line-height:1.05;padding:0 2px;}
.itembtn .c{position:absolute;top:-1px;right:1px;font-size:var(--f0);color:var(--am);}
.itembtn.on{border-color:var(--cy);background:rgba(63,216,255,.16);}
.itembtn .cd{position:absolute;inset:0;background:rgba(4,6,14,.72);display:flex;
  align-items:center;justify-content:center;color:var(--cy);font-size:var(--f1);}

/* ---------- side / drawer panels ---------- */
.panel{position:absolute;background:rgba(6,10,20,.96);border:1px solid var(--line2);
  display:flex;flex-direction:column;z-index:25;backdrop-filter:blur(4px);}
.ptitle{display:flex;align-items:center;gap:9px;padding:calc(9px*var(--ui)) calc(11px*var(--ui));
  border-bottom:1px solid var(--line);}
.ptitle h4{margin:0;font-size:var(--f2);font-weight:500;letter-spacing:.12em;flex:1 1 auto;}
.pbody{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(9px*var(--ui));}

#shop{top:0;right:0;bottom:0;width:min(392px,42vw);}
body.portrait #shop{top:auto;left:0;right:0;width:auto;height:64vh;border-bottom:none;}
#ctx{width:min(320px,84vw);left:calc(10px*var(--ui));bottom:calc(74px*var(--ui));max-height:56vh;}
body.portrait #ctx{left:calc(8px*var(--ui));right:calc(8px*var(--ui));width:auto;bottom:calc(96px*var(--ui));}

.searchrow{display:flex;gap:6px;padding:0 calc(9px*var(--ui)) calc(7px*var(--ui));}
.searchrow input{flex:1 1 auto;background:rgba(0,0,0,.4);border:1px solid var(--line);
  padding:7px 9px;outline:none;}
.searchrow input:focus{border-color:var(--cy);}
.cats{display:flex;gap:5px;overflow-x:auto;padding:0 calc(9px*var(--ui)) calc(8px*var(--ui));
  scrollbar-width:none;}
.cats::-webkit-scrollbar{display:none;}
.cats .chip{white-space:nowrap;flex:0 0 auto;}

.card{border:1px solid var(--line);margin-bottom:7px;background:rgba(255,255,255,.015);}
.card .hd{display:flex;align-items:center;gap:8px;padding:8px 9px;cursor:pointer;}
.card .sw{width:14px;height:14px;flex:0 0 auto;border:1px solid rgba(255,255,255,.35);}
.card .nm{flex:1 1 auto;min-width:0;}
.card .nm b{font-weight:500;display:block;}
.card .nm s{display:block;text-decoration:none;color:var(--dim2);font-size:var(--f0);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card .pr{color:var(--am);font-size:var(--f1);white-space:nowrap;}
.card .pr.no{color:var(--rs);}
.card .ex{display:none;padding:0 9px 9px;border-top:1px solid var(--line);}
.card.open .ex{display:block;}
.card .stat{display:flex;justify-content:space-between;gap:10px;padding:2.5px 0;
  color:var(--dim);font-size:var(--f0);border-bottom:1px dotted rgba(140,175,225,.12);}
.card .stat b{color:var(--fg);font-weight:400;}
.card .dsc{color:var(--dim);line-height:1.55;margin:8px 0;font-size:var(--f0);}
.locked{opacity:.42;}
.tag{display:inline-block;border:1px solid var(--line);padding:1px 6px;font-size:var(--f0);
  color:var(--dim2);margin:0 4px 4px 0;}
.tag.cy{color:var(--cy);border-color:rgba(63,216,255,.4)}
.tag.rs{color:var(--rs);border-color:rgba(255,92,156,.4)}
.tag.mt{color:var(--mt);border-color:rgba(92,255,180,.4)}
.tag.am{color:var(--am);border-color:rgba(255,194,77,.4)}
.tag.vi{color:var(--vi);border-color:rgba(169,139,255,.4)}

/* ---------- placement ---------- */
.placebar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(72px*var(--ui));
  display:flex;gap:8px;background:rgba(6,10,20,.94);border:1px solid var(--line2);
  padding:8px 10px;align-items:center;z-index:26;}
.placebar .lbl{color:var(--dim);letter-spacing:.08em;}
.placebar .bad{color:var(--rs);}

/* ---------- toasts / banners ---------- */
#toasts{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(126px*var(--ui));
  display:flex;flex-direction:column;gap:5px;align-items:center;z-index:30;pointer-events:none;}
.toast{background:rgba(6,10,20,.92);border:1px solid var(--line2);padding:6px 12px;
  letter-spacing:.05em;animation:tin .25s ease;}
.toast.warn{border-color:var(--rs);color:#ffd7e7;}
.toast.good{border-color:var(--mt);color:#d9fff0;}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#banner{position:absolute;top:34%;left:0;right:0;text-align:center;z-index:30;pointer-events:none;}
#banner .b1{font-size:clamp(30px,7vw,64px);letter-spacing:.26em;font-weight:300;}
#banner .b2{color:var(--dim);letter-spacing:.24em;margin-top:8px;font-size:var(--f1);}

/* ---------- tutorial ---------- */
#tut{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(94px*var(--ui));
  width:min(560px,92vw);background:rgba(6,10,20,.97);border:1px solid var(--cy);
  padding:calc(12px*var(--ui));z-index:32;}
#tut .tt{color:var(--cy);letter-spacing:.16em;font-size:var(--f0);margin-bottom:6px;}
#tut .tb{line-height:1.6;color:var(--fg);}
#tut .tf{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;}

/* ---------- discover ---------- */
.grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));}
.dcell{border:1px solid var(--line);padding:9px;display:flex;gap:9px;align-items:center;
  background:rgba(255,255,255,.015);cursor:pointer;text-align:left;}
.dcell:hover{border-color:var(--line2);}
.dcell .gl{width:26px;height:26px;flex:0 0 auto;}
.dcell b{font-weight:500;display:block;}
.dcell s{text-decoration:none;color:var(--dim2);font-size:var(--f0);}
.dcell.lk{opacity:.4;}
.rar1{color:var(--dim)} .rar2{color:var(--mt)} .rar3{color:var(--cy)}
.rar4{color:var(--vi)} .rar5{color:var(--am)}

/* ---------- settings rows ---------- */
.row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);}
.row .lb{flex:1 1 auto;}
.row .lb s{display:block;text-decoration:none;color:var(--dim2);font-size:var(--f0);margin-top:2px;}
input[type=range]{-webkit-appearance:none;appearance:none;width:min(180px,42vw);height:2px;
  background:var(--line2);outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;
  background:var(--cy);cursor:pointer;border-radius:0;transform:rotate(45deg);}
input[type=range]::-moz-range-thumb{width:12px;height:12px;background:var(--cy);border:none;border-radius:0;}
.seg{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;}

/* ---------- modal ---------- */
#modal{position:absolute;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;
  background:rgba(2,4,9,.8);backdrop-filter:blur(3px);}
#modal .box{width:min(430px,90vw);border:1px solid var(--line2);background:var(--bg2);padding:calc(16px*var(--ui));}
#modal h4{margin:0 0 8px;font-size:var(--f2);font-weight:500;letter-spacing:.1em;}
#modal p{color:var(--dim);line-height:1.6;margin:0 0 14px;}
#modal .mf{display:flex;gap:8px;justify-content:flex-end;}

/* ---------- rotate gate ---------- */
#rotate{z-index:90;align-items:center;justify-content:center;text-align:center;gap:18px;}
#rotate .ph{width:52px;height:86px;border:1.5px solid var(--cy);margin:0 auto 18px;
  animation:rot 2.4s ease-in-out infinite;}
@keyframes rot{0%,40%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}

/* ---------- game over ---------- */
#over{align-items:center;justify-content:center;text-align:center;}
#over .t1{font-size:clamp(30px,8vw,62px);letter-spacing:.24em;font-weight:300;color:var(--rs);}
#over .st{display:flex;gap:26px;margin:26px 0;flex-wrap:wrap;justify-content:center;}
#over .st div{min-width:96px;}
#over .st .k{color:var(--dim2);font-size:var(--f0);letter-spacing:.14em;}
#over .st .v{font-size:var(--f3);margin-top:4px;}

@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;}}
</style>
</head>

const Audio2={
  ctx:null,master:null,musicGain:null,sfxGain:null,started:false,musicTimer:0,step:0,
  init(){
    if(this.ctx)return;
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
    try{this.ctx=new AC();}catch(e){return;}
    this.master=this.ctx.createGain(); this.master.connect(this.ctx.destination);
    this.sfxGain=this.ctx.createGain(); this.sfxGain.connect(this.master);
    this.musicGain=this.ctx.createGain(); this.musicGain.connect(this.master);
    this.applyVolumes();
  },
  applyVolumes(){
    if(!this.ctx)return;
    const m=SET.mute?0:SET.master;
    this.master.gain.value=m;
    this.sfxGain.gain.value=SET.sfx;
    this.musicGain.gain.value=SET.music*0.34;
  },
  resume(){ if(this.ctx&&this.ctx.state==="suspended")this.ctx.resume(); },
  tone(f,dur,type,gain,f2,dest){
    if(!this.ctx||SET.mute)return; if(this.ctx.state!=="running")return;
    const t=this.ctx.currentTime;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type||"sine"; o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(gain==null?.22:gain,t+Math.min(.012,dur*.3));
    g.gain.exponentialRampToValueAtTime(.0008,t+dur);
    o.connect(g); g.connect(dest||this.sfxGain); o.start(t); o.stop(t+dur+.03);
  },
  noise(dur,gain,lp,hp){
    if(!this.ctx||SET.mute)return; if(this.ctx.state!=="running")return;
    const t=this.ctx.currentTime, n=Math.max(1,Math.floor(this.ctx.sampleRate*dur));
    const buf=this.ctx.createBuffer(1,n,this.ctx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    const src=this.ctx.createBufferSource(); src.buffer=buf;
    const f=this.ctx.createBiquadFilter(); f.type="lowpass"; f.frequency.setValueAtTime(lp||1400,t);
    f.frequency.exponentialRampToValueAtTime(Math.max(80,(lp||1400)*.25),t+dur);
    const g=this.ctx.createGain(); g.gain.setValueAtTime(gain==null?.28:gain,t);
    g.gain.exponentialRampToValueAtTime(.0008,t+dur);
    let chain=src; chain.connect(f);
    if(hp){const h=this.ctx.createBiquadFilter();h.type="highpass";h.frequency.value=hp;f.connect(h);h.connect(g);}
    else f.connect(g);
    g.connect(this.sfxGain); src.start(t); src.stop(t+dur+.02);
  },
  sfx(name){
    if(!this.ctx||SET.mute)return;
    switch(name){
      case "ui":       this.tone(660,.05,"triangle",.12); break;
      case "uiback":   this.tone(420,.06,"triangle",.1); break;
      case "buy":      this.tone(520,.07,"square",.1,780); this.tone(880,.12,"triangle",.08,1180); break;
      case "sellsfx":  this.tone(500,.1,"triangle",.12,240); break;
      case "placesfx": this.tone(300,.08,"square",.12,180); this.noise(.09,.1,900); break;
      case "upsfx":    this.tone(600,.08,"triangle",.1,900); this.tone(900,.14,"sine",.09,1350); break;
      case "shoot":    this.tone(rnd(880,1080),.035,"square",.045,420); break;
      case "beam":     this.tone(1500,.05,"sawtooth",.03,1200); break;
      case "cannon":   this.noise(.16,.16,900); this.tone(120,.16,"sine",.14,55); break;
      case "hit":      this.tone(rnd(230,300),.035,"square",.05,140); break;
      case "crit":     this.tone(1250,.07,"square",.09,620); break;
      case "ekill":    this.noise(.11,.11,1700); this.tone(rnd(180,260),.09,"triangle",.07,90); break;
      case "bigkill":  this.noise(.3,.2,1100); this.tone(90,.3,"sine",.16,40); break;
      case "shieldhit":this.tone(1400,.07,"sine",.08,900); break;
      case "towerhit": this.tone(150,.14,"sawtooth",.14,70); this.noise(.12,.1,600); break;
      case "heal":     this.tone(700,.1,"sine",.08,1050); this.tone(1050,.14,"sine",.06,1400); break;
      case "wavestart":this.tone(300,.16,"triangle",.13,450); setTimeout(()=>this.tone(450,.22,"triangle",.12,600),140); break;
      case "waveend":  this.tone(520,.13,"triangle",.12,700); setTimeout(()=>this.tone(780,.2,"triangle",.1,930),120); break;
      case "rare":     this.tone(220,.5,"sawtooth",.09,180); setTimeout(()=>this.tone(190,.5,"sawtooth",.08,150),200); break;
      case "warn":     this.tone(400,.1,"square",.09,300); break;
      case "death":    this.noise(.9,.32,900); this.tone(160,.9,"sawtooth",.2,30); break;
      case "item":     this.tone(900,.09,"square",.09,1350); break;
      case "explode":  this.noise(.26,.22,1200); this.tone(100,.24,"sine",.15,42); break;
      case "freeze":   this.tone(1700,.24,"sine",.09,700); this.noise(.2,.06,3000,1200); break;
      case "emp":      this.tone(2000,.3,"sawtooth",.08,120); break;
      case "event":    this.tone(120,.7,"sawtooth",.13,90); break;
      case "err":      this.tone(180,.11,"square",.1,120); break;
    }
  },
  musicTick(dt){
    if(!this.ctx||SET.mute||SET.music<=0)return;
    if(this.ctx.state!=="running")return;
    this.musicTimer-=dt;
    if(this.musicTimer>0)return;
    const intensity=(typeof RUN!=="undefined"&&RUN)?clamp(RUN.wave/100,0,1):0;
    this.musicTimer=lerp(1.05,.52,intensity);
    const scale=[0,3,5,7,10,12,15];
    const root=RUN&&RUN.wave>=76?49:(RUN&&RUN.wave>=31?52:55);
    const n=root+scale[this.step%scale.length]-(this.step%14===0?12:0);
    const f=440*Math.pow(2,(n-69)/12);
    this.tone(f,1.5,"sine",.14,f,this.musicGain);
    if(this.step%4===0)this.tone(f/2,2.4,"triangle",.1,f/2,this.musicGain);
    if(intensity>.35&&this.step%2===1)this.tone(f*2,.5,"sine",.05,f*1.5,this.musicGain);
    this.step++;
  }
};

  DPR=Math.min(window.devicePixelRatio||1,2);
  VW=CV.clientWidth||window.innerWidth; VH=CV.clientHeight||window.innerHeight;
  CV.width=Math.floor(VW*DPR); CV.height=Math.floor(VH*DPR);
  layoutMode();
}
function layoutMode(){
  const coarse=window.matchMedia("(pointer: coarse)").matches;
  const small=Math.min(window.innerWidth,window.innerHeight)<820;
  const mobile=coarse&&small;
  document.body.classList.toggle("mobileui",mobile);
  document.body.classList.toggle("portrait",window.innerHeight>=window.innerWidth);
  const needPortrait=mobile;
  const isPortrait=window.innerHeight>=window.innerWidth;
  const bad=(needPortrait&&!isPortrait)||(!needPortrait&&isPortrait&&!small);
  UI.rotateGate(bad,needPortrait);
}
function w2sx(x){return (x-CAM.x)*CAM.z+VW/2;}
function w2sy(y){return (y-CAM.y)*CAM.z+VH/2;}
function s2wx(x){return (x-VW/2)/CAM.z+CAM.x;}
function s2wy(y){return (y-VH/2)/CAM.z+CAM.y;}
function camClamp(){
  const lim=WORLD.r+120;
  CAM.tx=clamp(CAM.tx,-lim,lim); CAM.ty=clamp(CAM.ty,-lim,lim);
  CAM.tz=clamp(CAM.tz,.42,2.1);
}
function camShake(v){ if(SET.motion)return; CAM.shake=Math.min(24,CAM.shake+v*SET.shake); }
function recenter(){CAM.tx=0;CAM.ty=0;CAM.tz=Math.max(CAM.tz,.8);camClamp();}

const IN={down:false,id:null,sx:0,sy:0,lx:0,ly:0,moved:0,pinch:0,pts:new Map(),hoverX:0,hoverY:0,hasHover:false};
function bindInput(){
  CV.addEventListener("pointerdown",e=>{
    Audio2.init();Audio2.resume();
    IN.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(IN.pts.size===1){IN.down=true;IN.id=e.pointerId;IN.sx=IN.lx=e.clientX;IN.sy=IN.ly=e.clientY;IN.moved=0;}
    else if(IN.pts.size===2){const a=[...IN.pts.values()];IN.pinch=dst(a[0].x,a[0].y,a[1].x,a[1].y);}
    CV.setPointerCapture&&CV.setPointerCapture(e.pointerId);
  });
  CV.addEventListener("pointermove",e=>{
    if(e.pointerType==="mouse"&&!IN.down){IN.hoverX=e.clientX;IN.hoverY=e.clientY;IN.hasHover=true;
      if(Game.place)Game.movePlace(s2wx(e.clientX),s2wy(e.clientY));}
    if(!IN.pts.has(e.pointerId))return;
    IN.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(IN.pts.size===2){
      const a=[...IN.pts.values()];const d=dst(a[0].x,a[0].y,a[1].x,a[1].y);
      if(IN.pinch>0){const f=d/IN.pinch;CAM.tz=clamp(CAM.tz*Math.pow(f,SET.zoomSens),.42,2.1);}
      IN.pinch=d;IN.moved+=8;return;
    }
    if(e.pointerId!==IN.id)return;
    const dx=e.clientX-IN.lx, dy=e.clientY-IN.ly;
    IN.moved+=Math.abs(dx)+Math.abs(dy);
    if(IN.moved>7){
      CAM.tx-=dx/CAM.z*SET.camSens; CAM.ty-=dy/CAM.z*SET.camSens; camClamp();
      CAM.x=CAM.tx;CAM.y=CAM.ty;
    }
    IN.lx=e.clientX;IN.ly=e.clientY;
  });
  const up=e=>{
    IN.pts.delete(e.pointerId);
    if(IN.pts.size<2)IN.pinch=0;
    if(e.pointerId!==IN.id)return;
    IN.down=false;IN.id=null;
    if(IN.moved<9)Game.tap(s2wx(e.clientX),s2wy(e.clientY),e.pointerType);
  };
  CV.addEventListener("pointerup",up);
  CV.addEventListener("pointercancel",up);
  CV.addEventListener("wheel",e=>{
    e.preventDefault();
    const f=Math.exp(-e.deltaY*0.0016*SET.zoomSens);
    CAM.tz=clamp(CAM.tz*f,.42,2.1);
  },{passive:false});
  CV.addEventListener("contextmenu",e=>{e.preventDefault();if(Game.place||Game.itemMode)Game.cancelAction();});
  window.addEventListener("resize",resize);
  window.addEventListener("orientationchange",()=>setTimeout(resize,120));
  window.addEventListener("keydown",e=>{
    if(e.key==="Escape"){ if(Game.place||Game.itemMode)Game.cancelAction(); else if(RUN&&Game.running)UI.togglePause(); }
    if(!RUN||!Game.running)return;
    if(e.key===" "){e.preventDefault(); if(RUN.phase==="prep")Game.startWave();}
    if(e.key==="c"||e.key==="C")recenter();
    if(e.key==="b"||e.key==="B")UI.toggleShop();
    const n=parseInt(e.key,10);
    if(n>=1&&n<=9){const ids=Object.keys(RUN.inv).filter(k=>RUN.inv[k]>0);if(ids[n-1])Game.useItem(ids[n-1]);}
  });
}

function hpScale(w){ return 1+0.12*(w-1)+Math.pow(w/20,2); }

function spdScale(w){ return Math.min(1.45,1+0.0042*w); }
function rewardOf(e,w){ return Math.round((3+e.cost*0.75)*(1+0.028*w)); }
function prepTime(w){ return Math.max(8,Math.round(30-w*0.24)); }
function waveBudget(w){ return 22+w*12+Math.pow(w,1.8)/2.6; }

let ENs=[],PRs=[],EPRs=[],PTs=[],FLs=[],HZs=[],MNs=[],FXs=[];
function resetField(){ENs.length=0;PRs.length=0;EPRs.length=0;PTs.length=0;FLs.length=0;HZs.length=0;MNs.length=0;FXs.length=0;}

/* ---- structure stats ---- */
function structStats(s){
  if(s._st&&s._sv===s.lvl+"|"+(s.branch||""))return s._st;
  const D=DBY[s.t],L=s.lvl-1,up=D.up||{},o={f:{}};
  const P=(k,b)=>b?b*Math.pow(up[k]||1,L):0;
  o.hp=P("hp",D.hp); o.dmg=P("dmg",D.dmg); o.range=P("range",D.range); o.rof=P("rof",D.rof);
  o.auraR=P("auraR",D.auraR); o.repair=P("repair",D.repair); o.amp=P("amp",D.amp);
  o.slow=Math.min(.82,P("slow",D.slow)); o.structShield=P("structShield",D.structShield);
  o.pull=P("pull",D.pull); o.intercept=P("intercept",D.intercept);
  o.aoe=D.aoe||0; o.chain=D.chain||0; o.dtype=D.dtype||"phy"; o.pen=D.pen||0;
  o.mineDmg=D.mine?D.mine.dmg*Math.pow(up.dmg||1,L):0;
  o.taunt=D.taunt||0; o.armor=0;
  if(s.branch&&D.branches){
    const b=D.branches.find(x=>x.id===s.branch);
    if(b){
      if(b.m)for(const k in b.m){ if(o[k]!==undefined)o[k]*=b.m[k]; }
      if(b.f)for(const k in b.f)o.f[k]=b.f[k];
      const f=o.f;
      if(f.armor)o.armor=f.armor;
      if(f.aoeMul)o.aoe*=f.aoeMul;
      if(f.chain)o.chain+=f.chain;
      if(f.pen)o.pen=Math.max(o.pen,f.pen);
      if(f.tauntMul)o.taunt*=f.tauntMul;
      if(f.mineR)o.mineR=f.mineR;
      if(f.rangeBuff)o.rangeBuffOv=f.rangeBuff;
    }
  }
  o.slow=Math.min(.85,o.slow);
  s._st=o; s._sv=s.lvl+"|"+(s.branch||"");
  return o;
}
function upCost(s){ const D=DBY[s.t]; return Math.round(D.cost*0.62*Math.pow(1.62,s.lvl-1)); }
function sellValue(s){
  const D=DBY[s.t]; let v=D.cost*0.6;
  for(let i=1;i<s.lvl;i++)v+=Math.round(D.cost*0.62*Math.pow(1.62,i-1))*0.55;
  return Math.round(v);
}
function guardSell(g){ return Math.round(GBY[g.t].cost*0.6*(1+(g.lvl-1)*0.4)); }
function guardUpCost(g){ return Math.round(GBY[g.t].cost*0.55*Math.pow(1.6,g.lvl-1)); }
function guardStats(g){
  const G=GBY[g.t],m=Math.pow(1.3,g.lvl-1);
  return {hp:G.hp*Math.pow(1.35,g.lvl-1),dmg:(G.dmg||0)*m,heal:(G.heal||0)*m,
    range:G.range*Math.pow(1.06,g.lvl-1),rof:G.rof||0,spd:G.spd,dtype:G.dtype||"phy",
    slow:G.slow||0,taunt:G.taunt||0,armor:G.armor||0,pen:G.pen||0,airOnly:!!G.airOnly};
}

/* ---- structure buff aggregation (recomputed a few times a second) ---- */
let BUFF_T=0;
function recomputeBuffs(){
  const S=RUN.structs;
  for(const s of S){ s.bDmg=0; s.bRange=0; s.bCrit=0; s.bHpMul=0; s.maxShieldB=0; s.reflect=0; }
  for(const a of S){
    if(a.dead||a.jam>0)continue;
    const st=structStats(a),D=DBY[a.t];
    if(D.amp){for(const b of S){ if(b===a||b.dead)continue; if(d2(a.x,a.y,b.x,b.y)<st.auraR*st.auraR&&DBY[b.t].dmg)b.bDmg+=st.amp; }}
    if(D.reveal){const rb=st.f.rangeBuff||D.rangeBuff||0;const cb=st.f.critBuff||0;
      for(const b of S){ if(b===a||b.dead)continue; if(d2(a.x,a.y,b.x,b.y)<st.auraR*st.auraR){b.bRange+=rb;b.bCrit+=cb;} }}
    if(D.structShield){for(const b of S){ if(b===a||b.dead)continue;
      if(d2(a.x,a.y,b.x,b.y)<st.auraR*st.auraR){b.maxShieldB+=st.structShield; if(st.f.reflect)b.reflect=Math.max(b.reflect,st.f.reflect);} }}
    if(D.repair&&st.f.hpBuff){for(const b of S){ if(b===a||b.dead)continue;
      if(d2(a.x,a.y,b.x,b.y)<st.auraR*st.auraR)b.bHpMul+=st.f.hpBuff; }}
  }
  for(const s of S){
    const st=structStats(s);
    const nm=st.hp*(1+(s.bHpMul||0));
    if(Math.abs(nm-s.maxHp)>.5){ const r=s.maxHp>0?s.hp/s.maxHp:1; s.maxHp=nm; s.hp=Math.min(nm,nm*r); }
    s.maxShield=s.maxShieldB||0;
    if(s.shield>s.maxShield)s.shield=s.maxShield;
  }
}

/* ============================================================
   7. WAVE GENERATION
   ============================================================ */
const THEMES=["mixed","swarm","armour","air","support","range","disrupt","siege","speed","multi"];
function rarityAvail(rar,w,minWave){
  const s=(w-minWave);
  if(rar<=1)return 1; if(rar===2)return clamp(.35+s/18,.35,1);
  if(rar===3)return clamp(s/26,.12,.9);
  if(rar===4)return clamp(s/32,.06,.7);
  return clamp(s/30,.04,.45);
}
function themeAffinity(e,theme){
  switch(theme){
    case "swarm": return (e.cost<=18||e.onDeath||e.spawner)?2.6:.5;
    case "armour":return (e.armor>=.3||e.res&&(e.res.phy||e.res.exp))?2.8:.5;
    case "air":   return e.flying?4:.35;
    case "support":return e.aura||e.revive?3.4:.7;
    case "range": return e.atk==="ranged"?3.4:.6;
    case "disrupt":return (e.disrupt||e.cloak||e.mv==="blink"||e.steal)?3.2:.6;
    case "siege": return e.role==="siege"?3.4:.7;
    case "speed": return e.spd>=68?2.8:.5;
    case "multi": return 1;
    default: return 1;
  }
}
function availableThemes(w){
  const list=["mixed"];
  if(w>=3)list.push("swarm","speed");
  if(w>=8)list.push("armour");
  if(w>=9)list.push("air","support");
  if(w>=13)list.push("range","siege");
  if(w>=18)list.push("multi");
  if(w>=20)list.push("disrupt");
  return list;
}
function genWave(w){
  const pool=ENEMIES.filter(e=>!e.spawnOnly&&e.minWave<=w&&e.w>0);
  const q=[]; let budget=waveBudget(w)*(RUN.tut?.55:1);
  const nPhase=w>=100?5:clamp(1+Math.floor(w/13),1,4);
  const wts=[1,1.15,1.3,1.5,1.75].slice(0,nPhase);
  const sum=wts.reduce((a,b)=>a+b,0);
  const themes=shuffle(availableThemes(w).slice()).slice(0,nPhase);
  let t=w>=100?5:1.2;
  let hasRare=false;
  for(let p=0;p<nPhase;p++){
    const theme=themes[p%themes.length]||"mixed";
    let share=budget*wts[p]/sum;
    const scored=pool.map(e=>({e,s:e.w*rarityAvail(e.rar,w,e.minWave)*themeAffinity(e,theme)}))
                     .filter(o=>o.s>0.02);
    if(!scored.length)continue;
    scored.sort((a,b)=>b.s-a.s);
    const nTypes=clamp(2+Math.floor(w/22),2,5);
    const chosen=[];
    const bag=scored.slice(0,Math.min(scored.length,10));
    for(let i=0;i<nTypes&&bag.length;i++){
      let tot=bag.reduce((a,o)=>a+o.s,0),r=Math.random()*tot,k=0;
      for(;k<bag.length;k++){r-=bag[k].s;if(r<=0)break;}
      chosen.push(bag.splice(Math.min(k,bag.length-1),1)[0].e);
    }
    const parts=chosen.map(()=>rnd(.6,1.4));
    const ps=parts.reduce((a,b)=>a+b,0);
    const dirs=[];
    const nDir=w>=60?rndi(2,4):(w>=25?rndi(1,3):(w>=10?rndi(1,2):1));
    for(let i=0;i<nDir;i++)dirs.push(rnd(0,TAU));
    const list=[];
    chosen.forEach((e,i)=>{
      const bshare=share*parts[i]/ps;
      let n=Math.max(1,Math.round(bshare/Math.max(4,e.cost)));
      n=Math.min(n,e.rar>=4?4:(e.rar===3?9:42));
      if(e.rar>=3)hasRare=true;
      list.push({e,n});
    });
    const total=list.reduce((a,o)=>a+o.n,0);
    const dur=clamp(total*.42,4,22);
    let k=0;
    for(const o of list){
      for(let i=0;i<o.n;i++){
        const frac=total>1?(k/(total-1)):0;
        const a=dirs[k%dirs.length]+rnd(-.34,.34);
        q.push({t:t+frac*dur+rnd(0,.5),id:o.e.id,a,rar:o.e.rar});
        k++;
      }
    }
    t+=dur+clamp(5-w*.03,2,5);
  }
  if(w>=70&&Math.random()<clamp((w-65)/45,.1,.6)){
    q.push({t:t*0.55,id:"x_herald",a:rnd(0,TAU),rar:5}); hasRare=true;
  }
  if(w>=100){
    q.push({t:4,id:"x_ascendant",a:rnd(0,TAU),rar:5});
    for(let i=0;i<3;i++)q.push({t:t*(0.4+i*0.2),id:"x_herald",a:rnd(0,TAU),rar:5});
  }
  q.sort((a,b)=>a.t-b.t);
  return {q,hasRare,dur:t};
}

const MAX_ENEMIES=380;
function spawnEnemy(id,x,y,opts){
  const E=EBY[id]; if(!E)return null;
  if(ENs.length>=MAX_ENEMIES)return null;
  if(E.cost===0&&ENs.length>=MAX_ENEMIES*0.7)return null;
  const w=RUN.wave, tutM=RUN.tut?.7:1;
  const e={
    uid:uid(),t:id,fam:E.fam,rar:E.rar,x,y,vx:0,vy:0,
    maxHp:E.hp*hpScale(w)*tutM,hp:0,shield:0,maxShield:0,
    spd:E.spd*spdScale(w),dmg:E.dmg*dmgScale(w)*tutM,size:E.size,
    armor:E.armor||0,res:E.res||{},weak:E.weak||null,flying:!!E.flying,
    cloak:!!E.cloak,revealed:false,role:E.role||"ram",mv:E.mv||"direct",
    eff:{slow:0,slowT:0,frz:0,burn:0,burnT:0,shock:0,mark:0,weak:0,emp:0,empV:0},
    cool:0,ab:rnd(0,3),dash:rnd(1,3),blink:rnd(1.5,3),spw:E.spawner?E.spawner.every:0,
    trail:0,goal:null,gt:0,ang:0,flash:0,steal:E.steal||0,stole:false,flee:false,
    packArmorCur:0,conduit:0,haste:0,revived:false,phase:0,boss:!!E.boss,
    reflect:E.reflect||0,noKnock:!!E.noKnock
  };
  if(opts&&opts.hpMul)e.maxHp*=opts.hpMul;
  e.hp=e.maxHp;
  if(E.boss){e.maxHp=E.hp*(1+w*0.02);e.hp=e.maxHp;}
  ENs.push(e);
  discover("enemy",id);
  if(E.rar>=4&&Game.running){ Audio2.sfx("rare"); UI.toast(T(E.rar>=5?"rareWarn":"elite")+": "+TX(E.n),"warn"); }
  fx(e.x,e.y,FAM[E.fam].c,e.size*2.2,.4);
  return e;
}
function spawnStructure(t,x,y){

function particle(x,y,col,n,spd,life,size){
  const cap=[150,420,950][SET.vfx]|0;
  if(PTs.length>cap)n=Math.max(1,n>>2);
  for(let i=0;i<n;i++){

    const a=rnd(0,TAU),v=rnd(spd*.35,spd);
    PTs.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:life*rnd(.6,1.2),m:life,col,s:size||2.4,r:rnd(0,TAU),rv:rnd(-6,6)});
  }
}
function fx(x,y,col,r,life,w){

  FXs.push({x,y,r0:r*.2,r,l:life,m:life,col,w:w||2});

function floater(x,y,txt,col){
  if(!SET.dmgNum)return; if(FLs.length>90)return;
  FLs.push({x,y,l:.8,m:.8,txt,col});
}
function hazard(x,y,r,dmg,life,col){ HZs.push({x,y,r,dmg,l:life,m:life,col:col||"#ff8f5c",tick:0}); }

/* ============================================================
   9. DAMAGE
   ============================================================ */
function hurtEnemy(e,amt,dtype,opts){
  if(!e||e.dead)return 0;
  opts=opts||{};
  let m=1;
  let r=(e.res&&e.res[dtype])||0;
  if(e.conduit>0)r=Math.min(.85,r+e.conduit);
  if(e.weak&&e.weak[dtype])m*=(1+e.weak[dtype]);
  m*=(1-r);
  let armor=Math.max(0,(e.armor+(e.packArmorCur||0))-(opts.pen||0));
  if(dtype!=="burn"&&dtype!=="true")m*=(1-armor);
  if(e.eff.shock>0&&dtype==="enr")m*=1.25;
  if(e.eff.mark>0)m*=1.28;
  if(e.boss)m*=1-clamp((1-e.hp/e.maxHp)*.28,0,.28);
  let dmg=amt*m;
  if(opts.crit){dmg*=2;floater(e.x,e.y-e.size,Math.round(dmg),"#ffc24d");Audio2.sfx("crit");}
  else if(SET.dmgNum&&dmg>0&&Math.random()<.5)floater(e.x,e.y-e.size,Math.round(dmg),"#dfe9f7");
  if(e.shield>0){
    const a=Math.min(e.shield,dmg); e.shield-=a; dmg-=a;
    fx(e.x,e.y,"#3fd8ff",e.size*1.6,.16,1);
    if(dmg<=0){ if(Math.random()<.3)Audio2.sfx("shieldhit"); return a; }
  }
  e.hp-=dmg; e.flash=.12;
  if(Math.random()<.22)Audio2.sfx("hit");
  if(e.hp<=0)killEnemy(e,opts);
  return dmg;
}
function killEnemy(e,opts){
  if(e.dead)return; e.dead=true;
  const E=EBY[e.t];
  const rew=Math.round(rewardOf(E,RUN.wave)*incomeMul()*(RUN.tut?1.4:1));
  RUN.credits+=rew; RUN.kills++;
  const sc=Math.round((4+E.cost*1.5)*(1+RUN.wave*0.03)*(1+(E.rar-1)*.35));
  RUN.score+=sc;
  if(E.rar>=4)RUN.eliteKills++; if(E.rar===3)RUN.rareKills++;
  const col=FAM[E.fam].c;
  particle(e.x,e.y,col,E.rar>=4?26:10,E.rar>=4?260:170,.5,E.rar>=4?3.4:2.2);
  fx(e.x,e.y,col,e.size*(E.rar>=4?5:2.8),E.rar>=4?.55:.3,E.rar>=4?3:1.6);
  Audio2.sfx(E.rar>=4?"bigkill":"ekill");
  if(E.rar>=4)camShake(E.boss?14:5);
  if(E.onDeath){
    if(E.onDeath.type==="split"){
      for(let i=0;i<E.onDeath.n;i++){
        const a=rnd(0,TAU),d=e.size+6;
        spawnEnemy(E.onDeath.id,e.x+Math.cos(a)*d,e.y+Math.sin(a)*d);
      }
    } else if(E.onDeath.type==="explode"){
      const r=E.onDeath.r,dm=E.onDeath.dmg*dmgScale(RUN.wave);
      fx(e.x,e.y,"#ff8f5c",r,.35,3); Audio2.sfx("explode"); camShake(4);
      damageStructsArea(e.x,e.y,r,dm);
      if(d2(e.x,e.y,0,0)<(r+34)*(r+34))hurtTower(dm*.6);
      for(const g of RUN.guards)if(!g.dead&&d2(g.x,g.y,e.x,e.y)<r*r)hurtGuard(g,dm*.7);
    }
  }
  if(E.sacrifice){ /* handled on demand */ }
  if(RUN.tut)Tutorial.event("kill");
}
function damageStructsArea(x,y,r,dmg){
  for(const s of RUN.structs){ if(s.dead)continue;
    if(d2(s.x,s.y,x,y)<r*r)hurtStruct(s,dmg);
  }
}
function hurtStruct(s,dmg,attacker){
  if(s.dead)return;
  if(s.reflect&&s.shield>0&&attacker)hurtEnemy(attacker,dmg*s.reflect,"enr",{});
  const st=structStats(s);
  if(st.armor)dmg*=(1-st.armor);
  if(s.shield>0){const a=Math.min(s.shield,dmg);s.shield-=a;dmg-=a;
    fx(s.x,s.y,"#3fd8ff",DBY[s.t].size*2,.15,1);}
  s.hp-=dmg; s.flash=.12;
  if(st.f.thorns&&attacker)hurtEnemy(attacker,st.f.thorns,"enr",{});
  if(s.hp<=0)destroyStruct(s);
}
function destroyStruct(s){
  if(s.dead)return; s.dead=true;
  const D=DBY[s.t];
  particle(s.x,s.y,D.col,16,200,.55,3);
  fx(s.x,s.y,D.col,D.size*4,.4,2.4);
  Audio2.sfx("explode"); camShake(3);
  const st=structStats(s);
  if(st.f.deathBoom){
    const r=110,dm=st.f.deathBoom;
    fx(s.x,s.y,"#ffd06b",r,.35,3);
    for(const e of ENs)if(!e.dead&&d2(e.x,e.y,s.x,s.y)<r*r)hurtEnemy(e,dm,"exp",{});
  }
  recomputeBuffs();
}
function hurtGuard(g,dmg){
  if(g.dead)return; const gs=guardStats(g);
  if(gs.armor)dmg*=(1-gs.armor);
  g.hp-=dmg; g.flash=.12;
  if(g.hp<=0){
    g.dead=true; g.respawn=14;
    particle(g.x,g.y,GBY[g.t].col,14,190,.5,2.8);
    fx(g.x,g.y,GBY[g.t].col,40,.35,2); Audio2.sfx("explode");
  }
}
function hurtTower(dmg){
  const t=RUN.tower;
  dmg*=(1-towerArmour());
  if(t.shield>0){const a=Math.min(t.shield,dmg);t.shield-=a;dmg-=a;
    fx(0,0,"#3fd8ff",64,.2,2); Audio2.sfx("shieldhit");}
  if(dmg>0){
    t.hp-=dmg; Audio2.sfx("towerhit"); camShake(Math.min(9,dmg*.16));
    fx(0,0,"#ff5c9c",50,.24,2);
    if(t.hp<=0){t.hp=0;Game.lose();}
  }
}

const SECT=16;
let sectorThreat=new Array(SECT).fill(0), sectorT=0;
function aiLevel(){ return clamp((RUN.wave-8)/62,0,1)*(RUN.tut?.3:1); }
function computeSectors(){
  sectorThreat.fill(0);
  for(const s of RUN.structs){
    if(s.dead)continue; const D=DBY[s.t],st=structStats(s);
    const v=(st.dmg*st.rof)+(D.blocks?12:0)+(st.slow?26:0);
    if(v<=0)continue;
    const a=Math.atan2(s.y,s.x),i=((Math.floor((a+PI)/TAU*SECT))%SECT+SECT)%SECT;
    sectorThreat[i]+=v; sectorThreat[(i+1)%SECT]+=v*.4; sectorThreat[(i+SECT-1)%SECT]+=v*.4;
  }
}
function weakSectorAngle(){
  let best=0,bv=Infinity;
  for(let i=0;i<SECT;i++)if(sectorThreat[i]<bv){bv=sectorThreat[i];best=i;}
  return -PI+(best+.5)/SECT*TAU;
}
function nearestStruct(x,y,filter){
  let b=null,bd=Infinity;
  for(const s of RUN.structs){ if(s.dead)continue; if(filter&&!filter(s))continue;
    const d=d2(x,y,s.x,s.y); if(d<bd){bd=d;b=s;} }
  return b;
}
function bestStruct(){
  let b=null,bv=-1;
  for(const s of RUN.structs){ if(s.dead)continue;
    const v=DBY[s.t].cost*s.lvl; if(v>bv){bv=v;b=s;} }
  return b;
}
function tauntTarget(x,y){
  let b=null,bd=Infinity;
  for(const s of RUN.structs){ if(s.dead)continue; const st=structStats(s);
    if(!st.taunt)continue; const d=d2(x,y,s.x,s.y);
    if(d<st.taunt*st.taunt&&d<bd){bd=d;b=s;} }
  for(const g of RUN.guards){ if(g.dead)continue; const gs=guardStats(g);
    if(!gs.taunt)continue; const d=d2(x,y,g.x,g.y);
    if(d<gs.taunt*gs.taunt&&d<bd){bd=d;b=g;} }
  return b;
}
function isSupportStruct(s){const c=DBY[s.t].cat;return c==="support"||c==="utility";}

const Game={
  running:false,paused:false,place:null,itemMode:null,sel:null,selType:null,
  overcharge:0,acc:0,last:0,autoT:0,
  start(run){
    RUN=run; this.running=true; this.paused=false;
    this.place=null; this.itemMode=null; this.sel=null; this.overcharge=0;
    CAM.tx=CAM.x=RUN.cam.x||0; CAM.ty=CAM.y=RUN.cam.y||0; CAM.tz=CAM.z=RUN.cam.z||1;
    RUN.tower.maxHp=towerMax(); RUN.tower.maxShield=shieldMax();
    if(RUN.tower.hp>RUN.tower.maxHp)RUN.tower.hp=RUN.tower.maxHp;
    recomputeBuffs(); computeSectors();
    UI.enterGame();
    if(RUN.tut)Tutorial.begin();
    this.last=now();
  },
  stop(){ this.running=false; UI.exitGame(); },
  tick(dt){
    if(!this.running||this.paused||!RUN)return;
    Audio2.musicTick(dt);
    dt=Math.min(dt,.05);
    if(this.overcharge>0)this.overcharge-=dt;
    sectorT-=dt; if(sectorT<=0){sectorT=.8;computeSectors();}
    BUFF_T-=dt; if(BUFF_T<=0){BUFF_T=.45;recomputeBuffs();}
    if(RUN.phase==="prep"){
      RUN.prepLeft-=dt;
      if(RUN.prepLeft<=0)this.startWave();
    } else {
      RUN.waveTime+=dt;
      this.spawnDue();
      this.updateEvents(dt);
      if(!RUN.spawnQueue.length&&ENs.length){
        RUN.stallT=(RUN.stallT||0)+dt;
        if(RUN.stallT>40){
          const k=Math.min(.06,(RUN.stallT-40)*.0015)*4*dt;
          if(!RUN._stallMsg){RUN._stallMsg=true;UI.toast(T("collapse"),"warn");}
          for(const e of ENs){ if(e.dead||e.boss)continue;
            e.hp-=e.maxHp*k; if(Math.random()<dt*2)particle(e.x,e.y,"#8ea3c2",1,40,.4,1.6);
            if(e.hp<=0)killEnemy(e); }
        }
      } else RUN.stallT=0;
      if(!RUN.spawnQueue.length&&!ENs.length&&RUN.started)this.endWave();
    }
    this.updateEnemies(dt);
    this.updateStructs(dt);
    this.updateGuards(dt);
    this.updateTower(dt);
    this.updateProjectiles(dt);
    this.updateField(dt);
    this.updateFx(dt);
    for(const k in RUN.cd){ RUN.cd[k]-=dt; if(RUN.cd[k]<=0)delete RUN.cd[k]; }
    if(RUN.structs.some(s=>s.dead)){RUN.structs=RUN.structs.filter(s=>!s.dead);recomputeBuffs();}
    this.autoT-=dt; if(this.autoT<=0){this.autoT=3;saveRun();}
    if(RUN.tut)Tutorial.tick(dt);
    this.hudT=(this.hudT||0)-dt;
    if(this.hudT<=0){this.hudT=.1;UI.syncHud();}
  },
  /* ---------- waves ---------- */
  startWave(){
    RUN.phase="combat"; RUN.waveTime=0; RUN.started=true; RUN.stallT=0; RUN._stallMsg=false;
    const g=genWave(RUN.wave);
    RUN.spawnQueue=g.q; RUN.waveDur=g.dur;
    RUN.handicaps={}; RUN.events=[];
    if(RUN.wave>=100)this.setupFinal();
    else if(RUN.wave>=80&&Math.random()<.4)this.scheduleEvent(pick(["ev_quake","ev_storm"]),rnd(6,14));
    Audio2.sfx("wavestart");
    UI.banner(T("wave")+" "+roman(RUN.wave),T(difficultyOf(RUN.wave)),"d-"+difficultyOf(RUN.wave));
    UI.closeShop();
    if(RUN.tut)Tutorial.event("wavestart");
    saveRun();
  },
  setupFinal(){
    UI.banner(T("final"),T("finalNote"),"d-inhuman");
    Audio2.sfx("event");
    this.scheduleEvent("ev_meteor",8); this.scheduleEvent("ev_lock",4);
    this.scheduleEvent("ev_dark",34); this.scheduleEvent("ev_jam",52);
    this.scheduleEvent("ev_storm",70); this.scheduleEvent("ev_portal",88);
    this.scheduleEvent("ev_quake",104); this.scheduleEvent("ev_meteor",124);
  },
  scheduleEvent(id,t){ RUN.events.push({id,t,fired:false,dur:0}); },
  updateEvents(dt){
    for(const ev of RUN.events){
      if(!ev.fired&&RUN.waveTime>=ev.t){ ev.fired=true; this.fireEvent(ev); }
    }
    for(const k in RUN.handicaps){ RUN.handicaps[k]-=dt; if(RUN.handicaps[k]<=0)delete RUN.handicaps[k]; }
    if(this.meteorT>0){
      this.meteorT-=dt; this.meteorC-=dt;
      if(this.meteorC<=0){ this.meteorC=.55;
        const a=rnd(0,TAU),r=rnd(0,WORLD.r*.85);
        const x=Math.cos(a)*r,y=Math.sin(a)*r;
        FXs.push({x,y,r0:0,r:78,l:1.25,m:1.25,col:"#ff8f5c",w:2,warn:true});
        setTimeout(()=>{ if(!RUN)return;
          fx(x,y,"#ffb15c",90,.4,3); Audio2.sfx("explode"); camShake(5);
          for(const e of ENs)if(!e.dead&&d2(e.x,e.y,x,y)<78*78)hurtEnemy(e,150*dmgScale(RUN.wave)*.4,"exp",{});
          damageStructsArea(x,y,78,60);
          if(d2(x,y,0,0)<110*110)hurtTower(40);
        },1250);
      }
    }
    if(this.stormT>0){
      this.stormT-=dt; this.stormA+=dt*1.5; this.stormC-=dt;
      if(this.stormC<=0){ this.stormC=.35;
        const r=rnd(120,WORLD.r*.8),x=Math.cos(this.stormA)*r,y=Math.sin(this.stormA)*r;
        FXs.push({x,y,r0:6,r:62,l:.3,m:.3,col:"#a98bff",w:2});
        damageStructsArea(x,y,62,26);
        for(const e of ENs)if(!e.dead&&d2(e.x,e.y,x,y)<62*62)hurtEnemy(e,40,"enr",{});
      }
    }
  },
  fireEvent(ev){
    discover("event",ev.id); Audio2.sfx("event"); camShake(6);
    UI.toast(T(ev.id),"warn");
    switch(ev.id){
      case "ev_meteor": this.meteorT=13; this.meteorC=0; break;
      case "ev_storm":  this.stormT=11; this.stormA=rnd(0,TAU); this.stormC=0; break;
      case "ev_dark":   RUN.handicaps.vision=20; RUN.handicaps.items=14; break;
      case "ev_jam":    RUN.handicaps.jam=22; RUN.handicaps.targeting=22; break;
      case "ev_lock":   RUN.handicaps.shop=26; UI.closeShop(); break;
      case "ev_quake":  camShake(16); RUN.handicaps.repair=20;
        for(const s of RUN.structs)hurtStruct(s,s.maxHp*.16); break;
      case "ev_portal":
        for(let i=0;i<4;i++){
          const a=rnd(0,TAU),r=rnd(180,340),x=Math.cos(a)*r,y=Math.sin(a)*r;
          FXs.push({x,y,r0:0,r:60,l:1.5,m:1.5,col:"#ff6bd6",w:2,warn:true});
          setTimeout(()=>{ if(!RUN||!Game.running)return;
            const pool=ENEMIES.filter(e=>!e.spawnOnly&&e.minWave<=RUN.wave&&e.rar<=3&&e.w>0);
            for(let k=0;k<4;k++){const e=pick(pool);spawnEnemy(e.id,x+rnd(-30,30),y+rnd(-30,30));}
          },1500);
        }
        break;
    }
  },
  spawnDue(){
    const q=RUN.spawnQueue;
    while(q.length&&q[0].t<=RUN.waveTime){
      const s=q.shift();
      const r=WORLD.r*.97;
      spawnEnemy(s.id,Math.cos(s.a)*r,Math.sin(s.a)*r);
    }
  },
  endWave(){
    const w=RUN.wave;
    let pay=Math.round((45+w*9)*incomeMul()*(RUN.tut?1.5:1));
    RUN.credits+=pay;
    RUN.score+=Math.round(140*w*(1+(RUN.tower.hp/Math.max(1,RUN.tower.maxHp))*.5));
    const rep=(RUN.ups.tu_repair||0)*.07;
    if(rep>0)RUN.tower.hp=Math.min(RUN.tower.maxHp,RUN.tower.hp+RUN.tower.maxHp*rep);
    for(const s of RUN.structs)s.hp=Math.min(s.maxHp,s.hp+s.maxHp*.12);
    for(const g of RUN.guards){ g.dead=false; g.respawn=0; g.hp=guardStats(g).hp; }
    HZs.length=0; MNs.length=0; EPRs.length=0;
    Audio2.sfx("waveend");
    UI.banner(T("waveDone",roman(w)),T("bonus",pay),"d-"+difficultyOf(w));
    if(RUN.tut)Tutorial.event("waveend");
    if(w>=100){ this.win(); return; }
    RUN.wave=w+1; RUN.phase="prep"; RUN.prepLeft=prepTime(RUN.wave)*(RUN.tut?1.6:1);
    RUN.handicaps={}; RUN.events=[]; this.meteorT=0; this.stormT=0;
    if(RUN.tut&&RUN.wave>10){ Tutorial.finish(); return; }
    saveRun();
  },
  win(){
    this.running=false;
    const best=Math.max(PROF.best,RUN.score);
    PROF.best=best; PROF.bestWave=Math.max(PROF.bestWave,100); saveProf();
    Store.del(RUN.tut?K_TUT:K_RUN);
    UI.gameOver(true);
  },
  lose(){
    if(!this.running)return;
    this.running=false;
    Audio2.sfx("death"); camShake(20);
    for(let i=0;i<5;i++)setTimeout(()=>{particle(rnd(-40,40),rnd(-40,40),"#ff5c9c",22,300,.8,3.4);
      fx(0,0,"#ff5c9c",120+i*60,.7,3);},i*110);
    const wasTut=RUN.tut;
    if(!wasTut){
      if(RUN.score>PROF.best)PROF.best=RUN.score;
      PROF.bestWave=Math.max(PROF.bestWave,RUN.wave); PROF.plays++; saveProf();
    }
    Store.del(wasTut?K_TUT:K_RUN);
    setTimeout(()=>UI.gameOver(false),900);
  },
  /* ---------- enemies ---------- */
  updateEnemies(dt){
    const A=aiLevel(), tw=RUN.tower;
    for(let i=ENs.length-1;i>=0;i--){ const e=ENs[i];
      if(e.dead){ENs.splice(i,1);continue;}
      const E=EBY[e.t];
      if(e.flash>0)e.flash-=dt;
      /* status */
      const ef=e.eff;
      if(ef.slowT>0){ef.slowT-=dt; if(ef.slowT<=0)ef.slow=0;}
      if(ef.frz>0)ef.frz-=dt;
      if(ef.shock>0)ef.shock-=dt;
      if(ef.mark>0)ef.mark-=dt;
      if(ef.weak>0)ef.weak-=dt;
      if(ef.emp>0){ef.emp-=dt; if(ef.emp<=0)ef.empV=0;}
      if(ef.burnT>0){ef.burnT-=dt; e.hp-=ef.burn*dt; if(Math.random()<dt*6)particle(e.x,e.y,"#ff8f5c",1,40,.3,1.6);
        if(e.hp<=0){killEnemy(e);continue;}}
      if(e.revealTimer>0)e.revealTimer-=dt;
      e.revealed=(e.revealTimer>0);
      /* auras from other enemies (sampled) */
      e.packArmorCur=0; e.conduit=0; e.haste=0;
      /* movement */
      let spd=e.spd*(1-Math.min(.85,ef.slow))*(1+e.haste);
      if(ef.frz>0)spd=0;
      if(e.stunT>0){e.stunT-=dt;spd=0;}
      /* goal */
      e.gt-=dt;
      if(e.gt<=0||!e.goal||(e.goal.s&&e.goal.s.dead)){ e.gt=rnd(.9,1.6); e.goal=this.chooseGoal(e,A); }
      const G=e.goal||{k:"tower",x:0,y:0};
      let gx=G.k==="struct"?G.s.x:(G.k==="guard"?G.g.x:G.x||0);
      let gy=G.k==="struct"?G.s.y:(G.k==="guard"?G.g.y:G.y||0);
      let dx=gx-e.x,dy=gy-e.y,dd=Math.hypot(dx,dy)||1;
      let ux=dx/dd,uy=dy/dd;
      /* movement styles */
      if(e.mv==="dash"){
        e.dash-=dt;
        if(e.dash<=0){e.dash=rnd(2.2,3.6);e.dashT=.42;fx(e.x,e.y,FAM[e.fam].c,e.size*1.6,.2,1);}
        if(e.dashT>0){e.dashT-=dt;spd*=3.1;}
      } else if(e.mv==="blink"){
        e.blink-=dt;
        if(e.blink<=0&&dd>90){e.blink=rnd(3.4,5.2);
          const j=Math.min(150,dd-40);
          fx(e.x,e.y,FAM[e.fam].c,e.size*2,.28,2);
          e.x+=ux*j;e.y+=uy*j;
          fx(e.x,e.y,FAM[e.fam].c,e.size*2,.28,2);}
      } else if(e.mv==="orbit"){
        const dt2=Math.hypot(e.x,e.y);
        if(dt2>300){ /* approach */ }
        else if(!e.committed){
          const wa=weakSectorAngle();
          const ca=Math.atan2(e.y,e.x);
          let diff=((wa-ca+PI*3)%TAU)-PI;
          if(Math.abs(diff)<.28){e.committed=true;}
          else{ const tx=-Math.sin(ca)*Math.sign(diff),ty=Math.cos(ca)*Math.sign(diff);
            ux=lerp(ux,tx,.85);uy=lerp(uy,ty,.85);
            const n=Math.hypot(ux,uy)||1;ux/=n;uy/=n; }
        }
      } else if(e.mv==="formation"){
        let cx=0,cy=0,c=0;
        for(const o of ENs){ if(o===e||o.dead||o.t!==e.t)continue;
          if(d2(o.x,o.y,e.x,e.y)<120*120){cx+=o.x;cy+=o.y;c++;} }
        e.packArmorCur=Math.min(.4,c*(E.packArmor||0));
        if(c>0){ const ax=(cx/c-e.x),ay=(cy/c-e.y),an=Math.hypot(ax,ay)||1;
          ux=lerp(ux,ax/an,.22);uy=lerp(uy,ay/an,.22);
          const n=Math.hypot(ux,uy)||1;ux/=n;uy/=n; }
      }
      /* ranged / standoff hold */
      const rng=E.range||0;
      let hold=false;
      if(E.atk==="ranged"&&dd<rng*.86)hold=true;
      if(e.mv==="standoff"&&E.role==="support"){
        let lead=null,ld=Infinity;
        for(const o of ENs){ if(o===e||o.dead||o.role==="support")continue;
          const d=d2(o.x,o.y,0,0); if(d<ld){ld=d;lead=o;} }
        if(lead){ const tx=lead.x*1.12,ty=lead.y*1.12;
          const ax=tx-e.x,ay=ty-e.y,an=Math.hypot(ax,ay)||1;
          if(an<40)hold=true; else {ux=ax/an;uy=ay/an;} }
        else if(dd<260)hold=true;
      }
      if(e.mv==="strafe"&&dd<rng*.8){
        const ca=Math.atan2(e.y-gy,e.x-gx);
        ux=-Math.sin(ca);uy=Math.cos(ca);
      }
      /* threat avoidance for smarter enemies */
      if(A>.35&&!e.flying&&G.k==="tower"&&Math.hypot(e.x,e.y)>230&&Math.random()<A*.5){
        const wa=weakSectorAngle(),ca=Math.atan2(e.y,e.x);
        let diff=((wa-ca+PI*3)%TAU)-PI;
        if(Math.abs(diff)>.5){ const tx=-Math.sin(ca)*Math.sign(diff),ty=Math.cos(ca)*Math.sign(diff);
          ux=lerp(ux,tx,.4*A);uy=lerp(uy,ty,.4*A);
          const n=Math.hypot(ux,uy)||1;ux/=n;uy/=n; }
      }
      if(G.k==="tower"&&dd<46)hold=true;
      if(G.k==="struct"&&dd<DBY[G.s.t].size+e.size+4)hold=true;
      if(G.k==="guard"&&dd<e.size+16)hold=true;
      if(!hold){
        e.x+=ux*spd*dt; e.y+=uy*spd*dt; e.ang=Math.atan2(uy,ux);
      }
      if(!e.flying){
        for(const s2 of RUN.structs){
          if(s2.dead||!DBY[s2.t].blocks)continue;

function killSilent(e,i){ e.dead=true; if(i!=null)ENs.splice(i,1); }
function applyStatus(e,type,dur,val){
  if(!e||e.dead)return;
  const res=(e.res&&e.res.frz)||0;
  if(type==="frz"){ if(res>=1)return; e.eff.frz=Math.max(e.eff.frz,dur*(1-res)); discover("status","frozen"); }
  if(type==="slow"){ if(res>=1)return; const v=val*(1-res);
    e.eff.slow=e.eff.slowT<=0?v:Math.max(e.eff.slow,v);
    e.eff.slowT=Math.max(e.eff.slowT,dur); discover("status","slowed"); }
  if(type==="burn"){ e.eff.burn=Math.max(e.eff.burn,val); e.eff.burnT=Math.max(e.eff.burnT,dur); discover("status","burning"); }
  if(type==="shock"){ e.eff.shock=Math.max(e.eff.shock,dur); discover("status","shocked"); }
  if(type==="mark"){ e.eff.mark=Math.max(e.eff.mark,dur); discover("status","marked"); }
  if(type==="weak"){ e.eff.weak=Math.max(e.eff.weak,dur); discover("status","weakened"); }
  if(type==="stun"){ if(e.boss)dur*=.3; e.stunT=Math.max(e.stunT||0,dur); }
  if(type==="reveal"){ e.revealTimer=Math.max(e.revealTimer||0,dur); discover("status","revealed"); }
}

/* ---------- targeting ---------- */
function canTarget(s,e,air){
  if(e.dead)return false;
  if(e.cloak&&!e.revealed)return false;
  if(air==="air"&&!e.flying)return false;
  if(air==="ground"&&e.flying)return false;
  return true;
}
function pickTarget(s,range,mode){
  const air=DBY[s.t].air||"both";
  let best=null,bv=-Infinity;
  const r2=range*range;
  const cands=[];
  for(const e of ENs){
    if(!canTarget(s,e,air))continue;
    const d=d2(s.x,s.y,e.x,e.y); if(d>r2)continue;
    if(s.scr>0){cands.push(e);continue;}
    let v;
    switch(mode){
      case "farthest": v=d; break;
      case "strongest":v=e.hp+e.shield; break;
      case "weakest":  v=-(e.hp+e.shield); break;
      case "fastest":  v=e.spd; break;
      case "first":    v=-d2(e.x,e.y,0,0); break;
      case "elite":    v=e.rar*1e6-d; break;
      case "support":  v=(EBY[e.t].role==="support"?1e7:0)+(EBY[e.t].aura?1e6:0)-d; break;
      case "flying":   v=(e.flying?1e7:0)-d; break;
      default:         v=-d;
    }
    if(v>bv){bv=v;best=e;}
  }
  if(s.scr>0)return cands.length?pick(cands):null;
  return best;
}

        hurtEnemy(t,gs.dmg,gs.dtype,{pen:gs.pen});
        if(gs.slow)applyStatus(t,"slow",1.4,gs.slow);
        FXs.push({x:g.x,y:g.y,x2:t.x,y2:t.y,l:.1,m:.1,col:G.col,line:true});
        if(Math.random()<.3)Audio2.sfx("shoot");
      }
      const R=Math.hypot(g.x,g.y);
      if(R>WORLD.r){const k=WORLD.r/R;g.x*=k;g.y*=k;}
    }
  },
  updateTower(dt){
    const t=RUN.tower;
    t.maxHp=towerMax(); t.maxShield=shieldMax();
    const rg=(RUN.ups.tu_regen||0)*1.4;
    if(rg>0&&t.shield<t.maxShield)t.shield=Math.min(t.maxShield,t.shield+rg*dt);
    if(t.shieldTemp>0){t.shieldTemp-=dt; if(t.shieldTemp<=0){t.shield=Math.min(t.shield,t.maxShield);}}
    const cl=RUN.ups.tu_core||0;
    if(cl>0){
      this.coreCool=(this.coreCool||0)-dt;
      if(this.coreCool<=0){
        const range=190+cl*34, dmg=16*Math.pow(1.5,cl-1);
        let best=null,bd=Infinity;
        for(const e of ENs){ if(e.dead)continue; if(e.cloak&&!e.revealed)continue;
          const d=d2(0,0,e.x,e.y); if(d<range*range&&d<bd){bd=d;best=e;} }
        if(best){
          this.coreCool=1/(0.9+cl*0.12);
          const a=ang(0,0,best.x,best.y);
          PRs.push({x:0,y:0,vx:Math.cos(a)*600,vy:Math.sin(a)*600,dmg,dtype:"enr",aoe:0,
            pen:.25,col:"#3fd8ff",l:2,tgt:best,size:3.4,air:"both"});
          Audio2.sfx("shoot");
        } else this.coreCool=.2;
      }
    }
    const pl=RUN.ups.tu_pulse||0;
    if(pl>0){
      this.pulseCool=(this.pulseCool||6)-dt;
      if(this.pulseCool<=0){
        this.pulseCool=Math.max(3.2,7-pl*.7);
        const r=130+pl*38, dmg=42*Math.pow(1.55,pl-1);
        fx(0,0,"#3fd8ff",r,.45,3); Audio2.sfx("emp"); camShake(3);
        for(const e of ENs){ if(e.dead)continue;
          if(d2(e.x,e.y,0,0)<r*r){ hurtEnemy(e,dmg,"enr",{});
            if(!e.noKnock){const a=ang(0,0,e.x,e.y);e.x+=Math.cos(a)*70;e.y+=Math.sin(a)*70;} } }
      }
    }
    if(RUN.ups.tu_scan){
      for(const e of ENs){ if(e.dead||!e.cloak)continue;
        if(d2(e.x,e.y,0,0)<330*330)applyStatus(e,"reveal",.5); }
    }
  },
  updateProjectiles(dt){
    for(let i=PRs.length-1;i>=0;i--){
      const p=PRs[i]; p.l-=dt;
      if(p.tgt&&!p.tgt.dead){
        const a=ang(p.x,p.y,p.tgt.x,p.tgt.y),sp=Math.hypot(p.vx,p.vy);
        const ca=Math.atan2(p.vy,p.vx);
        let da=((a-ca+PI*3)%TAU)-PI;
        const na=ca+clamp(da,-6*dt,6*dt);
        p.vx=Math.cos(na)*sp; p.vy=Math.sin(na)*sp;
      }
      p.x+=p.vx*dt; p.y+=p.vy*dt;
      if(p.l<=0||Math.hypot(p.x,p.y)>WORLD.r+140){PRs.splice(i,1);continue;}
      let hitE=null;
      for(const e of ENs){
        if(e.dead)continue;
        if(p.hit&&p.hit.indexOf(e.uid)>=0)continue;
        if(p.air==="air"&&!e.flying)continue;
        if(p.air==="ground"&&e.flying)continue;
        if(e.cloak&&!e.revealed)continue;
        if(d2(p.x,p.y,e.x,e.y)<(e.size+p.size)*(e.size+p.size)){hitE=e;break;}
      }
      if(!hitE)continue;
      const E=EBY[hitE.t];
      if(E.reflect&&Math.random()<E.reflect&&p.src){
        EPRs.push({x:p.x,y:p.y,vx:-p.vx*.8,vy:-p.vy*.8,dmg:p.dmg*.7,aoe:p.aoe,l:3,
          col:FAM[hitE.fam].c,src:hitE});
        PRs.splice(i,1); fx(p.x,p.y,FAM[hitE.fam].c,16,.2,1.6); continue;
      }
      if(p.aoe>0){
        fx(p.x,p.y,"#ffb15c",p.aoe,.3,2.2); Audio2.sfx("explode");
        for(const e of ENs){ if(e.dead)continue;
          if(d2(e.x,e.y,p.x,p.y)<p.aoe*p.aoe)hurtEnemy(e,p.dmg,p.dtype,{pen:p.pen,crit:p.crit}); }
        PRs.splice(i,1); continue;
      }
      hurtEnemy(hitE,p.dmg,p.dtype,{pen:p.pen,crit:p.crit});
      particle(p.x,p.y,p.col,3,90,.25,1.8);
      if(p.pierce){ p.hit.push(hitE.uid); p.dmg*=.88; }
      else PRs.splice(i,1);
    }
    for(let i=EPRs.length-1;i>=0;i--){
      const p=EPRs[i]; p.l-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
      if(p.l<=0){EPRs.splice(i,1);continue;}
      let hit=null,ht=null;
      if(d2(p.x,p.y,0,0)<44*44){hit="tower";}
      if(!hit)for(const s of RUN.structs){ if(s.dead)continue;
        const R=DBY[s.t].size+5;
        if(d2(p.x,p.y,s.x,s.y)<R*R){hit=s;ht="s";break;} }
      if(!hit)for(const g of RUN.guards){ if(g.dead)continue;
        if(d2(p.x,p.y,g.x,g.y)<16*16){hit=g;ht="g";break;} }
      if(!hit)continue;
      EPRs.splice(i,1);
      fx(p.x,p.y,p.col,p.aoe||14,.26,2);
      if(p.aoe>0){
        for(const s of RUN.structs)if(!s.dead&&d2(s.x,s.y,p.x,p.y)<p.aoe*p.aoe)hurtStruct(s,p.dmg,p.src);
        for(const g of RUN.guards)if(!g.dead&&d2(g.x,g.y,p.x,p.y)<p.aoe*p.aoe)hurtGuard(g,p.dmg);
        if(d2(p.x,p.y,0,0)<(p.aoe+40)*(p.aoe+40))hurtTower(p.dmg*.7);
      } else if(hit==="tower"){
        if(p.drain&&RUN.tower.shield>0){
          const a=Math.min(RUN.tower.shield,p.dmg); RUN.tower.shield-=a;
          if(p.src&&!p.src.dead)p.src.hp=Math.min(p.src.maxHp,p.src.hp+a*.5);
          Audio2.sfx("shieldhit");
        } else hurtTower(p.dmg);
      }
      else if(ht==="s")hurtStruct(hit,p.dmg,p.src);
      else hurtGuard(hit,p.dmg);
    }
  },
  updateField(dt){
    for(let i=HZs.length-1;i>=0;i--){
      const h=HZs[i]; h.l-=dt; h.tick-=dt;
      if(h.l<=0){HZs.splice(i,1);continue;}
      if(h.tick<=0){ h.tick=.5;
        for(const s of RUN.structs)if(!s.dead&&d2(s.x,s.y,h.x,h.y)<h.r*h.r)hurtStruct(s,h.dmg*.5);
        for(const g of RUN.guards)if(!g.dead&&d2(g.x,g.y,h.x,h.y)<h.r*h.r)hurtGuard(g,h.dmg*.5);
        if(d2(h.x,h.y,0,0)<(h.r+38)*(h.r+38))hurtTower(h.dmg*.3);
      }
    }
    for(let i=MNs.length-1;i>=0;i--){
      const m=MNs[i]; m.l-=dt;
      if(m.l<=0){MNs.splice(i,1);continue;}
      if(m.kind==="barrier"){
        for(const e of ENs){ if(e.dead||e.flying)continue;
          if(d2(e.x,e.y,m.x,m.y)<(m.r+e.size)*(m.r+e.size)){
            const a=ang(m.x,m.y,e.x,e.y);
            e.x=m.x+Math.cos(a)*(m.r+e.size); e.y=m.y+Math.sin(a)*(m.r+e.size);
            if(e.cool<=0){e.cool=.8;m.hp-=e.dmg;}
          } }
        if(m.hp<=0)m.l=0;
      }
    }
  },
  updateFx(dt){
    for(let i=PTs.length-1;i>=0;i--){const p=PTs[i];p.l-=dt;
      if(p.l<=0){PTs.splice(i,1);continue;}
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.94;p.vy*=.94;p.r+=p.rv*dt;}
    for(let i=FXs.length-1;i>=0;i--){const f=FXs[i];f.l-=dt;if(f.l<=0)FXs.splice(i,1);}
    for(let i=FLs.length-1;i>=0;i--){const f=FLs[i];f.l-=dt;f.y-=26*dt;if(f.l<=0)FLs.splice(i,1);}
    CAM.x=lerp(CAM.x,CAM.tx,1-Math.pow(.0015,dt));
    CAM.y=lerp(CAM.y,CAM.ty,1-Math.pow(.0015,dt));
    CAM.z=lerp(CAM.z,CAM.tz,1-Math.pow(.0009,dt));
    if(CAM.shake>0)CAM.shake=Math.max(0,CAM.shake-dt*38);
  }
});

function discover(cat,id){
  if(!PROF.disc[cat])PROF.disc[cat]={};
  if(PROF.disc[cat][id])return;
  PROF.disc[cat][id]=1; saveProf();
  if(cat==="enemy"&&EBY[id]&&Game.running)UI.toast(T("discNew",TX(EBY[id].n)),"good");
}
function serializeRun(){
  if(!RUN)return null;
  return {
    ver:1,tut:RUN.tut,wave:RUN.wave,phase:RUN.phase,prepLeft:RUN.prepLeft,credits:RUN.credits,
    score:RUN.score,kills:RUN.kills,rareKills:RUN.rareKills,eliteKills:RUN.eliteKills,
    waveTime:RUN.waveTime,started:RUN.started,tutStep:RUN.tutStep,
    tower:{hp:RUN.tower.hp,maxHp:RUN.tower.maxHp,shield:RUN.tower.shield,maxShield:RUN.tower.maxShield},
    ups:RUN.ups,inv:RUN.inv,cd:RUN.cd,
    cam:{x:CAM.tx,y:CAM.ty,z:CAM.tz},
    structs:RUN.structs.filter(s=>!s.dead).map(s=>({t:s.t,x:s.x,y:s.y,lvl:s.lvl,branch:s.branch,
      hp:s.hp,tm:s.tm,mines:s.mines.map(m=>({x:m.x,y:m.y,r:m.r,dmg:m.dmg,arm:m.arm}))})),
    guards:RUN.guards.map(g=>({t:g.t,x:g.x,y:g.y,lvl:g.lvl,hp:g.hp,dead:g.dead,
      respawn:g.respawn,post:g.post})),
    queue:(RUN.spawnQueue||[]).map(q=>({t:q.t,id:q.id,a:q.a})),
    events:RUN.events||[],handicaps:RUN.handicaps||{},
    enemies:ENs.filter(e=>!e.dead&&!e.boss).slice(0,220).map(e=>({t:e.t,x:e.x,y:e.y,hp:e.hp,mh:e.maxHp,sh:e.shield})),
    boss:ENs.filter(e=>e.boss&&!e.dead).map(e=>({t:e.t,x:e.x,y:e.y,hp:e.hp,mh:e.maxHp}))
  };
}
function saveRun(){
  if(!RUN||!Game.running)return;
  const d=serializeRun(); if(d)Store.set(RUN.tut?K_TUT:K_RUN,d);
}
function loadRun(tut){
  const d=Store.get(tut?K_TUT:K_RUN,null);
  if(!d)return null;
  const r=newRun(tut);
  Object.assign(r,{wave:d.wave,phase:d.phase,prepLeft:d.prepLeft,credits:d.credits,score:d.score,
    kills:d.kills||0,rareKills:d.rareKills||0,eliteKills:d.eliteKills||0,waveTime:d.waveTime||0,
    started:d.started,tutStep:d.tutStep||0,ups:d.ups||{},inv:d.inv||{},cd:d.cd||{},
    cam:d.cam||{x:0,y:0,z:1},events:d.events||[],handicaps:d.handicaps||{},spawnQueue:d.queue||[]});
  r.tower=Object.assign({hp:600,maxHp:600,shield:0,maxShield:0},d.tower||{});
  r.structs=[];r.guards=[];
  RUN=r; resetField();
  (d.structs||[]).forEach(s=>{ if(!DBY[s.t])return;
    const o=spawnStructure(s.t,s.x,s.y);
    o.lvl=s.lvl||1;o.branch=s.branch||null;o.tm=s.tm||"closest";
    o._st=null;const st=structStats(o);o.maxHp=st.hp;o.hp=Math.min(o.maxHp,s.hp||st.hp);
    o.mines=(s.mines||[]).map(m=>({x:m.x,y:m.y,r:m.r,dmg:m.dmg,arm:m.arm||0}));
  });
  (d.guards||[]).forEach(g=>{ if(!GBY[g.t])return;
    const o=spawnGuard(g.t,g.x,g.y);
    o.lvl=g.lvl||1;o.hp=g.hp||guardStats(o).hp;o.dead=!!g.dead;o.respawn=g.respawn||0;o.post=g.post||null;
  });
  (d.enemies||[]).forEach(e=>{ if(!EBY[e.t])return;
    const o=spawnEnemy(e.t,e.x,e.y); if(!o)return;
    o.maxHp=e.mh||o.maxHp; o.hp=Math.min(o.maxHp,e.hp); o.shield=e.sh||0; });
  (d.boss||[]).forEach(e=>{ if(!EBY[e.t])return;
    const o=spawnEnemy(e.t,e.x,e.y); if(!o)return; o.maxHp=e.mh||o.maxHp;o.hp=Math.min(o.maxHp,e.hp); });
  recomputeBuffs();
  return r;
}
function hasRun(tut){ return !!Store.get(tut?K_TUT:K_RUN,null); }

function placeValid(kind,id,x,y){
  const R=Math.hypot(x,y);
  if(R>WORLD.r-24)return false;
  if(kind==="guard")return R>56;
  if(kind==="item")return true;
  const size=DBY[id].size;
  if(R<62+size*.5)return false;
  for(const s of RUN.structs){ if(s.dead)continue;
    if(dst(s.x,s.y,x,y)<size+DBY[s.t].size+5)return false; }
  return true;
}
Object.assign(Game,{
  beginPlace(kind,id){
    if(!RUN)return;
    this.cancelAction();
    const cost=kind==="def"?DBY[id].cost:GBY[id].cost;
    if(RUN.credits<cost){UI.toast(T("poor"),"warn");Audio2.sfx("err");return;}
    this.place={kind,id,x:CAM.tx,y:CAM.ty,ok:false};
    this.movePlace(CAM.tx,CAM.ty);
    UI.closeShop(); UI.showPlaceBar();
  },
  movePlace(x,y){
    if(!this.place)return;
    this.place.x=x;this.place.y=y;
    this.place.ok=placeValid(this.place.kind,this.place.id,x,y);
    UI.showPlaceBar();
  },
  confirmPlace(){
    const p=this.place; if(!p)return;
    if(!p.ok){UI.toast(T("badspot"),"warn");Audio2.sfx("err");return;}
    const cost=p.kind==="def"?DBY[p.id].cost:GBY[p.id].cost;
    if(RUN.credits<cost){UI.toast(T("poor"),"warn");Audio2.sfx("err");return;}
    RUN.credits-=cost;
    if(p.kind==="def"){ const s=spawnStructure(p.id,p.x,p.y); this.sel=s; this.selType="struct"; }
    else { const g=spawnGuard(p.id,p.x,p.y); g.post={x:p.x,y:p.y}; this.sel=g; this.selType="guard"; }
    fx(p.x,p.y,"#3fd8ff",44,.34,2); Audio2.sfx("placesfx");
    UI.toast(T("placed"),"good");
    this.place=null; UI.hidePlaceBar(); UI.showContext(); saveRun();
    if(RUN.tut)Tutorial.event("place");
  },
  cancelAction(){
    if(this.place){this.place=null;UI.hidePlaceBar();}
    if(this.itemMode){this.itemMode=null;UI.hidePlaceBar();UI.syncItems();}
    if(this.moveGuard){this.moveGuard=null;UI.hidePlaceBar();}
  },
  buyItem(id){
    const I=IBY[id];
    if(RUN.credits<I.cost){UI.toast(T("poor"),"warn");Audio2.sfx("err");return;}
    RUN.credits-=I.cost; RUN.inv[id]=(RUN.inv[id]||0)+1;
    discover("item",id); Audio2.sfx("buy"); UI.toast(T("bought"),"good"); UI.syncItems(); saveRun();
    if(RUN.tut)Tutorial.event("buyitem");
  },
  useItem(id){
    if(!RUN||!(RUN.inv[id]>0))return;
    if(RUN.handicaps.items){UI.toast(T("hp_items"),"warn");Audio2.sfx("err");return;}
    if((RUN.cd[id]||0)>0){UI.toast(T("cooldown"),"warn");Audio2.sfx("err");return;}
    const I=IBY[id];
    if(I.targeted){ this.cancelAction(); this.itemMode={id}; UI.showPlaceBar(); UI.syncItems(); }
    else this.applyItem(id,0,0);
  },
  applyItem(id,x,y){
    const I=IBY[id];
    if(!(RUN.inv[id]>0))return;
    RUN.inv[id]--; RUN.cd[id]=I.cd; Audio2.sfx("item");
    discover("item",id);
    switch(id){
      case "i_bomb":
        fx(x,y,"#ff6b52",I.r,.45,3.4); Audio2.sfx("explode"); camShake(7);
        for(const e of ENs)if(!e.dead&&d2(e.x,e.y,x,y)<I.r*I.r)hurtEnemy(e,300*(1+RUN.wave*.06),"exp",{});
        break;
      case "i_freeze":
        fx(x,y,"#7fe4ff",I.r,.5,3); Audio2.sfx("freeze");
        for(const e of ENs)if(!e.dead&&d2(e.x,e.y,x,y)<I.r*I.r)applyStatus(e,"frz",3.4);
        break;
      case "i_knock":
        fx(x,y,"#ffd06b",I.r,.4,3); Audio2.sfx("emp"); camShake(4);
        for(const e of ENs){ if(e.dead)continue;
          if(d2(e.x,e.y,x,y)<I.r*I.r){ hurtEnemy(e,50,"phy",{});
            if(!e.noKnock){const a=ang(x,y,e.x,e.y);e.x+=Math.cos(a)*190;e.y+=Math.sin(a)*190;} } }
        break;
      case "i_emp":
        fx(x,y,"#a98bff",I.r,.6,3.4); Audio2.sfx("emp");
        for(const e of ENs){ if(e.dead)continue;
          if(d2(e.x,e.y,x,y)<I.r*I.r){ applyStatus(e,"weak",7); applyStatus(e,"shock",6);
            applyStatus(e,"reveal",7); e.ab2=6; e.spw=6; e.cool2=6; } }
        for(let i=EPRs.length-1;i>=0;i--)if(d2(EPRs[i].x,EPRs[i].y,x,y)<I.r*I.r)EPRs.splice(i,1);
        break;
      case "i_missile":{
        const list=ENs.filter(e=>!e.dead).sort((a,b)=>(b.hp+b.shield)-(a.hp+a.shield)).slice(0,5);
        if(!list.length){RUN.inv[id]++;RUN.cd[id]=0;UI.toast(T("noTarget"),"warn");return;}
        list.forEach((e,i)=>setTimeout(()=>{
          if(!RUN||e.dead)return;
          fx(e.x,e.y,"#ff5c9c",50,.3,2.4);
          applyStatus(e,"mark",6);
          hurtEnemy(e,170*(1+RUN.wave*.05),"exp",{});
          Audio2.sfx("explode");
        },i*160));
        break;}
      case "i_barrier":
        MNs.push({kind:"barrier",x,y,r:44,hp:520,l:15});
        fx(x,y,"#8fa6c4",50,.3,2); break;
      case "i_decoy":{
        const s=spawnStructure("d_decoy",x,y); s.temp=12; s.hp=200;
        setTimeout(()=>{ if(RUN&&!s.dead)destroyStruct(s); },12000);
        break;}
      case "i_heal":
        RUN.tower.hp=Math.min(RUN.tower.maxHp,RUN.tower.hp+RUN.tower.maxHp*.25);
        fx(0,0,"#5cffb4",110,.5,3); Audio2.sfx("heal"); break;
      case "i_aegis":
        RUN.tower.shield+=220; RUN.tower.shieldTemp=15;
        fx(0,0,"#3fd8ff",120,.5,3); Audio2.sfx("heal"); break;
      case "i_overcharge":
        this.overcharge=10; fx(0,0,"#ffc24d",160,.6,3); Audio2.sfx("upsfx"); break;
    }
    this.itemMode=null; UI.hidePlaceBar(); UI.syncItems(); saveRun();
    if(RUN.tut)Tutorial.event("useitem");
  },
  upgradeSel(){
    const s=this.sel; if(!s)return;
    if(this.selType==="struct"){
      const D=DBY[s.t];
      if(s.lvl>=5)return;
      const c=upCost(s);
      if(RUN.credits<c){UI.toast(T("poor"),"warn");Audio2.sfx("err");return;}
      if(s.lvl===2&&D.branches&&!s.branch){UI.toast(T("branch"),"warn");return;}
      RUN.credits-=c; s.lvl++; s._st=null;
      const st=structStats(s); const ratio=s.hp/s.maxHp;
      s.maxHp=st.hp*(1+(s.bHpMul||0)); s.hp=s.maxHp*Math.min(1,ratio+.15);
      Audio2.sfx("upsfx"); fx(s.x,s.y,DBY[s.t].col,42,.35,2.4);
      UI.toast(T("upgraded"),"good");
    } else {
      const g=this.sel;
      if(g.lvl>=4)return;
      const c=guardUpCost(g);
      if(RUN.credits<c){UI.toast(T("poor"),"warn");Audio2.sfx("err");return;}
      RUN.credits-=c; g.lvl++; g.hp=guardStats(g).hp;
      Audio2.sfx("upsfx"); fx(g.x,g.y,GBY[g.t].col,36,.35,2.2);
      UI.toast(T("upgraded"),"good");
    }
    recomputeBuffs(); UI.showContext(); saveRun();
    if(RUN.tut)Tutorial.event("upgrade");
  },
  chooseBranch(bid){
    const s=this.sel; if(!s||this.selType!=="struct")return;
    s.branch=bid; s._st=null;
    const st=structStats(s); const r=s.hp/s.maxHp;
    s.maxHp=st.hp; s.hp=s.maxHp*r;
    Audio2.sfx("upsfx"); recomputeBuffs(); UI.showContext(); saveRun();
  },
  sellSel(){
    const s=this.sel; if(!s)return;
    const isS=this.selType==="struct";
    const val=isS?sellValue(s):guardSell(s);
    const nm=isS?TX(DBY[s.t].n):TX(GBY[s.t].n);
    UI.confirm(T("sellQ",nm),T("sellB",nm,val),()=>{
      RUN.credits+=val;
      if(isS){ s.dead=true; const i=RUN.structs.indexOf(s); if(i>=0)RUN.structs.splice(i,1); }
      else { const i=RUN.guards.indexOf(s); if(i>=0)RUN.guards.splice(i,1); }
      fx(s.x,s.y,"#ffc24d",40,.35,2); Audio2.sfx("sellsfx");
      UI.toast(T("sold",val),"good");
      this.sel=null; recomputeBuffs(); UI.hideContext(); saveRun();
      if(RUN.tut)Tutorial.event("sell");
    });
  },
  startMoveGuard(){
    if(this.selType!=="guard"||!this.sel)return;
    this.moveGuard=this.sel; UI.hideContext(); UI.showPlaceBar();
  },
  buyTowerUp(id){
    const U=TUBY[id]; const lvl=RUN.ups[id]||0;
    if(lvl>=U.max)return;
    const c=Math.round(U.base*Math.pow(U.mul,lvl));
    if(RUN.credits<c){UI.toast(T("poor"),"warn");Audio2.sfx("err");return;}
    RUN.credits-=c; RUN.ups[id]=lvl+1;
    discover("towerup",id);
    if(id==="tu_hp")RUN.tower.hp+=50;
    if(id==="tu_shield")RUN.tower.shield+=45;
    RUN.tower.maxHp=towerMax(); RUN.tower.maxShield=shieldMax();
    Audio2.sfx("upsfx"); fx(0,0,"#3fd8ff",90,.45,3);
    UI.toast(T("upgraded"),"good"); UI.buildShop(); saveRun();
  },
  tap(wx,wy,ptype){
    if(!RUN||!this.running)return;
    if(this.moveGuard){
      if(Math.hypot(wx,wy)<WORLD.r-20){
        this.moveGuard.post={x:wx,y:wy}; fx(wx,wy,GBY[this.moveGuard.t].col,30,.3,2);
        UI.toast(T("guardHere"),"good"); Audio2.sfx("ui");
      }
      this.moveGuard=null; UI.hidePlaceBar(); saveRun(); return;
    }
    if(this.itemMode){ this.applyItem(this.itemMode.id,wx,wy); return; }
    if(this.place){
      if(ptype==="mouse"&&this.place.ok){this.confirmPlace();}
      else this.movePlace(wx,wy);
      return;
    }
    /* selection */
    let best=null,bt=null,bd=Infinity;
    for(const s of RUN.structs){ if(s.dead)continue;
      const d=d2(s.x,s.y,wx,wy),R=(DBY[s.t].size+16);
      if(d<R*R&&d<bd){bd=d;best=s;bt="struct";} }
    for(const g of RUN.guards){ if(g.dead)continue;
      const d=d2(g.x,g.y,wx,wy); if(d<26*26&&d<bd){bd=d;best=g;bt="guard";} }
    if(!best)for(const e of ENs){ if(e.dead)continue; if(e.cloak&&!e.revealed)continue;
      const d=d2(e.x,e.y,wx,wy),R=e.size+16;
      if(d<R*R&&d<bd){bd=d;best=e;bt="enemy";} }
    if(best){ this.sel=best; this.selType=bt; UI.showContext(); Audio2.sfx("ui"); }
    else { this.sel=null; UI.hideContext(); }
  }
});
